name: matrix

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS filter (all/win32/darwin/linux)"
        required: false
        default: "all"
      backend:
        description: "Backend filter (all/github/markdown/gitlab)"
        required: false
        default: "all"

jobs:
  matrix:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      # 第三方步骤统一固定到提交哈希：井号后面的版本只给人看，实际跑的是前面的哈希。标签会被覆盖，哈希不会；以后升级走 Dependabot 的更新请求，不要手工改回标签。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # 同 verify.yml：版本只由 package.json 的 packageManager 定，这里不重复写 version
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 同 verify.yml：Node 22（仓库底座口径，也是 pnpm 11.22 的下限 Node ≥ 22.13）
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
        shell: bash
      - run: node scripts/build.mjs
        shell: bash
      - run: npm run verify
        shell: bash
      - run: node scripts/matrix-smoke.js --os=${{ inputs.os }}
        shell: bash
      - run: node scripts/matrix-full.js --os=${{ inputs.os }} --backend=${{ inputs.backend }}
        shell: bash
