name: verify

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 版本只留一处定版：package.json 的 packageManager（当前 pnpm@11.22.0+sha512…，
          # action 会自己把 +sha512 那段校验串剥掉）。这里再写 version 会与它撞车——
          # action-setup@v4 只要发现两处版本字符串不同，就直接报
          # "Multiple versions of pnpm specified" 并让整个 job 在装包阶段失败（门禁一条都跑不到）。
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22：仓库既有口径（票 #581 拍板 Node 22 为工程底座），也是 pnpm 11.22 的下限
          # ——它要求 Node ≥ 22.13，装在 Node 20 上跑 pnpm 会直接崩在 node:sqlite 这个内置模块上。
          node-version: 22
          cache: pnpm

      - name: Install (pnpm)
        run: |
          pnpm install --no-frozen-lockfile
        shell: bash

      # 浏览器门禁（verify-423-title-clamp-browser）要 Playwright 的 Chromium；
      # runner 上默认没有下载过浏览器，缺了就会报 Executable doesn't exist。
      # Linux 还要系统依赖，走 --with-deps；Windows / macOS 只装浏览器本体。
      - name: Install Playwright Chromium (Linux, with system deps)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        shell: bash

      - name: Install Playwright Chromium (Windows / macOS)
        if: runner.os != 'Linux'
        run: npx playwright install chromium
        shell: bash

      - name: Build artifacts (Gate I3)
        run: node scripts/build.mjs
        shell: bash

      - name: Verify chain（逐道跑并汇总：一条失败不再掩盖后面的门禁）
        run: node scripts/verify-all.mjs
        shell: bash

      - name: Stage 1 minimal smoke (3 OS × GitHub, injected I1/I2/I4)
        run: node scripts/matrix-smoke.js --os=all
        shell: bash

      - name: Stage 2 full matrix (3 OS × 3 backends, 9 cells)
        run: node scripts/matrix-full.js --os=all --backend=all
        shell: bash

      - name: Upload matrix snapshot (artifact per OS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-results-${{ matrix.os }}
          path: |
            docs/architecture/matrix.md
            scripts/matrix-smoke.js
            scripts/matrix-full.js
          retention-days: 14

  darwin-note:
    # 若组织禁用 macos-latest，需自托管 mac 或手动跑；此处仅作为文档性登记（本配置已用 hosted runner 覆盖 darwin）
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "darwin runner 若无则登记：需自托管 mac 或手动跑 node scripts/matrix-smoke.js --os=darwin"
