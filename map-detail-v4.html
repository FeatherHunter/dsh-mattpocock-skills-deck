<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waystation Map 详情 · v4（A/D/E 三方向 · 视觉升级）</title>
<style>
  :root{
    --bg:#05070c; --bg2:#0a0e16; --bg3:#111827; --line:#232b38;
    --txt:#e8edf4; --txt2:#97a2b3; --txt3:#5a6472;
    --green:#4ade80; --blue:#58a6ff; --orange:#f0883e; --purple:#c084fc; --red:#f87171;
    --mono:'JetBrains Mono','Cascadia Code',Consolas,monospace;
    --sans:'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;
    --hand:'Segoe Print','Comic Sans MS','Bradley Hand',cursive;
    --fw:520px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;font-family:var(--sans);color:var(--txt);display:flex;justify-content:center;padding:14px 6px;min-height:100vh;
    background-image:radial-gradient(700px 400px at 50% -10%, rgba(88,166,255,.06), transparent 60%),
      radial-gradient(500px 300px at 90% 110%, rgba(192,132,252,.05), transparent 60%)}
  .frame{width:var(--fw);max-width:100%;background:linear-gradient(180deg, rgba(10,14,22,.96), rgba(5,7,12,.98));border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:width .3s ease;box-shadow:0 0 40px rgba(0,0,0,.6)}
  .top{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02)}
  .top .t{font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;
    background:linear-gradient(90deg,#c084fc,#58a6ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .top .sp{flex:1}.top .x{color:var(--txt3);cursor:pointer;padding:0 6px}
  svg.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
  svg.ic.sm{width:12px;height:12px}
  .hd{display:flex;align-items:center;gap:8px;padding:10px 14px 0;flex-wrap:wrap}
  .hd .back{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--txt2);cursor:pointer;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
  .hd .back:hover{background:var(--bg3)}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid rgba(192,132,252,.5);color:var(--purple);font-family:var(--mono);background:rgba(192,132,252,.08)}
  .hd .sp{flex:1}.hd .ghost{font-size:10px;color:var(--txt3);cursor:pointer;padding:2px 6px}
  .mtitle{font-size:14px;font-weight:700;padding:8px 14px 0;line-height:1.4;overflow-wrap:anywhere;
    background:linear-gradient(180deg,#fff,#aeb6c4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  /* 状态条（玻璃拟态） */
  .statusbar{display:flex;align-items:center;gap:10px;margin:12px 14px 0;padding:9px 12px;border-radius:10px;
    background:linear-gradient(90deg, rgba(74,222,128,.08), rgba(88,166,255,.05));
    border:1px solid rgba(74,222,128,.25);backdrop-filter:blur(8px)}
  .statusbar .phase{font-size:11px;font-weight:700;color:var(--green);white-space:nowrap;display:flex;align-items:center;gap:5px}
  .statusbar .bar{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
  .statusbar .bar i{display:block;height:100%;border-radius:4px;
    background:linear-gradient(90deg,#4ade80,#58a6ff,#c084fc);background-size:200% 100%;animation:flow 4s linear infinite}
  @keyframes flow{0%{background-position:0% 0}100%{background-position:200% 0}}
  .statusbar .cnt{font-family:var(--mono);font-size:10px;color:var(--txt2);white-space:nowrap}
  .focusbar{display:flex;align-items:center;gap:8px;margin:8px 14px 0;padding:8px 12px;border-radius:10px;
    background:linear-gradient(90deg, rgba(74,222,128,.1), rgba(74,222,128,.03));border:1px solid rgba(74,222,128,.4)}
  .focusbar .lbl{font-size:9px;color:var(--green);font-weight:700;letter-spacing:.5px;text-transform:uppercase;flex:none;display:flex;align-items:center;gap:4px}
  .focusbar .who{font-size:11px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d7ffe6}
  .btn{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg3);color:var(--txt);cursor:pointer;font-family:var(--sans);transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,#4ade80,#22c55e);color:#04120a;font-weight:700;border:none;box-shadow:0 2px 12px rgba(74,222,128,.35)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--txt3)}
  .map{position:relative;padding:10px 14px 16px;min-height:200px}
  body.nofog .fog{filter:none!important;opacity:1!important}
  body.nofog .fog .qmark{display:none}
  .foobar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid rgba(255,255,255,.06);font-size:9.5px;color:var(--txt2);flex-wrap:wrap}
  .foobar label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .foobar .sp{flex:1}
  .wsel{display:flex;gap:4px}
  .wsel button{font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg3);color:var(--txt2);cursor:pointer}
  .wsel button.on{border-color:var(--purple);color:var(--purple);background:rgba(192,132,252,.1)}
  .switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(22,27,36,.92);border:1px solid #333d4e;border-radius:99px;padding:6px 14px;box-shadow:0 6px 24px rgba(0,0,0,.7);z-index:99;font-size:12px;white-space:nowrap;backdrop-filter:blur(10px)}
  .switcher .ar{cursor:pointer;color:var(--txt2);padding:2px 8px;border-radius:6px;user-select:none}
  .switcher .ar:hover{background:var(--bg3);color:#fff}
  .switcher .lbl{font-family:var(--mono);min-width:170px;text-align:center}
  .switcher .lbl small{color:var(--txt3);font-weight:400}
  .hint{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(16,20,28,.94);border:1px solid #333d4e;border-radius:8px;padding:5px 12px;font-size:10px;color:var(--txt3);z-index:99;white-space:nowrap;backdrop-filter:blur(8px)}
  .hint b{color:var(--purple)}
  /* ========== A 方向 ========== */
  .start{display:flex;gap:9px;align-items:flex-start;margin-bottom:4px}
  .start .wrap{display:flex;flex-direction:column}
  .start .cap{font-family:var(--hand);font-size:16px;font-weight:700;color:#fff;line-height:1.1}
  .start .desc{font-size:9px;color:var(--txt3);font-style:italic;line-height:1.3}
  .A-layer{display:flex;justify-content:center;gap:10px;padding:2px 0}
  .A-node{display:flex;align-items:center;gap:8px;border-radius:12px;padding:7px 9px;min-width:0;width:calc(50% - 5px);position:relative;
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    border:1.5px solid var(--line);transition:filter .5s,opacity .5s,box-shadow .5s,transform .2s;color:var(--txt)}
  .A-node .icbox{width:24px;height:24px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1.5px solid;background:rgba(0,0,0,.5);color:var(--txt2)}
  .A-node .bd{flex:1;min-width:0}
  .A-node .tt{font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .A-node .sub{font-size:8px;color:var(--txt3);margin-top:2px;white-space:nowrap;overflow:hidden}
  .A-node.done{opacity:.55}.A-node.done .icbox{border-color:rgba(139,148,158,.5);color:#8b949e}
  .A-node.now{border-color:rgba(74,222,128,.9);box-shadow:0 0 18px rgba(74,222,128,.3), inset 0 0 8px rgba(74,222,128,.08);animation:pulse 2.2s infinite}
  .A-node.now .icbox{border-color:rgba(74,222,128,.8);color:var(--green);box-shadow:0 0 10px rgba(74,222,128,.35)}
  .A-node.wait{border-color:rgba(240,136,62,.5);border-style:dashed;opacity:.8}
  .A-node.wait .icbox{border-color:rgba(240,136,62,.45);color:var(--orange)}
  .A-node.fog{filter:blur(2.4px) brightness(.45);opacity:.6;cursor:pointer;border-color:rgba(192,132,252,.4)}
  .A-node.fog:hover,.A-node.fog.revealed{filter:none;opacity:1}
  .A-node.fog.revealed .acts[data-reveal-acts], .A-node.fog:hover .acts[data-reveal-acts]{opacity:1;height:auto}
  .A-node.fog:hover .qmark,.A-node.fog.revealed .qmark{display:none}
  /* A 节点垂直布局（长标题 + 动作） */
  .A-node{flex-direction:column;align-items:stretch;gap:5px;padding:8px 9px}
  .A-node .row1{display:flex;align-items:center;gap:7px}
  .A-node .row2{flex:1;min-width:0}
  .A-node .meta{display:flex;align-items:center;gap:5px;margin-bottom:2px}
  .A-node .no{font-family:var(--mono);font-size:9px;color:var(--txt3)}
  .A-node .tag{font-family:var(--mono);font-size:8px;padding:0 4px;border-radius:3px;border:1px solid;opacity:.85}
  .A-node .tt{font-size:11px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
  .A-node .sub{font-size:8px;color:var(--txt3);margin-top:2px}
  .A-node .acts{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .act-btn{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;padding:3px 8px;border-radius:6px;border:none;cursor:pointer;font-family:var(--sans);font-weight:600;transition:filter .15s,transform .15s}
  .act-btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
  .act-btn .ic{width:11px;height:11px}
  .act-btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt2);font-weight:400}
  .act-btn.link{background:transparent;border:none;color:var(--txt3);padding:3px 4px}
  .act-diagnose{background:#f59e0b;color:#1a1200}
  .act-fix{background:#f87171;color:#1a0a0a}
  .act-discuss{background:#d93f0b;color:#fff}
  .act-execute{background:#c084fc;color:#140a1e}
  .A-node.now .tt{color:#d7ffe6}
  .A-node.wait .tt{color:var(--txt2)}
.A-gate{height:30px;display:flex;align-items:center;justify-content:center;position:relative}
  .A-gate::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:2px;background:linear-gradient(180deg, transparent, rgba(255,255,255,.15), transparent)}
  .A-gate .g{width:24px;height:24px;border-radius:50%;background:var(--bg2);border:2px solid;display:flex;align-items:center;justify-content:center;z-index:1;color:var(--txt2)}
  .A-gate .g.lock{border-color:rgba(240,136,62,.55);color:var(--orange)}
  .A-gate .g.open{border-color:rgba(74,222,128,.75);color:var(--green);box-shadow:0 0 10px rgba(74,222,128,.3)}
  .A-layerTag{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--txt3);letter-spacing:.5px;margin:9px 0 5px;text-transform:uppercase}
  .A-layerTag .sp{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  @keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(74,222,128,.25)}50%{box-shadow:0 0 22px rgba(74,222,128,.6)}}
  /* ===== Destination 圣坛（重做） ===== */
  .dest-dome{position:relative;margin-top:16px;border-radius:16px;padding:20px 14px 16px;text-align:center;overflow:hidden;
    background:linear-gradient(180deg, rgba(192,132,252,.14), rgba(88,166,255,.05) 60%, rgba(5,7,12,.4));
    border:1.5px solid rgba(192,132,252,.45)}
  .dest-dome::before{content:'';position:absolute;inset:-40% -20%;background:
    radial-gradient(40% 50% at 50% 0%, rgba(192,132,252,.25), transparent 70%),
    radial-gradient(30% 40% at 30% 100%, rgba(88,166,255,.15), transparent 70%);
    animation:breath 5s ease-in-out infinite;pointer-events:none}
  @keyframes breath{0%,100%{opacity:.6}50%{opacity:1}}
  .dest-dome > *{position:relative;z-index:1}
  .dest-ring{width:112px;height:112px;margin:0 auto 4px;position:relative}
  .dest-ring svg{transform:rotate(-90deg)}
  .dest-ring .track{stroke:rgba(255,255,255,.08);fill:none;stroke-width:8}
  .dest-ring .prog{fill:none;stroke-width:8;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(192,132,252,.7))}
  .dest-core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .dest-core .pct{font-family:var(--mono);font-size:24px;font-weight:700;
    background:linear-gradient(90deg,#4ade80,#58a6ff,#c084fc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .dest-core .cap{font-size:8px;color:var(--txt3);letter-spacing:1px}
  .dest-flag{width:18px;height:18px;margin:0 auto 2px;fill:none;stroke:var(--purple);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(192,132,252,.8))}
  .dest-title{font-family:var(--hand);font-size:19px;font-weight:700;margin-top:2px;
    background:linear-gradient(90deg,#c084fc,#58a6ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
  .dest-desc{font-size:9.5px;color:var(--txt3);font-style:italic;margin:3px 0 10px}
  .dest-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:12px}
  .dest-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#4ade80,#58a6ff,#c084fc);background-size:200% 100%;animation:flow 4s linear infinite}
  .dest-acts{display:flex;justify-content:center;gap:8px}
  .dest-orb{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--purple);box-shadow:0 0 8px var(--purple);animation:orb 6s linear infinite;z-index:0}
  @keyframes orb{0%{top:18%;left:8%;opacity:0}10%{opacity:.8}90%{opacity:.8}100%{top:70%;left:90%;opacity:0}}
  /* ===== D 关卡 ===== */
  .D-canvas{position:relative;border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.01)}
  .D-level{position:relative;display:flex;align-items:center;gap:10px;border-radius:12px;padding:9px 11px;
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));border:1.5px solid var(--line);transition:filter .5s,opacity .5s,box-shadow .5s;color:var(--txt)}
  .D-level .lv{width:34px;height:34px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;border:1.5px solid;color:var(--txt3);font-family:var(--hand);font-size:15px}
  .D-level .bd{flex:1;min-width:0}
  .D-level .nm{font-size:11.5px;font-weight:700}
  .D-level .ds{font-size:9px;color:var(--txt3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .D-level .stt{font-size:9px;flex:none;display:flex;align-items:center;gap:4px;color:var(--txt2)}
  .D-level.done{opacity:.55}.D-level.done .lv{border-color:var(--green);color:var(--green)}
  .D-level.now{border-color:rgba(74,222,128,.9);box-shadow:0 0 14px rgba(74,222,128,.35);animation:pulse 2.2s infinite}
  .D-level.now .lv{border-color:var(--green);color:var(--green);box-shadow:0 0 8px rgba(74,222,128,.4)}
  .D-level.lock{opacity:.7}.D-level.lock .lv{border-color:var(--txt3)}
  .D-level.fog{filter:blur(2.2px) brightness(.5);opacity:.6;cursor:pointer}
  .D-level.fog:hover{filter:none;opacity:1}
  .D-divider{text-align:center;font-size:9px;color:var(--txt3);padding:2px 0;display:flex;align-items:center;justify-content:center;gap:5px}
  .D-end{text-align:center;font-size:11px;color:var(--purple);font-family:var(--hand);font-weight:700;margin-top:2px;display:flex;align-items:center;justify-content:center;gap:6px}
  /* ===== E RTS（百分比自适应 + 连线） ===== */
  .E-canvas{position:relative;height:540px;border:1px dashed var(--line);border-radius:12px;overflow:hidden;
    background:
      radial-gradient(80px 60px at 12% 20%, rgba(255,255,255,.03), transparent 70%),
      radial-gradient(90px 70px at 78% 30%, rgba(255,255,255,.03), transparent 70%),
      radial-gradient(70px 50px at 30% 70%, rgba(255,255,255,.02), transparent 70%),
      linear-gradient(180deg, rgba(10,14,22,.6), rgba(5,7,12,.8))}
  .E-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:26px 26px}
  .E-lines{position:absolute;inset:0;width:100%;height:100%}
  .E-zone{position:absolute;border-radius:10px;padding:6px 8px;border:1.5px solid;background:rgba(0,0,0,.7);font-size:9.5px;cursor:pointer;transition:filter .5s,opacity .5s,box-shadow .5s,transform .15s;color:var(--txt);backdrop-filter:blur(4px)}
  .E-zone:hover{transform:scale(1.04)}
  .E-zone .zn{font-weight:700;display:flex;align-items:center;gap:5px}
  .E-zone .zd{font-size:7.5px;color:var(--txt3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .E-zone.explored{border-color:rgba(139,148,158,.4);opacity:.7}
  .E-zone.explored .zn{color:var(--txt2)}
  .E-zone.active{border-color:var(--green);box-shadow:0 0 14px rgba(74,222,128,.5);animation:pulse 2.2s infinite}
  .E-zone.active .zn{color:var(--green)}
  .E-zone.locked{border-color:rgba(240,136,62,.5);border-style:dashed;opacity:.8}
  .E-zone.locked .zn{color:var(--orange)}
  .E-zone.fog{filter:blur(2.2px) brightness(.45);opacity:.55;border-color:var(--purple)}
  .E-zone.fog:hover,.E-zone.fog.revealed{filter:none;opacity:1}
  .E-base{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px}
  .E-base .b{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--purple);display:flex;align-items:center;justify-content:center;background:rgba(192,132,252,.12);box-shadow:0 0 18px rgba(192,132,252,.45);color:var(--purple)}
  .E-legend{position:absolute;bottom:8px;left:10px;display:flex;gap:10px;font-size:8px;color:var(--txt3)}
  .E-legend .lg{display:flex;align-items:center;gap:4px}
  .E-legend .sq{width:9px;height:9px;border-radius:2px;border:1.5px solid}
  .explain{font-size:10px;color:var(--txt3);padding:9px 14px;border-top:1px solid rgba(255,255,255,.06);line-height:1.75;font-family:'Segoe UI',system-ui,sans-serif}
  .explain b{color:var(--txt2)}
</style>
</head>
<body>

<div class="hint">Map 详情 · <b>v4 · A/D/E 三方向</b> · ← → 切换 · 视觉升级版</div>

<div class="frame" id="frame">
  <div class="top">
    <span class="t"><svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><path d="M8 8 L11.5 4.5 M8 8 L8 2.5"/></svg>Waystation</span>
    <span class="sp"></span><span class="x">×</span>
  </div>
  <div class="hd">
    <span class="back"><svg class="ic sm" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>返回列表</span>
    <span class="chip"><svg class="ic sm" viewBox="0 0 24 24"><path d="M9 20l-5-5 9-9 5 5-9 9z"/><path d="M13 4l7 7"/></svg>wayfinder:map</span>
    <span class="sp"></span>
    <span class="ghost">刷新</span><span class="ghost"><svg class="ic sm" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg></span>
  </div>
  <div class="mtitle">[dsh-waystation] 实施 map · DSH-Waystation P0 落地</div>

  <div class="statusbar">
    <span class="phase"><svg class="ic sm" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8V4z"/></svg>当前阶段：构建</span>
    <div class="bar"><i style="width:38%"></i></div>
    <span class="cnt">3/8 · 38%</span>
  </div>
  <div class="focusbar">
    <span class="lbl"><svg class="ic sm" viewBox="0 0 24 24"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg>下一步</span>
    <span class="who" id="focusWho"></span>
    <button class="btn primary" onclick="flash('✓ 已注入 /wayfinder + #344（mock）')"><svg class="ic sm" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8V4z"/></svg>开始</button>
  </div>

  <div class="map" id="root"></div>

  <div class="foobar">
    <label><input type="checkbox" id="fogToggle"> 迷雾</label>
    <span class="sp"></span>
    <div class="wsel">
      <button data-w="360">360</button><button data-w="440">440</button><button data-w="520" class="on">520</button>
    </div>
  </div>

  <div class="explain" id="explain"></div>
</div>

<div class="switcher">
  <span class="ar" id="prev">◀</span>
  <span class="lbl" id="vlabel"></span>
  <span class="ar" id="next">▶</span>
</div>

<script>
try {
const I = {
  flag: '<svg class="ic" viewBox="0 0 24 24"><path d="M5 3v18"/><path d="M5 4c4-2 6 2 12 0v9c-6 2-8-2-12 0"/></svg>',
  mag:  '<svg class="ic" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5L21 21"/></svg>',
  bolt: '<svg class="ic" viewBox="0 0 24 24"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg>',
  wrench:'<svg class="ic" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.2 4.9L3 17.8V21h3.2l6.6-6.5a4 4 0 0 0 4.9-5.2l-2.8 2.8-2.6-2.6 2.8-2.8z"/></svg>',
  lock: '<svg class="ic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  play: '<svg class="ic" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8V4z"/></svg>',
  clock:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  q:    '<svg class="ic" viewBox="0 0 24 24"><path d="M9.5 9a2.5 2.5 0 1 1 3.7 2.2c-.9.4-1.2 1-1.2 1.8"/><circle cx="12" cy="18" r=".6"/></svg>',
  target:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>',
  arrowD:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 4v16M6 14l6 6 6-6"/></svg>',
  chat:  '<svg class="ic" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l2.5-3.5A8 8 0 1 1 21 12z"/><path d="M8.5 11.5h7M8.5 15h4"/></svg>',
  hammer:'<svg class="ic" viewBox="0 0 24 24"><path d="M13.5 5.5l5 5-2 2-5-5 2-2z"/><path d="M12 7.5L4 15.5a1.5 1.5 0 0 0 0 2.1l.9.9a1.5 1.5 0 0 0 2.1 0L15 10.5"/></svg>',
};
const flagSvg = (color) => '<svg style="width:20px;height:20px;fill:none;stroke:'+color+';stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M5 3v18"/><path d="M5 4c4-2 6 2 12 0v9c-6 2-8-2-12 0"/></svg>';

document.getElementById('fogToggle').addEventListener('change',function(){document.body.classList.toggle('nofog',this.checked)});
document.querySelectorAll('.wsel button').forEach(b=>{
  b.addEventListener('click',function(){
    document.querySelectorAll('.wsel button').forEach(x=>x.classList.remove('on'));
    this.classList.add('on');
    document.documentElement.style.setProperty('--fw', this.dataset.w + 'px');
  });
});
function flash(m){const s=document.querySelector('.switcher'),o=s.innerHTML;s.innerHTML='<span style="color:var(--green)">'+m+'</span>';setTimeout(()=>s.innerHTML=o,1400)}

/* ============ A · 漏斗分层（真实标题 + 四态动作） ============ */
const A_TICKETS = [
  { no:343, tag:'research',  st:'done', title:'核实 gh sub-issues/blocks 端点与 inputActions 签名' },
  { no:355, tag:'prototype', st:'done', title:'UX 原型 · 假数据可交互面板（评审后定稿 UX）' },
  { no:344, tag:'task', st:'now', label:'needs-triage', title:'前置检查绿点模块（Host wf.status 双层探测）' },
  { no:345, tag:'task', st:'now', label:'bug', title:'gh 数据层 + 快照模型 + 轮询 + wf.snapshot' },
  { no:424, tag:'task', st:'now', title:'状态栏胶囊 + 输入注入（v9-v24 迭代）' },
  { no:347, tag:'task', st:'wait', title:'开始此 Issue 流程（确认框 + 认领 + 注入 /wayfinder）', by:'#345' },
  { no:346, tag:'task', st:'wait', title:'Client 面板 UI（overlay 地图/票务/技能三视图）', by:'#344 #345' },
  { no:348, tag:'grilling', st:'fog', label:'wayfinder:grilling', title:'P0 验收与 UX 细节拍板（演示后定稿）' },
  { no:362, tag:'task', st:'fog', title:'NPM 发布 dsh-waystation（可分发 npm 包）' },
];
function actionOf(x){
  if (x.label === 'needs-triage') return {key:'diagnose', label:'诊断', icon:'chat', cls:'act-diagnose'}
  if (x.label === 'bug') return {key:'fix', label:'修复', icon:'hammer', cls:'act-fix'}
  if (x.label === 'wayfinder:grilling') return {key:'discuss', label:'讨论', icon:'chat', cls:'act-discuss'}
  return {key:'execute', label:'执行', icon:'play', cls:'act-execute'}
}
function dirA(){
  document.getElementById('focusWho').textContent='#344 诊断 · #345 修复 · #424 执行（可并行）';
  const node=(x)=>{
    const a = actionOf(x);
    const q = x.st==='fog' ? '<svg class="qmark" style="position:absolute;right:8px;bottom:6px;width:13px;height:13px;color:rgba(192,132,252,.8);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round" viewBox="0 0 24 24"><path d="M9.5 9a2.5 2.5 0 1 1 3.7 2.2c-.9.4-1.2 1-1.2 1.8"/><circle cx="12" cy="18" r=".6"/></svg>' : '';
    const sub = x.st==='done' ? '✓ 已完成' : x.st==='now' ? '未认领 · 可开始' : x.st==='wait' ? ('⏳ 被 '+x.by+' 阻塞') : 'Not yet specified';
    let acts='';
    if (x.st==='now') acts = '<div class="acts"><button class="act-btn '+a.cls+'" onclick="event.stopPropagation();flash(\'✓ 已注入 /wayfinder + #'+x.no+'（'+a.label+'·mock）\')">'+I[a.icon]+a.label+'</button><button class="act-btn ghost" onclick="event.stopPropagation()">新会话</button><button class="act-btn link" title="GitHub">'+I.flag+'</button></div>';
    else if (x.st==='fog') acts = '<div class="acts" style="opacity:0;height:0;overflow:hidden;transition:opacity .3s" data-reveal-acts>'+'<button class="act-btn '+a.cls+'">'+I[a.icon]+a.label+'</button><button class="act-btn ghost">新会话</button></div>';
    return '<div class="A-node '+x.st+'" '+(x.st==='fog'?'onclick="this.classList.toggle(\'revealed\')"':'')+'>'
      +'<div class="row1"><div class="icbox">'+(x.tag==='research'?I.mag:x.tag==='prototype'?I.bolt:x.tag==='grilling'?I.chat:I.wrench)+'</div>'
      +'<div class="row2"><div class="meta"><span class="no">#'+x.no+'</span><span class="tag">'+x.tag+'</span></div>'
      +'<div class="tt" title="'+x.title+'">'+x.title+'</div></div></div>'
      +'<div class="sub">'+sub+'</div>'
      +acts+q+'</div>';
  };
  const R=52,C=2*Math.PI*R,off=C*(1-0.38);
  return '<div class="start">'+flagSvg('#fff')+'<div class="wrap"><div class="cap">Start</div><div class="desc">模糊想法 → 点燃推进</div></div></div>'
    +'<div class="A-layerTag">可并行 · 已探索<span class="sp"></span></div>'
    +'<div class="A-layer">'+node(A_TICKETS[0])+node(A_TICKETS[1])+'</div>'
    +'<div class="A-gate"><span class="g open">'+I.check+'</span></div>'
    +'<div class="A-layerTag">可并行 · 当前行动<span class="sp"></span><span style="color:var(--green)">动作按 label 判定</span></div>'
    +'<div class="A-layer">'+node(A_TICKETS[2])+node(A_TICKETS[3])+'</div>'
    +'<div class="A-layer">'+node(A_TICKETS[4])+'</div>'
    +'<div class="A-gate"><span class="g lock">'+I.clock+'</span></div>'
    +'<div class="A-layerTag">可并行 · 等上游<span class="sp"></span></div>'
    +'<div class="A-layer">'+node(A_TICKETS[5])+node(A_TICKETS[6])+'</div>'
    +'<div class="A-gate"><span class="g lock">'+I.clock+'</span></div>'
    +'<div class="A-layerTag">必须串行 · 迷雾<span class="sp"></span></div>'
    +'<div class="A-layer">'+node(A_TICKETS[7])+'</div>'
    +'<div class="A-layer">'+node(A_TICKETS[8])+'</div>'
    +'<div class="dest-dome">'
    +'<span class="dest-orb"></span><span class="dest-orb" style="animation-delay:2s"></span>'
    +'<div class="dest-ring"><svg width="112" height="112" viewBox="0 0 120 120">'
    +'<defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4ade80"/><stop offset="50%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#c084fc"/></linearGradient></defs>'
    +'<circle class="track" cx="60" cy="60" r="52"/>'
    +'<circle class="prog" cx="60" cy="60" r="52" stroke="url(#dg)" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'"/>'
    +'</svg><div class="dest-core"><span class="pct">38%</span><span class="cap">3 / 8 票</span></div></div>'
    +flagSvg('var(--purple)')
    +'<div class="dest-title">Destination</div>'
    +'<div class="dest-desc">漏斗收敛 · 每层解锁推进 · 终点在迷雾尽头</div>'
    +'<div class="dest-bar"><i style="width:38%"></i></div>'
    +'<div class="dest-acts"><button class="btn primary" onclick="flash(\'✓ 已注入 /wayfinder + #344（mock）\')">'+I.play+'开始 #344</button><button class="btn ghost" style="margin-left:4px">档案</button></div>'
    +'</div>';
}

/* ============ D · 关卡路线 ============ */
function dirD(){
  document.getElementById('focusWho').textContent='关卡 3 · 当前可打（#344 / #345）';
  const lv=(n,nm,ds,st,right)=>{
    return '<div class="D-level '+st+'"><div class="lv"><span>'+n+'</span></div><div class="bd"><div class="nm">'+nm+'</div><div class="ds">'+ds+'</div></div><div class="stt">'+right+'</div></div>';
  };
  return '<div class="D-canvas">'
    +lv('1','探索起点','#343 核实端点 · #355 UX 原型','done','<svg class="ic" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>已通关')
    +'<div class="D-divider">'+I.arrowD+'当前关卡 · 迷雾边缘</div>'
    +lv('3','构建','#344 前置检查 · #345 gh 数据层（可并行）','now','<svg class="ic" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8V4z"/></svg>可打')
    +'<div class="D-divider">'+I.arrowD+'未解锁</div>'
    +lv('4','集成','#347 开始流程 · #346 Client 面板','lock','<svg class="ic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>等 3')
    +lv('5','验收','#348 P0 拍板','fog','<svg class="ic" viewBox="0 0 24 24"><path d="M9.5 9a2.5 2.5 0 1 1 3.7 2.2c-.9.4-1.2 1-1.2 1.8"/><circle cx="12" cy="18" r=".6"/></svg>迷雾')
    +lv('6','发布','#362 NPM 发布','fog','<svg class="ic" viewBox="0 0 24 24"><path d="M9.5 9a2.5 2.5 0 1 1 3.7 2.2c-.9.4-1.2 1-1.2 1.8"/><circle cx="12" cy="18" r=".6"/></svg>迷雾')
    +'<div class="D-end">'+flagSvg('var(--purple)')+'通关 = 到达 Destination</div>'
    +'</div>';
}

/* ============ E · RTS 小地图（百分比 + 连线 · 修复版） ============ */
function dirE(){
  document.getElementById('focusWho').textContent='「前置检查」区域 · 迷雾边缘的据点';
  // 节点百分比坐标，整体内缩（避开贴边），布局上下均衡
  const zones=[
    {x:8, y:6,  w:20, icon:'flag',  zn:'起点',   zd:'#343 核实 · #355 原型', st:'explored'},
    {x:72,y:6,  w:20, icon:'bolt',  zn:'原型',   zd:'#355 UX 原型',        st:'explored'},
    {x:8, y:30, w:22, icon:'wrench',zn:'前置检查',zd:'#344 · 可开始',       st:'active'},
    {x:70,y:30, w:22, icon:'wrench',zn:'数据层', zd:'#345 · 可开始',       st:'active'},
    {x:8, y:56, w:22, icon:'lock',  zn:'集成',   zd:'#347 #346 · 等上游',   st:'locked'},
    {x:70,y:56, w:22, icon:'q',     zn:'验收',   zd:'#348 P0 拍板',        st:'fog'},
    {x:36,y:76, w:24, icon:'q',     zn:'发布',   zd:'#362 NPM',            st:'fog'},
  ];
  // 连线：0起点 1原型 2前置 3数据 4集成 5验收 6发布 7=Destination
  const edges=[
    [0,2],[0,3],[1,3],
    [2,4],[3,4],
    [2,5],[4,5],
    [4,6],[5,6],[6,7]
  ];
  const cx=(z)=>{ const off=z.w/2; return z.x+off; };
  const cy=(z)=>z.y+7;
  const dst={x:84,y:70};
  let lines='';
  const col=(a,b)=>{
    if(a===7||b===7) return 'rgba(192,132,252,.45)';
    const za=zones[a],zb=zones[b];
    if(za.st==='fog'||zb.st==='fog') return 'rgba(192,132,252,.3)';
    if(za.st==='active'||zb.st==='active') return 'rgba(74,222,128,.5)';
    return 'rgba(255,255,255,.22)';
  };
  edges.forEach(([a,b])=>{
    const A=a===7?dst:{x:cx(zones[a]),y:cy(zones[a])};
    const B=b===7?dst:{x:cx(zones[b]),y:cy(zones[b])};
    const mid=(A.y+B.y)/2;
    lines+='<path d="M'+A.x+' '+A.y+' C '+A.x+' '+mid+', '+B.x+' '+mid+', '+B.x+' '+B.y+'" stroke="'+col(a,b)+'" stroke-width="1.6" stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>';
  });
  const zoneHtml=zones.map((z,i)=>{
    return '<div class="E-zone '+z.st+'" style="left:'+z.x+'%;top:'+z.y+'%;width:'+z.w+'%" onclick="if(this.classList.contains(\'fog\'))this.classList.toggle(\'revealed\')"><div class="zn">'+I[z.icon]+z.zn+'</div><div class="zd">'+z.zd+'</div></div>';
  }).join('');
  return '<div class="E-canvas">'
    +'<div class="E-grid"></div>'
    +'<svg class="E-lines" viewBox="0 0 100 100" preserveAspectRatio="none">'+lines+'</svg>'
    +zoneHtml
    +'<div class="E-base" style="right:6%;bottom:12%"><div class="b">'+I.target+'</div><div class="t" style="color:var(--purple);font-family:var(--hand);font-weight:700;font-size:8.5px">Destination</div></div>'
    +'<div class="E-legend"><span class="lg"><span class="sq" style="border-color:var(--txt3)"></span>已探索</span><span class="lg"><span class="sq" style="border-color:var(--green)"></span>可接</span><span class="lg"><span class="sq" style="border-color:var(--purple)"></span>迷雾</span></div>'
    +'</div>';
}

const DIRS=[
  {key:'A',name:'漏斗分层',sub:'Destination 圣坛'},
  {key:'D',name:'关卡路线',sub:'游戏选关'},
  {key:'E',name:'RTS 小地图',sub:'连线+自适应'},
];
const EXPLAIN={
  A:'<b>A · 漏斗分层</b>：真实标题（2 行 clamp + hover 全文）+ 四态动作（诊断 needs-triage / 修复 bug / 讨论 grilling / 执行 默认），与列表 mkRowAction 同逻辑。迷雾节点侦察后露出动作。',
  D:'<b>D · 关卡路线</b>：游戏选关，通关即前进。已通关/当前/未解锁/迷雾四态。',
  E:'<b>E · RTS 小地图</b>：节点全部百分比定位（随宽度缩放不溢出），节点间 SVG 虚线连线表达依赖流向。',
};
let cur=0;
function render(){
  const d=DIRS[cur];
  document.getElementById('root').innerHTML = d.key==='A'?dirA():d.key==='D'?dirD():dirE();
  document.getElementById('vlabel').innerHTML = d.key+' · <small>'+d.name+'</small>';
  document.getElementById('explain').innerHTML = EXPLAIN[d.key];
  const u=new URL(location.href);u.searchParams.set('dir',d.key);history.replaceState(null,'',u);
}
document.getElementById('prev').onclick=()=>{cur=(cur+2)%3;render()};
document.getElementById('next').onclick=()=>{cur=(cur+1)%3;render()};
document.addEventListener('keydown',e=>{
  const tag=document.activeElement&&document.activeElement.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  if(e.key==='ArrowLeft'){cur=(cur+2)%3;render()}
  if(e.key==='ArrowRight'){cur=(cur+1)%3;render()}
});
const vp=new URLSearchParams(location.search).get('dir');
if(vp){const i=DIRS.findIndex(d=>d.key===vp.toUpperCase());if(i>=0)cur=i}
render();
} catch(err){
  const el=document.createElement('div');
  el.style.cssText='margin:8px 14px;padding:8px 10px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.4);border-radius:8px;font-size:10px;color:#f87171;white-space:pre-wrap;font-family:monospace';
  el.textContent='JS 错误: '+String(err && err.message || err)+'\n'+String(err && err.stack || '');
  document.querySelector('.map').appendChild(el);
}
</script>
</body>
</html>
