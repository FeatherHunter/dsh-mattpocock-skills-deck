<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star History — dsh-mattpocock-skills-deck</title>
<script src="https://cdn.jsdelivr.net/npm/chart.xkcd@1.1/dist/chart.xkcd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
:root{--bg:#0b0e14;--fg:#e6edf3;--muted:#9aa3b2;--border:#1f2937;--card:#111827}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:"Patrick Hand",cursive}
.page{max-width:960px;margin:0 auto;padding:40px 24px 40px}
.hd{text-align:center;margin-bottom:20px}h1{margin:0;font-size:28px;letter-spacing:0.02em}
.card{background:var(--card);border:2.5px solid var(--border);border-radius:16px;padding:40px;box-shadow:4px 4px 0 rgba(255,255,255,0.06)}
.chart-wrap{position:relative;width:100%;height:520px}
.chart-wrap svg{width:100%!important;height:100%!important;display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--bg);border:2.5px solid var(--border);border-radius:12px;padding:14px;text-align:center;transform:rotate(-0.15deg)}
.stat:nth-child(2){transform:rotate(0.2deg)}
.stat:nth-child(3){transform:rotate(-0.1deg)}
.stat:nth-child(4){transform:rotate(0.15deg)}
.stat b{font-size:22px;display:block}
.stat span{color:var(--muted);font-size:12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
</style>
</head>
<body>
<div class="page">
<div class="hd"><h1>⭐ Star History</h1></div>
<div class="card">
<div class="chart-wrap"><svg id="chart"></svg></div>
<div class="stats" id="stats"></div>
</div>
</div>
<script>
async function load(){
  let data=null;
  const urls=[new URL("star-history.json",location.href).href,"https://featherhunter.github.io/dsh-mattpocock-skills-deck/star-history.json","https://raw.githubusercontent.com/FeatherHunter/dsh-mattpocock-skills-deck/main/docs/star-history.json"];
  for(const url of urls){try{const r=await fetch(url,{cache:"no-store"});if(!r.ok)continue;const j=await r.json();if(Array.isArray(j)&&j.length){data=j;break;}}catch(e){}}
  if(!data) throw new Error("star-history.json not found");
  const labels=data.map(d=>d.date.slice(5).replace("-","/"));
  const totals=data.map(d=>d.total);
  const dailys=data.map(d=>d.daily);
  const last=data[data.length-1];
  const maxDaily=Math.max(...dailys);
  const avg=(dailys.reduce((a,b)=>a+b,0)/dailys.length).toFixed(1);
  document.getElementById("stats").innerHTML=`<div class=stat><b>${last.total}</b><span>当前 Stars</span></div><div class=stat><b>${maxDaily}</b><span>单日峰值</span></div><div class=stat><b>${avg}</b><span>日均新增</span></div><div class=stat><b>${data.length}</b><span>有星之日</span></div>`;
  const svg=document.getElementById("chart");
  new chartXkcd.Line(svg,{
    xLabel:"Date",
    yLabel:"Stars",
    data:{labels,datasets:[{label:"Total Stars",data:totals},{label:"Daily New",data:dailys}]},
    options:{xTickCount:Math.min(5,Math.max(3,Math.ceil(labels.length/3))),yTickCount:4,legendPosition:chartXkcd.config.positionType.upLeft,showLine:true,dotSize:0.5,strokeColor:"white",backgroundColor:"#0b0e14",dataColors:["#ff6b6b","#38bdf8"],fontFamily:"Patrick Hand",unxkcdify:false}
  });
}
load().catch(e=>{document.getElementById("chart").outerHTML=`<p style="color:#ef4444;text-align:center;padding:40px">加载失败：${e.message}</p>`});
</script>
</body>
</html>
