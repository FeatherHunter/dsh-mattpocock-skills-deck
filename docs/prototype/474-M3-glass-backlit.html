<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地图详情页原型 M3 · 一块玻璃（从板子后面拍）</title>
<!--
  M3 · 一块玻璃（从板子后面拍）—— 电影探案板第四轮，独立设计方案三。

  这一屏在说什么（一句话）：你看的是一块立在房间里的半透明玻璃，资料用胶带贴在玻璃上，
  红线在玻璃上穿来穿去，马克笔的圈和字直接画在玻璃面上；玻璃后面是房间里的一盏灯，
  人从灯前走过时，那块光会跟着动，纸也就跟着亮一下、暗一下。

  物理叠法（从眼睛往房间深处数）：
    1. 马克笔层   —— 直接画在玻璃朝你这一面的圈、箭头、手写字（在纸的上方，会压过纸角）
    2. 玻璃层     —— 玻璃上的细划痕、水渍、指纹、灰尘（只加光不加黑，免得把纸上的字压暗）
    3. 资料层     —— 贴在玻璃上的纸（半透：alpha .80，房间的光会从纸里透出来一点）
    4. 线层       —— 红线（在纸的下面：纸压住线，跟真板子一样，线不会从资料上横穿过去）
    5. 光斑层     —— 目的地的常亮光晕、雾票的黑斑、跟着指针走的那片光
    6. 房间层     —— 房间的暗、灯、跟指针走的那片光、从灯前走过的人影

  雾里的票 = 背光被关掉的那一块：一块暗斑。点一下，背光亮起、内容浮出来。
  但它的状态照旧是「还没探明」—— 看清楚不等于办完了，这一条写在票上。

  真机功能（任务书第 3 节 A–H）一条都没省，每条都给了 data-cap 标记，方便验收脚本查。
  用到的技术：内联 SVG 做马克笔抖动（feTurbulence + feDisplacementMap）、
  transform 驱动的背光跟随（不在 rAF 里读布局）、Web Animations 做点亮时的那一下绽放、
  四状态用「盖章 / 蓝胶带 / 绿旗子 / 黑斑」四种实物区分（不只靠颜色）。
-->
<style>
  /* ============ 1. 基础与配色 ============ */
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --room-0: #04060a;
    --room-1: #0a0e15;
    --lamp: #ffd9a0;
    --cool: #9fc4ff;

    --ink: #1a1f27;          /* 纸上的墨 */
    --ink-2: #3d4854;
    /* 贴上去的资料：半透（房间的光会从纸里透出来一点），但纸面本身要够亮，
       免得半透 + 背光把字压到读不出来 */
    --paper-hi: rgba(243, 248, 254, .89);
    --paper: rgba(226, 234, 244, .78);
    --paper-lit-fog: rgba(222, 231, 242, .86);

    --red: #c0392b;
    --red-hot: #e8503a;
    --red-dim: #6b3227;
    --red-dead: #8a4a3c;
    --blue: #2f6fd0;
    --green: #15803d;
    --amber: #b45309;

    --metal-ink: #eef4fb;
    --metal-fg: #cfd8e3;
    --mono: Consolas, Menlo, "Cascadia Mono", monospace;
    --sans: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  html, body {
    margin: 0; padding: 0;
    background: #03050a;
    color: #e6edf3;
    font-family: var(--sans);
    overflow-x: clip;
  }
  body { min-height: 100vh; }
  button { font-family: inherit; cursor: pointer; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #2b3341; border-radius: 6px; }
  ::-webkit-scrollbar-track { background: #0a0e14; }

  #panel {
    position: relative;
    width: 810px;
    min-height: 100vh;
    margin: 0 auto;
    overflow-x: clip;
    isolation: isolate;
  }

  /* ============ 2. 房间（玻璃后面） ============ */
  #room {
    position: sticky; top: 0;
    height: 100vh; margin-bottom: -100vh;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #room .base {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 78% at 16% 4%, rgba(255, 217, 160, .20), rgba(255, 217, 160, .05) 42%, transparent 68%),
      radial-gradient(96% 62% at 92% 26%, rgba(159, 196, 255, .11), transparent 66%),
      linear-gradient(180deg, #0b1018 0%, #070a10 46%, #04060a 100%);
  }
  /* 墙上的暗纹理：两块大板拼缝 + 一点污渍，让玻璃后面的房间不是纯黑 */
  #room .wall {
    position: absolute; inset: -4% -2%;
    background:
      linear-gradient(90deg, transparent 0 49.7%, rgba(190, 214, 244, .035) 49.7% 50.3%, transparent 50.3%),
      radial-gradient(58% 34% at 74% 78%, rgba(120, 140, 170, .05), transparent 70%),
      radial-gradient(40% 26% at 30% 62%, rgba(120, 140, 170, .04), transparent 72%);
  }
  #lamp {
    position: absolute; left: -8%; top: -10%; width: 62%; height: 50%;
    background: radial-gradient(closest-side, rgba(255, 214, 150, .42), rgba(255, 214, 150, .13) 52%, transparent 76%);
  }
  #ptlight {
    position: absolute; left: -390px; top: -390px; width: 780px; height: 780px;
    background: radial-gradient(closest-side, rgba(255, 228, 184, .40), rgba(255, 222, 170, .15) 44%, rgba(255, 214, 150, .04) 62%, transparent 76%);
    will-change: transform;
  }
  /* 从灯前走过的那个人：一团比灯更暗的、拖在后面的模糊影子 */
  #walker {
    position: absolute; left: -110px; top: -200px; width: 220px; height: 400px;
    border-radius: 46% 46% 40% 40% / 38% 38% 30% 30%;
    background: radial-gradient(closest-side, rgba(2, 4, 8, .90), rgba(2, 4, 8, .62) 58%, transparent 80%);
    filter: blur(16px);
    will-change: transform;
  }
  #walker::before {
    content: ""; position: absolute; left: 50%; top: -46px; width: 128px; height: 128px;
    margin-left: -64px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(2, 4, 8, .88), rgba(2, 4, 8, .5) 62%, transparent 82%);
  }

  /* ============ 3. 玻璃面（只加光，不加黑，免得压暗纸上的字） ============ */
  #sheen {
    position: sticky; top: 0;
    height: 100vh; margin-bottom: -100vh;
    z-index: 5; pointer-events: none; overflow: hidden;
  }
  #sheen .streaks {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(102deg, rgba(200, 224, 250, .050) 0 1px, transparent 1px 6px),
      repeating-linear-gradient(97deg, rgba(200, 224, 250, .026) 0 1px, transparent 1px 13px);
  }
  #sheen .wash {
    position: absolute; inset: 0;
    background:
      linear-gradient(178deg, rgba(170, 200, 235, .055), transparent 16%),
      linear-gradient(0deg, rgba(170, 200, 235, .035), transparent 12%),
      linear-gradient(90deg, rgba(190, 215, 245, .05), transparent 4%, transparent 96%, rgba(190, 215, 245, .05));
  }
  .speck { position: absolute; border-radius: 50%; background: rgba(226, 238, 252, .30); }
  .smudge {
    position: absolute; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(214, 230, 250, .055), transparent 78%);
  }
  .ring {
    position: absolute; border-radius: 50%;
    border: 3px solid rgba(214, 230, 250, .07);
  }

  /* ============ 4. 顶部常驻操作行 ============ */
  #topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 6px;
    padding: 7px 10px;
    background: linear-gradient(180deg, rgba(11, 15, 22, .93), rgba(9, 12, 18, .88));
    border-bottom: 1px solid rgba(150, 180, 215, .16);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 6px 14px rgba(0, 0, 0, .35);
    backdrop-filter: none;
  }
  .tb-l { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1 1 auto; }
  .tb-r { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  #panel.narrow #topbar { flex-wrap: wrap; }
  #panel.narrow .tb-l { flex: 1 1 100%; }
  #panel.narrow .tb-r { flex: 1 1 100%; padding-top: 2px; }

  .tb-btn {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; line-height: 1; white-space: nowrap;
    padding: 6px 9px; border-radius: 4px;
    color: var(--metal-ink);
    border: 1px solid rgba(168, 190, 216, .26);
    background: linear-gradient(180deg, rgba(48, 57, 70, .78), rgba(26, 32, 41, .82));
    box-shadow: 0 1px 0 rgba(255, 255, 255, .10) inset, 0 2px 5px rgba(0, 0, 0, .34);
  }
  .tb-btn:hover { border-color: rgba(196, 220, 248, .48); background: linear-gradient(180deg, rgba(60, 71, 86, .85), rgba(33, 40, 51, .88)); }
  .tb-btn:active { transform: translateY(1px); }
  .tb-btn:focus-visible { outline: 2px solid #58a6ff; outline-offset: 1px; }
  .tb-btn.back { padding-left: 7px; }
  .tb-btn.primary {
    color: #d8ffe8;
    border-color: rgba(74, 222, 128, .45);
    background: linear-gradient(180deg, rgba(30, 68, 48, .92), rgba(16, 38, 28, .92));
    box-shadow: 0 1px 0 rgba(255, 255, 255, .12) inset, 0 0 14px rgba(74, 222, 128, .16), 0 2px 6px rgba(0, 0, 0, .4);
  }
  .tb-btn.primary b { color: #7ff0a8; font-weight: 700; }
  .crumb { font-size: 11.5px; color: #9aa7b6; display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
  .crumb button {
    background: none; border: 0; padding: 2px 1px; color: #a9b8c8; font-size: 11.5px;
    border-bottom: 1px dashed rgba(169, 184, 200, .45);
  }
  .crumb button:hover { color: #e6edf3; }
  .crumb .now { color: #dbe4ee; font-family: var(--mono); }
  .chip-map {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-family: var(--mono);
    color: #d8b4fe; border: 1px solid rgba(192, 132, 252, .5);
    background: rgba(192, 132, 252, .12);
    border-radius: 4px; padding: 3px 6px; white-space: nowrap;
  }
  .chip-map::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #c084fc; }

  /* ============ 5. 玻璃上擦出来的一块干净区（地图标签） ============ */
  .wipe { position: relative; }
  .wipe::before {
    content: ""; position: absolute; inset: -10px -12px;
    border-radius: 10px;
    background:
      radial-gradient(120% 130% at 24% 20%, rgba(232, 240, 250, .93), rgba(226, 236, 248, .88) 55%, rgba(214, 226, 240, .80) 100%);
    box-shadow: 0 0 0 1px rgba(212, 228, 246, .30), 0 6px 20px rgba(0, 0, 0, .40);
    z-index: 0;
  }
  .wipe > * { position: relative; z-index: 1; }

  #maplabel { margin: 14px 12px 4px; padding: 12px 14px 10px; color: var(--ink); }
  .lab-row { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .lab-no {
    font-family: var(--mono); font-size: 12px; font-weight: 700; color: #7c3aed;
    border: 1px solid rgba(124, 58, 237, .55); border-radius: 3px; padding: 1px 5px;
  }
  .lab-title { font-size: 14.5px; font-weight: 700; line-height: 1.45; color: #12161d; flex: 1 1 240px; min-width: 0; }
  .lab-count { font-size: 11.5px; color: #39434f; margin-top: 5px; }
  .lab-count b { color: #12161d; }
  .counts { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-top: 8px; }
  .cnt { font-size: 12px; color: #26303a; display: inline-flex; align-items: baseline; gap: 5px; }
  .cnt i { font-style: normal; font-family: var(--mono); font-weight: 700; font-size: 13px; }
  .cnt.closed i { color: #166b41; }
  .cnt.lit i { color: #1d4ed8; }
  .cnt.ready i { color: #0f6b31; }
  .cnt.fogc i { color: #6b4a1e; }
  .lab-note {
    margin-top: 8px; padding-top: 7px; border-top: 1px dashed rgba(24, 32, 42, .22);
    font-size: 10.5px; line-height: 1.6; color: #414b57;
  }

  /* ============ 6. 玻璃板面（线 / 光斑 / 资料 / 马克笔） ============ */
  #board { position: relative; z-index: 2; margin: 0 12px; }
  #threads { position: absolute; left: 0; top: 0; z-index: 1; overflow: visible; pointer-events: none; }
  #patches { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  #papers { position: absolute; left: 0; top: 0; z-index: 3; }
  #markers { position: absolute; left: 0; top: 0; z-index: 4; overflow: visible; pointer-events: none; }
  #marktext { position: absolute; left: 0; top: 0; z-index: 4; pointer-events: none; }

  /* 跟着指针走的那片光（在线的上面、纸的下面：线在光里发亮，纸不受影响） */
  #lightsheen {
    position: absolute; left: -320px; top: -320px; width: 640px; height: 640px;
    mix-blend-mode: screen;
    background: radial-gradient(closest-side, rgba(255, 232, 196, .34), rgba(255, 224, 176, .12) 46%, transparent 72%);
    will-change: transform;
  }
  /* 目的地脚下那块永远亮着的光晕 */
  .desthalo {
    position: absolute; left: 50%; top: 0;
    width: 150%; height: 150%;
    transform: translate(-50%, -18%);
    mix-blend-mode: screen;
    background: radial-gradient(closest-side, rgba(255, 236, 206, .32), rgba(255, 228, 184, .13) 48%, transparent 74%);
  }
  /* 雾票背后：背光被关掉的那一块暗斑 */
  .fogzone {
    position: absolute; transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(1, 3, 7, .90), rgba(1, 3, 7, .58) 48%, rgba(1, 3, 7, .16) 64%, transparent 76%);
    transition: opacity .75s ease;
  }

  /* 资料：贴在玻璃上的纸 */
  .card, .dest {
    position: absolute;
    border-radius: 3px;
    color: var(--ink);
    transform: rotate(var(--rot, 0deg));
    touch-action: none;
  }
  .card {
    width: var(--cw, 200px);
    padding: 10px 11px 9px;
    background: linear-gradient(178deg, var(--paper-hi), var(--paper));
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, .40) inset,
      0 0 26px rgba(255, 222, 170, .10),
      0 12px 22px rgba(0, 0, 0, .46);
    cursor: grab;
  }
  .card:active { cursor: grabbing; }
  .card.drag { cursor: grabbing; box-shadow: 0 0 0 1px rgba(255, 255, 255, .5) inset, 0 22px 34px rgba(0, 0, 0, .6); z-index: 9; }
  .card::after {
    content: ""; position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px;
    background: linear-gradient(315deg, rgba(0, 0, 0, .16), transparent 60%);
    border-radius: 0 0 3px 0;
  }
  .card[data-dragged="1"]::before {
    content: ""; position: absolute; left: -5px; bottom: 6px; width: 5px; height: 26px;
    background: rgba(192, 57, 43, .55); border-radius: 2px;
  }
  .tape {
    position: absolute; left: 10px; top: -8px; width: 46px; height: 15px;
    background: rgba(232, 240, 250, .34);
    border-left: 1px solid rgba(255, 255, 255, .30);
    border-right: 1px solid rgba(255, 255, 255, .30);
    transform: rotate(-3.5deg);
    box-shadow: 0 2px 6px rgba(0, 0, 0, .28);
  }

  .c-head { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .c-no { font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: #5b3fa8; }
  .c-type {
    font-size: 10.5px; line-height: 1.5; padding: 0 5px; border-radius: 3px;
    color: #26303a; background: rgba(24, 32, 42, .08); border: 1px solid rgba(24, 32, 42, .14);
  }
  .c-state { font-size: 10.5px; line-height: 1.6; padding: 1px 6px; margin-left: auto; white-space: nowrap; }
  /* 四状态：形状 / 纹理 / 字都不一样，不只靠颜色 */
  .c-state.closed {
    color: #0f4d29; border: 2px solid rgba(15, 77, 41, .85); border-radius: 2px;
    transform: rotate(-7deg); letter-spacing: .10em; font-weight: 700;
    box-shadow: 0 0 0 1px rgba(15, 77, 41, .40) inset;
  }
  .c-state.lit {
    color: #143da8; border: 1px dashed rgba(20, 61, 168, .62); border-radius: 0;
    background: rgba(37, 99, 235, .13); font-weight: 700;
  }
  .c-state.lit::before { content: "▸ "; }
  .c-state.ready {
    color: #f0fff6; background: #15803d; border: 1px solid #0f5f2d; font-weight: 700;
    clip-path: polygon(0 0, 100% 0, calc(100% - 7px) 50%, 100% 100%, 0 100%);
    padding-right: 12px; border-radius: 2px 0 0 2px;
  }
  .c-state.fog {
    color: #6b4210; border: 1px dashed rgba(107, 66, 16, .70); border-radius: 0;
    background: rgba(245, 158, 11, .14); font-weight: 700;
  }
  .c-state.fog::before { content: "? "; }
  /* 纸还是暗的时候，「还没探明」这四个字要用亮琥珀色才看得清 */
  .card[data-state="fog"][data-lit="0"] .c-state.fog {
    color: #ffce6b; border-color: rgba(245, 158, 11, .62); background: rgba(245, 158, 11, .14);
  }

  .c-title { margin: 6px 0 0; font-size: 12.5px; line-height: 1.45; font-weight: 700; color: var(--ink); }
  .c-sub { margin: 5px 0 0; font-size: 10.5px; line-height: 1.5; color: var(--ink-2); }
  .c-prog { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .bar { flex: 1 1 auto; height: 5px; border-radius: 3px; background: rgba(24, 32, 42, .16); overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #2f8f5b, #46b878); }
  .bar.empty i { background: repeating-linear-gradient(90deg, rgba(24, 32, 42, .22) 0 4px, transparent 4px 8px); }
  .pv { font-size: 10.5px; font-weight: 700; font-family: var(--mono); color: #2b333c; white-space: nowrap; }
  .c-acts { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .act {
    font-size: 10.5px; line-height: 1; padding: 5px 7px; border-radius: 3px;
    color: #16202b; background: rgba(255, 255, 255, .55);
    border: 1px solid rgba(24, 32, 42, .22);
  }
  .act:hover { background: #fff; border-color: rgba(24, 32, 42, .45); }
  .act:focus-visible { outline: 2px solid #2f6fd0; outline-offset: 1px; }
  .act.open { margin-left: auto; padding: 5px 6px; font-family: var(--mono); }

  /* 走亮：黑章压过的纸 */
  .card[data-state="closed"] .tape { background: rgba(24, 32, 42, .22); }
  .card[data-state="closed"] .c-title { color: #333c46; }
  /* 照亮中：压着一小节蓝胶带 */
  .card[data-state="lit"] .tape { background: rgba(37, 99, 235, .55); border-color: rgba(37, 99, 235, .8); transform: rotate(2deg); }
  /* 现在能做：绿旗子从右上角挑出来 */
  .card[data-state="ready"] .tape {
    left: auto; right: -14px; top: -9px; width: 44px; height: 20px;
    background: #15803d; border: 0; transform: rotate(0deg); border-radius: 2px 0 0 2px;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 18% 50%);
  }
  /* 雾里：背光关着的那一块。纸是暗的，所以编号/类型/状态这些「一定要看得见」的字要用亮色；
     标题与副信息是故意压暗的（点一下点亮背光才浮出来）。
     点亮以后纸变亮，这一组字要整体换成深墨，否则亮纸上的浅灰会读不出来。 */
  .card[data-state="fog"] {
    background: linear-gradient(178deg, rgba(28, 33, 42, .88), rgba(18, 22, 29, .90));
    box-shadow: 0 0 0 1px rgba(190, 214, 244, .12) inset, 0 0 30px rgba(255, 214, 150, .05), 0 12px 22px rgba(0, 0, 0, .5);
  }
  .card[data-state="fog"] .tape { display: none; }
  .card[data-state="fog"] .c-title { color: rgba(122, 134, 150, .13); }
  .card[data-state="fog"] .c-sub { color: rgba(122, 134, 150, .17); }
  .card[data-state="fog"] .c-no { color: #b3bfcc; }
  .card[data-state="fog"] .c-type { color: #cdd7e2; background: rgba(190, 214, 244, .10); border-color: rgba(190, 214, 244, .22); }
  .card[data-state="fog"] .bar { background: rgba(190, 214, 244, .13); }
  .card[data-state="fog"] .pv { color: #aeb9c6; }
  .card[data-state="fog"]::before {
    content: ""; position: absolute; inset: 5px; border: 1px dashed rgba(190, 214, 244, .22); border-radius: 2px;
    pointer-events: none;
  }
  .ghost-row { position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none; opacity: .5;

  .mk {

  /* 小字号的马克笔标签是画在暗玻璃上的：笔迹要比大字的红亮得多，
     否则红字落在房间的暗处只有 4 倍出头的对比度，读着费劲。 */
  .mk.sm { font-size: 14px; color: #ffa077; text-shadow: 0 0 9px rgba(0, 0, 0, .75), 0 1px 2px rgba(0, 0, 0, .6); }

  .mk.big::before {

  #folds { position: relative; z-index: 1; margin: 12px 12px 0; display: flex; flex-direction: column; gap: 6px; }

  function seedsFor(items, W_, H, topBias) {

    for (var q = 0; q < n; q++) { avgW += items[q].w; avgH += items[q].h; }
    avgW /= Math.max(1, n); avgH /= Math.max(1, n);

  function layout(items, destBox, W_, H, pts) {

    // 面板又窄又高，硬把目标塞在正中间会在上下各留出一大块空玻璃。
    var cx = W_ / 2;
    var cy = (W_ < 520)
      ? (destBox.h / 2 + 54)
      : Math.max(destBox.h / 2 + 30, Math.min(H * 0.26, 520));
    pts.forEach(function (P) { P.sx = P.x; P.sy = P.y; });
    // 目的地占的位置，谁都不许压上去；另外多留一圈 —— 那是马克笔的圈要占的地方，
    // 留了它，圈才不会横穿旁边资料的正文。
    var db = { x: (W_ - destBox.w) / 2 - 36, y: cy - destBox.h / 2 - 36, w: destBox.w + 72, h: destBox.h + 72 };
    for (var it = 0; it < 320; it++) {
      for (var a = 0; a < n; a++) {

              PA.x += s; PB.x -= s;
            } else {
              var s2 = (oy / 2) * (ay < by ? -1 : 1);
              PA.y += s2; PB.y -= s2;

        var px = hw - Math.abs(dx), py = hh - Math.abs(dy);

          // 往左右推通常更好看（纸像绕着中间那块牌子长），
          // 但板子窄、目的地又宽的时候左右其实推不开 —— 那就必须往上/下推，
          // 否则目标那张就会被别的纸压住。
          var loX = PAD + it2.w / 2, hiX = W_ - PAD - it2.w / 2;

        P.y = clamp(P.y, PAD + it2.h / 2, H - PAD - it2.h / 2);

      for (var b2 = a2 + 1; b2 < n; b2++) {

      var px2 = hw2 - Math.abs(dx2), py2 = hh2 - Math.abs(dy2);
      if (px2 > 0 && py2 > 0) worst = Math.max(worst, Math.min(px2, py2));

  /* ---- 线：从资料边缘出发，微弯，箭头指向被挡的那一方 ---- */
  /* toward 可以是另一张纸的矩形（有 cx/cy），也可以只是一个点（有 x/y） */
  function anchor(rc, toward) {

  function pathD(a, b, bend) {
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    var dx = b.x - a.x, dy = b.y - a.y, L = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / L * bend, ny = dx / L * bend;
    return 'M' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + ' Q' + (mx + nx).toFixed(1) + ' ' + (my + ny).toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + b.y.toFixed(1);
  }
  function threadStyle(st) {
    if (st === 'lit') return { c: '#e8503a', g: 'rgba(232,80,58,.28)', w: 1.9 };
    if (st === 'ready') return { c: '#d9482f', g: 'rgba(217,72,47,.24)', w: 1.7 };
    if (st === 'closed') return { c: '#8a4a3c', g: 'rgba(138,74,60,.10)', w: 1.4 };
    return { c: '#6b3227', g: 'rgba(107,50,39,.10)', w: 1.4 };
  }
  function addThread(fromRect, toRect, st, arrow, bend, tag) {
    var s = threadStyle(st);
    var glow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    glow.setAttribute('fill', 'none'); glow.setAttribute('stroke', s.g);
    glow.setAttribute('stroke-width', String(s.w * 5)); glow.setAttribute('stroke-linecap', 'round');
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('fill', 'none'); p.setAttribute('stroke', s.c);
    p.setAttribute('stroke-width', String(s.w)); p.setAttribute('stroke-linecap', 'round');
    if (arrow) p.setAttribute('marker-end', st === 'fog' ? 'url(#ah-dim)' : 'url(#ah)');
    p.setAttribute('data-thread', tag);
    threadsEl.appendChild(glow); threadsEl.appendChild(p);
    // 端点记的是「哪两张纸」，不是当时那两个坐标：资料被拖走以后线要跟着重画
    var rec = { el: p, glow: glow, from: fromRect, to: toRect, bend: bend, tag: tag };
    drawThread(rec);
    state.paths.push(rec);
    return p;
  }
  function drawThread(rec) {
    var a = anchor(rec.from, rec.to), b = anchor(rec.to, rec.from);
    var d = pathD(a, b, rec.bend);
    rec.el.setAttribute('d', d); rec.glow.setAttribute('d', d);
  }

  /* ---- 马克笔：圈、箭头、手写字（画在玻璃朝人这一面上，会压过纸角） ---- */
  function wobbleEllipse(cx, cy, rx, ry, seed, w) {
    var r = rnd(seed), n = 40, ph = r() * 6.283, ph2 = r() * 6.283;
    var pts = [];
    for (var i = 0; i <= n; i++) {
      var th = (i / n) * Math.PI * 2 + 0.35;   // 手画的圈总有个起笔叠压
      var k = 1 + 0.030 * Math.sin(3 * th + ph) + 0.018 * Math.sin(7 * th + ph2);
      pts.push([cx + Math.cos(th) * rx * k, cy + Math.sin(th) * ry * k]);
    }
    var d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
    for (var j = 1; j < pts.length; j++) d += ' L' + pts[j][0].toFixed(1) + ' ' + pts[j][1].toFixed(1);
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d); p.setAttribute('fill', 'none');
    p.setAttribute('stroke', '#c0392b'); p.setAttribute('stroke-width', String(w));
    p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-opacity', '0.88');
    p.setAttribute('filter', 'url(#wob2)');
    markersEl.appendChild(p);
    var g = p.cloneNode(false);
    g.setAttribute('stroke-width', String(w * 2.6)); g.setAttribute('stroke-opacity', '0.14');
    markersEl.insertBefore(g, p);
    return p;
  }
  function markerArrow(x1, y1, x2, y2) {
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    var dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / L, uy = dy / L, px = -uy, py = ux;
    var d = 'M' + x1 + ' ' + y1 + ' Q' + ((x1 + x2) / 2 + px * 10) + ' ' + ((y1 + y2) / 2 + py * 10) + ' ' + x2 + ' ' + y2;
    d += ' M' + x2 + ' ' + y2 + ' l' + (-ux * 11 + px * 6) + ' ' + (-uy * 11 + py * 6);
    d += ' M' + x2 + ' ' + y2 + ' l' + (-ux * 11 - px * 6) + ' ' + (-uy * 11 - py * 6);
    p.setAttribute('d', d); p.setAttribute('fill', 'none');
    p.setAttribute('stroke', '#d9482f'); p.setAttribute('stroke-width', '3');
    p.setAttribute('stroke-linecap', 'round'); p.setAttribute('filter', 'url(#wob)');
    markersEl.appendChild(p);
  }
  function markerText(html, x, y, cls) {
    var el = document.createElement('div');
    el.className = 'mk ' + (cls || 'sm');
    el.innerHTML = html;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    markTextEl.appendChild(el);
    return el;
  }
  /* 马克笔的字也是画在玻璃上的，但它不能压在资料上、也不能贴着板边折成竖排。
     做法：先放上去量出真实大小，再在一圈候选位置里挑一个不压任何一张纸的。 */
  function placeMarker(el, rc, kinds) {
    var w = el.offsetWidth, h = el.offsetHeight;
    var boxes = [];
    Object.keys(state.rects).forEach(function (k) {
      var r = state.rects[k];
      boxes.push({ x: r.cx - r.w / 2 - 8, y: r.cy - r.h / 2 - 8, w: r.w + 16, h: r.h + 16 });
    });
    // 已经写上去的字也要躲开，不然两段手写会叠在一起
    (state.placed || []).forEach(function (b) {
      boxes.push({ x: b.x - 6, y: b.y - 6, w: b.w + 12, h: b.h + 12 });
    });
    var free = function (x, y) {
      if (x < 2 || x + w > BW - 2 || y < 2 || y + h > BH - 2) return false;
      for (var i = 0; i < boxes.length; i++) {
        var b = boxes[i];
        if (x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y) return false;
      }
      return true;
    };
    var cands = around(rc, w, h);
    var pick = null;
    for (var j = 0; j < cands.length; j++) { if (free(cands[j].x, cands[j].y)) { pick = cands[j]; break; } }
    if (!pick) pick = { x: clamp(cands[0].x, 4, Math.max(4, BW - w - 4)), y: clamp(cands[0].y, 4, Math.max(4, BH - h - 4)) };
    el.style.left = Math.round(pick.x) + 'px';
    el.style.top = Math.round(pick.y) + 'px';
    state.placed = state.placed || [];
    state.placed.push({ x: Math.round(pick.x), y: Math.round(pick.y), w: w, h: h });
    return { x: Math.round(pick.x), y: Math.round(pick.y), w: w, h: h };
  }
  /* 候选位置按「目标那张纸」和「这段字自己有多大」一起算：先贴身放，再往外退 */
  function around(rc, w, h) {
    var l = rc.cx - rc.w / 2, t = rc.cy - rc.h / 2, r2 = rc.cx + rc.w / 2, b = rc.cy + rc.h / 2;
    return [
      { x: l, y: t - h - 8 },
      { x: l, y: b + 8 },
      { x: l - w - 8, y: rc.cy - h / 2 },
      { x: r2 + 8, y: rc.cy - h / 2 },
      { x: l - w - 8, y: t - h - 8 },
      { x: r2 + 8, y: t - h - 8 },
      { x: l - w - 8, y: b + 8 },
      { x: r2 + 8, y: b + 8 },
      { x: l, y: t - h - 42 },
      { x: r2 + 42, y: rc.cy - h / 2 },
      { x: l - w - 42, y: rc.cy - h / 2 },
      { x: l, y: b + 42 },
      { x: rc.cx - w / 2, y: t - h - 80 },
      { x: rc.cx - w / 2, y: b + 80 }
    ];
  }

  /* =====================================================================
     六、主装配
     ===================================================================== */
  function build() {
    var t0 = performance.now();
    state.data = SAMPLES[S];
    state.tickets = buildTickets(state.data.tickets);
    state.counts = countsOf(state.tickets);
    state.paths = []; state.rects = {}; state.fogZones = {};
    threadsEl.innerHTML = threadsEl.querySelector('defs').outerHTML;
    markersEl.innerHTML = '';
    markTextEl.innerHTML = '';
    papersEl.innerHTML = '';

    renderHead(state.data, state.tickets, state.counts);

    BW = panel.clientWidth - 24;      // #board 两边各留 12
    if (BW < 200) BW = W - 24;

    // 1) 先把纸摆进 DOM 量高度（一次读，不进 rAF 循环）
    var destEl = makeDest(state.data, state.tickets);
    destEl.style.width = DW + 'px';
    destEl.style.left = '0px'; destEl.style.top = '0px';
    destEl.style.visibility = 'hidden';
    papersEl.appendChild(destEl);
    var cards = state.tickets.map(function (t) {
      var el = makeCard(t);
      el.style.setProperty('--cw', CW + 'px');
      el.style.left = '0px'; el.style.top = '0px';
      el.style.visibility = 'hidden';
      papersEl.appendChild(el);
      return el;
    });
    var slots = [], emptyEls = [];
    if (state.tickets.length === 0) {
      emptyEls = makeEmptySlots(3);
      emptyEls.forEach(function (el) {
        el.style.width = Math.min(200, CW + 40) + 'px';
        el.style.height = '96px';
        el.style.left = '0px'; el.style.top = '0px';
        el.style.visibility = 'hidden';
        papersEl.appendChild(el);
      });
    }

    var destBox = { w: destEl.offsetWidth, h: destEl.offsetHeight };
    var items = cards.map(function (el, i) {
      return { w: el.offsetWidth, h: el.offsetHeight, no: state.tickets[i].no, st: state.tickets[i].st };
    });
    emptyEls.forEach(function (el) {
      items.push({ w: el.offsetWidth, h: el.offsetHeight, no: 0, st: 'empty' });
    });

    // 2) 估一个够高的板面（按格子的行列数算），排不下再一点点长高
    var avgW = 0, avgH = 0, nIt = Math.max(1, items.length);
    items.forEach(function (it) { avgW += it.w; avgH += it.h; });
    avgW /= nIt; avgH /= nIt;
    var cols = Math.max(1, Math.floor((BW - PAD * 2 + 16) / (avgW + 16)));
    var rows = Math.max(1, Math.ceil(items.length / cols));
    var narrow = W < 520;
    var topBias = (narrow && items.length) ? (destBox.h + 102) : PAD;
    var H = narrow ? 560 : 620;
    if (items.length) {
      H = narrow
        ? Math.max(H, topBias + rows * (avgH + 16) + PAD + 24)
        : Math.max(H, PAD * 2 + Math.max(destBox.h + 72, rows * (avgH + 16) + 20) + 40,
            destBox.h + Math.min(items.length, 4) * avgH * 0.95 + 170);
    }
    var res = null, guard = 0, pts = null;
    do {
      pts = seedsFor(items, BW, H, topBias);
      res = layout(items, destBox, BW, H, pts);
      if (res.worst < 3.5) break;
      H = Math.round(H * 1.08);
      guard++;
    } while (guard < 14);

    // 3) 收边：松弛是在一块偏大的板子上做的，做完把这圈余量收掉，
    //    板子刚好装下最高的那张纸 + 目的地，不留一整片空玻璃。
    var topMost = Infinity, bottomMost = -Infinity;
    items.forEach(function (it, i) {
      var P = res.pts[i];
      topMost = Math.min(topMost, P.y - it.h / 2);
      bottomMost = Math.max(bottomMost, P.y + it.h / 2);
    });
    topMost = Math.min(topMost, res.cy - destBox.h / 2);
    bottomMost = Math.max(bottomMost, res.cy + destBox.h / 2);
    var drop = PAD - topMost;
    if (items.length) {
      items.forEach(function (it, i) { res.pts[i].y += drop; });
      res.cy += drop;
      BH = Math.max(320, Math.round(bottomMost + drop + PAD + 16));
    } else {
      BH = Math.round(bottomMost + PAD + 16);
    }

    boardEl.style.height = BH + 'px';
    boardEl.style.width = BW + 'px';
    threadsEl.setAttribute('width', BW); threadsEl.setAttribute('height', BH);
    markersEl.setAttribute('width', BW); markersEl.setAttribute('height', BH);
    patchesEl.style.width = BW + 'px'; patchesEl.style.height = BH + 'px';
    papersEl.style.width = BW + 'px'; papersEl.style.height = BH + 'px';

    // 3) 落位
    var rot = rnd(90210);
    var dcy = res.cy;
    destEl.style.left = ((BW - destBox.w) / 2) + 'px';
    destEl.style.top = (dcy - destBox.h / 2) + 'px';
    destEl.style.visibility = 'visible';
    state.rects[state.data.no] = {
      cx: BW / 2, cy: dcy, w: destBox.w, h: destBox.h, el: destEl, isDest: true
    };

    cards.forEach(function (el, i) {
      var p = res.pts[i];
      var l = p.x - items[i].w / 2, t = p.y - items[i].h / 2;
      if (state.moved[state.tickets[i].no]) { l = state.moved[state.tickets[i].no].l; t = state.moved[state.tickets[i].no].t; }
      el.style.left = l.toFixed(1) + 'px';
      el.style.top = t.toFixed(1) + 'px';
      el.style.setProperty('--rot', (rot() * 6.4 - 3.2).toFixed(2) + 'deg');
      el.style.visibility = 'visible';
      state.rects[state.tickets[i].no] = {
        cx: l + items[i].w / 2, cy: t + items[i].h / 2,
        w: items[i].w, h: items[i].h, el: el, st: state.tickets[i].st, no: state.tickets[i].no, l: l, t: t
      };
    });
    emptyEls.forEach(function (el, i) {
      var p = res.pts[cards.length + i];
      el.style.left = (p.x - items[cards.length + i].w / 2) + 'px';
      el.style.top = (p.y - items[cards.length + i].h / 2) + 'px';
      el.style.visibility = 'visible';
    });

    // 4) 雾票背后那块暗斑
    var destHalo = document.createElement('div');
    destHalo.className = 'desthalo';
    destHalo.style.left = ((BW - destBox.w) / 2) + 'px';
    destHalo.style.top = (dcy - destBox.h / 2) + 'px';
    destHalo.style.width = (destBox.w * 1.5) + 'px';
    destHalo.style.height = (destBox.h * 1.5) + 'px';
    destHalo.style.transform = 'translate(-16.67%, -16.67%)';
    patchesEl.appendChild(destHalo);

    state.tickets.forEach(function (t) {
      if (t.st !== 'fog') return;
      var rc = state.rects[t.no];
      var z = document.createElement('div');
      z.className = 'fogzone';
      z.setAttribute('data-fogzone', String(t.no));
      z.style.width = (rc.w * 1.5) + 'px';
      z.style.height = (rc.h * 1.5) + 'px';
      z.style.left = rc.cx + 'px'; z.style.top = rc.cy + 'px';
      z.style.opacity = state.lit[t.no] ? '0.16' : '1';
      patchesEl.appendChild(z);
      state.fogZones[t.no] = z;
    });

    // 5) 线：每张资料一条到目的地；再加阻塞者指向被挡者的线（箭头朝被挡的一方）
    var dAnchor = state.rects[state.data.no];
    state.tickets.forEach(function (t, i) {
      var rc = state.rects[t.no];
      var bend = (i % 2 ? 1 : -1) * clamp(0.07 * Math.hypot(rc.cx - dAnchor.cx, rc.cy - dAnchor.cy), 12, 52);
      addThread(rc, dAnchor, t.st, false, bend, 'dest-' + t.no);
    });
    state.tickets.forEach(function (t) {
      t.blockers.forEach(function (b) {
        var f = state.rects[b], to = state.rects[t.no];
        if (!f || !to) return;
        addThread(f, to, t.st, true, 16, 'blk-' + b + '-' + t.no);
      });
    });

    // 6) 马克笔：圈住目的地 + 手写的「目标」 + 指向暗斑的提示
    //    圈是压扁的椭圆，只在纸的留白边上走：长轴正好在左右留白里穿过去，
    //    横向也只在上下留白里穿过去，不横穿正文；箭头也一律停在纸边上。
    var eccx = dAnchor.cx, eccy = dAnchor.cy;
    state.placed = [];
    wobbleEllipse(eccx, eccy, destBox.w / 2 + 16, destBox.h / 2 + 30, 91, 3.2);
    var firstFog = null, firstReady = null, firstLit = null;
    state.tickets.forEach(function (t) {
      if (t.st === 'fog' && !firstFog) firstFog = t;
      if (t.st === 'ready' && !firstReady) firstReady = t;
      if (t.st === 'lit' && !firstLit) firstLit = t;
    });
    // 「目标」写在目的地圈外，挪到不压任何一张纸的地方，箭头再指回牌子
    var lblT = markerText('目标', 0, 0, 'big');
    var lp = placeMarker(lblT, dAnchor);
    lblT.style.transform = 'rotate(-5deg)';
    var from0 = { x: lp.x + lp.w / 2, y: lp.y + lp.h * 0.75 };
    var to0 = anchor(dAnchor, from0);
    // 箭头只在靠近时画：拉得老远的箭头会横穿别的资料，那是败笔
    if (Math.hypot(to0.x - from0.x, to0.y - from0.y) < 210) markerArrow(from0.x, from0.y, to0.x, to0.y);
    if (firstFog) {
      var fr = state.rects[firstFog.no];
      var m1 = markerText(STATE_WORD.fog + ' · 点一下点亮背光', 0, 0, 'sm');
      var p1 = placeMarker(m1, fr);
      var from1 = { x: clamp(fr.cx, p1.x + 12, p1.x + p1.w - 12), y: p1.y + p1.h / 2 };
      var to1 = anchor(fr, from1);
      if (Math.hypot(to1.x - from1.x, to1.y - from1.y) < 210) markerArrow(from1.x, from1.y, to1.x, to1.y);
    }
    if (firstReady) {
      var rr = state.rects[firstReady.no];
      var m2 = markerText('这一块现在就能动手', 0, 0, 'sm');
      placeMarker(m2, rr);
    }
    if (firstLit) {
      var lr = state.rects[firstLit.no];
      var m3 = markerText('正在办', 0, 0, 'sm');
      placeMarker(m3, lr);
    }
    if (state.tickets.length === 0) {
      var em = markerText('一张证据都还没钉上', 0, 0, 'sm');
      placeMarker(em, dAnchor);
    }

    // 7) 右下角那段马克笔摘要
    document.getElementById('scrapText').innerHTML =
      '本图携带执行，不是纯规划图。票按「查清 → 方案 → 落地 → 真机复测」四步走；' +
      '地图关闭条件 = 清单上每一条要么已落地并复测达标，要么明确裁决「不改」并写明理由。' +
      '允许「裁决不改」作为合法终点，但不允许「没量就跳过」。';

    // 8) 底部三个可折叠区块（原词照用）
    renderFolds();

    // 9) 玻璃面上的生活痕迹
    decorateGlass();

    window.__firstPaintMs = Math.round(performance.now() - t0);
  }

  function renderFolds() {
    var host = document.getElementById('folds');
    var d = state.data;
    host.innerHTML = '';
    var defs = [
      ['decisions', 'Decisions so far（' + d.decisions.length + '）', d.decisions.length
        ? d.decisions.map(function (x) { return '<p class="fitem"><b>' + esc(x.t) + '</b><span class="dash"> — </span>' + esc(x.g) + '</p>'; }).join('')
        : '<p class="fitem">还没有定下来的结论。板子刚钉上，一条都还没有。</p>'],
      ['fog', 'Not yet specified（战雾 ' + d.fog.length + '）', d.fog.length
        ? d.fog.map(function (x) { return '<p class="fitem">' + esc(x) + '</p>'; }).join('')
        : '<p class="fitem">还没有写明「还不知道什么」的地方 —— 这张图才刚钉上，一片都还没探。</p>'],
      ['outOfScope', 'Out of scope（' + d.out.length + '）', d.out.length
        ? d.out.map(function (x) { return '<p class="fitem">' + esc(x) + '</p>'; }).join('')
        : '<p class="fitem">还没有写明不做的事。</p>']
    ];
    defs.forEach(function (x) {
      var det = document.createElement('details');
      det.className = 'fold';
      det.setAttribute('data-fold', x[0]);
      det.innerHTML = '<summary data-cap="' + x[0] + '">' + esc(x[1]) + '</summary>' +
        '<div class="fold-body">' + x[2] + '</div>';
      host.appendChild(det);
    });
  }

  function decorateGlass() {
    var sh = document.getElementById('sheen');
    var r = rnd(4242);
    for (var i = 0; i < 46; i++) {
      var s = document.createElement('span');
      s.className = 'speck';
      var sz = 1 + r() * 2.2;
      s.style.width = sz + 'px'; s.style.height = sz + 'px';
      s.style.left = (r() * 100) + '%'; s.style.top = (r() * 100) + '%';
      s.style.opacity = (0.25 + r() * 0.6).toFixed(2);
      sh.appendChild(s);
    }
    for (var j = 0; j < 4; j++) {
      var m = document.createElement('span');
      m.className = 'smudge';
      var w = 90 + r() * 160, hh = 70 + r() * 130;
      m.style.width = w + 'px'; m.style.height = hh + 'px';
      m.style.left = (r() * 88) + '%'; m.style.top = (r() * 88) + '%';
      sh.appendChild(m);
    }
    var ring = document.createElement('span');
    ring.className = 'ring';
    ring.style.width = '86px'; ring.style.height = '86px';
    ring.style.left = '68%'; ring.style.top = '38%';
    sh.appendChild(ring);
  }

  /* =====================================================================
     七、那盏跟着指针走的灯（只在没停稳时跑 rAF，不读任何布局）
     ===================================================================== */
  var light = { tx: 0, ty: 0, x: 0, y: 0, wx: 0, wy: 0, running: false };
  var ptLightEl = document.getElementById('ptlight');
  var walkerEl = document.getElementById('walker');
  var sheenEl = document.getElementById('lightsheen');
  var boardRectTop = 0;

  function seedLight() {
    var vh = window.innerHeight || 900;
    var x = panel.getBoundingClientRect().left + W * 0.34;
    var y = vh * 0.30;
    light.tx = light.x = x; light.ty = light.y = y;
    light.wx = x - 90; light.wy = y + 40;
    applyLight();
  }
  function syncBoardTop() {
    boardRectTop = boardEl.getBoundingClientRect().top;
  }
  function applyLight() {
    ptLightEl.style.transform = 'translate3d(' + light.x.toFixed(1) + 'px,' + light.y.toFixed(1) + 'px,0)';
    walkerEl.style.transform = 'translate3d(' + light.wx.toFixed(1) + 'px,' + light.wy.toFixed(1) + 'px,0)';
    var bx = light.x - (panel.getBoundingClientRect().left + 12);
    var by = light.y - boardRectTop;
    sheenEl.style.transform = 'translate3d(' + (bx - 320).toFixed(1) + 'px,' + (by - 320).toFixed(1) + 'px,0)';
  }
  function tick() {
    var dx = light.tx - light.x, dy = light.ty - light.y;
    light.x += dx * 0.14; light.y += dy * 0.14;
    // 人影比光慢得多，还会往侧后方偏一点：像有人从灯前走过去
    var wx = light.tx - 96, wy = light.ty + 44;
    light.wx += (wx - light.wx) * 0.052; light.wy += (wy - light.wy) * 0.052;
    applyLight();
    var rest = Math.abs(dx) + Math.abs(dy) + Math.abs(wx - light.wx) + Math.abs(wy - light.wy);
    if (rest > 0.6) { requestAnimationFrame(tick); }
    else { light.running = false; }
  }
  function moveLightTo(cx, cy) {
    light.tx = cx; light.ty = cy;
    if (!light.running) { light.running = true; requestAnimationFrame(tick); }
  }
  window.addEventListener('pointermove', function (e) {
    moveLightTo(e.clientX, e.clientY);
  }, { passive: true });
  window.addEventListener('resize', function () {
    syncBoardTop();
    if (panel.clientWidth - 24 > 200 && Math.abs(panel.clientWidth - 24 - BW) > 2) build();
    seedLight();
  });
  window.addEventListener('scroll', syncBoardTop, { passive: true });

  /* =====================================================================
     八、交互：拖资料 / 点暗斑 / 正文详情 / 顶部按钮
     ===================================================================== */
  var toastEl = document.getElementById('toast');
  var toastT = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.setAttribute('data-show', '1');
    var r = panel.getBoundingClientRect();
    toastEl.style.left = (r.left + r.width / 2) + 'px';
    if (toastT) clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.setAttribute('data-show', '0'); }, 3200);
  }

  function repaintThreadsOf(no) {
    state.paths.forEach(function (p) {
      var tag = p.tag || '';
      if (tag.indexOf('-' + no) < 0) return;
      p.bend = Math.sign(p.bend || 1) * clamp(0.07 * Math.hypot(p.from.cx - p.to.cx, p.from.cy - p.to.cy), 12, 52);
      drawThread(p);
    });
  }

  function startDrag(e, el, no) {
    if (e.button !== 0) return;
    if (e.target.closest('button, a')) return;
    var rc = state.rects[no];
    var sx = e.clientX, sy = e.clientY;
    var l0 = parseFloat(el.style.left) || 0, t0 = parseFloat(el.style.top) || 0;
    var wI = el.offsetWidth, hI = el.offsetHeight;
    var moved = false;
    el.setPointerCapture(e.pointerId);
    function onMove(ev) {
      var dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
      moved = true; el.classList.add('drag');
      var nl = clamp(l0 + dx, 2, BW - wI - 2), nt = clamp(t0 + dy, 2, BH - hI - 2);
      el.style.left = nl.toFixed(1) + 'px'; el.style.top = nt.toFixed(1) + 'px';
      rc.l = nl; rc.t = nt; rc.cx = nl + wI / 2; rc.cy = nt + hI / 2;
      state.moved[no] = { l: nl, t: nt };
      var z = state.fogZones[no];
      if (z) { z.style.left = rc.cx + 'px'; z.style.top = rc.cy + 'px'; }
      repaintThreadsOf(no);
    }
    function onUp() {
      el.removeEventListener('pointermove', onMove);
      el.removeEventListener('pointerup', onUp);
      el.removeEventListener('pointercancel', onUp);
      el.classList.remove('drag');
      if (moved) {
        el.setAttribute('data-dragged', '1');
        toast('把 #' + no + ' 挪了位（这块原型里会记住新位置）');
      }
    }
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);
  }

  function lightUp(el, no) {
    if (el.getAttribute('data-lit') === '1') return;
    el.setAttribute('data-lit', '1');
    state.lit[no] = true;
    var z = state.fogZones[no];
    if (z) z.style.opacity = '0.16';
    var bloom = el.querySelector('.bloom');
    if (bloom && bloom.animate) {
      bloom.animate([
        { opacity: 0.95, transform: 'translate(0,0) scale(0.55)' },
        { opacity: 0, transform: 'translate(0,0) scale(2.3)' }
      ], { duration: 720, easing: 'cubic-bezier(.2,.7,.3,1)' });
    }
    // 背光亮了，线也跟着亮起来
    state.paths.forEach(function (p) {
      var tag = p.tag || '';
      if (tag.indexOf('-' + no) < 0) return;
      var s = threadStyle('ready');
      p.el.setAttribute('stroke', s.c); p.glow.setAttribute('stroke', s.g);
    });
    toast('#' + no + ' 的背光点亮了，内容看得见了 —— 但它还是「还没探明」（看清楚 ≠ 办完了）');
  }

  papersEl.addEventListener('pointerdown', function (e) {
    var card = e.target.closest('.card, .dest');
    if (!card) return;
    var no = parseInt(card.getAttribute('data-ticket'), 10);
    if (card.classList.contains('card')) startDrag(e, card, no);
  });
  papersEl.addEventListener('click', function (e) {
    var act = e.target.closest('[data-act]');
    var card = e.target.closest('.card');
    if (!card) return;
    var no = parseInt(card.getAttribute('data-ticket'), 10);
    if (act) {
      var a = act.getAttribute('data-act');
      if (a === 'light') { lightUp(card, no); }
      else if (a === 'skill') { toast('（原型）' + act.textContent + '：真机上会用这个技能开一轮，推进 #' + no); }
      else if (a === 'new') { toast('（原型）新会话：真机上会在新会话里打开 #' + no); }
      else if (a === 'open') { toast('（原型）打开原票：真机会跳到这条 issue 的原票 ↗'); }
      return;
    }
    if (card.getAttribute('data-state') === 'fog') lightUp(card, no);
  });

  /* ---- 正文详情叠层 ---- */
  var layer = document.getElementById('notesLayer');
  var list = document.getElementById('nlList');
  list.innerHTML = NOTES.map(function (x) { return '<li>' + x + '</li>'; }).join('');
  function openNotes() {
    layer.setAttribute('data-open', '1');
    layer.setAttribute('aria-hidden', 'false');
    document.getElementById('notesScrap').setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
    document.getElementById('nlClose').focus();
  }
  function closeNotes() {
    layer.setAttribute('data-open', '0');
    layer.setAttribute('aria-hidden', 'true');
    document.getElementById('notesScrap').setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
    document.getElementById('notesScrap').focus();
  }
  document.getElementById('notesScrap').addEventListener('click', openNotes);
  document.getElementById('nlClose').addEventListener('click', closeNotes);
  document.getElementById('nlBack').addEventListener('click', closeNotes);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && layer.getAttribute('data-open') === '1') closeNotes();
  });

  /* ---- 顶部与底部按钮（都只给反馈，不假装真的执行了） ---- */
  document.getElementById('btnBack').addEventListener('click', function () { toast('（原型）返回：回到地图列表那一屏'); });
  document.getElementById('crumbList').addEventListener('click', function () { toast('（原型）列表：这一级是「列表」，当前这张是 #604'); });
  document.getElementById('btnExec').addEventListener('click', function () {
    toast('（原型）' + document.getElementById('btnExec').textContent + '：真机上会把 #604 交给新会话，接着往下推进');
  });
  document.getElementById('btnExecBottom').addEventListener('click', function () {
    toast('（原型）' + document.getElementById('btnExecBottom').textContent + '：与顶上那颗同一件事，推进 #604');
  });
  document.getElementById('btnNew').addEventListener('click', function () { toast('（原型）新会话：在新会话里打开 #604 继续推进'); });
  document.getElementById('btnDiag').addEventListener('click', function () { toast('（原型）诊断：真机上打开诊断入口，看取数链和日志'); });
  document.getElementById('btnArchive').addEventListener('click', function () { toast('（原型）档案：真机上跳到 #604 的原票 ↗'); });

  /* ---- 原型控制条 ---- */
  document.getElementById('ctrl').addEventListener('click', function (e) {
    var b = e.target.closest('.cbtn');
    if (!b) return;
    var q = new URLSearchParams(location.search);
    if (b.hasAttribute('data-w')) q.set('w', b.getAttribute('data-w'));
    if (b.hasAttribute('data-s')) q.set('s', b.getAttribute('data-s'));
    q.delete('bar');
    location.search = q.toString();
  });
  (function markCtrl() {
    var bs = document.querySelectorAll('#ctrl .cbtn');
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      var on = (b.hasAttribute('data-w') && parseInt(b.getAttribute('data-w'), 10) === W) ||
        (b.hasAttribute('data-s') && b.getAttribute('data-s') === S);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  })();

  /* =====================================================================
     九、开工
     ===================================================================== */
  build();
  syncBoardTop();
  seedLight();
  window.__readyAt = performance.now();
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { window.__paintedMs = performance.now(); });
  });
  window.addEventListener('load', function () {
    BW = panel.clientWidth - 24;
    syncBoardTop();
  });
})();
</script>
</body>
</html>
