<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>地图详情 · W2 航班信息板与塔台</title>
<style>
/* =====================================================================
   W2 · 起飞信息板 ＋ 塔台跑道
   把一张 wayfinder 地图当成一块出发信息板：每张票是一个航班，
   状态是航空里天生就有的四个词（已到达 / 登机中 / 准点 / 待定）。
   信息板上方一条跑道视图：一层一段，走到哪段亮哪段，尽头是永远亮着的灯塔。
   ===================================================================== */
:root{
  --panel:#10131a; --card:#16181d; --line:#2a2d35;
  --txt:#e6edf3; --sub:#a1a1aa; --cap:#8b8b95;
  --walk:#4ade80; --view:#58a6ff; --map:#c084fc; --warn:#f59e0b;
  --pending:#d4a24a;
  --mono:Consolas,Menlo,monospace;
  --ui:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  /* 六列一条：序号 / 航班号 / 目的地 / 状态 / 预计 / 备注 */
  --cols: 30px 52px minmax(0,1fr) 76px 54px 166px;
  --gap: 10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#0b0d12; color:var(--txt); font-family:var(--ui);
  font-size:13px; line-height:1.5; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--map);outline-offset:2px;border-radius:3px}

/* ---------- 面板外壳（照抄简报 §5） ---------- */
.wrap{padding:18px 20px 24px}
#panel{
  width:810px; max-width:100%; margin:0 auto; background:var(--panel);
  border:1px solid var(--line); border-radius:10px; overflow:hidden;
  display:flex; flex-direction:column;
}
.shell{
  display:flex; align-items:center; gap:8px; height:40px; padding:0 10px;
  background:#141720; border-bottom:1px solid var(--line); flex:none;
}
.shell .back{
  display:inline-flex; align-items:center; gap:4px; background:transparent; border:1px solid transparent;
  border-radius:6px; padding:4px 7px; font-size:12px; color:var(--sub); cursor:pointer;
}
.shell .back:hover{border-color:var(--line); color:var(--txt)}
.shell .crumb{display:flex; align-items:center; gap:7px; min-width:0; flex:1}
.shell .crumb .k{font-size:12px; color:var(--sub); white-space:nowrap}
.shell .crumb .t{
  font-size:12px; color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.shell .tag{
  display:inline-flex; align-items:center; gap:4px; flex:none; font-family:var(--mono); font-size:10.5px;
  color:#dcc7ff; background:rgba(192,132,252,.12); border:1px solid rgba(192,132,252,.4);
  border-radius:999px; padding:2px 8px;
}
.shell .primary{
  flex:none; display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
  background:rgba(88,166,255,.14); border:1px solid rgba(88,166,255,.5); color:#cfe6ff;
  border-radius:7px; padding:5px 10px; cursor:pointer;
}
.shell .primary:hover{background:rgba(88,166,255,.24)}
.scroll{overflow-x:hidden; overflow-y:auto; max-height:calc(100vh - 40px); padding:10px 12px 0}

/* ---------- 塔台跑道视图 ---------- */
.runway{
  position:relative; border:1px solid var(--line); border-radius:8px;
  background:#0e1118; padding:7px 10px 10px; overflow:hidden;
}
.rw-top{display:flex; align-items:baseline; gap:8px; margin-bottom:6px; font-size:11px}
.rw-top .k{color:var(--cap)}
.rw-top .v{font-family:var(--mono); color:var(--sub); font-size:10.5px}
.rw-top .sp{margin-left:auto; color:var(--cap); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rw{display:flex; align-items:center; gap:4px; margin-bottom:7px}
.rw-layer{
  flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:1px;
  border-radius:3px; overflow:hidden; background:#151922;
}
.rw-layer .track{height:5px; background:#1e222c}
.rw-layer .lift{
  height:2px; background:#1b1f28;
  background-image:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 6px);
  color:#252a35;
}
.rw-layer .segs{display:flex; gap:1px; padding:0 2px 2px}
.rw-layer .segs i{flex:1; height:7px; border-radius:1px; background:#1b1f28; display:block}
/* 走亮的段：跑道边灯点亮 */
.rw-layer[data-s=list] .lift{color:var(--walk)}
.rw-layer[data-s=list] .segs i{background:#2e5f42}
/* 照亮中的段：引导灯闪（CSS 动画，不是定时器） */
.rw-layer[data-s=work] .lift{color:var(--view)}
.rw-layer[data-s=work] .segs i{background:#1f4b76}
.rw-layer[data-s=work] .segs i:nth-child(2n){animation:beacon 1.2s linear infinite}
.rw-layer[data-s=work] .segs i:nth-child(3n){animation-delay:.4s}
.rw-layer[data-s=work] .segs i:nth-child(4n){animation-delay:.8s}
/* 未到达的段：暗 */
.rw-layer[data-s=todo] .segs i{background:#191d25}
/* 待定：暗色底上一条斜纹理，表示这层里还有没解锁的票 */
.rw-layer[data-s=fog] .track{background:#1a1a1e}
.rw-layer[data-s=fog] .segs i{background:#14171d; background-image:repeating-linear-gradient(45deg,#22252d 0 2px,transparent 2px 4px)}
/* 层号：骑在每一段的正上方，一条细线连下来 */
.rw-marks{position:relative; height:15px; margin-bottom:2px}
.rw-mark{
  position:absolute; left:var(--x,0%); transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:1px;
}
.rw-mark .n{
  font-family:var(--mono); font-size:9.5px; line-height:1.35; color:var(--cap);
  background:#191d25; border:1px solid #262a33; border-radius:3px; padding:0 4px; white-space:nowrap;
}
/* 层号：宽面板读整句（span.wg），窄面板只读数字（span.lg） */
.rw-mark .n .lg{display:none}
.rw-mark[data-s=list] .n{color:#a8e8c2; border-color:#2e5f42}
.rw-mark[data-s=work] .n{color:#cfe6ff; border-color:#2b4a6d; background:#17213a}
.rw-mark[data-s=fog] .n{color:var(--pending); border-color:#4a3d22; border-style:dashed}
.rw-mark .ln{width:1px; height:4px; background:#2a2d35}
.rw-mark[data-s=work] .ln{background:rgba(88,166,255,.7)}
/* 还没画图：跑道上没有段 */
.rw-empty{
  flex:1 1 auto; height:36px; border-radius:3px; border:1px dashed #2a2d35;
  background:repeating-linear-gradient(45deg,#14171d 0 5px,#161922 5px 10px);
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-family:var(--mono); font-size:10px; color:var(--cap); white-space:nowrap;
}
.marker{
  position:absolute; top:1px; left:var(--x,0%); transform:translateX(-50%);
  display:inline-flex; align-items:center; gap:3px; font-size:10px; color:#cfe6ff;
  background:rgba(88,166,255,.18); border:1px solid rgba(88,166,255,.55);
  border-radius:999px; padding:0 7px; white-space:nowrap; height:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.5); z-index:2;
}
.marker::after{content:""; position:absolute; top:100%; left:50%; width:1px; height:10px; background:rgba(88,166,255,.6)}
.beacon{
  flex:none; display:flex; align-items:center; gap:6px; padding:2px 7px; border-radius:5px;
  border:1px solid rgba(192,132,252,.4); background:rgba(192,132,252,.08); color:#e7d8ff;
  font-size:10px; white-space:nowrap;
}
.beacon .lamp{
  width:9px; height:9px; border-radius:2px; background:var(--map); color:var(--map); flex:none;
  animation:lamp 2.4s ease-in-out infinite;
}
@keyframes lamp{
  0%,100%{box-shadow:0 0 0 0 rgba(192,132,252,.6), 0 0 10px 2px rgba(192,132,252,.85)}
  50%{box-shadow:0 0 0 7px rgba(192,132,252,0), 0 0 14px 3px rgba(192,132,252,.45)}
}
@keyframes beacon{0%,100%{background:#1f4b76}50%{background:#7fc0ff}}
.rw-dest{display:flex; align-items:center; gap:7px; margin-top:8px}
.rw-dest .lbl{font-family:var(--mono); font-size:10px; color:var(--map); flex:none; letter-spacing:.06em}
.rw-dest .ruler{
  flex:none; width:44px; height:8px; border-radius:0 2px 2px 0;
  border-right:1px solid rgba(192,132,252,.7);
  background:linear-gradient(90deg,rgba(192,132,252,.05),rgba(192,132,252,.5));
}
.rw-dest .right{flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:8px; margin-left:auto}
.rw-dest .tow{
  flex:1 1 auto; min-width:0; text-align:right; font-size:11px; color:#e7d8ff;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ---------- 计数行（四个小读数块，分隔符统一用「 · 」的空档） ---------- */
.tally{display:flex; flex-wrap:wrap; margin:9px 0 6px; font-variant-numeric:tabular-nums}
.tally .c{
  display:flex; align-items:baseline; gap:5px; font-size:11.5px; color:var(--sub); white-space:nowrap;
}
.tally .c + .c::before{content:"·"; color:var(--cap); margin:0 9px; align-self:center}
.tally .c b{font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--txt)}
.tally .c[data-tone=walk] b{color:var(--walk)}
.tally .c[data-tone=view] b{color:var(--view)}
.tally .c[data-tone=open] b{color:#ffffff}
.tally .c[data-tone=fog] b{color:var(--pending)}
.tally .c[data-tone=total] b{color:var(--txt)}
.tally .c[data-tone=layers] b{font-size:11.5px; color:var(--cap)}

/* ---------- 黑板（出发信息板） ---------- */
.board{
  border:1px solid var(--line); border-radius:8px; background:#12151c; overflow:hidden;
}
.board-head{
  display:grid; grid-template-columns:var(--cols); gap:var(--gap); align-items:center;
  padding:6px 10px; border-bottom:1px solid var(--line);
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--cap);
  background:#14171f;
}
.board-body{display:flex; flex-direction:column; gap:3px; padding:5px 6px}
.row{
  position:relative; overflow:hidden; border-radius:5px; border:1px solid #22262f;
  background:#151821; padding:3px 4px;
}
.row .g{
  display:grid; grid-template-columns:var(--cols); gap:var(--gap); align-items:center;
  padding:2px 5px; min-height:26px;
}
.r-seq{font-family:var(--mono); font-size:10.5px; color:var(--cap); text-align:right}
.r-flt{font-family:var(--mono); font-size:12px; color:var(--sub); letter-spacing:.02em}
.r-dest{min-width:0}
.r-dest .t{
  display:block; font-size:12.5px; color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.r-dest .m{display:block; font-family:var(--mono); font-size:10px; color:var(--cap); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.r-eta{font-family:var(--mono); font-size:11.5px; color:var(--sub); text-align:center}
.r-note{font-size:11px; color:var(--sub); min-width:0}
.r-note .blk{font-family:var(--mono); color:var(--cap); font-size:10px}
.adv{
  display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600;
  background:rgba(88,166,255,.14); border:1px solid rgba(88,166,255,.5); color:#d6e9ff;
  border-radius:5px; padding:2px 8px; cursor:pointer;
}
.adv:hover{background:rgba(88,166,255,.26)}
/* 编号列在窄面板里用 */
.r-no{display:none; font-family:var(--mono); font-size:11px}

/* ---- 状态格：翻牌 ---- */
.r-status{display:flex; align-items:center; gap:5px; min-width:0}
.r-status .word{
  display:inline-flex; align-items:center; font-family:var(--mono); font-size:12.5px; font-weight:600;
  letter-spacing:.02em; white-space:nowrap; border-radius:3px; padding:1px 5px;
  transform-origin:50% 100%; backface-visibility:visible;
}
/* 已知状态：进场时状态字翻一下（一次性，跑完就停） */
body[data-anim="1"] .row[data-flip="1"] .r-status .word{animation:flipIn .62s cubic-bezier(.2,.75,.25,1) both}
@keyframes flipIn{
  from{transform:perspective(280px) rotateX(-92deg); opacity:.25}
  60%{transform:perspective(280px) rotateX(9deg); opacity:1}
  to{transform:perspective(280px) rotateX(0deg); opacity:1}
}
/* 待定：不算「翻定」，只是点亮一颗灰灯 —— 刻意的差别 */
body[data-anim="1"] .row[data-flip="2"] .r-status .word{animation:dimIn .8s ease-out both}
@keyframes dimIn{from{opacity:.15}to{opacity:1}}
.r-status .word::before{
  content:""; width:7px; height:7px; border-radius:1px; flex:none;
  border:1px solid currentColor; background:currentColor;
}
/* 走亮：勾 + 暗一格 */
.row[data-st=walk]{background:#12141a; border-color:#1d2129}
.row[data-st=walk] .r-dest .t{color:#9dafab}
.row[data-st=walk] .r-status .word{color:var(--walk); background:rgba(74,222,128,.10); border:1px solid rgba(74,222,128,.32)}
.row[data-st=walk] .r-status .word::before{content:"✓"; width:auto; height:auto; border:0; background:none; font-size:11px; line-height:1}
.row[data-st=walk] .r-flt{color:#6f7a76}
.row[data-st=walk] .g{opacity:.72}
/* 照亮中：蓝 + 一道扫动高光 */
.row[data-st=view]{background:#151c28; border-color:#2b4a6d}
.row[data-st=view] .r-status .word{color:#cfe6ff; background:rgba(88,166,255,.18); border:1px solid rgba(88,166,255,.55)}
.row[data-st=view] .r-status .word::before{border-radius:50%; box-shadow:0 0 6px 1px rgba(88,166,255,.75)}
.row[data-st=view] .sweep{
  position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(100deg,transparent 38%,rgba(120,190,255,.20) 50%,transparent 62%);
  animation:sweep 2.5s linear infinite;
}
@keyframes sweep{from{transform:translateX(-72%)}to{transform:translateX(72%)}}
/* 现在能做：整行最亮 + 写实的推进按钮 */
.row[data-st=open]{background:#1a1e28; border-color:#3a4152}
.row[data-st=open] .r-status .word{color:#ffffff; background:rgba(230,237,243,.10); border:1px solid rgba(230,237,243,.42)}
.row[data-st=open] .r-status .word::before{background:transparent; border-color:#e6edf3}
/* 待定：灰、闪、标题被雾盖掉一截（不许伪装成准点） */
.row[data-st=fog]{background:#14161c; border-color:#23262e; border-style:dashed}
.row[data-st=fog] .r-status .word{color:var(--pending); background:rgba(212,162,74,.10); border:1px solid rgba(212,162,74,.40)}
.row[data-st=fog] .r-status .word::before{
  background-image:repeating-linear-gradient(45deg,currentColor 0 2px,transparent 2px 4px);
  background-color:transparent; border-color:var(--pending);
  animation:blip 1.6s steps(1,end) infinite;
}
.row[data-st=fog] .r-eta{color:#5f626c}
.row[data-st=fog] .r-dest{position:relative}
.row[data-st=fog] .r-dest .t{color:#94836a; text-decoration:line-through; text-decoration-color:rgba(139,139,149,.55)}
.row[data-st=fog] .r-dest .fog{
  position:absolute; inset:0 auto 0 30%; right:0; pointer-events:none;
  background:
    repeating-linear-gradient(45deg,rgba(16,19,26,.94) 0 4px,rgba(16,19,26,.5) 4px 8px),
    linear-gradient(90deg,rgba(16,19,26,0),rgba(16,19,26,.92) 45%,#10131a);
  border-radius:2px;
}
.row[data-st=fog] .fog-dot{
  display:inline-block; width:4px; height:4px; border-radius:50%; background:var(--pending);
  margin-right:5px; vertical-align:1px; animation:blip 1.6s steps(1,end) infinite;
}
@keyframes blip{0%,58%{opacity:1}59%,100%{opacity:.22}}
/* 底行（空图） */
.row[data-st=none]{border-style:dashed; border-color:#2a2d35; background:#12151c}
.row[data-st=none] .r-status .word{color:var(--cap); background:transparent; border:1px dashed #3a3f4b}
.row[data-st=none] .r-status .word::before{content:"—"; width:auto;height:auto;border:0;background:none;font-size:11px}

/* ---------- 底部说明 / 空图 ---------- */
.note{
  margin:9px 0 2px; padding:9px 11px; border:1px dashed var(--line); border-radius:7px;
  background:#12151c; color:var(--sub); font-size:11.5px;
}
.note b{color:var(--txt); font-weight:600}
.note .ln{display:flex; gap:6px; align-items:flex-start; margin-top:3px}
.note .ln .b{color:var(--cap); font-family:var(--mono); flex:none}

/* ---------- 400 宽：两行式紧凑布局 ---------- */
body[data-narrow="1"] .scroll{padding:8px 8px 0}
/* 返工 2：窄面板下「正在推进」单独占最上面一行，「塔台 · 跑道 4 层」在它下面一行 */
body[data-narrow="1"] .runway{padding:24px 8px 8px}
body[data-narrow="1"] .rw-top{flex-wrap:wrap; align-items:baseline; row-gap:2px}
body[data-narrow="1"] .rw-top .sp{display:none}
body[data-narrow="1"] .rw-top .v{color:var(--sub)}
body[data-narrow="1"] .marker{
  position:absolute; left:10px; right:10px; top:5px; width:auto; transform:none;
  justify-content:center; max-width:none; box-sizing:border-box;
  overflow:hidden; text-overflow:ellipsis; display:block; text-align:center;
}
body[data-narrow="1"] .marker::after{display:none}
/* 返工 2：层标签缩成纯数字，一格一段、对齐到各段中心（不是折行） */
body[data-narrow="1"] .rw-marks{
  display:grid; grid-template-columns:repeat(var(--lanes,1),minmax(0,1fr));
  gap:4px; height:16px; margin-bottom:2px;
}
body[data-narrow="1"] .rw-marks .rw-mark{
  position:static; transform:none; left:auto; justify-content:flex-start; min-width:0;
}
body[data-narrow="1"] .rw-mark .n{
  width:100%; text-align:center; padding:0;
  background:none; border:0; border-top:2px solid currentColor; border-radius:0;
  font-size:9.5px; letter-spacing:.04em;
}
body[data-narrow="1"] .rw-mark .n .wg{display:none}
body[data-narrow="1"] .rw-mark .n .lg{display:block}
body[data-narrow="1"] .rw-mark[data-s=list] .n{color:#4f8f68}
body[data-narrow="1"] .rw-mark[data-s=work] .n{color:#3d6f9e}
body[data-narrow="1"] .rw-mark[data-s=todo] .n{color:#3a3f4b}
body[data-narrow="1"] .rw-mark[data-s=fog] .n{color:#7a6338; border-top-style:dashed}
body[data-narrow="1"] .rw-mark .ln{display:none}
/* 段数超过 8 段时只留首尾两段有数字，中间的用点连接 */
body[data-narrow="1"] .rw-marks[data-compact="1"] .rw-mark{opacity:.22}
body[data-narrow="1"] .rw-marks[data-compact="1"] .rw-mark:first-child,
body[data-narrow="1"] .rw-marks[data-compact="1"] .rw-mark:last-child{opacity:1}
body[data-narrow="1"] .rw-dest{gap:5px}
body[data-narrow="1"] .rw-dest .ruler{width:22px}
body[data-narrow="1"] .rw-dest .right{gap:5px}
body[data-narrow="1"] .beacon{padding:2px 5px; gap:4px}
/* 返工 1：窄面板没有表头这回事——每行自己带「#605 · 第 1 层」这种小标签，直接不渲染表头 */
body[data-narrow="1"] .board-head{display:none}
body[data-narrow="1"] .board-body{padding:5px}
body[data-narrow="1"] .row{padding:2px 3px}
body[data-narrow="1"] .row .g{
  display:grid; grid-template-columns:1fr auto; grid-template-areas:"head status" "dest dest";
  gap:2px 8px; padding:2px 4px; align-items:center;
}
body[data-narrow="1"] .r-flt{grid-area:head; display:flex; align-items:center; gap:6px; font-size:11px; min-width:0}
body[data-narrow="1"] .r-flt .r-no{display:inline; color:var(--cap)}
body[data-narrow="1"] .r-status{grid-area:status}
body[data-narrow="1"] .r-dest{grid-area:dest}
body[data-narrow="1"] .r-dest .t{
  font-size:12px; white-space:normal; display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden;
}
body[data-narrow="1"] .r-dest .m{display:block; margin-top:1px}
body[data-narrow="1"] .r-seq,body[data-narrow="1"] .r-eta,body[data-narrow="1"] .r-note{display:none}
body[data-narrow="1"] .row[data-st=fog] .r-dest .fog{inset:0 auto 0 45%}
body[data-narrow="1"] .shell .crumb .t{display:none}
body[data-narrow="1"] .tag{padding:2px 6px; font-size:10px}

/* ---------- 原型的控制条（不属于设计本身） ---------- */
.bar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:11px 20px; border-top:1px solid var(--line); background:#0d1016;
}
.bar .grp{display:flex; align-items:center; gap:6px}
.bar .k{font-size:11px; color:var(--cap); letter-spacing:.06em}
.bar button{
  font-size:12px; color:var(--sub); background:#16181d; border:1px solid var(--line);
  border-radius:6px; padding:4px 9px; cursor:pointer;
}
.bar button:hover{color:var(--txt); border-color:#3a4152}
.bar button[aria-pressed="true"]{color:#cfe6ff; background:rgba(88,166,255,.16); border-color:rgba(88,166,255,.55)}
.bar .hint{margin-left:auto; font-size:11px; color:var(--cap)}

/* 给读屏软件的一条纯文字说明（画面上不占位） */
.sr{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

/* ---------- 减少动效 ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important}
}
</style>
</head>
<body>

<div class="wrap">
  <div id="panel">
    <header class="shell">
      <button class="back" type="button">← 返回</button>
      <span class="crumb"><span class="k">列表 /</span><span class="t" id="crumbTitle">#604</span></span>
      <span class="tag" id="tag">▣ wayfinder:map</span>
      <button class="primary" type="button" id="btnPush">▶ 推进这张图</button>
    </header>

    <div class="scroll" id="scroll">
      <!-- 塔台：跑道视图 -->
      <section class="runway" id="runway" aria-label="跑道视图"></section>
      <!-- 读数 -->
      <div class="tally" id="tally"></div>
      <!-- 信息板 -->
      <section class="board" id="board" aria-label="出发信息板"></section>
      <!-- 说明 / 空图 -->
      <div class="note" id="note"></div>
    </div>
  </div>
</div>

<footer class="bar" id="bar">
  <div class="grp"><span class="k">宽度</span>
    <button type="button" data-k="w" data-v="400">400</button>
    <button type="button" data-k="w" data-v="810">810</button>
  </div>
  <div class="grp"><span class="k">状态</span>
    <button type="button" data-k="s" data-v="active">推进中</button>
    <button type="button" data-k="s" data-v="empty">还没画图</button>
    <button type="button" data-k="s" data-v="big">大图</button>
  </div>
  <div class="grp"><span class="k">翻牌动效</span>
    <button type="button" data-k="flip" data-v="1">开</button>
    <button type="button" data-k="flip" data-v="0">关</button>
  </div>
  <span class="hint">?w=400|810 · ?s=active|empty|big · ?bar=0 · ?flip=0</span>
</footer>

<script>
/* =====================================================================
   1. 数据：真实地图 #604 原文照抄（简报 §4），另加两个标注为示例的状态
   ===================================================================== */
const ACTIVE = {
  no: 604,
  title: 'MattSkillsDeck 全量性能调查与优化落地（面板 · 状态栏 · 宿主取数链）',
  destination: '把整个 MattSkillsDeck 的性能查清、治到目标准、并在真机上复测通过。走完这张图：宿主外部命令链与定时扫描、客户端渲染与交互、装配与启动、日志落盘与内存，每一层都有实测数字支撑的结论；每一条超标的毛病要么已落地并复测达标，要么明确裁决「不改」并写明理由——插件里不再有「不知道慢在哪」的地方。',
  tickets: [
    { no: 605, type: 'task',     title: '收口上个会话的遗留：提交两处面板渲染修复与布局零抖动文档，临时测点留给下一票', state: 'CLOSED', blockedBy: [] },
    { no: 606, type: 'task',     title: '补上 gh 调用的测量盲区，并把临时测点改造成一组常备测点', state: 'CLOSED', blockedBy: [605] },
    { no: 607, type: 'research', title: '全量性能体检：宿主命令链与扫描、客户端渲染、装配启动、日志落盘逐块实测，产出按耗时排序的问题清单', state: 'OPEN', claimedBy: 'FeatherHunter', blockedBy: [605, 606] },
    { no: 608, type: 'grilling', title: '宿主取数层设计：接缝画在哪、缓存键怎么定、请求怎么合并、三个扫描器怎么收成一个', state: 'OPEN', blockedBy: [607] },
  ],
  decisions: [{ t: '收口上个会话的遗留', g: '倍数结论：点击到内容可见 5075 → 193 毫秒（约 26 倍）' },
              { t: '补上 gh 调用的测量盲区', g: '真机一天 2538 次 gh 调用，中位 7.8 秒，超过「单次 ≤ 1.5 秒」' }],
  fog: ['按体检清单毕业出来的「方案 ＋ 落地 ＋ 真机复测」票：每一条毛病单独成票，数量与内容要等体检结果才知道，现在切不出来。',
        '客户端渲染类问题的具体治理方案：状态栏、列表与地图行、页签切换、详情页各自慢不慢、慢在哪，现在说不清，等体检数字。'],
  fogTotal: 5,
};

const EMPTY = {
  no: 800, title: '去泰国旅游', sample: true,
  destination: '到泰国这件事是明确的：机票落地曼谷、玩十天、把该看的地方看完。怎么去、走哪条线、花多少钱，现在全是待探索——这张图还没画完。',
  tickets: [], fog: [], fogTotal: 0,
};

/* 大图（按简报 §4 的描述造）：9 张票 · 4 层 —— 层 1 三张并行、层 2 两张、层 3 三张、层 4 一张；
   其中 4 张已关、1 张进行中、3 张雾里、1 张可做。四态在同一屏都看得到。 */
const BIG = {
  no: 900, title: '示例大图：9 张票 · 4 层', sample: true,
  destination: '把这条链路的读写路径各治一遍：先查清楚、再定方案、再落地、最后真机复测。到终点 = 每个环节都有实测数字，谁慢在哪一眼能指出来。',
  tickets: [
    { no: 901, type: 'research',  title: '盘点现行取数路径与调用点（示例）', state: 'CLOSED', blockedBy: [] },
    { no: 902, type: 'research',  title: '客户端渲染路径实测（示例）', state: 'CLOSED', blockedBy: [] },
    { no: 903, type: 'prototype', title: '缓存键与合并策略原型（示例）', state: 'CLOSED', blockedBy: [] },
    { no: 904, type: 'grilling',  title: '定版：接缝画在哪、缓存键怎么定（示例）', state: 'CLOSED', blockedBy: [901, 902] },
    { no: 905, type: 'grilling',  title: '定版：请求合并与三个扫描器收成一个（示例）', state: 'OPEN', claimedBy: 'FeatherHunter', blockedBy: [902, 903] },
    { no: 906, type: 'task',      title: '落地：取数层收敛（示例）', state: 'OPEN', blockedBy: [904] },
    { no: 907, type: 'task',      title: '落地：渲染路径单点改造（示例）', state: 'OPEN', blockedBy: [905] },
    { no: 908, type: 'task',      title: '落地：日志落盘批量写（示例）', state: 'OPEN', blockedBy: [904, 905] },
    { no: 909, type: 'research',  title: '真机复测：四个场景逐条给数字（示例）', state: 'OPEN', blockedBy: [906, 907] },
  ],
  fog: ['体检清单毕业出来的落地票，数量与内容要等体检结果（示例）', '跨插件的统一治理是否纳入本图（示例）'],
  fogTotal: 2,
};

/* =====================================================================
   2. 判定（抄自 474-map-detail-ten-directions.html 的 levelize / stateOf / counts）
   ===================================================================== */
function levelize(tickets) {
  const byNo = new Map(tickets.map((t) => [String(t.no), t]));
  const memo = new Map();
  const lv = (t) => {
    if (memo.has(String(t.no))) return memo.get(String(t.no));
    const bs = (t.blockedBy || []).map((b) => byNo.get(String(b))).filter(Boolean);
    const v = bs.length ? Math.max.apply(null, bs.map(lv)) + 1 : 0;
    memo.set(String(t.no), v); return v;
  };
  tickets.forEach(lv);
  const layers = [];
  tickets.forEach((t) => { const i = lv(t); (layers[i] = layers[i] || { i: i, items: [] }).items.push(t); });
  return layers.filter(Boolean);
}
function stateOf(t, all) {
  if (t.state === 'CLOSED') return 'walk';
  if (t.claimedBy) return 'view';
  const bs = (t.blockedBy || []).map((b) => all.find((x) => String(x.no) === String(b))).filter(Boolean);
  return bs.some((b) => b.state === 'OPEN') ? 'fog' : 'open';
}
const counts = (map) => {
  const all = map.tickets;
  return {
    walk: all.filter((t) => stateOf(t, all) === 'walk').length,
    view: all.filter((t) => stateOf(t, all) === 'view').length,
    open: all.filter((t) => stateOf(t, all) === 'open').length,
    fog: all.filter((t) => stateOf(t, all) === 'fog').length,
    total: all.length,
  };
};
const openBlockers = (t, all) => (t.blockedBy || [])
  .map((b) => all.find((x) => String(x.no) === String(b)))
  .filter((b) => b && b.state === 'OPEN');

/* 四态 → 航空词。全项目统一语义，只换说法：
   走亮=已到达 / 照亮中=登机中 / 现在能做=准点 / 雾里=待定。
   键就是 stateOf 的返回值，DOM 上的 data-st 也用同一套名字，避免两处对不上。 */
const WORD = { walk: '已到达', view: '登机中', open: '准点', fog: '待定' };
const ICON = { walk: '✓', view: '◍', open: '○', fog: '▨' };
const TYPE_L = { task: '任务', research: '研究', grilling: '对齐', prototype: '原型', map: '地图' };

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (s, n) => (String(s).length > n ? String(s).slice(0, n) + '…' : String(s));

/* 派生：票号 → 航站序列号（按层内顺序），以及每层的读数 */
function flightOf(layers) {
  const map = new Map();
  let seq = 0;
  layers.forEach((L) => L.items.forEach((t) => { seq += 1; map.set(String(t.no), { seq: seq, layer: L.i }); }));
  return map;
}
function layerState(L, all) {
  const cs = L.items.map((t) => stateOf(t, all));
  if (cs.includes('view')) return 'work';
  if (cs.every((c) => c === 'walk')) return 'list';
  if (cs.some((c) => c === 'fog')) return 'fog';
  return 'todo';
}

/* =====================================================================
   3. 渲染
   ===================================================================== */
const $ = (s) => document.querySelector(s);

function renderRunway(map, layers, all, narrow) {
  const n = Math.max(layers.length, 1);
  const c = counts(map);
  const workIdx = layers.findIndex((L) => L.items.some((t) => stateOf(t, all) === 'view'));
  const head =
    '<div class="rw-top"><span class="k">塔台 · 跑道</span>' +
    '<span class="v">' + (layers.length ? n + ' 层' : '还没有段') + '</span>' +
    '<span class="sp">一层一段 · 走到哪段亮哪段 · 尽头是目的地</span></div>';

  let seg = '';
  layers.forEach((L) => {
    const s = layerState(L, all);
    const lit = s === 'list' ? L.items.length : (s === 'view' ? 1 : 0);
    let inner = '';
    for (let k = 0; k < L.items.length; k++) inner += '<i' + (k < lit ? ' style="background:currentColor"' : '') + '></i>';
    seg += '<div class="rw-layer" data-s="' + s + '" data-layer="' + L.i + '">' +
      '<span class="track"></span><span class="lift"></span><span class="segs">' + inner + '</span></div>';
  });

  const marks = layers.length
    ? '<div class="rw-marks"' + (narrow && n > 8 ? ' data-compact="1"' : '') + '>' + layers.map((L, i) => {
        const s = layerState(L, all);
        /* 两种说法都放成真文字：宽面板读 .wg「第 3 层 · 1 张」，窄面板只读 .lg「3」（CSS 切换，不用伪元素） */
        const wide = '第 ' + (L.i + 1) + ' 层 · ' + L.items.length + ' 张' + (s === 'fog' ? ' · 待定' : '');
        const drop = narrow && n > 8 && i !== 0 && i !== layers.length - 1;
        return '<div class="rw-mark" data-s="' + s + '" data-layer="' + L.i + '"' + (drop ? ' data-drop="1"' : '') + '>' +
          '<span class="n"><span class="wg">' + wide + '</span><span class="lg">' + (L.i + 1) + '</span></span>' +
          '<span class="ln"></span></div>';
      }).join('') + '</div>'
    : '';

  $('#runway').innerHTML = head +
    '<div class="rw">' +
      (seg || '<div class="rw-empty">还没有段 · 第一张票落地时亮起</div>') +
    '</div>' + marks +
    '<div class="rw-dest"><span class="lbl">目的地</span><span class="ruler"></span>' +
    '<span class="right"><span class="beacon"><span class="lamp"></span>灯塔常亮</span>' +
    '<span class="tow" title="' + esc(map.destination || '') + '">' + esc(clamp(map.destination || '（目的地未写）', narrow ? 20 : 46)) + '</span></span></div>';

  /* 层号与「正在推进」指示器：量出每段的真实位置再贴上去（不靠算百分比） */
  const rw = $('#runway .rw');
  if (!layers.length) return c;
  const base = rw.getBoundingClientRect().left;
  layers.forEach((L) => {
    const lane = rw.querySelector('.rw-layer[data-layer="' + L.i + '"]');
    const mark = $('#runway .rw-mark[data-layer="' + L.i + '"]');
    if (!lane || !mark || narrow) return;      // 窄面板中层号块竖排，不用量位置
    const lb = lane.getBoundingClientRect();
    mark.style.left = (lb.left + lb.width / 2 - base) + 'px';
  });
  if (workIdx >= 0) {
    const lane = rw.querySelector('.rw-layer[data-layer="' + layers[workIdx].i + '"]');
    const lb = lane.getBoundingClientRect();
    /* 指示器只在真有「正在推进」的段时才插进 DOM（不留占位元素，免得被画出来） */
    const mk = document.createElement('div');
    mk.className = 'marker';
    mk.textContent = '▸ 正在推进：第 ' + (workIdx + 1) + ' 层 · ' + layers[workIdx].items.map((t) => '#' + t.no).join(' ');
    mk.style.left = Math.max(70, lb.left + lb.width / 2 - base) + 'px';
    /* 贴在这一段正上方（量真实位置，不猜偏移） */
    mk.style.top = Math.max(0, lb.top - $('#runway').getBoundingClientRect().top - 28) + 'px';
    $('#runway').appendChild(mk);
  }

  /* 跑道是用颜色和灯表达的，这里补一条纯文字的等价说法给读屏软件 */
  const say = document.createElement('p');
  say.className = 'sr';
  say.textContent = '跑道一共 ' + layers.length + ' 段，一段就是一层：' + layers.map((L) => {
    const s = layerState(L, all);
    const word = s === 'list' ? '已经走完' : (s === 'view' ? '正在推进' : (s === 'fog' ? '还有票没解锁，待定' : '还没走到'));
    return '第 ' + (L.i + 1) + ' 段（' + L.items.length + ' 张票）' + word;
  }).join('；') + '。跑道尽头的灯塔是目的地，永远亮着：' + (map.destination || '（目的地未写）');
  $('#runway').appendChild(say);
  return c;
}

function renderRow(t, all, F, flip) {
  const s = stateOf(t, all);                       // walk | view | open | fog，与 data-st 同名
  const st = s;                                    // DOM 上直接用这个名字
  const f = F.get(String(t.no)) || { seq: 0, layer: 0 };
  const blk = openBlockers(t, all);
  let note = '';
  if (s === 'walk') note = '<span class="blk">已落地，结论可查</span>';
  else if (s === 'view') note = '<span class="blk">' + esc(t.claimedBy) + ' 在推</span>';
  else if (s === 'open') note = '<button class="adv" type="button" data-adv="' + t.no + '" aria-label="推进 #' + t.no + '">▶ 推进</button>';
  else note = '<span class="blk">先关掉 ' + blk.map((b) => '#' + b.no).join(' ') + '　未解锁</span>';

  const metaRight = '<span class="blk">#' + t.no + ' · ' + (TYPE_L[t.type] || '票') + '</span>';
  const eta = s === 'fog' ? '待定' : (s === 'walk' ? '已落地' : '第 ' + (f.layer + 1) + ' 层');

  return '<article class="row" data-st="' + st + '" data-flip="' + flip + '" data-no="' + t.no + '" ' +
    'tabindex="0" role="button" aria-label="票 #' + t.no + ' ' + WORD[s] + '">' +
    (s === 'view' ? '<span class="sweep" aria-hidden="true"></span>' : '') +
    '<div class="g">' +
      '<span class="r-seq">' + String(f.seq).padStart(2, '0') + '</span>' +
      '<span class="r-flt">#' + t.no + '<span class="r-no"> · 第 ' + (f.layer + 1) + ' 层</span></span>' +
      '<span class="r-dest"><span class="t">' + esc(t.title || '（无标题）') + '</span>' +
        '<span class="m">' + metaRight + '</span>' +
        (s === 'fog' ? '<span class="fog" aria-hidden="true"></span>' : '') +
      '</span>' +
      '<span class="r-status"><span class="word">' + WORD[st] + '</span></span>' +
      '<span class="r-eta">' + eta + '</span>' +
      '<span class="r-note">' + note + '</span>' +
    '</div></article>';
}

function render() {
  const p = new URLSearchParams(location.search);
  const w = Number(p.get('w')) || 810;
  const s = p.get('s') || 'active';
  const flipOn = p.get('flip') !== '0';
  const narrow = w < 560;

  document.documentElement.style.setProperty('--cols',
    narrow ? '30px 46px minmax(0,1fr) 74px 50px 150px' : '30px 58px minmax(0,1fr) 78px 54px 172px');
  document.body.dataset.narrow = narrow ? '1' : '0';
  $('#panel').style.width = w + 'px';
  $('#bar').style.display = p.get('bar') === '0' ? 'none' : 'flex';
  document.body.style.overflowX = 'hidden';
  const y = Number(p.get('y')) || 0;               // ?y=1200 → 让状态字停在那一下翻牌的中间帧，便于截图比对
  document.body.dataset.anim = (flipOn && !y) ? '1' : '0';

  const map = s === 'empty' ? EMPTY : (s === 'big' ? BIG : ACTIVE);
  const all = map.tickets || [];
  const layers = levelize(all);
  const F = flightOf(layers);
  const c = counts(map);
  /* 跑道分几段 —— 窄面板下 1-2-3-4 那排数字正好按这个格数排 */
  document.documentElement.style.setProperty('--lanes', String(Math.max(1, layers.length)));

  $('#crumbTitle').textContent = '#' + (map.no || '—') + '　' + clamp(map.title || '', narrow ? 16 : 44);
  $('#crumbTitle').title = map.title || '';

  renderRunway(map, layers, all, narrow);

  /* 读数：四个小读数块，分隔符统一（每块之间一个「 · 」，前后留同样宽的空档） */
  const card = (tone, num, word) =>
    '<span class="c" data-tone="' + tone + '"><b>' + num + '</b>' + word + '</span>';
  const cf = (k) => card(k, c[k], WORD[k]);
  $('#tally').innerHTML =
    cf('walk') + cf('fog') + cf('view') + cf('open') +
    card('total', c.total, '总票数') +
    card('layers', layers.length ? layers.length + ' 层' : '还没分层', '');

  /* 信息板 */
  let body = '';
  if (!all.length) {
    body = '<article class="row" data-st="none" data-flip="0"><div class="g">' +
      '<span class="r-seq">--</span><span class="r-flt">暂无</span>' +
      '<span class="r-dest"><span class="t">— 还没有票 —</span><span class="m"><span class="blk">下表空着，等第一张票落地</span></span></span>' +
      '<span class="r-status"><span class="word">待定</span></span>' +
      '<span class="r-eta">—</span><span class="r-note"><span class="blk">占位行，不是真航班</span></span>' +
      '</div></article>';
  } else {
    all.forEach((t, i) => {
      const st = stateOf(t, all);
      const flip = !flipOn ? '0' : (st === 'fog' ? '2' : '1');
      body += renderRow(t, all, F, flip).replace('<article class="row"',
        '<article class="row" style="animation-delay:' + Math.min(i * 45, 480) + 'ms"');
    });
  }
  $('#board').innerHTML =
    '<div class="board-head">' +
      '<span class="h-seq">序号</span><span>航班</span><span>目的地（这张票要干的事）</span>' +
      '<span>状态</span><span>预计</span><span>备注</span>' +
    '</div><div class="board-body">' + body + '</div>';

  /* ?y=毫秒：把进场动画停在那一帧（负数延迟 = 直接跳到该时刻），用于截「翻牌」的中间帧 */
  if (y) {
    document.querySelectorAll('#board .row[data-flip="1"] .r-status .word').forEach((el) => {
      el.style.animationDelay = '-' + y + 'ms';
    });
  }

  /* 空图不是白屏：说清「今天没有航班」，并且终点照样亮着 */
  const fogLines = (map.fog || []).slice(0, 2).map((f) => '<div class="ln"><span class="b">▨</span><span>' + esc(f) + '</span></div>').join('');
  if (s === 'empty') {
    $('#note').innerHTML =
      '<b>今天没有航班。</b>这张图还没画完：目的地已经写在上面了，通往它的票一张都还没开。<br>' +
      '空信息板不是出错——等第一张票落地，这一屏就会有行。' +
      (fogLines ? '<div style="margin-top:6px;color:var(--cap)">已知的两处「还没想清楚」：</div>' + fogLines : '');
  } else {
    $('#note').innerHTML = all.length
      ? '<b>怎么读这块板。</b>状态列四个词——<span style="color:var(--walk)">已到达</span>（走亮的票，行压暗）· ' +
        '<span style="color:#cfe6ff">登机中</span>（有人认领，蓝色高光扫过）· ' +
        '<span style="color:#e6edf3">准点</span>（阻塞都解了，点得到「▶ 推进」）· ' +
        '<span style="color:var(--pending)">待定</span>（还没解锁，标题被雾盖掉一截，斜纹灰灯）。' +
        '状态同时用字形（✓ / ◍ / ○ / ▨）与纹理区分，不只靠颜色。' +
        (map.fogTotal > (map.fog || []).length
          ? '<div class="ln"><span class="b">▨</span><span>这张图另有 ' + (map.fogTotal - (map.fog || []).length) +
            ' 处「留白」：还没想清楚、现在切不出票的地方（本原型只带 2 条原文样本）。</span></div>'
          : '')
      : '';
  }

  /* 控制条状态 */
  document.querySelectorAll('#bar button[data-k]').forEach((b) => {
    const k = b.dataset.k, v = b.dataset.v;
    const cur = k === 'w' ? String(w) : (k === 's' ? s : (flipOn ? '1' : '0'));
    b.setAttribute('aria-pressed', String(v === cur));
    b.onclick = () => {
      const np = new URLSearchParams(location.search);
      np.set(k, v);
      location.search = np.toString();
    };
  });

  /* 交互：推进按钮 / 行可点 / 键盘 */
  $('#board').addEventListener('click', (e) => {
    const adv = e.target.closest('.adv');
    const row = e.target.closest('.row');
    if (adv) { adv.textContent = '… 已派出'; adv.disabled = true; return; }
    if (row && row.dataset.no) {
      document.querySelectorAll('#board .row[aria-selected]').forEach((r) => r.removeAttribute('aria-selected'));
      row.setAttribute('aria-selected', 'true');
      row.style.outline = '2px solid rgba(192,132,252,.6)';
      row.style.outlineOffset = '-1px';
    }
  });
  $('#board').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    const row = e.target.closest('.row'); if (!row) return;
    e.preventDefault();
    const btn = row.querySelector('.adv');
    (btn || row).click();
  });
  $('#btnPush').onclick = () => { location.search = 'w=' + w + '&s=' + s; };
}

render();
</script>
</body>
</html>
