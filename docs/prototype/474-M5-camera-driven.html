<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地图详情页 · M5 运镜即交互</title>
<!--
  M5 · 运镜即交互（把「镜头」做成界面）
  单文件自包含：没有第三方库、没有 CDN、没有外链字体与图片、不联网、没有轮询定时器。
  金属板与纸张材质全部由内联 SVG 滤镜（feTurbulence / feDisplacementMap）现算，零图片资源。
  中间的磁扣板就是目的地；四种状态各有各的实物；红线是「谁挡着谁」的可见化。
  牌位只按「离中心的远近」和「阻塞关系」排开，不按层分行、分列、分章节，票上也没有层号。
  镜头只有一个：位置与缩放写在 #world 的 style 上，自检脚本直接读得到。
-->
<style>
/* ============================================================
   0. 配色（任务书第 6 节，五个原型一致）
   ============================================================ */
:root{
  --bg:#10131a; --cardbg:#16181d; --line:#2a2d35;
  --tx:#e6edf3; --sec:#a1a1aa; --cap:#8b8b95;
  --walk:#4ade80; --lit:#58a6ff; --goal:#c084fc; --warn:#f59e0b;
  --mono:Consolas,Menlo,monospace;
  --plate:#3a4048; --plate-dark:#22262c;
  --paper:#e7e0d0; --ink:#2b2b2b;
  --cord:#c0392b; --stamp:#a01e1e;
  --rail-bg:#0b0e14;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0b0e14;color:var(--tx);
  font:13.5px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
#svgdefs{position:absolute;width:0;height:0;overflow:hidden}

/* ============================================================
   1. 面板外壳
   ============================================================ */
#panel{position:relative;width:var(--panel-w,810px);max-width:100vw;height:var(--panel-h,820px);
  margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;box-shadow:0 26px 70px rgba(0,0,0,.72);
  container-type:inline-size}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 10px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,#181b22,#12151b);min-width:0;z-index:6}
.tb-back{font-size:12px;color:var(--sec);white-space:nowrap;background:none;border:0;padding:2px 5px;
  border-radius:5px;cursor:pointer;font-family:inherit}
.tb-back:hover{color:var(--tx);background:#22262f}
.tb-crumb{font:600 11px/1 var(--mono);color:var(--cap);white-space:nowrap}
.tb-tag{font:600 10px/1 var(--mono);color:var(--goal);border:1px solid rgba(192,132,252,.42);
  border-radius:99px;padding:3px 7px;white-space:nowrap}
.tb-sp{flex:1 1 auto;min-width:4px}
.tb-go{font:600 11.5px/1 inherit;color:#0b0f15;background:var(--goal);border:0;border-radius:7px;
  padding:7px 11px;cursor:pointer;white-space:nowrap}
.tb-go:hover{background:#d0a3ff}
.tb-go:active{transform:translateY(1px)}

/* ============================================================
   2. 舞台：镜头就在这一层上推拉摇
   ============================================================ */
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none;cursor:grab;
  background:radial-gradient(120% 90% at 50% -10%,#1b2029 0%,#0d1016 60%,#080a0e 100%)}
#stage.dragging{cursor:grabbing}
#wall{position:absolute;inset:-40px;pointer-events:none;
  background:
    radial-gradient(52% 40% at 50% 8%,rgba(232,238,245,.10),rgba(232,238,245,0) 70%),
    repeating-linear-gradient(180deg,rgba(255,255,255,.026) 0 1px,rgba(255,255,255,0) 1px 46px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,rgba(255,255,255,0) 1px 46px)}
#lamp{position:absolute;left:50%;top:-16%;width:76%;height:78%;pointer-events:none;transform:translateX(-50%);
  background:conic-gradient(from 180deg at 50% 0%,rgba(232,238,245,0) 42%,rgba(232,238,245,.075) 50%,rgba(232,238,245,0) 58%)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.055;mix-blend-mode:screen;filter:url(#grain)}
#vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(72% 66% at 50% 46%,rgba(0,0,0,0) 42%,rgba(0,0,0,.62) 100%)}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
#platform{position:absolute;border-radius:26px;background:linear-gradient(180deg,#2c3138,#1c2026);
  box-shadow:0 0 0 1px #0c0e12,0 40px 120px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.05)}
#plate{position:absolute;border-radius:14px;overflow:hidden;
  background:linear-gradient(168deg,#464d57 0%,#3a4048 34%,#2b3037 72%,#22262c 100%);
  box-shadow:0 26px 60px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.14),
    inset 0 -30px 60px rgba(0,0,0,.34),0 0 0 3px #191c21,0 0 0 9px #2b2f36}
#plateTex{position:absolute;inset:0;pointer-events:none;opacity:.5;filter:url(#brushed);mix-blend-mode:overlay}
#plateGrid{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 1px,rgba(255,255,255,0) 1px 34px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,rgba(255,255,255,0) 1px 34px)}
#plateSheen{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(46% 38% at 32% 16%,rgba(255,255,255,.17),rgba(255,255,255,0) 66%),
    linear-gradient(200deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%)}
#deckPlate{position:absolute;border-radius:16px;background:linear-gradient(180deg,#2b3037,#22262c);
  box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.10),0 0 0 3px #191c21}
#ropeLayer{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#vacancies{position:absolute;left:0;top:0;pointer-events:none}

/* —— 目的地：整个板子的中心 —— */
#hub{position:absolute;cursor:pointer;outline:none}
#hubCard{width:100%;height:100%;padding:18px 20px 16px;border-radius:12px;position:relative;overflow:hidden;
  background:linear-gradient(165deg,#3c3450 0%,#2a2740 46%,#1f1d2e 100%);
  box-shadow:0 0 0 2px rgba(192,132,252,.55),0 0 74px 12px rgba(192,132,252,.26),
    0 22px 46px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15)}
#hubCard:focus-visible{outline:2px solid #e9d9ff;outline-offset:4px}
.hub-top{display:flex;align-items:center;gap:12px}
.reticle{width:54px;height:54px;flex:none;border-radius:50%;position:relative;
  border:2px solid var(--goal);box-shadow:0 0 20px rgba(192,132,252,.55),inset 0 0 12px rgba(192,132,252,.35)}
.reticle::before,.reticle::after{content:"";position:absolute;background:rgba(192,132,252,.75)}
.reticle::before{left:50%;top:-8px;bottom:-8px;width:1px;transform:translateX(-50%)}
.reticle::after{top:50%;left:-8px;right:-8px;height:1px;transform:translateY(-50%)}
.reticle i{position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;
  background:var(--goal);box-shadow:0 0 16px rgba(192,132,252,.9)}
.hub-no{font:700 13px/1 var(--mono);color:#f0dcff;letter-spacing:.5px}
.hub-word{font:700 10px/1 var(--mono);letter-spacing:3px;color:#c9b6e8;margin-top:5px}
.hub-title{font-size:14.5px;font-weight:640;line-height:1.35;color:#f4eeff;margin-top:2px}
.hub-dest{margin-top:11px;font-size:12.5px;line-height:1.62;color:#efe7fb;
  border-top:1px solid rgba(192,132,252,.32);padding-top:10px}
.statrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.stat{font-size:11px;line-height:1.1;padding:5px 8px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
.stat b{font:700 12.5px/1 var(--mono);margin-right:4px}
.st-walk{border-color:rgba(74,222,128,.5);background:rgba(74,222,128,.13);color:#a7f3c8}
.st-lit{border-color:rgba(88,166,255,.5);background:rgba(88,166,255,.13);color:#a9d0ff}
.st-ready{border-color:rgba(192,132,252,.55);background:rgba(192,132,252,.14);color:#dcc3ff}
.st-fog{border-color:rgba(139,139,149,.5);background:rgba(139,139,149,.13);color:#c9c9d2;border-style:dashed}
.hub-meta{margin-top:10px;font-size:10.5px;font-family:var(--mono);color:#a99ec4;
  display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.hub-meta i{font-style:normal;opacity:.55}

/* —— 板上的空位：还没钉上资料的磁扣位 —— */
.vac{position:absolute;border-radius:12px;border:1.5px dashed rgba(232,238,245,.16);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.022) 0 8px,rgba(255,255,255,0) 8px 18px)}
.vac span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;
  color:rgba(232,238,245,.32);white-space:nowrap;text-align:center;line-height:1.6}

/* —— 板上的票：一张资料 —— */
.card{position:absolute;will-change:transform;cursor:pointer;outline:none;
  transition:filter .18s ease}
.cardSheet{position:relative;background:var(--paper);color:var(--ink);border-radius:4px;padding:14px 13px 20px;
  overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.7);
  transition:box-shadow .18s ease}
.cardSheet::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.07) 0 1px,rgba(0,0,0,0) 1px 4px);
  border-top:1px solid rgba(0,0,0,.08)}
.card[data-state="closed"] .cardSheet{background:#e2dccd}
.card:hover .cardSheet,.card:focus-visible .cardSheet{box-shadow:0 18px 34px rgba(0,0,0,.6),0 0 0 2px rgba(232,238,245,.5)}
.card.hot .cardSheet{box-shadow:0 0 0 3px rgba(232,238,245,.95),0 20px 44px rgba(0,0,0,.66)}
.mag{position:absolute;width:22px;height:22px;border-radius:50%;z-index:3;
  background:radial-gradient(60% 60% at 34% 28%,#a8b1bd,#4b525c 62%,#2a2f36);
  box-shadow:0 3px 5px rgba(0,0,0,.65),inset 0 -3px 5px rgba(0,0,0,.5),inset 0 2px 3px rgba(255,255,255,.5)}
.mag::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
  border-radius:50%;background:#1d2126;box-shadow:inset 0 1px 2px rgba(0,0,0,.9)}
.mag.tl{left:-9px;top:-9px} .mag.br{right:-9px;bottom:-9px}
.c-no{font:700 12.5px/1 var(--mono);color:#5a5347;letter-spacing:.3px}
.c-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.c-type{font-size:11px;padding:2px 6px;border-radius:3px;border:1px solid;white-space:nowrap}
.ty-task{border-color:#2f6b4a;color:#1f5738;background:rgba(47,107,74,.10)}
.ty-research{border-color:#1e5b8a;color:#144d78;background:rgba(30,91,138,.10)}
.ty-grilling{border-color:#7a4a86;color:#63306f;background:rgba(122,74,134,.10)}
.ty-prototype{border-color:#8a6a1e;color:#6d5312;background:rgba(138,106,30,.10)}
.ty-map{border-color:#7a7a7a;color:#555;background:rgba(122,122,122,.10)}
.c-title{font-size:13px;line-height:1.34;font-weight:640;margin-top:6px;color:#242424}
.c-sub{font-size:11px;line-height:1.4;color:#5f594c;margin-top:7px}
.c-foot{display:flex;align-items:center;gap:9px;margin-top:8px;flex-wrap:wrap}
.c-prog{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#5f594c;font-family:var(--mono)}
.c-prog i{display:block;width:62px;height:5px;border-radius:3px;background:rgba(0,0,0,.16);overflow:hidden}
.c-prog i b{display:block;height:100%;background:#3f8a5f}
.c-act{display:none;gap:5px;flex-wrap:wrap;margin-top:9px}
.c-act.on{display:flex}
.abtn{font:600 10.5px/1 inherit;padding:5px 8px;border-radius:4px;border:1px solid #2f6b4a;
  background:rgba(47,107,74,.10);color:#1f5738;cursor:pointer}
.abtn:hover{background:rgba(47,107,74,.22)}
.abtn.b2{border-color:#1e5b8a;color:#144d78;background:rgba(30,91,138,.10)}
.abtn.b2:hover{background:rgba(30,91,138,.22)}
.aopen{border-color:#7a7a7a;color:#555;background:rgba(122,122,122,.10);display:inline-flex;
  align-items:center;gap:3px;padding:5px 7px;border-radius:4px;font:600 10.5px/1 inherit;cursor:pointer}
.aopen:hover{background:rgba(122,122,122,.24)}
.badge{position:absolute;right:-13px;top:-14px;width:50px;height:50px;border-radius:50%;z-index:4;
  border:2.5px solid var(--stamp);display:grid;place-items:center;transform:rotate(-16deg);opacity:.82}
.badge b{font-size:12px;line-height:1.05;color:var(--stamp);letter-spacing:1px;text-align:center;font-weight:800}
.litBand{position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#58a6ff,#9ccbff);
  box-shadow:0 0 14px rgba(88,166,255,.7)}
.flag{position:absolute;left:-9px;bottom:14px;width:30px;height:30px;z-index:4}
.flag i{position:absolute;left:0;top:0;width:2.5px;height:30px;background:#3d434b;border-radius:2px}
.flag u{position:absolute;left:2px;top:1px;width:26px;height:15px;background:#3aa35c;
  clip-path:polygon(0 0,100% 0,78% 50%,100% 100%,0 100%);box-shadow:0 2px 4px rgba(0,0,0,.45)}
.card[data-state="ready"] .cardSheet{box-shadow:0 10px 22px rgba(0,0,0,.5),0 0 0 1.5px rgba(58,163,92,.8),inset 0 1px 0 rgba(255,255,255,.7)}
.card[data-state="fog"] .cardSheet{background:linear-gradient(166deg,#cdb890,#b9a077);
  box-shadow:0 10px 20px rgba(0,0,0,.46),0 0 0 1.5px rgba(90,74,48,.5),inset 0 1px 0 rgba(255,255,255,.45)}
.wet{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(168deg,rgba(58,50,36,.40),rgba(58,50,36,.16) 40%,rgba(58,50,36,.48));mix-blend-mode:multiply}
.mist{position:absolute;inset:0;pointer-events:none;opacity:.66;transition:opacity .2s ease;
  background:
    radial-gradient(38% 42% at 26% 34%,rgba(238,238,242,.60),rgba(238,238,242,0) 72%),
    radial-gradient(46% 40% at 74% 66%,rgba(214,220,230,.46),rgba(214,220,230,0) 74%)}
.card[data-state="fog"] .card-title-t{color:rgba(24,20,12,.34);font-weight:600}
.card[data-state="fog"] .c-sub{color:rgba(30,24,14,.46)}
.card[data-state="fog"] .c-no{color:rgba(30,24,14,.52)}
.card[data-state="fog"] .c-type{border-color:rgba(60,48,30,.5);color:rgba(40,32,18,.64);background:rgba(255,255,255,.14)}
.card[data-state="fog"]:hover .mist{opacity:.24}
.card[data-state="fog"]:hover .card-title-t{color:rgba(24,20,12,.72)}
.card[data-state="fog"]:hover .c-sub{color:rgba(30,24,14,.66)}
.fogSeal{position:absolute;left:50%;bottom:4px;transform:translateX(-50%) rotate(-2deg);z-index:3;
  font:700 11px/1 inherit;letter-spacing:1.5px;color:#5d4a2c;border:1.5px solid #6b5636;border-radius:3px;
  padding:2.5px 7px;background:rgba(240,232,214,.74)}
.fogNote{font-size:10.5px;color:rgba(40,32,18,.6);margin-top:7px;font-style:normal}

/* ============================================================
   3. 资料展板（目的地正文 / 正文详情 / 三个区块）
   ============================================================ */
.panels{position:absolute;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
  grid-auto-rows:max-content}
.panel{background:linear-gradient(170deg,#f2ecdd,#e4dccb);color:var(--ink);border-radius:6px;
  padding:16px 18px 18px;box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7);
  position:relative;outline:none}
.panel:focus-visible{box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 3px #c084fc}
.panel h3{margin:0 0 9px;font-size:15px;font-weight:700;color:#241f18;display:flex;align-items:baseline;gap:8px}
.panel h3 i{font-style:normal;font-size:11px;color:#6d6455;font-weight:600}
.panel p.big{margin:0;font-size:13.5px;line-height:1.72;color:#26221c}
.panel .sig{margin-top:12px;padding-top:9px;border-top:1px dashed rgba(0,0,0,.22);font-size:11px;color:#6d6455;font-family:var(--mono)}
.panel code{font:600 11.5px/1 var(--mono);background:rgba(0,0,0,.08);padding:1px 4px;border-radius:3px}
.panel ul{margin:0;padding:0;list-style:none}
.panel li{font-size:12.5px;line-height:1.62;color:#2b2620;padding:6px 0 6px 16px;position:relative}
.panel li+li{border-top:1px solid rgba(0,0,0,.09)}
.panel li::before{content:"•";position:absolute;left:3px;top:6px;color:#8a7a5e}
.panel[data-panel="dest"]{grid-column:span 1}
.panel[data-panel="dest"]::after{content:"";position:absolute;inset:-8px;border-radius:10px;pointer-events:none;
  box-shadow:0 0 0 2px rgba(192,132,252,.75),0 0 50px 8px rgba(192,132,252,.35)}
.panel[data-panel="dest"] h3{color:#4b2a75}
.dk li b{display:block;font-size:12.5px;color:#241f18}
.dk li span{display:block;font-size:12px;color:#4a4437;margin-top:2px}
.dash li::before{content:"—";top:6px;color:#8a7a5e}
.dash.out li::before{content:"✕";color:#9a5a4a}
.moreline{margin-top:10px;font:600 11px/1.5 var(--mono);color:#6d6455;border-top:1px dashed rgba(0,0,0,.22);padding-top:8px}
.empty{font-size:12.5px;color:#6d6455;line-height:1.7;padding:8px 0}

/* ============================================================
   4. 常驻字幕条（操作行）
   ============================================================ */
#rail{flex:0 0 auto;border-top:1px solid #232734;background:var(--rail-bg);z-index:8;
  padding:7px 10px 9px;display:flex;flex-direction:column;gap:7px}
#railJump{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
#railJump::-webkit-scrollbar{display:none}
.jump{font:600 11px/1 inherit;color:var(--sec);background:#12151c;border:1px solid var(--line);
  border-radius:99px;padding:5px 9px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.jump:hover{color:var(--tx);border-color:#3a4050;background:#1a1f28}
.jump[aria-current="true"]{color:#0b0f15;background:var(--sec);border-color:var(--sec)}
.jump i{font-style:normal;font-size:10px;opacity:.75;font-family:var(--mono)}
#railMain{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rbtn{font:600 12px/1 inherit;border-radius:7px;padding:8px 12px;cursor:pointer;border:1px solid var(--line);
  background:#171b22;color:var(--tx);white-space:nowrap}
.rbtn:hover{background:#20252e}
.rbtn.primary{background:var(--goal);border-color:var(--goal);color:#0b0f15}
.rbtn.primary:hover{background:#d0a3ff}
.rbtn.notes{border-color:rgba(88,166,255,.5);background:rgba(88,166,255,.12);color:#cfe4ff}
.rbtn.notes:hover{background:rgba(88,166,255,.24)}
.rbtn.notes[aria-pressed="true"]{background:var(--lit);border-color:var(--lit);color:#08121f}
.rbtn.diag{border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.1);color:#ffdca6}
.rbtn.diag:hover{background:rgba(245,158,11,.22)}
.rail-sp{flex:1 1 auto;min-width:4px}
.legend{display:flex;gap:9px;flex-wrap:wrap;font-size:10.5px;color:var(--cap);align-items:center}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.lg{width:10px;height:10px;border-radius:2px;display:inline-block;border:1px solid}
.lg-walk{border-color:rgba(74,222,128,.6);background:rgba(74,222,128,.28)}
.lg-lit{border-color:rgba(88,166,255,.6);background:rgba(88,166,255,.3)}
.lg-ready{border-color:rgba(192,132,252,.7);background:rgba(192,132,252,.32)}
.lg-fog{border-color:rgba(139,139,149,.6);background:rgba(139,139,149,.26);border-style:dashed}

/* ============================================================
   5. 舞台上的读表
   ============================================================ */
#hud{position:absolute;right:9px;top:9px;z-index:5;pointer-events:none;
  display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hudbox{background:rgba(9,11,16,.78);border:1px solid #262b36;border-radius:8px;padding:6px 8px;

/* ============================================================
   八、镜头：frameRect / home / focusCard / focusPanel / 进场 / 走位
   ============================================================ */
function measure() {
  var r = el.stage.getBoundingClientRect();
  stageW = Math.max(140, r.width); stageH = Math.max(140, r.height);
  var ws = worldSize();
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  el.ropeLayer.width = Math.ceil(ws.w * dpr);
  el.ropeLayer.height = Math.ceil(ws.h * dpr);
  el.ropeLayer.style.width = ws.w + "px";
  el.ropeLayer.style.height = ws.h + "px";
  el.ropeLayer.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
}
function worldSize() {
  var bottom = 0;
  for (var k in panels) bottom = Math.max(bottom, panels[k].y + panels[k].h);
  if (!bottom) bottom = geom ? geom.boardH : 800;
  return { w: (geom ? geom.boardW : 800) + 40, h: bottom + 60 };
}
function camKey() { return [cur.x.toFixed(1), cur.y.toFixed(1), cur.k.toFixed(3)].join(","); }
/* 自检用的把手：把镜头、红线、卡片摆到 window 上，方便脚本直接读（不影响画面） */
function expose() {
  window.__cam = function () {
    return { x: +cur.x.toFixed(2), y: +cur.y.toFixed(2), k: +cur.k.toFixed(4),

             flying: !!flying, kind: flyingKind, frames: frameIndex,

             entry: entryJob ? +((performance.now() - entryJob.t0) / entryJob.dur).toFixed(3) : null,

  window.__cards = function () {
    return cards.map(function (c) { return { no: c.no, st: c.st, cx: c.cx, cy: c.cy, x: c.x, y: c.y, w: c.w, h: c.h }; });
  };
  window.__cables = function () {
    return cables.map(function (c, i) {

    });

  window.__deckRow = function () {

    var st = el.stage.getBoundingClientRect();

  };
  window.__panels = function () {
    var o = {};

    return o;
  };
  window.__geom = function () { return { hubX: geom.hubX, hubY: geom.hubY, boardW: geom.boardW, boardH: geom.boardH }; };
  window.__stage = function () { return { w: stageW, h: stageH }; };
  window.__clickMark = function () { return clickMark; };
  window.__wheelLog = function () { return wheelLog.slice(); };
  window.__cableAt = function (px, py) { return cableAt(px, py); };

}
function commitCam() {
  frameIndex++;

  el.world.setAttribute("data-cam", camKey());
  el.world.setAttribute("data-frame", String(frameIndex));
  el.world.setAttribute("data-frames", flying ? "flying" : "settled");
  el.world.setAttribute("data-last-move", flyingKind);
  updateHUD();
  drawCables();
}
function fitRect(x, y, w, h, opts) {
  opts = opts || {};
  var pad = (opts.pad == null ? FIT_PAD : opts.pad);
  var k = Math.min((stageW - pad * 2) / w, (stageH - pad * 2) / h);
  k = clamp(k, opts.min == null ? HOME_MIN : opts.min, opts.max == null ? HOME_MAX : opts.max);
  return { k: k, x: stageW / 2 - (x + w / 2) * k, y: stageH / 2 - (y + h / 2) * k };
}
/* 板面外框：下沿一直算到资料展板区的顶边，这样「看全整块板」时展板会贴着画面下沿露一条头，
   一眼就知道下面还钉着东西，标着 Destination 的按钮一点就推近 */
function boardBox() {
  var left = 26, top = 26;
  var right = geom.boardW - 26;
  var bottom = geom.boardH + DETAILS_GAP;
  return { x: left, y: top, w: right - left, h: bottom - top };
}
function stopFlight() { entryJob = null; travelJob = null; flying = false; drag.vx = drag.vy = 0; inertia = 0; }
function moveTo(x, y, k) { tgt.x = x; tgt.y = y; tgt.k = k; }
function home() {
  stopFlight();
  setMark("");
  var b = boardBox();
  var t = fitRect(b.x, b.y, b.w, b.h, { pad: 22, min: HOME_MIN, max: HOME_MAX });
  moveTo(t.x, t.y, t.k);
  flyingKind = "glide";
  kick();
}
function focusCard(c) {
  stopFlight();
  setMark("");
  var k = clamp(Math.max(0.92, Math.min(1.15, cur.k)), 0.92, 1.15);
  moveTo(stageW / 2 - c.cx * k, stageH / 2 - c.cy * k, k);
  flyingKind = "glide";
  mark(c.el, "hot");

}
function focusPanel(key) {
  stopFlight();
  setMark(key);
  var p = panels[key];
  if (!p) { home(); return; }
  var k = clamp(Math.min((stageW - 56) / p.w, 1.05), HOME_MIN, 1.02);
  if (k * p.h > stageH - 40) k = clamp((stageH - 40) / p.h, HOME_MIN, 1.02);
  moveTo(stageW / 2 - (p.x + p.w / 2) * k, stageH / 2 - (p.y + p.h / 2) * k, k);
  flyingKind = "glide";
  var word = key === "dest" ? "Destination" : key === "notes" ? "正文详情" : key === "decisions" ? "Decisions so far" : key === "fog" ? "Not yet specified" : "Out of scope";
  flash("镜头对准「" + word + "」这块展板");

  kick();
}
function mark(node, cls) {
  if (!node) return;
  document.querySelectorAll(".card.hot").forEach(function (n) { n.classList.remove("hot"); });
  node.classList.add("hot");
  if (glowTimer) clearTimeout(glowTimer);
  glowTimer = setTimeout(function () { node.classList.remove("hot"); }, 1800);
}
function setMark(key) {
  document.querySelectorAll("#railJump .jump").forEach(function (b) {
    b.setAttribute("aria-current", b.getAttribute("data-jump") === key ? "true" : "false");
  });
}
function flash(msg) { el.live.textContent = msg; }

/* 进场：先一张资料的特写（停一下，让人看清牌子上写的是什么）→ 镜头拉远露出整块板。
   一次就好，不循环；手指一动就停。特写起点保证 k 永远大于看全的倍数，所以画面里从头到尾有东西。 */
function entryPass() {
  stopFlight();
  setMark("");
  var ht = homeCam();
  var hero = cards.filter(function (c) { return c.st === "lit"; })[0] || cards[cards.length >> 1] || null;
  var k0 = 2.05, x0, y0;
  if (hero) { x0 = stageW / 2 - hero.cx * k0 - 40; y0 = stageH / 2 - hero.cy * k0 + 22; }
  else { x0 = stageW / 2 - geom.hubX * k0; y0 = stageH / 2 - geom.hubY * k0; }
  var from = { x: x0, y: y0, k: k0 };
  cur.x = from.x; cur.y = from.y; cur.k = from.k;
  tgt.x = ht.x; tgt.y = ht.y; tgt.k = ht.k;
  commitCam();
  entryJob = { t0: performance.now(), dur: 1900, hold: 0.28, from: from, to: ht };
  flying = true; flyingKind = "entry";
  el.hint.classList.remove("off");
  if (hintTimer) clearTimeout(hintTimer);
  hintTimer = setTimeout(function () { el.hint.classList.add("off"); }, 4600);
  kick();
}
/* 点线走位：镜头沿着这条线走到另一头（两段弧线：先微微推、再落到目标） */
function lineWalk(cb, target) {
  stopFlight();
  setMark("");
  var kArr = clamp(Math.max(cur.k, 0.9), 0.9, 1.3);
  var kMid = clamp((kArr + cur.k) / 2 + 0.06, 0.5, 1.4);
  var cx = target.cx, cy = target.cy;
  travelJob = {
    t0: performance.now(), dur: 780,
    from: { x: tgt.x, y: tgt.y, k: tgt.k },
    legs: [
      { x: stageW / 2 - cx * kMid, y: stageH / 2 - cy * kMid, k: kMid },
      { x: stageW / 2 - cx * kArr, y: stageH / 2 - cy * kArr, k: kArr }
    ]
  };
  flying = true; flyingKind = "line-walk";
  clickMark.count++;
  clickMark.from = cb.blocked != null ? cb.blocked : map.no;
  clickMark.target = cb.no;
  clickMark.fromCam = camKey();
  mark(target.el, "hot");
  var other = cb.blocked != null ? ("#" + cb.blocked) : ("目的地 #" + map.no);
  flash("沿着红线从 " + other + " 走到 #" + cb.no + "：" + target.t.title);
  el.hudHot.innerHTML = "刚从 <span>" + other + "</span> 走到 <span>#" + cb.no + "</span>";
  el.world.setAttribute("data-click-from", String(clickMark.from));
  el.world.setAttribute("data-click-target", String(clickMark.target));

/* rAF 主循环：镜头只在这一处往前走 */
var looping = false, lastT = 0;
function kick() { if (looping) return; looping = true; lastT = performance.now(); requestAnimationFrame(loop); }
function loop(now) {
  var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  var settled = false;
  if (entryJob) {
    var raw = clamp((now - entryJob.t0) / entryJob.dur, 0, 1);
    /* 前 hold 段停在特写上（略微推一点点，像呼吸），后面的段才是拉远 */
    var p = raw <= entryJob.hold ? 0 : (raw - entryJob.hold) / (1 - entryJob.hold);
    var e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    var breath = raw <= entryJob.hold ? Math.sin(raw / entryJob.hold * Math.PI) * 0.012 : 0;
    cur.x = entryJob.from.x + (entryJob.to.x - entryJob.from.x) * e;
    cur.y = entryJob.from.y + (entryJob.to.y - entryJob.from.y) * e;
    cur.k = (entryJob.from.k + (entryJob.to.k - entryJob.from.k) * e) * (1 + breath);
    tgt.x = cur.x; tgt.y = cur.y; tgt.k = cur.k;
    if (raw >= 1) {
      entryJob = null; flying = false; el.hint.classList.add("off");
      endCount++;
      el.world.setAttribute("data-entry-plays", String(endCount));
    }
  } else if (travelJob) {
    var q = clamp((now - travelJob.t0) / travelJob.dur, 0, 1);
    var a = travelJob.legs[0], b2 = travelJob.legs[1];
    var seg = q < 0.5 ? { p: q * 2, from: travelJob.from, to: a } : { p: (q - 0.5) * 2, from: a, to: b2 };
    var eq = 1 - Math.pow(1 - seg.p, 3);
    cur.x = seg.from.x + (seg.to.x - seg.from.x) * eq;
    cur.y = seg.from.y + (seg.to.y - seg.from.y) * eq;
    cur.k = seg.from.k + (seg.to.k - seg.from.k) * eq;
    tgt.x = cur.x; tgt.y = cur.y; tgt.k = cur.k;
    if (q >= 1) { travelJob = null; flying = false; }
  } else {
    if (drag.on) {
      cur.x = tgt.x; cur.y = tgt.y; cur.k = tgt.k;
    } else {
      /* 只有「刚松手」才带余速，跑一小截自己收住；别的动作不掺进来 */
      if (inertia > 0 && (Math.abs(drag.vx) > 0.05 || Math.abs(drag.vy) > 0.05)) {
        inertia -= dt;
        tgt.x += drag.vx * dt * 60 * 0.5; tgt.y += drag.vy * dt * 60 * 0.5;
        drag.vx *= Math.pow(0.004, dt); drag.vy *= Math.pow(0.004, dt);
      } else { drag.vx = drag.vy = 0; inertia = 0; }
      cur.x += (tgt.x - cur.x) * 0.30;
      cur.y += (tgt.y - cur.y) * 0.30;
      cur.k += (tgt.k - cur.k) * 0.30;
    }
    /* 「停住了」要停得干净：留给缓动的那点尾巴也算在走，免得自检和指针读到一个还在漂的镜头 */
    settled = Math.abs(tgt.x - cur.x) < 0.2 && Math.abs(tgt.y - cur.y) < 0.2 && Math.abs(tgt.k - cur.k) < 0.0004;
    if (settled) { cur.x = tgt.x; cur.y = tgt.y; cur.k = tgt.k; flying = false; }
    else flying = true;      /* 缓动还没停下也算「正在走」，自检读得到真话 */
  }
  commitCam();
  if (!settled) requestAnimationFrame(loop); else { looping = false; }
}

/* ============================================================
   九、红线画在 canvas 上
   ============================================================ */
function drawCablePath(g, cb, dy) {
  g.beginPath();
  g.moveTo(cb.from.x, cb.from.y + (dy || 0));
  g.bezierCurveTo(cb.bend.x, cb.bend.y + (dy || 0), cb.bend.x, cb.bend.y + (dy || 0), cb.to.x, cb.to.y + (dy || 0));
}
function drawCables() {
  var g = el.ropeLayer.getContext("2d");
  g.clearRect(0, 0, el.ropeLayer.width, el.ropeLayer.height);
  g.lineCap = "round";
  cables.forEach(function (cb, i) {
    var hot = (hoverCable === i);
    var fog = cb.state === "fog";
    /* 影子：绳是绷在板上的，所以下面压着一道暗影 */
    g.save();
    g.translate(0, 2.5);
    drawCablePath(g, cb, 0);
    g.strokeStyle = "rgba(0,0,0,.42)"; g.lineWidth = hot ? 6 : 4; g.stroke();
    g.restore();
    drawCablePath(g, cb, 0);
    g.strokeStyle = hot ? "#ff6b52" : "#a8321f";
    g.lineWidth = hot ? 4.4 : 2.8;
    g.setLineDash(fog ? [11, 6] : []);
    g.stroke();
    drawCablePath(g, cb, -1);
    g.strokeStyle = hot ? "rgba(255,226,214,.9)" : "rgba(255,190,170,.30)";
    g.lineWidth = 1;
    g.stroke();
    g.setLineDash([]);
    /* 箭头：指着被挡的那一方 */
    var bq = cubicAt(cb, 0.965), eq2 = cubicAt(cb, 1);
    var ang = Math.atan2(eq2.y - bq.y, eq2.x - bq.x);
    g.save(); g.translate(eq2.x, eq2.y); g.rotate(ang);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(-11, 5); g.lineTo(-11, -5); g.closePath();
    g.fillStyle = hot ? "#ff6b52" : "#a8321f"; g.fill(); g.restore();
    if (hot) {
      g.fillStyle = "#ffd7cc";
      g.beginPath(); g.arc(eq2.x, eq2.y, 5, 0, 6.3); g.fill();
      g.beginPath(); g.arc(cb.from.x, cb.from.y, 4, 0, 6.3); g.fill();
    }
  });
}

/* ============================================================
   十、读表与微小地图
   ============================================================ */
function updateHUD() {

  var seen = 0;

  });

    (seen === cards.length && cards.length ? "整块板都在画面里" : "推拉或摇镜看其余");
  var mw = el.miniBoard.parentNode.clientWidth, mh = el.miniBoard.parentNode.clientHeight;
  var s = Math.min(mw / ws.w, mh / ws.h) * 0.92;
  var ox = (mw - ws.w * s) / 2, oy = (mh - ws.h * s) / 2;
  el.miniBoard.style.left = ox + "px";
  el.miniBoard.style.top = oy + "px";
  el.miniBoard.style.width = (ws.w * s) + "px";
  el.miniBoard.style.height = ((geom ? geom.boardH : 0) * s) + "px";
  el.miniView.style.left = (ox + (-cur.x / cur.k) * s) + "px";
  el.miniView.style.top = (oy + (-cur.y / cur.k) * s) + "px";
  el.miniView.style.width = clamp((stageW / cur.k) * s, 5, ws.w * s) + "px";
  el.miniView.style.height = clamp((stageH / cur.k) * s, 5, ws.h * s) + "px";
  el.miniDest.style.left = (ox + (geom ? geom.hubX : 0) * s - 4) + "px";
  el.miniDest.style.top = (oy + (geom ? geom.hubY : 0) * s - 4) + "px";
  var hc = (hoverCable >= 0 && cables[hoverCable]) ? cables[hoverCable] : null;
  if (hc) {
    el.miniHot.style.display = "block";
    el.miniHot.style.left = (ox + hc.to.x * s - 4) + "px";
    el.miniHot.style.top = (oy + hc.to.y * s - 4) + "px";
  } else el.miniHot.style.display = "none";
}

/* ============================================================
   十一、指针：滚轮推拉 / 拖动摇镜 / 点红线走位
   ============================================================ */
function screenToWorld(px, py) { return { x: (px - cur.x) / cur.k, y: (py - cur.y) / cur.k }; }
function cableAt(px, py, tol) {
  var p = screenToWorld(px, py);
  var best = -1, bd = (tol == null ? 26 : tol) / cur.k;
  for (var i = 0; i < cables.length; i++) {
    var r = distToCable(cables[i], p.x, p.y);
    if (r.d < bd) { bd = r.d; best = i; }
  }
  return best;
}
el.stage.addEventListener("wheel", function (ev) {
  ev.preventDefault();
  stopFlight();
  var r = el.stage.getBoundingClientRect();
  var px = ev.clientX - r.left, py = ev.clientY - r.top;
  /* 以上一刻「真正看见的」那个缩放为锚点：上一次滚轮还没走完就用它，会连跳两下 */
  var p = screenToWorld(px, py);
  var nk = clamp(cur.k * Math.exp(-ev.deltaY * 0.0016), 0.26, 2.4);
  tgt.x = px - p.x * nk; tgt.y = py - p.y * nk; tgt.k = nk;
  drag.vx = drag.vy = 0; inertia = 0;
  flyingKind = "wheel";
  wheelLog.push({ dy: Math.round(ev.deltaY), k: +nk.toFixed(3), x: Math.round(px), y: Math.round(py) });
  if (wheelLog.length > 24) wheelLog.shift();
  kick();
}, { passive: false });

el.stage.addEventListener("pointerdown", function (ev) {
  if (ev.button !== 0) return;
  stopFlight();
  drag.on = true; drag.moved = 0;
  drag.sx = ev.clientX; drag.sy = ev.clientY;
  drag.ox = cur.x; drag.oy = cur.y;
  drag.lx = ev.clientX; drag.ly = ev.clientY; drag.lt = performance.now();
  drag.vx = drag.vy = 0;
  el.stage.classList.add("dragging");
  try { el.stage.setPointerCapture(ev.pointerId); } catch (e) {}
  kick();
});
el.stage.addEventListener("pointermove", function (ev) {
  if (drag.on) {
    var dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
    drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
    tgt.x = drag.ox + dx; tgt.y = drag.oy + dy;
    var now = performance.now(), dt = Math.max(1, now - drag.lt);
    drag.vx = (ev.clientX - drag.lx) / dt * 12;
    drag.vy = (ev.clientY - drag.ly) / dt * 12;
    drag.lx = ev.clientX; drag.ly = ev.clientY; drag.lt = now;
    flyingKind = "drag";
    kick();
    return;
  }
  var r = el.stage.getBoundingClientRect();
  var i = cableAt(ev.clientX - r.left, ev.clientY - r.top);
  if (i !== hoverCable) setHover(i);
});
el.stage.addEventListener("pointerup", function (ev) {
  if (!drag.on) return;
  drag.on = false;
  el.stage.classList.remove("dragging");
  try { el.stage.releasePointerCapture(ev.pointerId); } catch (e) {}
  if (drag.moved > 6) {
    inertia = 0.85;                 /* 松手后带 0.85 秒的余速 */
    flyingKind = "drag";
    kick();
    return;
  }
  drag.vx = drag.vy = 0; inertia = 0;
  var r = el.stage.getBoundingClientRect();
  var i = cableAt(ev.clientX - r.left, ev.clientY - r.top);
  if (i >= 0) {
    var cb = cables[i];
    var target = cards.filter(function (k) { return k.no === cb.no; })[0];
    if (target) { lineWalk(cb, target); return; }
  }
  kick();
});
el.stage.addEventListener("pointerleave", function () {
  if (drag.on) { drag.on = false; el.stage.classList.remove("dragging"); }
  setHover(-1);
});
function setHover(i) {
  hoverCable = i;
  if (i < 0) {
    el.hudHot.innerHTML = "点一条红线，镜头走到它的另一头";
    drawCables();
    return;
  }
  var cb = cables[i];
  var fromW = nodesByNo[cb.blocked] ? ("#" + cb.blocked + " " + nodesByNo[cb.blocked].title) : ("目的地 #" + map.no);
  var toW = "#" + cb.no + " " + (nodesByNo[cb.no] ? nodesByNo[cb.no].title : "");
  el.hudHot.innerHTML = "这根红线连着 <span>" + esc(short(fromW, 24)) + "</span> → <span>" + esc(short(toW, 24)) + "</span>　点一下走到另一头";
  drawCables();
}
el.stage.addEventListener("keydown", function (ev) {
  var step = ev.shiftKey ? 180 : 70;
  if (ev.key === "ArrowLeft") { stopFlight(); tgt.x += step; flyingKind = "keys"; kick(); ev.preventDefault(); }
  else if (ev.key === "ArrowRight") { stopFlight(); tgt.x -= step; flyingKind = "keys"; kick(); ev.preventDefault(); }
  else if (ev.key === "ArrowUp") { stopFlight(); tgt.y += step; flyingKind = "keys"; kick(); ev.preventDefault(); }
  else if (ev.key === "ArrowDown") { stopFlight(); tgt.y -= step; flyingKind = "keys"; kick(); ev.preventDefault(); }
  else if (ev.key === "+" || ev.key === "=") { stopFlight(); zoomBy(1.18); ev.preventDefault(); }
  else if (ev.key === "-" || ev.key === "_") { stopFlight(); zoomBy(1 / 1.18); ev.preventDefault(); }
  else if (ev.key === "Escape") { home(); ev.preventDefault(); }
});
function zoomBy(f) {
  var p = screenToWorld(stageW / 2, stageH / 2);
  var nk = clamp(tgt.k * f, 0.26, 2.4);
  tgt.x = stageW / 2 - p.x * nk; tgt.y = stageH / 2 - p.y * nk; tgt.k = nk;
  flyingKind = "keys";
  kick();
}

/* ============================================================
   十二、按钮与控制条
   ============================================================ */
function applyMainWord() {
  var n = map.tickets.length;
  var open = map.tickets.filter(function (t) { return t.state !== "CLOSED"; }).length;
  var word = n === 0 ? "检查" : (open === 0 ? "完成" : "执行");
  el.topGo.textContent = "▸ " + word;
  el.railGo.textContent = "▸ " + word;
  el.topGo.setAttribute("data-word", word);
  el.railGo.setAttribute("data-word", word);
}
function applyShell() {
  document.documentElement.style.setProperty("--panel-w", state.w + "px");
  var h = Math.max(620, window.innerHeight - 90);
  document.documentElement.style.setProperty("--panel-h", h + "px");
  el.ctl.querySelectorAll("[data-w]").forEach(function (b) {
    b.setAttribute("aria-pressed", b.getAttribute("data-w") === String(state.w) ? "true" : "false");
  });
  el.ctl.querySelectorAll("[data-s]").forEach(function (b) {
    b.setAttribute("aria-pressed", b.getAttribute("data-s") === state.s ? "true" : "false");
  });
  el.ctl.style.display = state.bar ? "flex" : "none";
}
document.getElementById("backBtn").addEventListener("click", function () { flash("返回" + state.from + "（原型里不跳页）"); });
el.topGo.addEventListener("click", function () { flash("主按钮：" + el.topGo.getAttribute("data-word") + "这张图"); });
el.railGo.addEventListener("click", function () { flash("主按钮：" + el.railGo.getAttribute("data-word") + "这张图"); });
document.getElementById("railNew").addEventListener("click", function () { flash("在新会话里打开并推进 #" + map.no); });
document.getElementById("railDiag").addEventListener("click", function () { flash("打开诊断（原型里只有这一下反馈）"); });
document.getElementById("railArchive").addEventListener("click", function () { flash("打开原票 #" + map.no + "（原型里不联网）"); });
el.railNotes.addEventListener("click", function () {
  var on = el.railNotes.getAttribute("aria-pressed") === "true";
  if (on) { el.railNotes.setAttribute("aria-pressed", "false"); home(); }
  else focusPanel("notes");
});
document.querySelectorAll("#railJump .jump").forEach(function (b) {
  b.addEventListener("click", function () {
    var k = b.getAttribute("data-jump");
    if (k === "home") { el.railNotes.setAttribute("aria-pressed", "false"); home(); flash("镜头退回来，看全整块板"); return; }
    focusPanel(k);
  });
});
document.getElementById("ctlHome").addEventListener("click", home);
document.getElementById("ctlReplay").addEventListener("click", entryPass);
el.ctl.querySelectorAll("[data-w]").forEach(function (b) {
  b.addEventListener("click", function () {
    state.w = parseInt(b.getAttribute("data-w"), 10);
    applyShell(); measure(); home();
  });
});
el.ctl.querySelectorAll("[data-s]").forEach(function (b) {
  b.addEventListener("click", function () { state.s = b.getAttribute("data-s"); render(); });
});
/* 面板被拖动改宽（真响应容器）：尺子重新量一次，但不许打断正在播的入场镜头，
   也不许把观众的镜头拽回去——只有原来就停在「看全整块板」的时候才重新取一次景 */
var resizeCount = 0;
function onResize() {
  var keep = homeCam();
  measure();
  resizeCount++;
  el.world.setAttribute("data-resizes", String(resizeCount));
  if (flying || travelJob || entryJob || drag.on) return;
  var atHome = Math.hypot(cur.x - keep.x, cur.y - keep.y) < 2 && Math.abs(cur.k - keep.k) < 0.004;
  if (atHome) home();
}
/* 当前舞台尺寸下，「看全整块板」的落点 */
function homeCam() {
  if (!geom) return { x: cur.x, y: cur.y, k: cur.k };
  var b = boardBox();
  var k = clamp(Math.min((stageW - 44) / b.w, (stageH - 44) / b.h), HOME_MIN, HOME_MAX);
  return { k: k, x: stageW / 2 - (b.x + b.w / 2) * k, y: stageH / 2 - (b.y + b.h / 2) * k };
}
if (window.ResizeObserver) new ResizeObserver(onResize).observe(el.stage);
window.addEventListener("resize", onResize);

/* ============================================================
   十三、渲染
   ============================================================ */
function render() {
  map = DATA[state.s];
  geom = layout();
  buildAll();
  applyMainWord();
  applyShell();
  measure();
  el.crumb.textContent = state.from + " / #" + map.no;
  el.crumb.setAttribute("data-breadcrumb", state.from + " / #" + map.no);
  document.body.setAttribute("data-sample", state.s);
  if (state.noanim) {
    var b = boardBox();
    var t = fitRect(b.x, b.y, b.w, b.h);
    cur.x = tgt.x = t.x; cur.y = tgt.y = t.y; cur.k = tgt.k = t.k;
    commitCam();
  } else entryPass();
  document.body.setAttribute("data-ready", "1");
  expose();
}
readURL();
render();
</script>
</body>
</html>
