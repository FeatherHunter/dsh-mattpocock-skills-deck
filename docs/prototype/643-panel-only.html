<title>原型 #643 · 大区域面板（只摆面板本身，左右方向键换形态）</title>
<!--
  PROTOTYPE — 一次性原型，不是生产代码，不要合进主干。
  这是「只看面板本身」的那一份：和 docs/prototype/643-workflow-panel-variants.html 用同一套内容与渲染代码
  （由脚本从那份文件里抽出来），但去掉了原型自己的切换条、状态卡、引导场景与假宿主页，只留下面板本体。

  怎么用：按左右方向键在 5 个形态里换（左下角那行写清当前是第几个、叫什么、地址是什么）；地址栏跟着变，
  所以刷新、或者把地址复制给别人，看到的都是同一档。点面板里的任意一颗技能名，真机上那一下会把
  「/技能名」写进当前会话的输入框。

  这一版里只有定下来的那一套：大区域 + 分组块 + 一行一个＋引导线 + 说明只在悬停（自己画的 100 毫秒气泡）
  + 点完关面板 + 不突出「该点哪个」+ 不要一行总览；摆法只剩三档，外加「编号标记」开与关。
  地址栏参数：?layout=sceneblk|scenesec|flat · ?tag=1
-->
<style>
:root{
  --bg:#0c0e12; --panel:#16181d; --card:#1c1f27; --card2:#20242e;
  --border:#2a2d35; --border2:#3a3f4a; --text:#e6edf3; --muted:#a1a1aa;

  --success:#4ade80; --error:#f87171; --amber:#fbbf24; --blue:#58a6ff;
  --mono:Consolas,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:14px}
.badge{position:fixed;top:8px;left:8px;background:#ff3b30;color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;z-index:100000;letter-spacing:.02em}
.wrap{max-width:1180px;margin:0 auto;padding:44px 18px 340px}
h1{font-size:20px;margin:0 0 6px}
h2{font-size:15px;margin:0 0 10px}
p{margin:6px 0}
.sub{font-size:13px;color:var(--muted)}
.mono{font-family:var(--mono)}
code{font-family:var(--mono);font-size:12.5px;background:var(--card2);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.hero{border:1px solid var(--border);border-radius:14px;background:linear-gradient(180deg,#181d26,#12151c);padding:18px 20px;margin-bottom:14px}
.hero .q{font-size:15px;color:#f3f4f6;background:#141922;border-left:3px solid var(--primary);border-radius:0 8px 8px 0;padding:10px 14px;margin:12px 0 0}
.hero .q b{color:var(--primary)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11.5px;border:1px solid var(--border);border-radius:99px;padding:2px 10px;color:var(--muted)}
.tag.hot{border-color:var(--primary);color:#cdb8ff}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media(max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:14px;margin-bottom:12px}
.card h2{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card .hint{font-size:12px;color:var(--caption);font-weight:400}
/* ---- 假装的宿主界面：一条输入框 + 一条状态栏胶囊 ---- */
.host{border:1px solid var(--border);border-radius:12px;background:#101317;padding:12px 14px 0}
.host .input{background:var(--card);border:1px solid var(--border);border-radius:10px;min-height:64px;padding:10px 12px;font-size:13px;color:var(--caption)}
.host .input .typed{color:var(--text);font-family:var(--mono)}
.host .capsule{margin:10px 0 0;background:var(--card2);border:1px solid var(--border);border-radius:999px 999px 0 0;border-bottom:0;padding:7px 12px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.capsule .seg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.capsule .dot{width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block}
.capsule .grow{flex:1}
.skillbtn{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:6px;cursor:pointer;color:var(--caption);border:1px solid transparent}

/* ---- 悬浮面板本体 ---- */
.spop{position:fixed;z-index:90000;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border2);border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,.5);overflow:hidden}
.spop .head{padding:9px 11px;border-bottom:1px solid var(--border);background:var(--card2);display:flex;align-items:center;gap:8px}
.spop .head .t{font-size:12.5px;font-weight:700}
.spop .head .c{font-size:11px;color:var(--caption);margin-left:auto;white-space:nowrap}
.spop .head .x{cursor:pointer;color:var(--caption);font-size:14px;line-height:1;padding:0 2px}
.spop .scroll{overflow-y:auto;overflow-x:hidden;padding:6px}

.blk{border:1px solid var(--border);border-radius:9px;background:var(--card);margin:6px 0}
.blk.open{border-color:rgba(192,132,252,.4)}
.blk.hovered{border-color:rgba(192,132,252,.55)}
.blk .bh{display:flex;align-items:center;gap:7px;padding:8px 9px;cursor:pointer}
.blk .bh:hover{background:var(--card2)}
.blk .num{font-family:var(--mono);font-size:10.5px;font-weight:700;color:#cdb8ff;background:rgba(192,132,252,.12);border:1px solid rgba(192,132,252,.4);border-radius:5px;padding:1px 6px;flex:none}
.blk .num.gray{color:var(--caption);background:transparent;border-color:var(--border)}
.blk .bn{font-size:12.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .bc{font-size:10.5px;color:var(--caption);flex:none;white-space:nowrap}

.blk .bd{border-top:1px dashed var(--border);padding:7px 9px 8px}

/* ---- 技能行（只有这一种排法：一行一个＋引导线） ---- */
.skl{display:flex;align-items:baseline;gap:7px;padding:4px 7px;border-radius:6px;cursor:pointer;border-left:2px solid transparent;position:relative;padding-left:6px}
.skl:hover{background:rgba(255,255,255,.06);border-left-color:var(--primary)}
.skl .sl{position:relative;width:18px;height:18px;border-radius:50%;border:1px solid #6f7a90;display:flex;align-items:center;justify-content:center;font-size:10px;color:#c9d1e0;background:var(--card);align-self:center;flex:none}
.skl:not(:last-child) .sl::after{content:'';position:absolute;left:50%;top:18px;width:1px;height:9px;background:#6f7a90;transform:translateX(-50%)}
.skl .sn{font-size:12px;color:var(--text);font-family:var(--mono);white-space:nowrap;flex:none}
.skl .inside{font-size:11px;color:#8fb8ff}
.skl.armed{background:rgba(74,222,128,.12);border-left-color:var(--success)}
.skl.armed .sn{color:var(--success)}
/* 每条路的名字后面那枚官网组编号 */
.gtag{font-size:10px;color:var(--caption);border:1px solid var(--border);border-radius:4px;padding:0 4px;margin-left:6px;white-space:nowrap;flex:none}
/* 悬停气泡：自己画的，100 毫秒出内容 */
.protoTip{position:fixed;z-index:99999;max-width:320px;background:#0b0d11;border:1px solid var(--border2);border-radius:8px;box-shadow:0 8px 26px rgba(0,0,0,.55);color:var(--text);font-size:11.5px;line-height:1.5;padding:6px 9px;display:none;pointer-events:none}
.spop .foot{border-top:1px solid var(--border);padding:6px 10px;font-size:10.5px;color:var(--caption);background:var(--card2);display:flex;gap:8px;align-items:center}
.spop .foot .hit{color:var(--success)}
/* ---- 大区域 ---- */
.spop.big{border-radius:12px;border-color:var(--border2)}
.spop.big .head{padding:11px 14px}
.spop.big .head .t{font-size:13.5px}
.spop.big .scroll{padding:8px 10px 12px}
.spop.big.cols2 .scroll{column-count:2;column-gap:12px}
.spop.big.cols3 .scroll{column-count:3;column-gap:12px}
.spop.big .scroll > .blk{break-inside:avoid;-webkit-column-break-inside:avoid}
.spop.big .scroll > .rgroup{break-after:avoid;-webkit-column-break-after:avoid;break-inside:avoid}
/* 处境分段那行标题（摆法「处境 6 块·路成块」用） */
.rgroup{font-size:11.5px;color:#cdb8ff;border-bottom:1px solid var(--border);padding:9px 2px 5px;margin-top:2px}
.rgroup span{color:var(--caption);font-size:10.5px}
/* ---- 右边：状态面板 ---- */
.st{font-size:12.5px}
.strow{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--border)}
.strow:last-child{border-bottom:0}
.strow .k{color:var(--caption);flex:none;width:104px}
.strow .v{color:var(--text);min-width:0;word-break:break-word}
.strow .v b{color:var(--primary)}
.strow .v .ok{color:var(--success)}
.strow .v .warn{color:var(--amber)}
.legend{font-size:11.5px;color:var(--caption);margin-top:8px}
.legend div{margin:3px 0}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{font-size:12px;padding:5px 11px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--border2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#1a1030;font-weight:700}
.btn.small{font-size:11.5px;padding:4px 9px}
/* ---- 引导场景 ---- */
.tabs{display:flex;gap:3px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:10px}
.tabs button{font-size:12px;padding:6px 11px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.active{color:var(--text);border-bottom-color:var(--primary)}
.walk .what{font-size:12.5px;color:var(--muted);background:#141922;border-left:3px solid var(--primary);border-radius:0 8px 8px 0;padding:9px 12px;margin-bottom:10px}
.walk .what b{color:#f3f4f6}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:var(--card)}
.step.done{opacity:.5}
.step.now{border-color:var(--primary)}
.step .idx{font-family:var(--mono);font-size:11px;color:var(--caption);flex:none;padding-top:2px}
.step .body{flex:1;min-width:0}
.step .say{font-size:12.5px}
.step .watch{font-size:11.5px;color:var(--caption)}
.step .acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.walk .reset{font-size:11.5px;color:var(--caption);margin-top:9px}
/* ---- 底部悬浮切换条 ---- */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:95000;background:#0b0d11;border:1px solid var(--border2);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.6);padding:8px 10px;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 20px);flex-wrap:wrap;justify-content:center}
.bar .nav{display:flex;align-items:center;gap:6px}
.bar .arrow{width:26px;height:26px;border-radius:8px;border:1px solid var(--border2);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.bar .arrow:hover{border-color:var(--primary);color:#cdb8ff}
.bar .cur{font-size:12.5px;font-weight:700;min-width:230px;text-align:center;color:#f3f4f6}
.bar .cur small{display:block;font-weight:400;color:var(--caption);font-size:10.5px}
.bar .sep{width:1px;height:24px;background:var(--border)}
.bar .grp{display:flex;gap:5px;align-items:center}
.bar .gl{font-size:10.5px;color:var(--caption);margin-right:1px}
.bar .op{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer}
.bar .op.on{background:var(--primary);border-color:var(--primary);color:#1a1030;font-weight:700}
.bar .kbd{font-size:10.5px;color:var(--caption)}
.bar .kbd kbd{font-family:var(--mono);background:var(--panel);border:1px solid var(--border2);border-radius:4px;padding:0 4px}
.proto-note{position:fixed;right:10px;bottom:10px;z-index:94000;font-size:10.5px;color:var(--caption);background:#0b0d11cc;border:1px solid var(--border);border-radius:8px;padding:4px 8px}
</style>
<style>
  /* 这一页自己没有别的装饰，就把面板摆在正中间 */
  body{background:#0c0e12}
  .only-note{position:fixed;left:10px;bottom:10px;z-index:94000;max-width:900px;font-size:11px;line-height:1.75;color:var(--caption);background:#0b0d11e6;border:1px solid var(--border);border-radius:8px;padding:8px 11px}

</head>

<div class="badge">PROTOTYPE · 只摆面板本身</div>

<script>


/* =========================================================================
   第一部分：内容（真实工作流，取自 research/642-aihero-workflows.md）
   ========================================================================= */

// 技能一句话：给「技能行」用。文字取自报告第 2 节那张表的「大白话」一列。
var SKILL_LINE = {
  'grill-with-docs':'被追问一遍方案，同时把决定记进文档',
  'to-spec':'把聊定的对话变成一份书面规格',
  'to-tickets':'把规格拆成 agent 能一件件做的小工单',
  'implement':'把定稿的规格做成代码，测试先行',
  'code-review':'拿改动对照标准和规格审一遍',
  'tdd':'先写测试再写实现的红绿循环（建造环节里的发动机）',
  'grill-me':'不碰仓库，纯对话把想法问一遍',
  'wayfinder':'把一大块活画成一张决策地图，再逐条敲定',
  'triage':'把外面报进来的活整理成有人能领走的工单',
  'diagnosing-bugs':'从一个能复现的失败开始诊断难修的 bug',
  'improve-codebase-architecture':'扫出值得重构的模块，出一份可视化报告',
  'resolving-merge-conflicts':'一块一块把合并或变基冲突解决掉',
  'handoff':'把这段会话写成一份文件，另起一个会话接着做',
  'prototype':'用一段做完就删的代码回答一个设计问题',
  'research':'读一手资料，交一份带出处的答案',
  'to-questionnaire':'把答不了的问题写成一份让别人填的问卷',
  'teach':'跨很多次会话、一层层往上地学一个主题',
  'wait-what':'让 agent 用大白话把刚才那段重讲一遍',
  'ask-matt':'不知道该用哪个技能时问它',
  'setup-matt-pocock-skills':'把一个仓库配好，后面所有技能才知道它怎么运转',
  'wizard':'生成一个脚本，牵着人一步步做完只有人能做的设置',
  'domain-modeling':'把项目用的词磨准，并写进文档',
  'codebase-design':'设计深模块用的那套词汇',
  'grilling':'别的技能用来把方案问穿的访谈',
  'writing-for-agents':'怎么写技能和别人给 agent 读的文档'
}

// 工作流：一条 = 一块。
// id 是给切换器与引导场景用的短标记；title 是面板上给人看的名字。
// scene 是「这条工作流适合什么场景」，也就是第一轮讨论定的那句组说明。
// steps 是这条路上的技能，按先后顺序排列；branch 里的 b 那几棒是「可以跳过或分岔」的一棒，用括号标出来。
// note 是研究里点名「不写清会教错人」的地方，只在需要时出现。
var FLOWS = [
  { id:'A', title:'主建造链（要跨多个会话）', scene:'有个想法，要一路做到能合并的代码，而且这件事大到值得分成好几个会话来做。', enter:'想法还没想清楚的时候进入；它只能由人手动敲，agent 不会自己拉起它。', end:'code-review 是链尾。评审之后不是回头重跑实现：先提交，再对着你分叉出来的那个点评审，拿到发现用 amend 或补一个 fixup 提交；工单和验收标准由人自己收。', steps:['grill-with-docs','to-spec','to-tickets','implement','code-review'], inside:{'implement':['tdd']} },
  { id:'B', title:'短路径（跳过规格与工单）', scene:'这次改动装得进一个上下文窗口，不值得为它拆规格和工单。', enter:'动手前就能判断出「装得进一个窗口」时才跳这两棒；不是聊完才回头发现。', end:'最后一棒要换一个干净会话再跑 code-review。作者的理由是：同一个上下文审自己写的代码不是评审，是给确认偏误加一条命令。', steps:['grill-with-docs','implement','code-review'], inside:{'implement':['tdd']}, note:'前三棒留在同一个会话里连着跑；只有最后一棒必须换会话。' },
  { id:'C', title:'大工程先划路（wayfinder）', scene:'一大块活，一个会话装不下，而且路还看不清。', enter:'作者把它定位成「情境入口，不是默认前门」；由人手动唤起。', end:'走到「前面再没有要拍板的事」就结束，它自己不写代码；常规收尾是交给 to-spec 把地图收拢成一份规格。', steps:['wayfinder','to-spec','to-tickets','implement','code-review'], note:'地图上的票有四种：research / prototype / grilling / task。研究票与原型票都可以并行跑。' },

// 官网首页的六组：组名与组说明是官网原话的直译，块里的技能照官网归属。

var WEB_GROUPS = [
  { id:'01', title:'入门', blurb:'配置一次，然后自己在整套技能里找到路。', skills:['setup-matt-pocock-skills','ask-matt'] },

  { id:'03', title:'塑形', blurb:'把一个还没定下来的问题探清楚，交出一个决定或者一份答案，再喂进那条主干。', skills:['wayfinder','prototype','research'] },
  { id:'04', title:'维护', blurb:'让代码库与议题列表保持健康，并且给主干攒出活来。', skills:['improve-codebase-architecture','diagnosing-bugs','resolving-merge-conflicts','triage','wizard'] },

// 所以块数比路数多——这正是「块数会长到多少」最容易翻车的地方，如实算给看的人。
var SCENE_GROUPS = [
  { id:'S1', title:'我要把一件事从想法做到能合并', blurb:'你起了个头，要一路做到底；差别只在这次改动装不装得进一个上下文窗口。', flows:['A','B','S'] },
  { id:'S2', title:'这块活太大，一个会话装不下', blurb:'路还看不清，或者一张地图已经摊开了要逐条敲定。', flows:['C','K','J'] },
  { id:'S3', title:'活是外面报进来的', blurb:'别人提的 issue、外部交上来的拉取请求，不是你自己起的事。', flows:['D','F','E'] },
  { id:'S4', title:'东西坏了，或者合并卡住了', blurb:'有一个能复现的失败，或者冲突正卡着你。', flows:['F','V','G'] },
  { id:'S5', title:'答案不在我这个会话里', blurb:'要靠跑一段代码看、要靠翻一手资料、要靠别人回答，或者得换个会话接着做。', flows:['R','H','Q','L','M','N'] },
  { id:'S6', title:'这套技能该怎么用', blurb:'配好仓库、不知道点哪一个、或者要把结论沉淀成文档。', flows:['P','O','I','K'] }

<script>

/* =========================================================================
   第二部分：状态与外显
   ========================================================================= */

// 摆法：一个开关说清「第一层怎么分 + 一块是什么」。
var LAYOUTS = [
  { k:'scenesec', n:'处境 6 块·路小节',  what:'每一块 = 一个处境；处境里一条路一个小节（路名 + 那句场景 + 顺着排下来的技能）' },
  { k:'sceneblk', n:'处境 6 块·路成块',  what:'每一块 = 一条路，按处境分成六段；同一条路只画一块，块上写明它还归在哪几处' },
  { k:'flat',     n:'20 条路平铺',      what:'不分处境，20 条路一块一条、按研究里 A 到 Z 的顺序排下来（认路用）' }
]
function layoutName(k){ for (var i=0;i<LAYOUTS.length;i++) if (LAYOUTS[i].k === k) return LAYOUTS[i].n; return k }
function layoutWhat(k){ for (var i=0;i<LAYOUTS.length;i++) if (LAYOUTS[i].k === k) return LAYOUTS[i].what; return '' }

var S = {
  open:false,
  layout:'sceneblk',    // 摆法：sceneblk 处境 6 块·路成块 / scenesec 处境 6 块·路小节 / flat 20 条路平铺
  tag:false,            // 每条路的名字后面要不要跟一枚官网组编号
  variant:'B',          // 内部用：下面那几个渲染分支读它（由 applyLayout 从 layout 推出来）
  blocks:'g6',          // 内部用，同上
  expanded:{ '01':true, '02':true },
  hoverFlow:null,
  hoverSkill:null,
  lastHit:null,
  injectCount:0,
  typedIn:''
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function flowById(id){ for (var i=0;i<FLOWS.length;i++) if (FLOWS[i].id===id) return FLOWS[i]; return null }

// 把「摆法 + 编号标记」翻译成渲染分支要用的两个内部开关。
function applyLayout(){
  if (S.layout === 'scenesec'){ S.variant = S.tag ? 'C' : 'A'; S.blocks = 'g6' }
  else if (S.layout === 'sceneblk'){ S.variant = S.tag ? 'C' : 'A'; S.blocks = 's22' }
  else { S.variant = 'A'; S.blocks = 'f17' }
}
function groupsFor(){ return SCENE_GROUPS }
// 「一块一条路」的两档（处境 6 块·路成块、20 条路平铺）才是一块 = 一条路；
// 「处境 6 块·路小节」那一档一块 = 一个处境，里面一条路一个小节。
function isFlowMode(){ return (S.layout === 'sceneblk' || S.layout === 'flat') }
function countSkillRowsOf(g){
  var n = 0
  ;(g.flows||[]).forEach(function(fid){ var f = flowById(fid); if (f) n += f.steps.length })
  return n
}
function groupBlurb(g){
  if (S.variant === 'A') return ''
  return g.blurb || ''
}
function alsoInGroups(gs, index, fid){
  if (S.layout !== 'sceneblk') return []
  var out = []
  for (var i=0;i<gs.length;i++){
    if (i === index) continue
    var fl = (gs[i] && gs[i].flows) || []
    if (fl.indexOf(fid) >= 0) out.push(gs[i].title)
  }
  return out
}
// 20 条路按研究里的字母顺序排一遍，给「平铺」那一档用。
function allRouteIds(){
  var seen = {}, out = []
  SCENE_GROUPS.forEach(function(g){
    (g.flows||[]).forEach(function(fid){ if (!seen[fid]) { seen[fid] = 1; out.push(fid) } })
  })
  return out
}
function flatRouteIds(){
  var ids = allRouteIds()
  var order = {}
  FLOWS.forEach(function(f, i){ order[f.id] = i })
  return ids.sort(function(a, b){ return (order[a] || 0) - (order[b] || 0) })
}
// 这条路还挂在哪些别的处境下（只在「路成块」那一档显示）。
function alsoInTitle(fid){
  var out = []
  SCENE_GROUPS.forEach(function(g){ if ((g.flows||[]).indexOf(fid) >= 0) out.push(g.title) })
  return out.join(' / ')
}
// 这条路最主要落在官网哪一组里（看它第一棒属于哪组）——「编号标记」用它当认路标记。
function routeWebGroup(f){
  for (var i=0;i<f.steps.length;i++){
    for (var j=0;j<WEB_GROUPS.length;j++){
      if ((WEB_GROUPS[j].skills||[]).indexOf(f.steps[i]) >= 0) return WEB_GROUPS[j]
    }
  }
  return null
}
function webGroupTag(f){
  if (!S.tag) return ''
  var g = routeWebGroup(f)
  if (!g) return ''
  return '<span class="gtag">' + esc(g.id + ' ' + g.title) + '</span>'
}
// 这个处境下原本挂了几条路，给分段标题上那句「几条」用。
function countGroupRoutes(gs, i){
  var seen = {}, n = 0
  ;((gs[i] && gs[i].flows) || []).forEach(function(fid){ if (!seen[fid]) { seen[fid] = 1; n++ } })
  return n
}

// ---- 悬停气泡：自己画的那种，不是浏览器自带的那层提示（固定 100 毫秒出内容） ----
var TIP_DELAY = 100
var TIP = { el:null, timer:null }
function tipEl(){
  if (!TIP.el){
    TIP.el = document.createElement('div')
    TIP.el.className = 'protoTip'
    document.body.appendChild(TIP.el)
  }
  return TIP.el
}
function hideTip(){
  if (TIP.timer){ clearTimeout(TIP.timer); TIP.timer = null }
  if (TIP.el) TIP.el.style.display = 'none'
}
function showTip(text, anchor){
  var el = tipEl()
  el.textContent = text
  el.style.display = 'block'
  var r = anchor.getBoundingClientRect()
  var w = el.offsetWidth, h = el.offsetHeight
  var left = Math.min(Math.max(8, r.left), Math.max(8, window.innerWidth - w - 8))
  var top = r.bottom + 6
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6)
  el.style.left = left + 'px'
  el.style.top = top + 'px'
}
function hoverTip(anchor, text){
  hideTip()
  TIP.timer = setTimeout(function(){ showTip(text, anchor) }, TIP_DELAY)
}

function syncURL(){
  var u = new URL(location.href)
  u.searchParams.set('layout', S.layout)
  u.searchParams.set('tag', S.tag ? '1' : '0')
  history.replaceState(null,'',u)
}
function readURL(){
  var p = new URLSearchParams(location.search)
  var lay = p.get('layout')
  if (lay === 'scenesec' || lay === 'sceneblk' || lay === 'flat') S.layout = lay
  if (p.get('tag') === '1') S.tag = true
  applyLayout()
  S.expanded = expandDefault(S.variant)
}

function toggle(id){ S.expanded[id] = !S.expanded[id] }
function openPanel(){ S.open = true; S.lastHit = null }
function closePanel(){ S.open = false; S.hoverFlow = null; S.hoverSkill = null; hideTip() }
// 点一颗技能：写进假输入框、记一条回执，然后关掉面板（和真机现状一样）。
function injectSkill(name, flowId){
  S.injectCount++
  S.lastHit = { skill:name, flow:flowId, at:new Date().toLocaleTimeString('zh-CN',{hour12:false}) }
  S.typedIn = '/' + name
  closePanel()
}
function resetState(){
  S.open = false
  S.layout = 'sceneblk'; S.tag = false; applyLayout()
  S.expanded = expandDefault(S.variant)
  S.hoverFlow = null; S.hoverSkill = null; S.lastHit = null
  S.injectCount = 0; S.typedIn = ''
}
function expandDefault(v){
  if (v === 'B') return { '01':true, '02':true }
  return { 'S1':true, 'S2':true, 'S3':true, 'S4':true, 'S5':true, 'S6':true }
}

</script>

function renderHost(){
  var cap = document.getElementById('capsule')
  cap.innerHTML =
    '<span class="seg"><i class="dot"></i>可接 3</span>' +
    '<span class="seg">占用 1</span>' +

    '<span class="seg">环境 8/8</span>' +

    '<span class="skillbtn' + (S.open ? ' on' : '') + '" id="skillBtn" title="技能（原型的开关，真机上这颗图标是紫色的）">' + ICON_SKILLS + ' 技能</span>'

    render()
  }
  document.getElementById('typedHint').textContent = S.typedIn ? (S.typedIn + '（刚注入的，真机上会写进主输入框）') : ''
}

// 大区域：屏幕居中，宽取「1240 与（窗口宽 - 40）里小的那个」，高取「880 与（窗口高 - 56）里小的那个」。
function bigSize(){
  return { w: Math.min(1240, window.innerWidth - 40), h: Math.max(360, Math.min(880, window.innerHeight - 56)) }
}
function bigColumns(){
  var w = bigSize().w
  return w >= 1150 ? 3 : (w >= 780 ? 2 : 1)
}
// 面板只有一个形状：屏幕居中一大块。
function panelStyle(){
  var b = bigSize()
  return 'left:50%;top:24px;transform:translateX(-50%);width:' + b.w + 'px;height:' + b.h + 'px;max-height:none'
}
// 「一眼看全」：量面板里那一截有没有藏起来的东西，直说要不要滚。
function fitReport(){
  var sc = document.getElementById('spopScroll')
  if (!sc) return '面板还没开'
  var over = sc.scrollHeight - sc.clientHeight
  return over <= 1 ? '全看得到，不用滚' : ('还差 ' + Math.round(over) + ' 像素，要滚')
}
// 面板里要画的东西，先算成一张扁平的清单：块列表、标题条上的计数、一屏估算都读它。
function panelItems(){
  var gs = groupsFor()
  var items = []
  if (S.layout === 'flat'){
    return flatRouteIds().map(function(fid){ return { kind:'flow', id:fid, flow:flowById(fid), alias:[], heading:'' } })
  }
  if (isFlowMode()){
    var seen = {}
    for (var i=0;i<gs.length;i++){
      var mine = gs[i].flows || []
      var first = true
      for (var j=0;j<mine.length;j++){
        var fid = mine[j]
        if (seen[fid]) continue
        seen[fid] = 1
        items.push({ kind:'flow', id:fid, flow:flowById(fid), alias:alsoInGroups(gs, i, fid),
                     heading: (first && S.layout === 'sceneblk') ? (gs[i].title + '（' + countGroupRoutes(gs, i) + ' 条）') : '' })
        first = false
      }
    }
    return items
  }
  return gs.map(function(g){ return { kind:'group', id:g.id, group:g } })
}

function renderPanel(){
  var host = document.getElementById('panelHost')
  if (!S.open){ host.innerHTML = ''; return }
  var items = panelItems()
  // 标题条上那个「几行」= 面板里真的画出几行技能
  var rows = 0
  items.forEach(function(it){
    if (it.kind === 'flow') rows += (it.flow ? it.flow.steps.length : 0)
    else rows += countSkillRowsOf(it.group)
  })
  var cls = 'spop big cols' + bigColumns()
  var html = '<div class="' + cls + '" id="spop" style="' + panelStyle() + '">'
  html += '<div class="head"><span class="t">按工作流找技能</span><span class="c">' + items.length + ' 块 · ' + rows + ' 行</span><span class="x" id="panelX">✕</span></div>'
  html += '<div class="scroll" id="spopScroll">'
  items.forEach(function(it){
    if (it.heading) html += '<div class="rgroup">' + esc(it.heading) + '</div>'
    if (it.kind === 'flow') html += renderFlowOnlyBlock(it)
    else html += renderFlowBlock(it.group)
  })
  html += '</div>'
  var foot = '<span class="hit" id="fitVerdict"></span> · 悬停有说明：自己画的气泡，100 毫秒出内容（鼠标停上去）· 点技能：注入后关面板'
  html += '<div class="foot">' + foot + '</div>'
  html += '</div>'
  var scrollBefore = document.getElementById('spopScroll')
  var keepTop = scrollBefore ? scrollBefore.scrollTop : 0
  host.innerHTML = html
  var scrollAfter = document.getElementById('spopScroll')
  if (scrollAfter) scrollAfter.scrollTop = keepTop
  var fitVerdict = document.getElementById('fitVerdict')
  if (fitVerdict) fitVerdict.textContent = '一眼看全：' + fitReport()

  var x = document.getElementById('panelX')
  if (x) x.onclick = function(e){ e.stopPropagation(); closePanel(); render() }
  Array.prototype.forEach.call(host.querySelectorAll('.blk .bh'), function(el){
    el.onclick = function(e){
      e.stopPropagation()
      var bid = el.parentNode.getAttribute('data-bid')
      if (isFlowMode()) S.expanded[bid] = !(S.expanded[bid] !== false)
      else toggle(bid)
      render()
    }
  })
  // 悬停只在现有这棵 DOM 上换样式，不整块重画：一重画，鼠标底下那块就换成新节点，滚动位置也会被冲掉。
  function setHoverBlock(id){
    S.hoverFlow = id
    Array.prototype.forEach.call(host.querySelectorAll('.blk'), function(el){
      if (el.getAttribute('data-bid') === id) el.classList.add('hovered'); else el.classList.remove('hovered')
    })
    renderState()
  }
  function setHoverSkill(name){
    S.hoverSkill = name
    Array.prototype.forEach.call(host.querySelectorAll('.skl'), function(el){
      if (name && el.getAttribute('data-sname') === name) el.classList.add('armed'); else el.classList.remove('armed')
    })
    renderState()
  }
  Array.prototype.forEach.call(host.querySelectorAll('.blk'), function(el){
    el.onmouseenter = function(){ setHoverBlock(el.getAttribute('data-bid')) }
  })
  Array.prototype.forEach.call(host.querySelectorAll('.skl'), function(el){
    el.onmouseenter = function(){ setHoverSkill(el.getAttribute('data-sname')); hoverTip(el, el.getAttribute('data-tip') || '') }
    el.onmouseleave = function(){ setHoverSkill(null); hideTip() }
    el.onclick = function(e){
      e.stopPropagation()
      hideTip()
      injectSkill(el.getAttribute('data-sname'), el.getAttribute('data-fid'))
      render()
    }
  })
  var scroller = document.getElementById('spopScroll')
  if (scroller) scroller.addEventListener('scroll', hideTip)
}

// 这一棒里还内嵌着别的技能时（比如 implement 里跑 tdd），名字后面标一个括号清单。
function stepInside(fid, name){
  var f = flowById(fid)
  if (!f || !f.inside || !f.inside[name]) return ''
  return '<span class="inside">（内含 /' + f.inside[name].join(' / ') + '）</span>'
}

// 技能行：只有「一行一个＋引导线」这一种排法（序号是串在竖线上的圆点）。
function skillRow(name, fid, lead){
  var on = (S.hoverSkill === name)
  var key = fid || ''
  return '<div class="skl' + (on ? ' armed' : '') + '" data-sname="' + esc(name) + '" data-fid="' + esc(key) + '" data-tip="' + esc(SKILL_LINE[name]||'') + '">' +
    '<span class="sl">' + lead + '</span>' +
    '<span class="sn">/' + esc(name) + '</span>' +
    stepInside(fid, name) +
  '</div>'
}

// 形态二之一：一块就是一条路（摆法「处境 6 块·路成块」与「20 条路平铺」）
function renderFlowOnlyBlock(it){
  var f = it.flow
  if (!f) return ''
  var openFlag = (S.expanded[f.id] !== false)
  var h = '<div class="blk' + (openFlag ? ' open' : '') + '" data-bid="' + esc(f.id) + '" data-fid="' + esc(f.id) + '">'
  h += '<div class="bh"><span class="arrow">▼</span><span class="num gray">' + esc(f.id) + '</span>' +
       '<span class="bn">' + esc(f.title) + '</span>' + webGroupTag(f) + '<span class="bc">' + f.steps.length + ' 棒</span></div>'
  if (!openFlag) return h + '</div>'
  h += '<div class="bd">'
  h += '<div class="bs">' + esc(f.scene) + '</div>'
  if (it.alias && it.alias.length) h += '<div class="note">这条路也归在「' + esc(it.alias.join('」「')) + '」下，面板里只画一次。</div>'
  f.steps.forEach(function(n, i){ h += skillRow(n, f.id, (i+1)) })
  var meta = []
  if (f.enter) meta.push('<b>什么时候进</b>：' + esc(f.enter))
  if (f.end) meta.push('<b>走到哪算结束</b>：' + esc(f.end))
  if (meta.length) h += '<div class="bs" style="padding-top:7px;border-top:1px dashed var(--border);margin-top:6px">' + meta.join('<br>') + '</div>'
  if (f.note) h += '<div class="note">' + esc(f.note) + '</div>'
  h += '</div>'
  return h + '</div>'
}

// 形态二之二：一块是一个处境，里面一条路一个小节（摆法「处境 6 块·路小节」）
function renderFlowBlock(g){
  var openFlag = !!S.expanded[g.id]
  var h = '<div class="blk' + (openFlag ? ' open' : '') + '" data-bid="' + g.id + '">'
  h += '<div class="bh"><span class="arrow">▼</span>' +
       '<span class="num gray">' + esc(g.id) + '</span>' +
       '<span class="bn">' + esc(g.title) + '</span>' +
       '<span class="bc">' + ((g.flows || []).length) + ' 条路</span></div>'
  if (openFlag && groupBlurb(g)) h += '<div class="bs">' + esc(groupBlurb(g)) + '</div>'
  if (openFlag){
    h += '<div class="bd">'
    ;(g.flows || []).forEach(function(fid){
      var f = flowById(fid); if (!f) return
      h += '<div style="margin-bottom:8px">'
      h += '<div class="bs" style="padding:4px 2px 2px"><b style="font-size:12px;color:#e6edf3">' + esc(f.title) + '</b>' + webGroupTag(f)
      h += '<br>' + esc(f.scene)
      h += '</div>'
      f.steps.forEach(function(n, i){ h += skillRow(n, f.id, (i+1)) })
      h += '</div>'
    })
    h += '</div>'
  }
  return h + '</div>'
}

function renderState(){
  var items = panelItems()
  var fits = computeFits()
  var flowItems = items.filter(function(it){ return it.kind === 'flow' }).length
  var blockLine = '共 ' + items.length + ' 块'
  if (flowItems) blockLine += '（其中 ' + flowItems + ' 条路）'
  var rows = []
  rows.push(['摆法', '<b>' + esc(layoutName(S.layout)) + '</b> — ' + esc(layoutWhat(S.layout))])
  rows.push(['面板', '大区域·屏幕居中，' + bigSize().w + ' × ' + bigSize().h + ' 像素；铺法固定分组块（分 ' + bigColumns() + ' 栏）'])
  rows.push(['一眼看全', esc(fitReport())])
  rows.push(['这一档摆出来', esc(blockLine)])
  if (S.layout !== 'web') rows.push(['编号标记', S.tag ? '每条路的名字后面跟一枚官网组编号（例如「02 主干」）' : '不跟编号'])
  rows.push(['面板开没开', S.open ? '<span class="ok">开着</span>' : '关着'])
  rows.push(['哪几块展开', esc(Object.keys(S.expanded).filter(function(k){ return S.expanded[k] }).join('、') || '一个都没展开')])
  rows.push(['技能排版', '一行一个＋引导线（已定，没有开关）'])
  rows.push(['技能行说明', '只在悬停里，自己画的气泡，100 毫秒出内容（已定，没有开关）'])
  rows.push(['点完技能', '注入后关面板（已定，没有开关）'])
  rows.push(['鼠标停在哪', S.hoverSkill ? ('技能 /' + esc(S.hoverSkill)) : (S.hoverFlow ? ('块 ' + esc(S.hoverFlow)) : '没停')])
  rows.push(['已注入', S.injectCount + ' 次' + (S.lastHit ? ' · 最近一次 /' + esc(S.lastHit.skill) + '（' + esc(S.lastHit.at) + '）' : '')])
  rows.push(['估算', S.open ? ('一屏能完整露出 <b>' + fits + '</b> 块（量的）') : ('面板还没开；按高度估，打开后大约能露出 <b>' + fits + '</b> 块')])
  var html = '<div class="st">'
  rows.forEach(function(r){ html += '<div class="strow"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>' })
  html += '</div>'
  document.getElementById('state').innerHTML = html
}
function computeFits(){
  var sc = document.getElementById('spopScroll')
  if (sc){
    var box = sc.getBoundingClientRect()
    var blocks = sc.querySelectorAll('.blk')
    var n = 0
    for (var i=0;i<blocks.length;i++){
      var r = blocks[i].getBoundingClientRect()
      if (r.top > box.bottom + 0.5) break
      if (r.top >= box.top - 0.5 && r.bottom <= box.bottom + 0.5) n++
    }
    return n
  }
  var limit = bigSize().h
  var items = panelItems()
  var used = 40, fits = 0
  for (var k=0;k<items.length;k++){
    var bh = 30 + (items[k].kind === 'flow' && items[k].flow ? items[k].flow.steps.length * 32 + 90 : 120)
    if (used + bh > limit) break
    used += bh; fits++
  }
  return fits
}

function renderBar(){
  var bar = document.getElementById('bar')
  var keys = LAYOUTS.map(function(l){ return l.k })
  var html = '<div class="nav"><button class="arrow" id="prev">‹</button>' +
    '<div class="cur">' + esc(layoutName(S.layout)) + '<small>← → 切换摆法 · URL 里是 ?layout=' + S.layout + '</small></div>' +
    '<button class="arrow" id="next">›</button></div><div class="sep"></div>'
  function grp(label, items, cur, kind){
    var s = '<div class="grp"><span class="gl">' + label + '</span>'
    items.forEach(function(it){
      s += '<button class="op' + (it.k === cur ? ' on' : '') + '" data-kind="' + kind + '" data-k="' + it.k + '" title="' + esc(it.tip || '') + '">' + esc(it.n) + '</button>'
    })
    return s + '</div>'
  }
  var groups = []
  groups.push(grp('摆法', LAYOUTS.map(function(l){ return { k:l.k, n:l.n, tip:l.what } }), S.layout, 'layout'))
  groups.push(grp('编号标记', [{k:'1',n:'跟编号'},{k:'0',n:'不跟'}], S.tag ? '1' : '0', 'tag'))
  html += groups.join('<div class="sep"></div>')
  html += '<div class="sep"></div><span class="kbd"><kbd>Esc</kbd> 关面板</span>'
  bar.innerHTML = html
  document.getElementById('prev').onclick = function(){ cycleVariant(-1) }
  document.getElementById('next').onclick = function(){ cycleVariant(1) }
  Array.prototype.forEach.call(bar.querySelectorAll('.op'), function(b){
    b.onclick = function(){ setOption(b.getAttribute('data-kind'), b.getAttribute('data-k')) }
  })
}

function setOption(kind, k){
  if (kind==='layout'){ S.layout = k; applyLayout(); S.expanded = expandDefault(S.variant) }
  if (kind==='tag'){ S.tag = (k==='1'); applyLayout() }
  render()
}
function cycleVariant(d){
  var keys = LAYOUTS.map(function(l){ return l.k })
  var i = keys.indexOf(S.layout)
  S.layout = keys[(i + d + keys.length) % keys.length]
  applyLayout()
  S.expanded = expandDefault(S.variant)
  render()
}
function render(){ hideTip(); renderHost(); renderPanel(); renderState(); renderBar(); if (window.renderWalk) window.renderWalk(); syncURL() }

</script>

<script>
/* 这一页只留面板：原型页里那几件边角料（假宿主页、状态卡、底部切换条、引导场景）全部换成空函数。 */
renderHost = function(){}
renderState = function(){}
renderBar = function(){}
syncURL = function(){}

// 还在选的两件事合起来正好五个形状：三种摆法 × 编号标记开/关（默认那一档与 4 号重复，不重列）。
var TOUR = [
  { n:'摆法：处境 6 块·路成块（默认，不跟编号）', q:'' },
  { n:'摆法：处境 6 块·路小节（不跟编号）', q:'layout=scenesec' },
  { n:'摆法：20 条路平铺（不跟编号）', q:'layout=flat' },
  { n:'摆法：处境 6 块·路成块 ＋ 编号标记', q:'layout=sceneblk&tag=1' },
  { n:'摆法：20 条路平铺 ＋ 编号标记', q:'layout=flat&tag=1' }
]
var tourIndex = 0

function applyParams(qs){
  var q = new URLSearchParams(qs)
  var want = q.get('layout')
  S.layout = (want === 'scenesec' || want === 'sceneblk' || want === 'flat') ? want : 'sceneblk'
  S.tag = q.get('tag') === '1'
  S.open = true
  applyLayout()
  S.expanded = expandDefault(S.variant)
  S.hoverFlow = null; S.hoverSkill = null
  hideTip()
}
function tourPath(it){
  var path = location.href.split('?')[0].split('#')[0]
  return path + (it.q ? '?' + it.q : '')
}
function showStep(i){
  tourIndex = (i + TOUR.length) % TOUR.length
  var it = TOUR[tourIndex]
  applyParams(it.q)
  render()
  history.replaceState(null, '', tourPath(it))
  document.getElementById('tourLabel').textContent = '第 ' + (tourIndex + 1) + ' / ' + TOUR.length + ' 个 —— ' + it.n
  document.getElementById('tourUrl').textContent = location.href
}
function findStartStep(){
  var mine = new URLSearchParams(location.search).toString()
  for (var i=0;i<TOUR.length;i++){
    if (new URLSearchParams(TOUR[i].q).toString() === mine) return i
  }
  return -1
}
document.addEventListener('keydown', function(e){
  var t = (e.target && e.target.tagName) || ''
  if (t === 'INPUT' || t === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return
  if (e.key === 'ArrowRight'){ showStep(tourIndex + 1); return }
  if (e.key === 'ArrowLeft'){ showStep(tourIndex - 1); return }
})
var __inject = injectSkill
injectSkill = function(name, fid){
  __inject(name, fid)
  var r = document.getElementById('receipt')
  if (r) r.innerHTML = '刚注入：<span class="hit">/' + name + '</span>（累计 ' + S.injectCount + ' 次）——真机上这一下会把「/' + name + '」写进当前会话的输入框，面板按设定关掉。'
}
S.open = true
var start = findStartStep()
if (start >= 0) showStep(start)
else { applyParams(location.search); render(); document.getElementById('tourLabel').textContent = '自定义这一档（按 → 从第一个开始走）'; document.getElementById('tourUrl').textContent = location.href }
</script>
</body>
