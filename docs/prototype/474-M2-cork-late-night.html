<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地图详情 · 深夜软木板（M2）</title>
<style>
/* ==========================================================================
   M2 · 深夜软木板 —— 暖 · 图钉 · 一个人的房间
   场景：房间是暗的，墙上挂一块软木板，桌上有一盏台灯、一杯咖啡、一本便签、一支笔。
   灯的光圈跟着鼠标走（有阻尼，灯罩有重量）；光没照到的地方沉在暗里 —— 雾就是暗。
   例外只有一处，也是 #474 第一条理念：目的地那张永远最亮，跟灯在哪无关。
   ========================================================================== */
:root{
  --room:#04050a; --room2:#0a0c12;
  --cork1:#b08a58; --cork2:#9d7a4e; --cork3:#87683f;
  --kraft:#c8a97a; --paper:#f4edda; --paper2:#e9dec5; --paper3:#f7f3ea;
  --ink:#2b2b2b; --ink2:#4a453c;
  --thread:#c0392b; --thread2:#8e2b20; --ochre:#b8862b;
  --stamp:#a01e1e; --warm:#ffd9a0;
  --wood1:#54402c; --wood2:#382a1c; --wood3:#22190f;
  --brass1:#e0bd75; --brass2:#a3803a; --brass3:#6b5222;
  --ok:#4ade80; --lit:#58a6ff; --map:#c084fc; --warn:#f59e0b;
  --lx:50vw; --ly:50vh; --deskx:50vw;
  --panelw:810px;
  --cwh:126px;
  --cw:196px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--room);
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:#e6edf3;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px dashed #ffd9a0;outline-offset:2px}

/* ---------- 面板骨架 ---------- */
#panel{position:relative;width:min(100%,var(--panelw));height:100%;margin:0 auto;
  display:flex;flex-direction:column;background:var(--room);overflow:hidden}
body.withbar #panel{height:calc(100% - 34px)}
#svgdefs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- 顶部：板子的上沿木框（常驻操作行 + 抬头） ---------- */
#topstem{position:relative;z-index:70;flex:none;
  background:
    repeating-linear-gradient(91deg,rgba(0,0,0,.16) 0 1px,rgba(255,255,255,.035) 1px 4px),
    linear-gradient(180deg,#5b4630,#3d2d1d 62%,#2a1e12);
  border-bottom:3px solid #1a1209;
  box-shadow:0 3px 10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,220,170,.16);
  padding:6px 8px 7px}
#topbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.brass{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:3px;
  font-size:11.5px;line-height:16px;color:#2a1f08;font-weight:600;
  background:linear-gradient(180deg,var(--brass1),var(--brass2) 62%,#8a6a2e);
  border:1px solid #5d4718;
  box-shadow:inset 0 1px 0 rgba(255,246,220,.75),inset 0 -1px 0 rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.5);
  text-shadow:0 1px 0 rgba(255,240,200,.45);white-space:nowrap}
.brass:hover{background:linear-gradient(180deg,#efd18f,var(--brass1) 62%,#9a7735)}
.brass:active{transform:translateY(1px)}
.brass.prim{color:#04120a;background:linear-gradient(180deg,#8bf0ae,var(--ok) 60%,#2fa85e);
  border-color:#1d5c33;text-shadow:0 1px 0 rgba(255,255,255,.35);font-weight:700}
.brass.prim.amber{color:#2b1a02;background:linear-gradient(180deg,#facc7a,var(--warn) 60%,#b5760a);border-color:#6d4a06}
.crumb{font:11px/16px Consolas,Menlo,monospace;color:#d8c19a;padding:2px 6px;border-radius:3px;
  background:rgba(0,0,0,.32);border:1px solid rgba(255,220,170,.16);white-space:nowrap}
.tagmap{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;line-height:16px;padding:1px 7px;border-radius:3px;
  color:#e6d3ff;background:linear-gradient(180deg,#6b3fae,#4b2b7d);border:1px solid #2e1a4d;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.5)}
#headline{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
#h604{font:700 12px/16px Consolas,Menlo,monospace;color:var(--map);border:1px solid var(--map);
  border-radius:3px;padding:1px 5px;background:rgba(192,132,252,.10);flex:none}
#htitle{font-size:12px;line-height:17px;color:#f0e6d6;text-shadow:0 1px 1px rgba(0,0,0,.7);min-width:0}
#hcount{font-size:10.5px;line-height:16px;color:#c0ad8e;white-space:nowrap}
.screw{width:7px;height:7px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#f0d9a6,#8a6a2e 60%,#4d3a12);
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.5),0 1px 1px rgba(0,0,0,.6)}

/* ---------- 中间：软木板（会滚动的板面），板子以外是房间的墙，暗着 ---------- */
#scroller{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  background:linear-gradient(180deg,#0a0b14,#05060b 55%,#07070c);
  scrollbar-width:thin;scrollbar-color:#4b3a26 #0b0d13}
#scroller::-webkit-scrollbar{width:9px}
#scroller::-webkit-scrollbar-thumb{background:#4b3a26;border-radius:5px}
#scroller::-webkit-scrollbar-track{background:#0b0d13}
#board{position:relative;width:auto;height:1400px;margin:0 9px 30px;padding:0;
  background:
    radial-gradient(120% 46% at 22% 6%,rgba(255,226,180,.10),transparent 62%),
    radial-gradient(84% 46% at 84% 88%,rgba(0,0,0,.34),transparent 72%),
    radial-gradient(46% 20% at 62% 34%,rgba(120,84,48,.34),transparent 70%),
    radial-gradient(34% 16% at 24% 66%,rgba(0,0,0,.22),transparent 70%),
    linear-gradient(180deg,var(--cork1),var(--cork2) 38%,var(--cork3))}
#grain{position:absolute;inset:0;filter:url(#coarse);mix-blend-mode:soft-light;opacity:.72;pointer-events:none}
#grain2{position:absolute;inset:0;filter:url(#fine);mix-blend-mode:multiply;opacity:.34;pointer-events:none}
#stain{position:absolute;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle,rgba(60,32,12,.30) 0 54%,rgba(60,32,12,.16) 72%,transparent 78%)}
.frame{position:absolute;top:0;bottom:0;width:13px;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(88deg,rgba(0,0,0,.2) 0 1px,rgba(255,235,200,.05) 1px 3px),
    linear-gradient(90deg,#4a3624,#31251a)}
.f-l{left:0;box-shadow:inset -2px 0 4px rgba(0,0,0,.7)}
.f-r{right:0;box-shadow:inset 2px 0 4px rgba(0,0,0,.7)}

/* 红线网：画在资料底下（z-index 0，和资料同一层但树序在前），所以线“从纸背后穿过去”，
   不会在纸面上横穿 —— 这是第 8 节「线不许穿过资料卡片」那条。 */
#threads{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:0;
  overflow:hidden;filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}
.th{fill:none;stroke:var(--thread);stroke-width:1.5;stroke-linecap:round;opacity:.62}
.th.fog{stroke:var(--thread2);stroke-dasharray:5 5;opacity:.42}
.th.lit{stroke:#e0503c;stroke-width:2.1;opacity:.95}
.th.blk{stroke:var(--ochre);stroke-width:1.3;opacity:.5;stroke-dasharray:7 5}
.th.blk.done{stroke-dasharray:none;opacity:.34}
.th.hot{stroke:#ff6a4d;stroke-width:2.4;opacity:1}
/* 注意：#field / #overlayer 都不能有自己的 z-index —— 一有就自成层，目的地那张会被压到暗层下面去。
   四状态都画在暗层下面（该暗就暗），只有目的地、记账便签、抬起来看的那张，和目的地那圈光画在暗层上面。
   #overlayer 只管把光晕裁在板子范围内（overflow:hidden 不生成层，压不住目的地）。 */
#field{position:absolute;inset:0}
#overlayer{position:absolute;inset:0;overflow:hidden;pointer-events:none}

/* ---------- 资料（票） ---------- */
.tick{position:absolute;left:0;top:0;width:var(--cw);height:var(--cwh);cursor:grab;
  transform-origin:50% 6%;will-change:transform;touch-action:none}
.tick .sheet{position:relative;width:100%;height:100%;padding:9px 9px 7px;overflow:hidden;
  background:linear-gradient(180deg,#f8f2e2,#eadfc6);
  border:1px solid rgba(70,52,28,.42);border-radius:2px;
  box-shadow:0 3px 7px rgba(0,0,0,.5),0 10px 18px rgba(0,0,0,.3),inset 0 1px 0 #fffdf6;
  display:flex;flex-direction:column;gap:3px}
.tick.p2 .sheet{background:linear-gradient(180deg,#fbfaf5,#eef0ec)}
.tick.p3 .sheet{background:linear-gradient(180deg,#f6ecd2,#e6d8b4)}
.tick:hover{z-index:30}
.tick:hover .sheet{box-shadow:0 6px 12px rgba(0,0,0,.6),0 16px 28px rgba(0,0,0,.36),inset 0 1px 0 #fffdf6}
.tick.dragging{cursor:grabbing}
.tick.dragging .sheet{box-shadow:0 14px 22px rgba(0,0,0,.66),0 28px 48px rgba(0,0,0,.4)}
/* 抬起来看的那张：越过“暗”，自己带光 */
.tick.lifted .sheet{box-shadow:0 12px 26px rgba(0,0,0,.7),0 0 0 1px rgba(255,214,150,.5),0 0 46px 8px rgba(255,190,120,.24)}
.tick .pin{position:absolute;left:50%;top:-6px;width:17px;height:17px;margin-left:-8.5px;border-radius:50%;
  box-shadow:0 3px 4px rgba(0,0,0,.55),inset 0 -2px 2px rgba(0,0,0,.35),inset 0 2px 2px rgba(255,255,255,.5);
  background:radial-gradient(circle at 34% 28%,#fff8,transparent 46%),radial-gradient(circle at 40% 34%,#d88,#7c1f14)}
.pin.t-research{background:radial-gradient(circle at 34% 28%,#fff8,transparent 46%),radial-gradient(circle at 40% 34%,#d9534f,#8c2018)}
.pin.t-grilling{background:radial-gradient(circle at 34% 28%,#fff8,transparent 46%),radial-gradient(circle at 40% 34%,#6aa8dd,#1f4f80)}
.pin.t-prototype{background:radial-gradient(circle at 34% 28%,#fff8,transparent 46%),radial-gradient(circle at 40% 34%,#f0cc63,#9a6f11)}
.pin.t-task{background:radial-gradient(circle at 34% 28%,#fff,transparent 46%),radial-gradient(circle at 40% 34%,#f3f5f8,#8d949e)}
.pin.t-fix{background:radial-gradient(circle at 34% 28%,#fff8,transparent 46%),radial-gradient(circle at 40% 34%,#7fd08f,#2b6b3c)}
.pin.t-map{background:radial-gradient(circle at 34% 28%,#fff8,transparent 46%),radial-gradient(circle at 40% 34%,#c9a2f7,#6b34b8)}
.tick .no{font:700 11px/15px Consolas,Menlo,monospace;color:#3b342a}
.tick .tipe{font-size:9.5px;line-height:14px;padding:0 5px;border-radius:8px;border:1px solid;white-space:nowrap}
.tick .hd{display:flex;align-items:center;gap:5px}
.tick .tt{font-size:12.5px;line-height:15px;color:#241f18;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:15px}
.tick .sub{font-size:10.5px;line-height:13px;color:#59503f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick .sub .ok{color:#2f7d45;font-weight:600}
.tick .sub .bl{color:#a5641a;font-weight:600}
.tick .sub .ow{color:#2f6699;font-weight:600}
.tick .bar{height:3px;border-radius:2px;background:rgba(60,48,30,.18);overflow:hidden}
.tick .bar i{display:block;height:100%;background:#b9a07a}
.tick .bar i.done{background:linear-gradient(90deg,#4fae6c,#2f7d45)}
.tick .acts{display:flex;align-items:center;gap:4px;margin-top:auto;min-height:19px}
.mini{font-size:10px;line-height:15px;padding:1px 6px;border-radius:3px;border:1px solid #7a6a4c;
  background:linear-gradient(180deg,#fffdf6,#e8dcc0);color:#332c20;font-weight:600}
.mini:hover{background:#fffdf6}
.mini.ghost{background:rgba(255,255,255,.4)}
.mini.sk{color:#fff;border-color:transparent}
.tick .link{font-size:11px;line-height:15px;padding:1px 4px;border-radius:3px;border:1px solid #7a6a4c;
  background:rgba(255,255,255,.4);color:#332c20;text-decoration:none;display:inline-flex}

/* 四状态：形状 / 印章 / 旗子 / 铅笔问号 —— 都不只靠颜色 */.stamp{position:absolute;right:5px;bottom:26px;transform:rotate(-13deg);
  font:700 13px/17px "Microsoft YaHei",sans-serif;letter-spacing:2px;color:var(--stamp);
  border:2px solid var(--stamp);border-radius:3px;padding:0 4px;opacity:.62;
  mix-blend-mode:multiply;pointer-events:none}
.tick.s-closed .sheet{background:linear-gradient(180deg,#eee7d6,#ded3b8)}
.tick .dogear{position:absolute;right:0;bottom:0;width:0;height:0;border-style:solid;
  border-width:0 0 17px 17px;border-color:transparent transparent rgba(120,100,70,.5) transparent;pointer-events:none}
.flag{position:absolute;left:5px;bottom:24px;transform:rotate(-2deg);font-size:9.5px;line-height:15px;
  padding:0 6px 0 10px;color:#0e2d19;font-weight:700;background:linear-gradient(90deg,#8ff0ae,#4cc474);
  clip-path:polygon(7px 0,100% 0,100% 100%,7px 100%,0 50%);pointer-events:none;
  box-shadow:0 1px 2px rgba(0,0,0,.4)}
.qmark{position:absolute;right:6px;bottom:27px;font:700 15px/15px Georgia,serif;color:#6b6152;
  transform:rotate(-8deg);opacity:.75;pointer-events:none}
.tick.s-fog .qmark{pointer-events:none}
.tick .litbar{position:absolute;left:0;top:34px;height:15px;width:78%;
  background:linear-gradient(90deg,rgba(255,214,80,0),rgba(255,214,80,.5) 14%,rgba(255,214,80,.5) 86%,rgba(255,214,80,0));
  mix-blend-mode:multiply;pointer-events:none}
.tick.s-lit .sheet{box-shadow:0 8px 16px rgba(0,0,0,.6),0 20px 34px rgba(0,0,0,.36),inset 0 1px 0 #fffdf6}
.tick.s-lit{z-index:20}
/* 拿下来看的那张必须压在暗层上面 —— 写在状态规则后面，免得被 s-lit 的 z-index 盖掉 */
.tick.lifted{z-index:48}
.tick.dragging{z-index:49}

/* ---------- 目的地：整页中心，永远最亮 ---------- */
#destglow{position:absolute;z-index:45;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle,rgba(255,206,140,.22) 0 22%,rgba(255,192,124,.09) 42%,rgba(255,184,116,.03) 62%,transparent 76%)}
#dest{position:absolute;z-index:46;transform-origin:50% 4%}
#dest .plate{position:relative;padding:13px 15px 11px;border-radius:2px;
  background:linear-gradient(168deg,#fffefa,#fdf7e8 46%,#f8efe0);
  border:1px solid rgba(90,70,40,.45);
  box-shadow:0 14px 30px rgba(0,0,0,.72),0 34px 60px rgba(0,0,0,.42),
    inset 0 1px 0 #fff,0 0 0 1px rgba(255,244,214,.6),
    0 0 70px 14px rgba(255,204,136,.20),0 0 140px 40px rgba(255,190,120,.10)}
#dest .head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#dest .goalchip{display:inline-flex;align-items:center;gap:4px;font-size:10px;line-height:16px;padding:1px 7px;
  border-radius:2px;color:#3d1d63;font-weight:700;background:linear-gradient(180deg,#e4d0ff,#c9a2f7);
  border:1px solid #5c3391}
#dest .d604{font:700 11px/16px Consolas,Menlo,monospace;color:#5c3391;border:1px solid #a97fd8;padding:0 5px;border-radius:2px}
#dest .cap{font-size:10px;line-height:15px;letter-spacing:.5px;color:#7c6a4a;text-transform:uppercase}
#dest .body{font-size:12px;line-height:18px;color:#2a2419;margin-top:5px;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));padding:2px 0}
#dest .body b{color:#1d1913}
#dest .pin{width:19px;height:19px}
#dest .pins{position:absolute;inset:-6px;pointer-events:none}
#dest .pins .pin{position:absolute;top:auto;left:auto;margin:0}
/* 板子下沿/中间那张算出来的账 —— 诚实的进度，不用层数 */
#ledger{position:absolute;z-index:47;transform-origin:50% 6%}
#ledger .slip{background:linear-gradient(180deg,#f7f0dd,#e6dabb);border:1px solid rgba(90,70,40,.4);
  border-radius:2px;padding:6px 9px;box-shadow:0 6px 12px rgba(0,0,0,.55);
  font-size:11px;line-height:16px;color:#3a3226}
#ledger .slip b{color:#241f18}
#ledger .slip .n{font:700 12px/16px Consolas,Menlo,monospace;color:#241f18}
#ledger .slip .w m{color:#2f7d45;font-weight:700}
#ledger .slip .w f{color:#a5641a;font-weight:700}
#ledger .slip .w r{color:#2f6699;font-weight:700}
#ledger .slip .w u{color:#6b6152;font-weight:700}

/* 空板：一张证据都还没有 */
#vacant{position:absolute;z-index:4;border:2px dashed rgba(255,240,210,.42);border-radius:3px;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;
  font-size:11.5px;line-height:17px;color:#f6e9cf;background:rgba(255,238,205,.05)}
#vacant .hole{position:absolute;left:50%;top:-5px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;
  background:radial-gradient(circle at 40% 34%,#2b2117,#0d0906);box-shadow:0 0 0 1px rgba(255,235,200,.2)}

/* ---------- 房里的暗：物理上成立的雾（一层带洞的黑，洞跟着灯） ----------
   洞的外面还留一点点环境光：没照到的地方仍然看得见“那里有东西”，只是读不出字。
   指针事件全交给板子（pointer-events:none），所以暗处的东西照样点得到。 */
#fog{position:fixed;left:50%;top:50%;width:2500px;height:2500px;margin:-1250px 0 0 -1250px;
  z-index:40;pointer-events:none;will-change:transform;
  background:radial-gradient(circle 360px at 50% 50%,rgba(6,7,14,0) 0 48%,rgba(6,7,14,.30) 66%,rgba(6,7,14,.63) 85%,rgba(6,7,14,.78) 100%);
  transform:translate3d(calc(var(--lx) - var(--vcx)),calc(var(--ly) - var(--vcy)),0)}
#glow{position:fixed;left:50%;top:50%;width:1900px;height:1900px;margin:-950px 0 0 -950px;
  z-index:42;pointer-events:none;will-change:transform;mix-blend-mode:screen;
  background:radial-gradient(circle 470px at 50% 50%,rgba(255,205,138,.34) 0 24%,rgba(255,190,120,.16) 52%,rgba(255,176,106,.06) 74%,transparent 88%);
  transform:translate3d(calc(var(--lx) - var(--vcx)),calc(var(--ly) - var(--vcy)),0)}

/* ---------- 台灯（房间里那个把光打到板上的东西） ----------
   灯在离镜头很近的地方：灯罩看得清，灯杆是一条暗的剪影，稍微虚一点。 */
#arm{position:fixed;inset:0;width:100%;height:100%;z-index:43;pointer-events:none}
#arm path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#arm .sh{stroke:rgba(0,0,0,.5);stroke-width:7}
#arm .bd{stroke:#120d07;stroke-width:4.4;opacity:.8}
#arm .bs{stroke:rgba(180,148,90,.34);stroke-width:1.2}
#lamp{position:fixed;left:0;top:0;z-index:52;width:88px;height:76px;transform-origin:44px 5px;
  will-change:transform;cursor:grab;touch-action:none;pointer-events:none}
/* 灯只有「画出来的那部分」吃指针：空白的方框不吃，所以它挡不住板子上的东西 */
#lamp svg path{pointer-events:auto}
#lamp .neckdot{pointer-events:auto}
#lampTag{pointer-events:auto}
#lamp.grabbing{cursor:grabbing}
#lamp .neckdot{position:absolute;left:38px;top:1px;width:11px;height:11px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#f4e2b6,#8a6a2e 62%,#3d2d12);box-shadow:0 1px 2px rgba(0,0,0,.7)}
#lampTag{position:absolute;left:2px;top:53px;white-space:nowrap;font-size:9px;line-height:13px;
  padding:0 5px;border-radius:7px;color:#2a1f08;font-weight:700;opacity:.92;
  background:linear-gradient(180deg,var(--brass1),var(--brass2));border:1px solid #5d4718;
  box-shadow:0 1px 3px rgba(0,0,0,.6)}

/* ---------- 板子下沿：木质横档（黄铜牌）+ 桌面 ---------- */
#desk{position:relative;z-index:70;flex:none}
#rail{position:relative;height:38px;display:flex;align-items:center;gap:8px;padding:0 8px;
  background:repeating-linear-gradient(91deg,rgba(0,0,0,.16) 0 1px,rgba(255,235,200,.04) 1px 4px),
    linear-gradient(180deg,#5f4a33,#3a2b1c 60%,#241a10);

function overlap(a, b, gap) {
  const g = gap || 0;
  const ox = Math.min(a.x + a.w + g, b.x + b.w + g) - Math.max(a.x - g, b.x - g);
  const oy = Math.min(a.y + a.h + g, b.y + b.h + g) - Math.max(a.y - g, b.y - g);
  return (ox > 0 && oy > 0) ? Math.min(ox, oy) : 0;

/* 求线段与矩形的边界交点（把线头收在纸边，不钻进纸里） */
function clipToRect(rect, from) {
  const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
  let dx = from.x - cx, dy = from.y - cy;
  if (dx === 0 && dy === 0) return { x: cx, y: cy };
  const sx = dx === 0 ? Infinity : (rect.w / 2) / Math.abs(dx);
  const sy = dy === 0 ? Infinity : (rect.h / 2) / Math.abs(dy);
  const s = Math.min(sx, sy);
  return { x: cx + dx * s, y: cy + dy * s };

    else if (st === "ready") { const n = ALL.filter(function (t) { return stateOf(t, ALL) === "ready"; }).length; const j = order.slice(0, k).filter(function (o) { return o.s === "ready"; }).length; const per = narrow ? 2 : 3; const row = Math.floor(j / per), col = j % per; ax = (col - (Math.min(per, n) - 1) / 2) * (cw + 14); ay = (300 + row * (ch + 16)) * spread; }
    else if (st === "closed") { const j = order.slice(0, k).filter(function (o) { return o.s === "closed"; }).length; ax = (-250 + (j % 2) * (cw + 12)) * spread; ay = (620 + Math.floor(j / 2) * (ch + 14)) * spread; }
    else { const j = order.slice(0, k).filter(function (o) { return o.s === "fog"; }).length; const total = ALL.filter(function (t) { return stateOf(t, ALL) === "fog"; }).length; const R = (330 + j * Math.min(26, 220 / Math.max(1, total))) * (total <= 2 ? 0.82 : spread); const th = (j * 2.39996 + 0.9) + rnd() * 0.5; ax = Math.cos(th) * R * (1 + rnd() * .28); ay = Math.sin(th) * R * (1 + rnd() * .28) + 40; }

    el.setAttribute("tabindex", "0");
    el.setAttribute("role", "button");
    el.style.transform = "translate3d(" + x + "px," + y + "px,0) rotate(" + it.rot.toFixed(2) + "deg)";
    el.setAttribute("aria-label", "#" + t.no + " " + TYPES[typeOf(t)].zh + " · " + STATE_ZH[st] + " · " + t.title);
    el.setAttribute("title", t.title);
    const sk = TYPES[typeOf(t)].skill;
    const act = (st === "ready")
      ? '<div class="acts">' +
          '<button class="mini sk" data-act="skill" style="background:' + TYPES[typeOf(t)].ink + '">' + sk + '</button>' +
          '<button class="mini ghost" data-act="newsession">新会话</button>' +
          '<a class="link" data-act="open" href="#" onclick="return false" title="打开原票 #' + t.no + '" aria-label="打开原票 #' + t.no + '">🔗</a>' +
        '</div>'
      : '<div class="acts"></div>';
    let sub = "";
    if (st === "closed") sub = '<span class="ok">✓ 已关闭</span> · 100%';
    else if (st === "lit") sub = '<span class="ow">经办人 ' + esc(t.claimedBy) + '</span> · 未动工 · 0%';
    else if (st === "ready") sub = '未动工 · 0%';
    else sub = '<span class="bl">被 ' + esc(blockNames(t)) + ' 挡着</span>';
    let mark = "";
    if (st === "closed") mark = '<span class="stamp">已关闭</span><span class="dogear"></span>';
    else if (st === "lit") mark = '<span class="litbar"></span>';
    else if (st === "ready") mark = '<span class="flag">现在能做</span>';
    else mark = '<span class="qmark" aria-hidden="true">?</span>';
    el.innerHTML =
      '<span class="pin ' + TYPES[typeOf(t)].pin + '" aria-hidden="true"></span>' +
      '<div class="sheet">' +
        '<div class="hd"><span class="no">#' + t.no + '</span>' +
          '<span class="tipe" style="color:' + TYPES[typeOf(t)].ink + ';border-color:' + TYPES[typeOf(t)].ink + ';background:rgba(255,255,255,.5)">' + TYPES[typeOf(t)].zh + '</span>' +
          '<span style="flex:1"></span>' +
          (st === "fog" ? '<span class="tipe" style="color:#6b6152;border-color:#9c9284;background:rgba(255,255,255,.35)">还没探明</span>' : "") +
        '</div>' +
        '<div class="tt">' + esc(t.title) + '</div>' +
        '<div class="sub">' + sub + '</div>' +
        '<div class="bar"><i class="' + (st === "closed" ? "done" : "") + '" style="width:' + (st === "closed" ? 100 : 0) + '%"></i></div>' +
        mark + act +
      '</div>';
    field.appendChild(el);
    it.el = el;
  });

  /* ---- 空样本：一张证据都没有的板子（不是白屏，也不是「暂无数据」） ---- */
  if (ALL.length === 0) {
    const v = document.createElement("div");
    v.id = "vacant";
    const vw = Math.min(300, boardW - 60); v.style.width = vw + "px"; v.style.height = "128px";
    v.style.left = (fx + (dw - vw) / 2) + "px";
    v.style.top = (fy + dh + 64) + "px";
    v.innerHTML = '<span class="hole"></span>这张图还没有钉上任何资料。<br>下一张钉这里 —— 先按「检查」把整张图摸一遍。';
    field.appendChild(v);
  }

  /* ---- 记分便签：照四态口径数出来的账（没有层，也没有任何一句会撒谎的进度） ---- */
  let nc = 0, nl = 0, nr = 0, nf = 0;
  ALL.forEach(function (t) { const s = stateOf(t, ALL); if (s === "closed") nc++; else if (s === "lit") nl++; else if (s === "ready") nr++; else nf++; });
  const ledger = document.createElement("div");
  ledger.id = "ledger";
  const lw = Math.min(dw, boardW - 60);
  ledger.style.width = lw + "px";
  ledger.innerHTML = '<div class="slip">' +
    (ALL.length === 0
      ? '<span class="n">0 张</span> 子票 —— 这是一张刚钉上的空板子，还没有可推进的东西。'
      : '<b>照四态数下来</b>：已经办结 <span class="n">' + nc + '</span> 张 / 一共 <span class="n">' + ALL.length + '</span> 张<br>' +
        '<span class="w" style="color:#5c5340">正在办 <r>' + nl + '</r> 张 · 现在能动手 <m>' + nr + '</m> 张 · 还没探明 <u>' + nf + '</u> 张</span>' +
        '<div style="margin-top:2px;color:#6b6152">把灯挪过去，暗处那些就会亮起来；点一下就能拿下来看。</div>') +
    '</div>';
  ledger.style.left = (fx + (dw - lw) / 2) + "px";
  ledger.style.top = (fy + dh + 12) + "px";
  field.appendChild(ledger);
  M2.geom.ledger = { x: fx + (dw - lw) / 2, y: fy + dh + 12, w: lw, h: ledger.offsetHeight };

  drawThreads();
  /* 板子一打开就把镜头对在目的地那张上（上面已经挑过：这一屏里没有票的中心点被 chrome 压住） */
  sc.scrollTop = chosen.s;
  return H;
}

/* ---- 红线：从每张票的图钉牵到目的地；被挡住的票那条是虚的（路画出来了，通不通不知道） ---- */
function drawThreads() {
  const svg = $("#threads");
  const destRect = M2.geom.dest; if (!destRect) return;
  let s = "";
  const pinOf = function (r, i) { return { x: r.x + r.w / 2, y: r.y + 7 }; };
  ALL.forEach(function (t) {
    const st = stateOf(t, ALL);
    const r = M2.geom.pos[t.no]; if (!r) return;
    const a = pinOf(r), b = clipToRect({ x: destRect.x - 4, y: destRect.y - 4, w: destRect.w + 8, h: destRect.h + 8 }, a);
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + Math.min(95, Math.hypot(b.x - a.x, b.y - a.y) * 0.15) + 10;
    const cls = "th" + (st === "fog" ? " fog" : st === "lit" ? " lit" : "");
    s += '<path class="' + cls + '" data-thread="' + t.no + '" d="M' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + ' Q' + mx.toFixed(1) + ' ' + my.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + b.y.toFixed(1) + '"/>';
  });
  ALL.forEach(function (t) {
    (t.blockedBy || []).forEach(function (bn) {
      const rb = M2.geom.pos[bn], rt = M2.geom.pos[t.no]; if (!rb || !rt) return;
      const blk = ALL.find(function (x) { return x.no === bn; });
      const done = blk && blk.state === "CLOSED";
      const p1 = { x: rb.x + rb.w / 2, y: rb.y + rb.h / 2 }, p2 = { x: rt.x + rt.w / 2, y: rt.y + rt.h / 2 };
      const a = clipToRect(rb, p2), b = clipToRect(rt, p1);       // 两头都收在纸边
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + Math.min(70, Math.hypot(b.x - a.x, b.y - a.y) * 0.12) + 8;
      s += '<path class="th blk' + (done ? " done" : "") + '" data-blk="' + bn + '-' + t.no + '" d="M' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + ' Q' + mx.toFixed(1) + ' ' + my.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + b.y.toFixed(1) + '"/>';
      const ang = Math.atan2(b.y - my, b.x - mx), L = 9;
      s += '<path class="th blk' + (done ? " done" : "") + '" d="M' + b.x.toFixed(1) + ' ' + b.y.toFixed(1) +
        ' L' + (b.x - Math.cos(ang - 0.42) * L).toFixed(1) + ' ' + (b.y - Math.sin(ang - 0.42) * L).toFixed(1) +
        ' M' + b.x.toFixed(1) + ' ' + b.y.toFixed(1) +
        ' L' + (b.x - Math.cos(ang + 0.42) * L).toFixed(1) + ' ' + (b.y - Math.sin(ang + 0.42) * L).toFixed(1) + '"/>';
    });
  });
  svg.innerHTML = s;
}

/* ============================================================================
   四、台灯：灯罩有重量（阻尼跟随），光圈跟着鼠标走
   目的地那张永远最亮，跟灯在哪无关 —— 它画在暗层上面。
   ========================================================================== */
const LAMP = M2.lamp;
let rafId = 0;
function clampLight(x, y) {
  const sc = $("#scroller").getBoundingClientRect();
  const pad = 22;
  return { x: Math.max(sc.left + pad, Math.min(sc.right - pad, x)), y: Math.max(sc.top + pad, Math.min(sc.bottom - pad, y)) };
}
function scheduleLight() { if (!rafId) rafId = requestAnimationFrame(tickLight); }
function tickLight() {
  rafId = 0;
  const k = 0.17, ks = 0.115;
  LAMP.cx += (LAMP.tx - LAMP.cx) * k;
  LAMP.cy += (LAMP.ty - LAMP.cy) * k;
  const sx0 = LAMP.tx + 96, sy0 = LAMP.ty - 134;
  const sx = Math.max(2, Math.min(innerWidth - 90, sx0));       // 灯罩别跑出画面（灯还是照着原来的点）
  const sy = Math.max(-6, Math.min(innerHeight - 58, sy0));
  LAMP.sx += (sx - LAMP.sx) * ks;
  LAMP.sy += (sy - LAMP.sy) * ks;
  const dx = LAMP.tx - LAMP.sx, dy = LAMP.ty - LAMP.sy;
  const want = Math.max(-56, Math.min(56, Math.atan2(dx, dy) * 180 / Math.PI));
  LAMP.ang += (want - LAMP.ang) * 0.16;
  root.style.setProperty("--lx", LAMP.cx.toFixed(1) + "px");
  root.style.setProperty("--ly", LAMP.cy.toFixed(1) + "px");
  root.style.setProperty("--deskx", Math.max(0, Math.min(innerWidth, LAMP.cx)).toFixed(0) + "px");
  $("#lamp").style.transform = "translate3d(" + LAMP.sx.toFixed(1) + "px," + LAMP.sy.toFixed(1) + "px,0) rotate(" + LAMP.ang.toFixed(2) + "deg)";
  drawArm();
  if (Math.abs(LAMP.tx - LAMP.cx) + Math.abs(LAMP.ty - LAMP.cy) + Math.abs(sx - LAMP.sx) + Math.abs(sy - LAMP.sy) + Math.abs(want - LAMP.ang) > 0.5) scheduleLight();
}
function drawArm() {
  const p = $("#arm");
  const x0 = innerWidth - 2, y0 = innerHeight - 18;
  const x1 = LAMP.sx + 44, y1 = LAMP.sy + 5;
  const mx = x1 - 92, my = y1 - 116;
  p.setAttribute("viewBox", "0 0 " + innerWidth + " " + innerHeight);
  const d = "M" + x0 + " " + y0 + " L" + mx.toFixed(1) + " " + my.toFixed(1) + " L" + x1.toFixed(1) + " " + y1.toFixed(1);
  p.querySelector(".sh").setAttribute("d", d);
  p.querySelector(".bd").setAttribute("d", d);
  p.querySelector(".bs").setAttribute("d", d);
}
function setLampTarget(x, y) { const c = clampLight(x, y); LAMP.tx = c.x; LAMP.ty = c.y; scheduleLight(); }
function lampFollow() { LAMP.mode = "follow"; $("#lampTag").textContent = "跟手"; }
function lampPark(x, y) { LAMP.mode = "park"; setLampTarget(x, y); $("#lampTag").textContent = "已放下 · 点一下回跟手"; }

/* ============================================================================
   五、交互：拖动资料、抬起看、拖动台灯、键盘
   ========================================================================== */
let dragTicket = null, lampDrag = null;

function setLifted(no) {
  $$(".tick.lifted").forEach(function (e) { e.classList.remove("lifted"); });
  M2.lifted = no || null;
  if (!no) { $$(".th").forEach(function (p) { p.classList.remove("hot"); }); markOverlay(); return; }
  const el = $('.tick[data-ticket="' + no + '"]');
  if (el) el.classList.add("lifted");
  $$(".th").forEach(function (p) { p.classList.toggle("hot", p.getAttribute("data-thread") === String(no) || p.getAttribute("data-blk") === no + "-" + String(no) || (p.getAttribute("data-blk") || "").indexOf("-" + no) > -1); });
  markOverlay();
}
/* 抬起来那张的自述：被谁挡着 / 挡住了谁 —— 只看自己家前后就能判出来，不问「第几层」 */
function markOverlay() {
  if (M2.lifted == null) { $$(".tick .why").forEach(function (e) { e.remove(); }); return; }
  const t = ALL.find(function (x) { return x.no === M2.lifted; });
  $$(".tick .why").forEach(function (e) { e.remove(); });
  if (!t) return;
  const el = $('.tick[data-ticket="' + t.no + '"]');
  if (!el) return;
  const st = stateOf(t, ALL);
  const up = ALL.filter(function (x) { return (x.blockedBy || []).indexOf(t.no) > -1; }).map(function (x) { return "#" + x.no; });
  const d = document.createElement("div");
  d.className = "why";
  d.style.cssText = "position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(255,250,236,.96),#f2e9d4);border-top:1px solid rgba(90,70,40,.5);font-size:10.5px;line-height:14px;color:#3a3226;padding:3px 7px";
  d.textContent = STATE_ZH[st] + (t.claimedBy ? "（经办人 " + t.claimedBy + "）" : "") +
    " · 前面挡着的：" + (t.blockedBy && t.blockedBy.length ? blockNames(t) : "没有") +
    " · 它挡住了：" + (up.length ? up.join("、") : "没有");
  el.querySelector(".sheet").appendChild(d);
}

function bind() {
  /* 指针移动 → 台灯跟过去；指针压在灯罩上时灯就停住（不然它永远追不上手，抓不住） */
  window.addEventListener("pointermove", function (e) {
    if (lampDrag) { lampDrag.moved = Math.max(lampDrag.moved, Math.hypot(e.clientX - lampDrag.x, e.clientY - lampDrag.y)); lampPark(e.clientX - 96, e.clientY + 134); return; }
    if (e.target && e.target.closest && e.target.closest("#lamp")) return;
    if (LAMP.mode === "follow") setLampTarget(e.clientX, e.clientY);
  }, { passive: true });
  window.addEventListener("pointerdown", function (e) {
    if (M2.lifted != null && !e.target.closest(".tick, #drawer, #lamp, #bar")) setLifted(null);
  });

  /* 拖动资料：按住纸就把它挪个地方，松手记住新位置 */
  $("#field").addEventListener("pointerdown", function (e) {
    const el = e.target.closest(".tick"); if (!el) return;
    if (e.target.closest("button, a")) return;              // 票上的按钮交给按钮
    dragTicket = { el: el, no: Number(el.getAttribute("data-ticket")), sx: e.clientX, sy: e.clientY, moved: 0, dx: 0, dy: 0 };
    el.classList.add("dragging");
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });
  $("#field").addEventListener("pointermove", function (e) {
    if (!dragTicket) return;
    dragTicket.dx = e.clientX - dragTicket.sx; dragTicket.dy = e.clientY - dragTicket.sy;
    dragTicket.moved = Math.abs(dragTicket.dx) + Math.abs(dragTicket.dy);
    const p = M2.geom.pos[dragTicket.no], r = p.rot;
    dragTicket.el.style.transform = "translate3d(" + (p.x + dragTicket.dx).toFixed(1) + "px," + (p.y + dragTicket.dy).toFixed(1) + "px,0) rotate(" + r.toFixed(2) + "deg)";
  });
  const dropTicket = function () {
    if (!dragTicket) return;
    const d = dragTicket; dragTicket = null;
    d.el.classList.remove("dragging");
    if (d.moved > 4) {
      const p = M2.geom.pos[d.no];
      p.x = Math.max(4, Math.min(M2.geom.boardW - p.w - 4, p.x + d.dx));
      p.y = Math.max(4, Math.min(M2.geom.boardH - p.h - 4, p.y + d.dy));
      d.el.style.transform = "translate3d(" + p.x + "px," + p.y + "px,0) rotate(" + p.rot.toFixed(2) + "deg)";
      d.el.setAttribute("data-moved", "1");
      drawThreads();
    } else {
      setLifted(Number(d.el.getAttribute("data-ticket")));
    }
  };
  $("#field").addEventListener("pointerup", dropTicket);
  $("#field").addEventListener("pointercancel", dropTicket);

  /* 票上的键盘：Enter / Space 等同于点一下 */
  $("#field").addEventListener("keydown", function (e) {
    const el = e.target.closest(".tick"); if (!el) return;
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      e.preventDefault();
      setLifted(Number(el.getAttribute("data-ticket")));
    }
  });

  /* 台灯：拖动它 / 点一下回跟手 / 聚焦后方向键挪 */
  const lamp = $("#lamp");
  lamp.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    lampDrag = { x: e.clientX, y: e.clientY, moved: 0 };
    lamp.classList.add("grabbing");
    try { lamp.setPointerCapture(e.pointerId); } catch (err) {}
    lampPark(e.clientX - 96, e.clientY + 134);
  });
  lamp.addEventListener("pointerup", function (e) {
    if (!lampDrag) return;
    const moved = lampDrag.moved; lampDrag = null; lamp.classList.remove("grabbing");
    if (moved < 9) {                                                       // 其实是点了一下 → 切回跟手 / 放下
      if (LAMP.mode === "follow") { lampPark(LAMP.tx, LAMP.ty); } else { lampFollow(); }
    } else { lampPark(e.clientX - 96, e.clientY + 134); }
  });
  lamp.addEventListener("pointercancel", function () { lampDrag = null; lamp.classList.remove("grabbing"); });
  lamp.addEventListener("keydown", function (e) {
    const step = e.shiftKey ? 12 : 44;
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].indexOf(e.key) < 0) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (LAMP.mode === "follow") { const l = clampLight(LAMP.cx, LAMP.cy); lampPark(l.x, l.y); } else lampFollow(); }
      return;
    }
    e.preventDefault();                                                    // 只在灯自己身上拦方向键
    const l = clampLight(LAMP.mode === "follow" ? LAMP.cx : LAMP.tx, LAMP.mode === "follow" ? LAMP.cy : LAMP.ty);
    const nx = l.x + (e.key === "ArrowLeft" ? -step : e.key === "ArrowRight" ? step : 0);
    const ny = l.y + (e.key === "ArrowUp" ? -step : e.key === "ArrowDown" ? step : 0);
    lampPark(nx, ny);
  });
  $("#btnFollow").addEventListener("click", function () { lampFollow(); const r = $("#lamp").getBoundingClientRect(); setLampTarget(r.left, r.top); });

  /* 正文详情：钉在横档上的那张对折的纸，点开摊平 */
  const DRAW = {
    notes: { title: "正文详情", cap: "notes", body: function () {
      let h = "";
      NOTES6.forEach(function (x) { h += '<div class="item"><span class="n">' + x.n + '</span><div>' + md(x.s) + '</div></div>'; });
      h += '<div class="more">……折叠起来的那一叠里还有 <b>10 条</b>（正文一共 16 条）。</div>';
      return h;
    } },
    decisions: { title: "Decisions so far（2）", cap: "decisions", body: function () {
      let h = "";
      DATA.decisions.forEach(function (d, i) { h += '<div class="item"><span class="n">' + (i + 1) + '</span><div><b>' + esc(d.t) + '</b> — ' + esc(d.g) + '</div></div>'; });
      if (!DATA.decisions.length) h = '<div class="item"><span class="n">—</span><div>还没有定下来的结论。</div></div>';
      return h;
    } },
    fog: { title: "Not yet specified（战雾 " + DATA.fog.length + "）", cap: "fog", body: function () {
      let h = "";
      DATA.fog.forEach(function (f, i) { h += '<div class="item"><span class="n">' + (i + 1) + '</span><div>' + md(f) + '</div></div>'; });
      if (!DATA.fog.length) h = '<div class="item"><span class="n">—</span><div>还没有「等数字才能定」的条目。</div></div>';
      return h;
    } },
    outOfScope: { title: "Out of scope（" + DATA.outOfScope.length + "）", cap: "outOfScope", body: function () {
      let h = "";
      DATA.outOfScope.forEach(function (f, i) { h += '<div class="item"><span class="n">' + (i + 1) + '</span><div>' + md(f) + '</div></div>'; });
      if (!DATA.outOfScope.length) h = '<div class="item"><span class="n">—</span><div>还没有写下来的「不做」。</div></div>';
      return h;
    } }
  };
  let openDrawer = null;
  const btnOf = { notes: "#noteBtn", decisions: "#tabDec", fog: "#tabFog", outOfScope: "#tabOut" };
  function closeDrawer() {
    if (!openDrawer) return;
    $(btnOf[openDrawer]).setAttribute("aria-expanded", "false");
    openDrawer = null;
    $("#drawer").classList.remove("on");
    $("#drawer").style.bottom = "0px";
  }
  function openTo(key) {
    if (openDrawer === key) { closeDrawer(); return; }
    closeDrawer();
    const d = DRAW[key];
    $("#drawerSheet").innerHTML = '<div class="dt"><b>' + esc(d.title) + '</b><span class="foldline">对折的纸，摊平了</span></div>' + d.body();
    $("#drawer").classList.add("on");
    $("#drawer").style.bottom = $("#desk").offsetHeight + "px";
    openDrawer = key;
    $(btnOf[key]).setAttribute("aria-expanded", "true");
    $(btnOf[key]).focus();
  }
  $("#noteBtn").addEventListener("click", function () { openTo("notes"); });
  $("#tabDec").addEventListener("click", function () { openTo("decisions"); });
  $("#tabFog").addEventListener("click", function () { openTo("fog"); });
  $("#tabOut").addEventListener("click", function () { openTo("outOfScope"); });
  $("#drawerClose").addEventListener("click", closeDrawer);
  window.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeDrawer(); setLifted(null); } });

  /* 顶部与下沿那两组按钮：都有反馈，且都不改原词 */
  const say = function (el, word) {
    const old = el.textContent;
    el.textContent = word;
    window.setTimeout(function () { el.textContent = old; }, 1100);
  };
  [["#btnExec", "已写进输入框"], ["#btnMain", "已写进输入框"], ["#btnNew", "已开新会话"], ["#btnNewTop", "已开新会话"]].forEach(function (pair) {
    const el = $(pair[0]); if (el) el.addEventListener("click", function () { say(el, "✓ " + pair[1]); });
  });
  [["#btnDiag", "诊断已开"], ["#btnDiagTop", "诊断已开"]].forEach(function (pair) {
    const el = $(pair[0]); if (el) el.addEventListener("click", function () { say(el, "✓ " + pair[1]); });
  });
  $("#btnBack").addEventListener("click", function () { say($("#btnBack"), "✓ 已返回列表"); });
  $("#btnArchive").addEventListener("click", function () { say($("#btnArchive"), "已开原票"); });
  $("#field").addEventListener("click", function (e) {
    const b = e.target.closest("[data-act]"); if (!b) return;
    e.stopPropagation();
    say(b, b.getAttribute("data-act") === "skill" ? "已写进输入框" : b.getAttribute("data-act") === "newsession" ? "已开新会话" : "已开原票");
  });

  /* 控制条 */
  $$("#segW button").forEach(function (b) {
    b.addEventListener("click", function () { location.search = "?w=" + b.getAttribute("data-v") + "&s=" + SAMPLE + (SHOWBAR ? "" : "&bar=0"); });
  });
  $$("#segS button").forEach(function (b) {
    b.addEventListener("click", function () { location.search = "?w=" + PANEL_W + "&s=" + b.getAttribute("data-v") + (SHOWBAR ? "" : "&bar=0"); });
  });
}

/* ============================================================================
   六、起步
   ========================================================================== */
function chrome() {
  root.style.setProperty("--panelw", PANEL_W + "px");
  root.style.setProperty("--vcx", (innerWidth / 2) + "px");
  root.style.setProperty("--vcy", (innerHeight / 2) + "px");
  $("#panel").setAttribute("data-w", PANEL_W < 600 ? "400" : "810");
  document.body.classList.toggle("withbar", SHOWBAR);
  if (!SHOWBAR) $("#bar").style.display = "none";
  $$("#segW button").forEach(function (b) { b.classList.toggle("on", Number(b.getAttribute("data-v")) === (PANEL_W < 600 ? 400 : 810)); });
  $$("#segS button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-v") === SAMPLE); });
  $("#htitle").textContent = DATA.title;
  let closed = 0; ALL.forEach(function (t) { if (t.state === "CLOSED") closed++; });
  $("#hcount").textContent = "本图 " + ALL.length + " 张子票（已关闭 " + closed + " 张）";
  const main = ALL.length === 0 ? "检查" : (closed === ALL.length ? "完成" : "执行");
  $("#btnMain").textContent = (main === "检查" ? "🔍 " : main === "完成" ? "✓ " : "▶ ") + main;
  $("#btnExec").textContent = main;
  $("#tabDec").textContent = "Decisions so far（" + DATA.decisions.length + "）";
  $("#tabFog").textContent = "Not yet specified（战雾 " + DATA.fog.length + "）";
  $("#tabOut").textContent = "Out of scope（" + DATA.outOfScope.length + "）";
}
function resize() {
  $("#scroller").innerHTML = '<div id="board"><div id="grain"></div><div id="grain2"></div>' +
    '<div class="frame f-l"></div><div class="frame f-r"></div>' +
    '<svg id="threads" aria-hidden="true"></svg><div id="field"></div><div id="overlayer"></div></div>';
  M2.geom.pos = {}; M2.lifted = null;
  buildBoard();
}
function start() {
  chrome();
  /* 两条常驻条的高度定死：标题怎么换行、字形怎么量，都不该让它们变高变矮 ——
     否则「哪张票的中心点被它接走」会随它们的高度在两次打开之间翻来翻去。 */
  ["#topstem", "#desk"].forEach(function (sel) {
    const e = $(sel), h = Math.round(e.getBoundingClientRect().height);
    e.style.height = h + "px";
    e.style.minHeight = h + "px";
    e.style.maxHeight = h + "px";
    e.style.overflow = "hidden";
  });
  resize();
  const sc = $("#scroller");
  /* 开场：先让光停在目的地那张上（整张图的中心就是这个终点） */
  const d = M2.geom.dest;
  const scb = sc.getBoundingClientRect();
  LAMP.tx = LAMP.cx = scb.left + scb.width / 2;
  LAMP.ty = LAMP.cy = scb.top + Math.max(60, Math.min(scb.height - 60, d.y + d.h / 2 - sc.scrollTop));
  LAMP.sx = LAMP.tx + 118; LAMP.sy = LAMP.ty - 152;
  tickLight();
  bind();
  /* 面板被人拖动宽度时，重新按容器宽度排一次（真响应容器，不是响应窗口） */
  if (window.ResizeObserver) {
    let last = $("#scroller").clientWidth;
    new ResizeObserver(function () {
      root.style.setProperty("--vcx", (innerWidth / 2) + "px");
      root.style.setProperty("--vcy", (innerHeight / 2) + "px");
      const w = $("#scroller").clientWidth;
      if (Math.abs(w - last) < 8) return;
      last = w;
      M2.geom.boardW = w;
      resize();
    }).observe($("#scroller"));
  }
}
start();
</script>
