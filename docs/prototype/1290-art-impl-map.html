<div class="page-head">
  <h1>原型 · 实施地图的四种画法</h1>
  <p>探索地图那张已经定了（<b>一条路分成几条岔路</b>）。实施地图的意思是：一张<b>规格</b>下面挂着若干<b>实施票</b>，票与票之间可能有先后（这张不做完，那张就动不了）；等所有票都做完了，最终效果<b>一定</b>达成。</p>
  <p>所以实施图得把三件事说清楚：票都挂在规格下面；票与票之间有先后；全部做完就一定到终点。下面四种画法分别用不同办法讲这三件事——挑的时候以每节末尾 132×82 的真实尺寸为准。</p>
  <p>另外一处改动：实施图左边的标签保持「<b>需求</b>」。探索那副和实施这副，左边都是同一条需求——出发前它分岔着还没答案，做完后它下面挂着一堆做完的票，最后盖章。两张图放在一起，是同一条需求的两个阶段。</p>
</div>

/* ================= 渲染 ================= */
function withIds(svg, suffix){
  return svg.replace(/id="([^"]+)"/g, 'id="$1-' + suffix + '"')
            .replace(/url\(#([^)]+)\)/g, 'url(#$1-' + suffix + ')');
}
function mini(svg, cap, suffix){
  return '<div class="mini">' + withIds(svg, suffix) + '<div class="cap">' + cap + '</div></div>';
}
function implHtml(d){
  var h = '<section class="section" id="impl-' + d.id + '">';
  h += '<h2><span class="no">' + d.no + '</span>' + d.name + '</h2>';
  h += '<p class="idea">' + d.idea + '</p>';
  h += '<div class="pair">';
  h += '<div class="artbox impl"><div class="who">实施地图</div>' + withIds(d.svg, d.id) + '<div class="cap">' + d.cap + '</div></div>';
  h += '</div>';
  h += '<div class="mini-label">真实尺寸（132×82，放进选择卡就是这么大）：</div>';
  h += '<div class="minirow">' + mini(d.svg, d.cap, d.id + "m") + '</div>';
  h += '</section>';
  return h;
}
var html = '';
html += '<section class="section" id="pair"><h2><span class="no">配对参考</span>探索地图（已定稿）</h2>';
html += '<p class="idea">左边是已经定下来的探索地图（一条路分成几条岔路）。它和实施地图的关系是：同一件事，出发前是分岔的、雾里看不清的；做完后是全连通的、问号变勾的。</p>';
html += '<div class="pair"><div class="artbox explore"><div class="who">探索地图</div>' + withIds(REF_EXPLORE, "ref") + '<div class="cap">路分成几条，每条尽头是问号</div></div></div>';
html += '<div class="mini-label">真实尺寸：</div><div class="minirow">' + mini(REF_EXPLORE, "路分成几条，每条尽头是问号", "refm") + '</div>';
html += '</section>';
html += IMPLS.map(implHtml).join("");
document.getElementById("root").innerHTML = html;
</script>
