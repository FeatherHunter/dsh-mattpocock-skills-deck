<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C3 · 案情桌面 · 一张办公桌和一盏台灯 —— 地图 #604</title>
<style>
/* ============================================================================
   C3 · 案情桌面（斜俯视的一张办公桌 ＋ 台灯）

   概念：票是摊在桌上的纸。灯照着的那一小块地方是「已知」，看得到字；
         灯照不到的地方沉在暗里，只剩轮廓 —— 雾是物理上成立的，不是画上去的。
         桌上只有一处不靠灯也最亮：右下角立着的名牌（目的地）。
         它不随灯走，也不许被任何雾盖住。

   交互（都能用键盘做到）：
     移动鼠标 / 点桌面 / 拖灯头 / ← → ↑ ↓ 方向键  -> 挪灯（带阻尼，灯罩有重量）
     拖一张纸                    -> 挪位，位置记在本机
     点一张纸                    -> 抽到最上面（压在一摞下面的也抽得出来）＋ 翻出全文
     点暗处的物证袋              -> 就地拆封，暗不挡点按
     拖桌面空白处                -> 推桌子（桌子比一屏大三成）
     鼠标移到面板边缘            -> 桌面自己滑过去
     按住笔在纸上写              -> 笔迹粗细跟着笔压走

   版面：桌面随面板宽度自适应。一开屏就是一整块桌面（看不到桌子外面），
         一桌子活按状态分成四摞（已结清 / 正在办 / 可以动手 / 还没查清），
         每摞朝同一个方向错位叠着 —— 一眼是「一摞纸」，不是排版坏了。
   ============================================================================ */

:root{
  /* 界面外壳（六个原型统一） */
  --bg:#10131a; --card:#16181d; --line:#2a2d35;
  --tx:#e6edf3; --sec:#a1a1aa; --cap:#8b8b95;
  --walk:#4ade80; --view:#58a6ff; --dest:#c084fc; --warn:#f59e0b;
  --sans:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:Consolas,Menlo,monospace;

  /* 桌面世界（牛皮纸与软木的参考色，另立一套更深的办公桌版本） */
  --wood:#2a1f16;
  --felt:#241d17;
  --paper:#f3ead6;
  --paper2:#f6efdd;
  --paper-dark:#d9cdb2;
  --carbon:#2b2b2b;
  --kraft:#d9c39a;
  --envelope:#c8a97a;
  --seal:#b01e1e;
  --string:#c0392b;

  /* 灯的几何（屏幕像素） */
  --cone:330px;      /* 光圈半径：灯光的外沿 */
  --core:126px;      /* 光心：这一圈里细节全清楚 */
  --pan-x:0px; --pan-y:0px;
  --wl:0; --wt:0;    /* 挪过位置的纸：位移 */
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#08090c;color:var(--tx);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100vh;padding:12px 0 22px;
}
body.embed{padding:0;background:var(--bg)}
/* 让 flex 别把面板拉满一屏：面板就是侧栏里的一屏 */
#panel{align-self:flex-start}

/* 全页只有一盏灯：任务书要求目的地最亮，所以页面其余部分整体压暗，
   免得外壳把灯压成灰的。 */
body:not(.embed) #panel{opacity:.88;filter:saturate(.9)}

#panel{
  position:relative;width:810px;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
  height:660px;                        /* 面板是侧栏里的一屏，不是整页 */
}
body.embed #panel{height:100vh;height:100dvh;border:none;border-radius:0}

/* ---------------- 顶部外壳（照抄任务书第 5 节） ---------------- */
.phead{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 9px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,#151922,#12151c);
  position:relative;z-index:60;flex-wrap:nowrap;overflow:hidden;
}
.pbtn{
  appearance:none;background:transparent;border:1px solid transparent;color:var(--sec);
  font:500 12px/1 var(--sans);padding:5px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;flex:0 0 auto;
}
.pbtn:hover{background:rgba(255,255,255,.06);color:var(--tx);border-color:var(--line)}
.pbtn:focus-visible{outline:2px solid var(--view);outline-offset:1px}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto;overflow:hidden;
  font-size:11.5px;color:var(--sec);white-space:nowrap}
.crumb .no{font:600 12px/1 var(--mono);color:var(--tx);flex:0 0 auto}
.crumb .sep{color:#3a3f4b;flex:0 0 auto}
.crumb .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tag-map{
  display:inline-flex;align-items:center;gap:4px;font:600 10.5px/1 var(--mono);
  color:#d8c7ff;background:rgba(192,132,252,.13);border:1px solid rgba(192,132,252,.45);
  border-radius:999px;padding:3px 8px;white-space:nowrap;flex:0 0 auto;
}
.pbtn.primary{
  margin-left:auto;background:rgba(88,166,253,.14);border-color:rgba(88,166,253,.55);
  color:#bfd9ff;font-weight:600;flex:0 0 auto;
}
.pbtn.primary:hover{background:rgba(88,166,253,.24);color:#e6f1ff}
/* 面板窄的时候（400）：标题收起来、按钮写短一点，但一行也不许换行 */
#panel.narrow .crumb .title,#panel.narrow .crumb .sep{display:none}
#panel.narrow .phead{gap:6px;padding:6px 7px}
#panel.narrow .pbtn{padding:5px 6px;font-size:11.5px}
#panel.narrow .tag-map{font-size:9.5px;padding:3px 6px}

/* ---------------- 桌面视口 ---------------- */
#desk{
  position:relative;flex:1 1 auto;overflow:hidden;background:#120d09;
  touch-action:none;cursor:crosshair;
  user-select:none;-webkit-user-select:none;
}
#desk.grab{cursor:grabbing}

#fog{position:absolute;inset:0;pointer-events:none;z-index:30;
  background:
    radial-gradient(115% 95% at 50% 42%, rgba(6,7,11,.24) 0%, rgba(6,7,11,.52) 52%, rgba(5,6,10,.80) 100%),
    linear-gradient(180deg, rgba(9,13,26,.16), rgba(9,13,26,.26));
  mix-blend-mode:multiply;}

#world{
  position:absolute;left:0;top:0;will-change:transform;
  transform:translate3d(var(--pan-x),var(--pan-y),0);
}
#tilt{
  position:absolute;left:0;top:0;transform-origin:50% 50%;
  transform:perspective(1600px) rotateX(6deg) scale(1.16);
}

/* 桌面本体：深色木头 ＋ 中间一大块毛毡垫。
   底色不能压到纯黑：灯照不到的地方要是「一屋子的暗」，不是「什么都没画」。 */
#surface{
  position:absolute;left:0;top:0;border-radius:14px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 42% 30%, #6b5238 0%, #513d29 46%, #3a2b1d 100%),
    linear-gradient(118deg,#5c452e,#3e2d1e);
  box-shadow:inset 0 0 140px rgba(0,0,0,.55);
}
#surface .grain{position:absolute;inset:0;filter:url(#wood);opacity:.5;mix-blend-mode:overlay}
#felt{
  position:absolute;border-radius:12px;overflow:hidden;
  background:linear-gradient(160deg,#4a3a36,#332a29);
  box-shadow:inset 0 0 70px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.03);
}
#felt .grain{position:absolute;inset:0;filter:url(#felt);opacity:.38;mix-blend-mode:soft-light}
/* 桌面上的旧水渍、划痕：程序化生成，不用图 */
#stains{position:absolute;inset:0;pointer-events:none}

/* 灯座与灯臂（固定在桌上，和纸一起被拖动） */
/* 台灯：底座 ＋ 立柱 ＋ 一条弯臂 ＋ 灯头。
   从上面斜看下去，底座是个压扁的圆、灯头是个圆环（灯罩口朝下，看到的是罩口）。
   灯座跟着灯头走（像推着走的落地灯），所以臂长是固定的，看着始终是一盏灯。
   灯头（#lampshade）的中心就是光圈的中心 —— 光圈不是凭空飘着的。 */
#lampbase{position:absolute;left:0;top:0;z-index:3;pointer-events:none;width:64px;height:64px}
#lampbase .foot{position:absolute;left:0;bottom:0;width:64px;height:20px;border-radius:50%;
  background:radial-gradient(ellipse at 38% 30%, #6d6a60 0%, #3b3730 52%, #17150f 100%);
  box-shadow:0 6px 16px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.12)}
#lampbase .foot i{position:absolute;left:18px;top:5px;width:28px;height:9px;border-radius:50%;
  background:rgba(0,0,0,.36);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
#lampbase .pole{position:absolute;left:29px;top:16px;width:6px;height:30px;border-radius:3px;
  background:linear-gradient(90deg,#100e0a,#5c5347 46%,#1a1712);box-shadow:0 2px 7px rgba(0,0,0,.7)}
#lampbase .elbow{position:absolute;left:25px;top:8px;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%, #6b6459, #26221d 74%);box-shadow:0 2px 7px rgba(0,0,0,.75)}
#lampbase .arm{position:absolute;left:32px;top:20px;width:209px;height:7px;border-radius:4px;
  transform-origin:0 3.5px;transform:rotate(38.2deg);
  background:linear-gradient(180deg,#5c5449,#221e19);box-shadow:0 3px 9px rgba(0,0,0,.65)}
#lampbase .label{position:absolute;left:0;top:44px;width:64px;text-align:center;
  font:600 8.5px/1 var(--mono);letter-spacing:.16em;color:rgba(206,186,150,.5);white-space:nowrap}
/* 灯头：外圈是灯罩金属边，中间是亮着的灯泡 —— 看上去是一个罩口，不是一个洞 */
#lampshade{position:absolute;left:0;top:0;width:46px;height:46px;z-index:4;pointer-events:none}
#lampshade .shade{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 44% 38%, #8a8172 0%, #3b362e 52%, #15120f 100%);
  box-shadow:0 7px 20px rgba(0,0,0,.8), inset 0 0 0 1.5px rgba(255,255,255,.18),
    0 0 0 1px rgba(255,214,158,.35), 0 0 20px rgba(255,204,138,.35)}
#lampshade .bulb{position:absolute;left:9px;top:9px;width:28px;height:28px;border-radius:50%;
  background:radial-gradient(circle, #fffdf6 0%, #ffeec6 42%, rgba(255,214,150,.30) 68%, rgba(255,196,120,0) 84%)}
#lampshade .glow{position:absolute;left:-22px;top:-22px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,240,208,.85) 0%,rgba(255,222,170,.38) 44%,rgba(255,200,140,0) 74%)}
/* 灯头那一小块是可以抓的：按住它拖，光圈就跟着走 */
#lampshade .grabh{position:absolute;inset:-8px;border-radius:50%;
  pointer-events:auto;cursor:grab;touch-action:none}
#lampshade .grabh:focus-visible{outline:2px solid var(--warn);outline-offset:6px;border-radius:50%}
#lampshade .grabh:active{cursor:grabbing}

/* ---------------- 纸 ---------------- */
.paper{
  position:absolute;z-index:var(--zf,1);border-radius:3px;cursor:grab;
  padding:11px 12px 10px;color:var(--carbon);overflow:hidden;
  transform:translate3d(var(--wl,0px),var(--wt,0px),0) rotate(var(--rot,0deg)) scale(var(--lift,1));
  will-change:transform;
  /* 多重阴影 = 纸抬离桌面的高度；拿起纸时 --lift 变大、影子更大更远 */
  box-shadow:
    0 calc(1px * var(--lv,1)) calc(2px * var(--lv,1)) rgba(0,0,0,.28),
    0 calc(4px * var(--lv,1)) calc(10px * var(--lv,1)) rgba(0,0,0,.40),
    0 calc(11px * var(--lv,1)) calc(26px * var(--lv,1)) rgba(0,0,0,.46),
    inset 0 0 0 1px rgba(0,0,0,.12);
}
.paper.k-lift{--lv:3.1; cursor:grabbing; z-index:26}
/* 点一张纸：抽到最上面（压着的也能抽出来看） */
.paper.k-top{z-index:30}
.paper.k-lift .sheet::after{background:rgba(255,246,224,.10)} /* 抬起来时把下面那片盖住：免得看着像重影 */
.paper:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.sheet{
  position:absolute;inset:0;border-radius:3px;overflow:hidden;pointer-events:none;z-index:0;
  background:
    linear-gradient(157deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,0) 42%),
    radial-gradient(120% 120% at 8% 2%, rgba(214,192,152,.55) 0%, rgba(214,192,152,0) 46%),
    linear-gradient(180deg, var(--paper2), var(--paper));
}
.sheet::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(120,96,60,.05))}
.tex{position:absolute;inset:0;filter:url(#paperturb);opacity:.20;mix-blend-mode:multiply;pointer-events:none;z-index:0}
.edge{display:none;position:absolute;inset:0;border-radius:3px;pointer-events:none;z-index:3;
  box-shadow:inset 0 0 0 2px rgba(118,86,40,.65)}
.paper.k-open .edge{display:block}
.paper.k-open{--lift:1.02}
/* 纸上的字要压在纸纹和底色上面（纸纹是绝对定位的，不抬一层会被它盖住） */
.paper .pno,.paper .ptitle,.paper .blk,.paper .pstat,.paper .blanknote,.paper .fogrest,.paper .waits{
  position:relative;z-index:1}

/* 纸上的字 */
.pno{font:600 11px/1 var(--mono);letter-spacing:.04em;color:#4a4034;display:flex;gap:6px;align-items:center}
.pno .typ{color:#7a6a52;font-weight:500}
.ptitle{font-size:13px;line-height:1.42;color:var(--carbon);margin-top:7px;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.blk{font:400 9.5px/1.4 var(--mono);color:#6b5c47;margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pstat{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:10.5px;font-weight:600}
.pstat .ic{font-size:10px}
/* 面板窄的时候（400）：纸小，字也收一号，一行不许挤成两行 */
#panel.narrow .paper{padding:8px 9px 8px}
#panel.narrow .ptitle{font-size:10.5px;line-height:1.34;margin-top:5px;-webkit-line-clamp:3}
#panel.narrow .pno{font-size:9.5px}
#panel.narrow .blk{font-size:8.5px;margin-top:4px;-webkit-line-clamp:1}
#panel.narrow .pstat{font-size:9px;margin-top:5px}
#panel.narrow .fogrest .t{font-size:9.5px;-webkit-line-clamp:2}
#panel.narrow .fogrest .ic{font-size:12px}
#panel.narrow .seal{font-size:8px;height:14px;letter-spacing:.12em}
#panel.narrow .waits{font-size:8.5px;left:9px;right:9px;bottom:6px}
#panel.narrow .fogtag{font-size:8.5px;left:9px;top:19px}
#panel.narrow .blurred{inset:10px 9px 24px}
#panel.narrow .stamp-old{font-size:9px;padding:2px 5px;right:6px;top:18px}
#panel.narrow .holder{font-size:8.5px;right:6px;bottom:6px;padding:2px 4px}
#panel.narrow .notes .hand{font-size:9px;left:9px;right:9px;bottom:7px}
#panel.narrow .notes .underline{left:9px;right:9px;bottom:5px}
#panel.narrow .sticky{width:60px;padding:6px 5px 7px;font-size:9px;right:-10px;top:-12px}
#panel.narrow .sticky b{font-size:10px}

/* 走亮：已归档、压平、盖了「已结」章 */
.paper.s-closed{padding-top:12px}
.paper.s-closed .ptitle{-webkit-line-clamp:3;font-weight:500;color:#3a3226}
.stamp-old{
  position:absolute;right:8px;top:24px;padding:3px 7px;border-radius:3px;z-index:2;
  border:2px solid rgba(160,30,30,.62);color:rgba(160,30,30,.72);
  font:700 11px/1.1 var(--sans);letter-spacing:.16em;transform:rotate(-11deg);
  background:rgba(255,255,255,.10);
}
.stamp-old::after{content:"";position:absolute;inset:-3px;border-radius:5px;
  background:radial-gradient(circle at 24% 30%, rgba(160,30,30,.20), transparent 60%)}
.notes{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:2}
.notes .hand{position:absolute;left:11px;bottom:7px;right:11px;font:italic 600 10.5px/1.35 var(--sans);
  color:rgba(34,46,80,.95);transform:rotate(-1.6deg);letter-spacing:.01em;
  background:rgba(255,252,242,.80);padding:1px 4px;border-radius:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notes .underline{position:absolute;left:13px;bottom:4px;height:1px;background:rgba(40,52,86,.35);right:13px;
  transform:rotate(-1.6deg)}

/* 照亮中：手压着的那一张，桌上一支笔 */
.paper.s-lit{box-shadow:
  0 2px 4px rgba(0,0,0,.30), 0 8px 18px rgba(0,0,0,.42), 0 18px 40px rgba(0,0,0,.50),
  0 0 0 1px rgba(88,166,255,.40), 0 0 26px rgba(88,166,255,.26), inset 0 0 0 1px rgba(0,0,0,.12)}
.paper.s-lit .pstat{color:#16537a}
.paper.s-lit .ptitle{font-weight:700}
.holder{
  position:absolute;right:9px;bottom:8px;display:flex;align-items:center;gap:4px;z-index:2;
  font:600 9.5px/1 var(--mono);color:#1d5d86;
  border:1px dashed rgba(29,93,134,.55);border-radius:999px;padding:3px 6px;
}
.holder .dot{width:5px;height:5px;border-radius:50%;background:#2b8fd4;box-shadow:0 0 6px rgba(43,143,212,.9)}

/* 现在能做：露一角 + 压着一张绿便签 */
.paper.s-ready{}
.sticky{
  position:absolute;right:-16px;top:-15px;width:74px;padding:8px 7px 9px;z-index:4;
  background:linear-gradient(172deg,#e9f7bd,#bfe07a 78%,#a8cc63);
  transform:rotate(6deg);box-shadow:0 5px 12px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.35);
  font:600 10px/1.32 var(--sans);color:#3a4a12;text-align:center;
}
.sticky::before{content:"";position:absolute;left:50%;top:-5px;width:26px;height:11px;margin-left:-13px;
  background:rgba(255,255,255,.42);transform:rotate(-4deg);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.sticky b{display:block;font-size:11px;letter-spacing:.02em}
.paper.s-ready .pstat{color:#2f6b12}
.paper.s-ready .corner{
  position:absolute;right:0;bottom:0;width:0;height:0;border-style:solid;z-index:1;
  border-width:0 0 26px 26px;border-color:transparent transparent rgba(190,224,122,.95) transparent;
}
.paper.s-ready .corner::after{content:"";position:absolute;left:-22px;bottom:-24px;width:22px;height:22px;
  background:linear-gradient(135deg,transparent 48%,rgba(0,0,0,.22))}

/* 雾里：封着的纸（物证袋），只看得出轮廓，点一下才翻出来。
   袋子里的东西都是绝对定位的，所以这里必须给一个高度，不然纸会塌成一条 */
.paper.s-fog{cursor:pointer;min-height:132px}
.paper.s-fog.wide{min-height:150px}
.paper.s-fog .sheet{background:linear-gradient(180deg,#cfc4ab,#b3a68a)}
.bag{
  position:absolute;inset:5px;border-radius:2px;pointer-events:none;z-index:0;
  background:linear-gradient(154deg, rgba(232,238,244,.40), rgba(198,208,220,.22) 58%, rgba(232,238,244,.34));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.30), inset 0 0 26px rgba(255,255,255,.20);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.paper.k-open .bag{opacity:0;transition:opacity .22s ease}
.blurred{position:absolute;inset:13px 12px 30px;pointer-events:none;z-index:0;
  filter:blur(2.2px);opacity:.5;
  background:repeating-linear-gradient(180deg, rgba(58,50,38,.92) 0 3px, transparent 3px 11px);
  border-radius:2px;
}
.blurred i{display:block;height:3px}
.paper.k-open .blurred{opacity:0;transition:opacity .22s ease}
.seal{
  position:absolute;left:0;right:0;top:0;height:17px;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(90deg,#a51d1d 0 12px,#8e1616 12px 22px);
  border-radius:3px 3px 0 0;box-shadow:0 2px 6px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;
  font:700 9px/1 var(--mono);letter-spacing:.22em;color:rgba(255,225,220,.92);
}

  if (t.state === 'CLOSED') return 'closed';
  if (t.claimedBy) return 'lit';
  var blocked = (t.blockedBy || []).some(function (no) {
    for (var i = 0; i < all.length; i++) if (all[i].no === no) return all[i].state !== 'CLOSED';
    return false;
  });
  return blocked ? 'fog' : 'ready';
}

  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

}

/* ===========================================================================
   摆位置：由「这张票的档案状态」和「人手上的动作」决定，不由层决定。

   一桌子活分成四摞，每摞是一个「东西」：
     已结清的一摞（压进档案盘）· 正在办的那一张（摊开、单放）·
     可以动手的一张一张（各自压着绿便签）· 还没查清的一摞（封着的物证袋）
   每摞内部按同一个方向错位叠起来 —— 一眼能看出是「一摞纸」，不是排版坏了。
   被压住的那张点一下就抽到最上面，正文也在翻出来的牌里看得全。

   所有的纸都摆在「首屏能看见的那块桌面」里面：尺寸随面板宽度自适应。
   =========================================================================== */
function metrics() {
  var narrow = panel.clientWidth < 520;
  return {
    narrow: narrow,
    vw: VW / ZOOM, vh: VH / ZOOM,            /* 首屏能看见的桌面范围（世界坐标） */
    pad: narrow ? 10 : 16,
    cw: narrow ? 124 : 150, ch: narrow ? 92 : 104,          /* 普通纸 */
    lw: narrow ? 142 : 176, lh: narrow ? 112 : 140,         /* 正在办的那一张：单放，给大一点 */
    fw: narrow ? 98  : 142, fh: narrow ? 70  : 112,         /* 物证袋 */
    dx: narrow ? 14 : 22,  dy: narrow ? 18 : 30,            /* 一摞纸的错位 */
    fdx: narrow ? 8 : 18,  fdy: narrow ? 11 : 24
  };
}
/* 一摞纸：从 (x,y) 起，每张往右下错一点 */
function pile(cards, cls, x, y, w, h, dx, dy, extraOf) {
  var out = [];
  for (var i = 0; i < cards.length; i++) {
    var p = paper(cards[i], cls, clamp(x + i * dx, 2, WW - w - 2), clamp(y + i * dy, 2, WH - h - 2), w, h,
      extraOf ? extraOf(i, cards[i]) : '');
    p.html = p.html.replace('--lv:', '--lv:' + (1 + i * 0.55).toFixed(1) + ';--zf:' + (2 + i));
    out.push(p);
  }
  return out;
}
function pileSize(n, w, h, dx, dy) { return { w: w + (n - 1) * dx, h: h + (n - 1) * dy }; }
/* 把几摞东西摆进一块地（长条货架式：一行放不下就换行；放不下就压紧一点重来） */
function shelf(items, box, gap) {
  var tries = [1, 0.7, 0.5], best = null;
  for (var t = 0; t < tries.length; t++) {
    var k = tries[t], rows = [], row = { items: [], w: 0, h: 0 }, y = box.y0, ok = true;
    for (var i = 0; i < items.length; i++) {
      var it = items[i], iw = it.w, ih = it.h;
      if (row.w + (row.w ? gap : 0) + iw > box.w + 0.5 && row.items.length) {
        rows.push(row); row = { items: [], w: 0, h: 0 };
      }
      if (iw > box.w + 0.5 || ih > box.h + 0.5) { ok = false; break; }
      row.items.push({ it: it, x: row.w + (row.w ? gap : 0) }); row.w += (row.w ? gap : 0) + iw;
      row.h = Math.max(row.h, ih);
    }
    if (ok) rows.push(row);
    var total = 0;
    for (var r = 0; r < rows.length; r++) total += rows[r].h + (r ? gap : 0);
    if (ok && total <= box.h + 0.5) { best = { rows: rows, total: total, k: k }; break; }
    best = ok ? { rows: rows, total: total, k: k } : best;
  }
  return best;
}

function layOut() {
  var papers = document.getElementById('papers');
  var props = document.getElementById('props');
  var M = metrics();
  var W = M.cw, H = M.ch;

  var groups = { closed: [], lit: [], ready: [], fog: [] };
  for (var i = 0; i < tickets.length; i++) groups[classify(tickets[i], tickets)].push(tickets[i].no);

  /* 目的地占掉右下角，摆纸的时候要绕开它（它是钉在面板角上的，不跟桌子走） */
  var plateEl = document.getElementById('destplate');
  plateEl.style.width = Math.min(236, M.vw - 2 * M.pad) + 'px';
  placeDest(M.narrow);                                   /* 先把它摆好，才量得到它有多高 */
  var destTopW = M.vh - (30 + plateEl.offsetHeight) / ZOOM - 6;   /* 目的地上面那条线（世界坐标） */
  var ca = { x0: M.pad, y0: M.pad, x1: M.vw - M.pad, y1: destTopW };

  var outP = [], outProp = [];
  var shelfResult = null;

  if (!tickets.length) {
    /* --- 空样本：一个还没开始的案子：空的档案盘 ＋ 只有案由的封皮 --- */
    var bw = Math.min(M.vw - 2 * M.pad, M.narrow ? 300 : 360);
    var bx = Math.round((M.vw - bw) / 2), by = Math.round(M.vh * 0.14);
    outProp.push({ c: 'tray', s: 'left:' + bx + 'px;top:' + by + 'px;width:' + bw + 'px;height:' + Math.round(bw * 0.62) + 'px',
      inner: '<div class="lip"></div><div class="tag">档案盘 · 还是空的</div>' });
    outP.push(paper('blank', 's-blank', bx + 14, by + 16, bw - 40, Math.round(bw * 0.60), ''));
    outProp.push({ c: 'clip', s: 'left:' + (bx + bw + 18) + 'px;top:' + (by + 30) + 'px;transform:rotate(24deg)' });
    outProp.push({ c: 'band', s: 'left:' + (bx - 10) + 'px;top:' + (by + bw * 0.62 + 46) + 'px;width:150px;height:7px;transform:rotate(3deg);opacity:.8' });
  } else if (groups.lit.length && !S_NAME.match(/big/)) {
    /* --- 主样本：4 张票。已结清一摞压进档案盘；正在办的那张单放；没查清的那袋压在角上 --- */
    var cN = groups.closed.length;
    var cw2 = M.narrow ? 150 : 208, ch2 = M.narrow ? 104 : 128;
    var cs = pileSize(cN, cw2, ch2, M.dx, M.dy);
    outProp.push({ c: 'tray', s: 'left:' + (ca.x0 - 4) + 'px;top:' + (ca.y0 - 6) + 'px;width:' + (cs.w + 34) + 'px;height:' + (cs.h + 40) + 'px',
      inner: '<div class="lip"></div><div class="tag">档案盘 · 已结清 ' + cN + ' 张</div>' });
    var dec = data.decisions || [];
    outP = outP.concat(pile(groups.closed, 's-closed', ca.x0 + 12, ca.y0 + 6, cw2, ch2, M.dx, M.dy, function (k) {
      return '<div class="stamp-old" style="right:10px;top:26px">已结</div>' +
        '<div class="notes"><div class="hand">' + esc(short((dec[k] || {}).g, M.narrow ? 20 : 30)) + '</div><div class="underline"></div></div>';
    }));

    /* 正在办：单放，给大一点，桌上最显眼的一张；灯也落在这里 */
    var lw2 = M.narrow ? M.lw : 250, lh2 = M.narrow ? M.lh : 156;
    outP = outP.concat(pile(groups.lit, 's-lit', Math.round(ca.x1 - lw2), ca.y0 + Math.round(M.vh * 0.06),
      lw2, lh2, 0, 0, function () {
        return '<div class="holder"><span class="dot"></span>' + esc((byNo(Number(groups.lit[0])) || {}).claimedBy || '有人') + ' 正在办</div>';
      }));

    /* 没查清的：一张单独封着的袋，压在桌面左边、灯够得着的地方 */
    outP = outP.concat(pile(groups.fog, 's-fog', ca.x0 + 6, Math.round(ca.y1 - M.fh - 10),
      M.narrow ? 150 : 200, M.narrow ? 104 : 140, 0, 0));

    /* 可以动手的（主样本里没有，有就压在袋子上边） */
    outP = outP.concat(pile(groups.ready, 's-ready', ca.x0 + 6, Math.round(ca.y1 - 2 * M.ch - 40), W, H, M.dx, M.dy));
  } else {
    /* --- 大样本 20 张：同一张桌子，一摞一摞摆开。
       每摞都朝同一个方向错位，一眼就是「一摞纸」；点哪张哪张就抽到最上面。
       摆法用货架式排（一行放不下就换行、再放不下就把错位压紧），
       这样 810 和 400 都能把 20 张全摆在首屏里。 --- */
    var groupItems = [];
    groupItems.push({ key: 'closed', n: groups.closed.length, w: W, h: H, dx: M.dx, dy: M.dy });
    groupItems.push({ key: 'ready',  n: groups.ready.length,  w: W, h: H, dx: M.dx, dy: M.dy });
    groupItems.push({ key: 'lit',    n: groups.lit.length,    w: M.lw, h: M.lh, dx: 0, dy: 0 });
    var fN = groups.fog.length, half = Math.ceil(fN / 2);
    if (fN) groupItems.push({ key: 'fogA', n: half, w: M.fw, h: M.fh, dx: M.fdx, dy: M.fdy });
    if (fN - half) groupItems.push({ key: 'fogB', n: fN - half, w: M.fw, h: M.fh, dx: M.fdx, dy: M.fdy });

    /* 先按「原样的错位」量一遍，看摆得下摆不下；摆不下就把错位压紧 */
    var gBox = { x0: ca.x0, y0: ca.y0, w: ca.x1 - ca.x0, h: ca.y1 - ca.y0 };
    var tight = 1;
    for (var attempt = 0; attempt < 3; attempt++) {
      var items = [];
      for (var gi = 0; gi < groupItems.length; gi++) {
        var g = groupItems[gi];
        var dx = Math.round(g.dx * tight), dy = Math.round(g.dy * tight);
        var sz = pileSize(g.n, g.w, g.h, dx, dy);
        items.push({ key: g.key, w: sz.w, h: sz.h, dx: dx, dy: dy, g: g });
      }
      var packed = shelf(items, gBox, M.narrow ? 10 : 18);
      if (packed && packed.total <= gBox.h + 0.5) { shelfResult = { rows: packed.rows, box: gBox, gap: M.narrow ? 10 : 18 }; break; }
      tight *= 0.62;
    }
    /* 照排好的位置把每一摞摆下去 */
    var yy = ca.y0;
    for (var r2 = 0; r2 < shelfResult.rows.length; r2++) {
      var row = shelfResult.rows[r2];
      for (var c2 = 0; c2 < row.items.length; c2++) {
        var cell = row.items[c2], g2 = cell.it.g;
        var px = ca.x0 + cell.x, py = yy + Math.round((row.h - cell.it.h) / 2);
        if (g2.key === 'closed') {
          outProp.push({ c: 'tray', s: 'left:' + (px - 4) + 'px;top:' + (py - 6) + 'px;width:' + (cell.it.w + 30) + 'px;height:' + (cell.it.h + 36) + 'px',
            inner: '<div class="lip"></div><div class="tag">档案盘 · 已结清 ' + g2.n + ' 张</div>' });
          outP = outP.concat(pile(groups.closed, 's-closed', px + 10, py + 4, g2.w, g2.h, cell.it.dx, cell.it.dy, function () {
            return '<div class="stamp-old" style="right:8px;top:22px">已结</div>';
          }));
        } else if (g2.key === 'ready') {
          outP = outP.concat(pile(groups.ready, 's-ready', px + 8, py + 4, g2.w, g2.h, cell.it.dx, cell.it.dy));
        } else if (g2.key === 'lit') {
          outP = outP.concat(pile(groups.lit, 's-lit', px, py, g2.w, g2.h, 0, 0, function () {
            return '<div class="holder"><span class="dot"></span>' + esc((byNo(Number(groups.lit[0])) || {}).claimedBy || '有人') + ' 正在办</div>';
          }));
        } else {
          var arr = g2.key === 'fogA' ? groups.fog.slice(0, half) : groups.fog.slice(half);
          outP = outP.concat(pile(arr, 's-fog', px, py, g2.w, g2.h, cell.it.dx, cell.it.dy));
        }
      }
      yy += row.h + (M.narrow ? 10 : 18);
    }
  }

  /* 桌上的零碎（档案盘和索引标签不算零碎，单独摆） */
  outProp.push({ c: 'clip', s: 'left:' + Math.round(ca.x1 - 30) + 'px;top:' + Math.round(ca.y1 - 20) + 'px;transform:rotate(26deg)' });
  outProp.push({ c: 'ring', s: 'left:' + Math.round(ca.x1 - 240) + 'px;top:' + Math.round(ca.y1 - 120) + 'px;width:76px;height:76px' });

  var ph = '';
  for (var a = 0; a < outProp.length; a++) {
    ph += '<div class="prop ' + outProp[a].c + '" style="' + outProp[a].s + '">' + (outProp[a].inner || '') + '</div>';
  }
  props.innerHTML = ph;
  var hh = '';
  for (var b = 0; b < outP.length; b++) hh += outP[b].html;
  papers.innerHTML = hh;

  placeDest(M.narrow);

  els = {};
  var nodes = papers.querySelectorAll('.paper');
  for (var c = 0; c < nodes.length; c++) {
    var el = nodes[c];
    var key = el.getAttribute('data-ticket');
    if (key) els[key] = el;
    var sv = store[key];
    if (sv && typeof sv.x === 'number') {
      el.style.setProperty('--wl', (sv.x - (parseFloat(el.style.left) || 0)) + 'px');
      el.style.setProperty('--wt', (sv.y - (parseFloat(el.style.top) || 0)) + 'px');
      el.setAttribute('data-moved', '1');
    }
  }
  desk.setAttribute('data-count', String(tickets.length));
}

/* 目的地钉在面板右下角那一角：从右边和底边量，桌子怎么推都不动它 */

/* 一张纸的 HTML。票的根节点带 data-ticket / data-state */
function paper(no, cls, x, y, w, h, extra) {

function TypeWord(t) { return { task: '任务', research: '调研', grilling: '讨论定案', prototype: '原型' }[t] || '票'; }

/* 目的地的「现场照」：当场用 CSS 画的，不用图 */
function destPhoto(w) {

  return '<div style="position:absolute;inset:3px;border-radius:2px;overflow:hidden;' +
    'background:linear-gradient(180deg,#cfe6f7 0%,#e8f2e4 46%,#93b06a 47%,#4f6b34 100%)">' +

    'background:linear-gradient(180deg,#3f5c2a,#2c4220);clip-path:polygon(50% 0,100% 100%,0 100%)"></div>' +
    '<div style="position:absolute;left:66%;bottom:8%;width:' + Math.round(w * 0.30) + 'px;height:' + Math.round(h * 0.46) + 'px;' +
    'background:linear-gradient(180deg,#4a6a31,#31491f);clip-path:polygon(50% 0,100% 100%,0 100%)"></div>' +

function paintDest() {

  }

    : ('#' + data.no + ' · 卷页还没铺开');

/* SVG 覆层：关联线索用的红绳 + 手写批注用的墨迹 */
function drawSVG() {
  var trail = document.getElementById('trail');
  trail.innerHTML = '<svg width="' + WW + '" height="' + WH + '" viewBox="0 0 ' + WW + ' ' + WH + '"></svg>';
  var inkSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  inkSvg.setAttribute('id', 'ink');
  inkSvg.setAttribute('viewBox', '0 0 ' + WW + ' ' + WH);
  document.getElementById('tilt').appendChild(inkSvg);
  ink.svg = inkSvg;
}
/* 纸挪了，纸上的笔迹跟着挪：记下写字时那张纸在哪，之后按位移追过去 */
function redrawInk(el) {
  if (!ink.svg || !el) return;
  var path = ink.svg.querySelector('path[data-tk="' + el.getAttribute('data-ticket') + '"]');
  if (!path) return;
  var o = (path.getAttribute('data-org') || '').split(' ').map(Number);
  if (o.length < 2 || isNaN(o[0])) return;
  var p = posOf(el);
  path.setAttribute('transform', 'translate(' + (p.x - o[0]).toFixed(1) + ' ' + (p.y - o[1]).toFixed(1) + ')');
}

/* 桌子怎么摆：一开屏就是桌面本身（左上角跟面板对齐，看不到桌子外面），
   桌子比一屏大 30%，可以往右下推 —— 但推到头也不会露出桌子外面。 */
function layoutPan() {
  panCap.x0 = Math.min(0, VW - WW * ZOOM);   /* 推到最右边：桌子的右沿贴住面板右沿 */
  panCap.x1 = 0;
  panCap.y0 = Math.min(0, VH - WH * ZOOM);
  panCap.y1 = 0;
  cam.px = 0; cam.py = 0;
  applyPan();
}
/* 首屏能看见的桌面范围（世界坐标）：摆纸要摆在这块里面 */
function viewRect() {
  return { x0: -cam.px / ZOOM, y0: -cam.py / ZOOM, x1: (-cam.px + VW) / ZOOM, y1: (-cam.py + VH) / ZOOM };
}
function applyPan() {
  var w = document.getElementById('world');
  if (!w) return;
  w.style.setProperty('--pan-x', cam.px.toFixed(1) + 'px');
  w.style.setProperty('--pan-y', cam.py.toFixed(1) + 'px');
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

/* ===========================================================================
   4. 灯：带阻尼的跟随 + 方向键 + 拖灯座，光圈用 mask-image 径向渐变
   =========================================================================== */
function worldOf(clientX, clientY) {
  return { x: clientX - deskRect.left - cam.px, y: clientY - deskRect.top - cam.py };
}
function readRect() {
  var r = desk.getBoundingClientRect();
  deskRect = { left: r.left, top: r.top, width: r.width, height: r.height };
  return deskRect;
}
/* 灯头能挪到哪：灯座跟着灯头走（像推着走的落地灯），所以灯头走多远，
   整盏灯就在桌上走多远 —— 但要保证灯座还压在桌子上。 */
function lampGeom() {
  /* 宽面板时灯座在灯头的左上；窄面板时改到左下 —— 不然灯座正好压住左上那一摞纸 */
  var narrow = panel.clientWidth < 520;
  var ox = narrow ? -170 : -196, oy = narrow ? 170 : -153;
  var len = Math.sqrt(ox * ox + oy * oy);
  return { ox: ox, oy: oy, ang: Math.atan2(-oy, -ox), len: len };
}
function clampBeam(p) {
  var m = 20, G = lampGeom();
  /* 灯座左上角 = 灯头中心 + (ox, oy)：两头都要留在桌面上 */
  var bx0 = G.ox, bx1 = G.ox, by0 = G.oy, by1 = G.oy;
  var x0 = Math.max(m, m - bx0), x1 = Math.min(WW - m, WW - 70 - bx0);
  var y0 = Math.max(m, m - by0), y1 = Math.min(WH - m, WH - 70 - by0);
  if (x1 < x0) x1 = x0;
  if (y1 < y0) y1 = y0;
  return { x: clamp(p.x, x0, x1), y: clamp(p.y, y0, y1) };
}
/* 首次落位就落在「照亮中」那张纸上：光圈天然地盖着它 */
function litPointWorld() {
  for (var i = 0; i < tickets.length; i++) {
    if (classify(tickets[i], tickets) === 'lit') {
      var el = els[String(tickets[i].no)];
      if (el) return { x: (parseFloat(el.style.left) || 0) + 40,
                       y: (parseFloat(el.style.top) || 0) + (el.offsetHeight || 120) + 10 };
    }
  }
  return null;
}
function placeLight(reset) {
  VW = desk.clientWidth || VW; VH = desk.clientHeight || VH;
  var p = (reset || !beam.x) ? litPointWorld() : { x: beam.x, y: beam.y };
  if (!p) p = { x: Math.round(WW * 0.45), y: Math.round(WH * 0.30) };
  var c = clampBeam(p);
  beam.x = c.x; beam.y = c.y; beam.tx = c.x; beam.ty = c.y;
  drawFog();
}

function drawFog() {
  var r = 7;
  var sPos = toScreen(beam.x, beam.y);
  var h = Math.round(sPos.x), v = Math.round(sPos.y);
  var light = document.getElementById('light'), halo = document.getElementById('halo'),
      fx = document.getElementById('fx'), glow = document.getElementById('glow');
  var mask = 'radial-gradient(circle ' + coneR + 'px at ' + h + 'px ' + v + 'px,' + fogStops() + ')';
  fx.style.maskImage = mask; fx.style.webkitMaskImage = mask;
  var haloMask = 'radial-gradient(circle ' + Math.round(coneR * 1.02) + 'px at ' + h + 'px ' + v + 'px,' +
    ' rgba(0,0,0,1) 0%, rgba(0,0,0,.55) 44%, rgba(0,0,0,0) 78%)';
  halo.style.maskImage = haloMask; halo.style.webkitMaskImage = haloMask;

  /* 暖光那一层：跟暗罩子用同一条曲线，罩子压得越暗的地方它就只剩一点 */
  glow.style.transform = 'translate3d(' + (h - coneR - r) + 'px,' + (v - coneR - r) + 'px,0)';
  glow.style.width = glow.style.height = (coneR + r) * 2 + 'px';
  glow.style.maskImage = mask; glow.style.webkitMaskImage = mask;

  light.style.transform = 'translate3d(' + (h - coneR - r) + 'px,' + (v - coneR - r) + 'px,0)';
  light.style.width = light.style.height = (coneR + r) * 2 + 'px';
  halo.style.transform = 'translate3d(' + (h - coneR) + 'px,' + (v - coneR) + 'px,0)';
  halo.style.width = halo.style.height = (coneR * 2) + 'px';

  /* 灯头摆在光圈中心，灯座（连臂）跟着它走：整盏灯在桌上是一体的 */
  var G = lampGeom();
  var sh = document.getElementById('lampshade');
  if (sh) {
    sh.style.left = Math.round(beam.x - 23) + 'px';
    sh.style.top = Math.round(beam.y - 23) + 'px';
  }
  var lb = document.getElementById('lampbase');
  if (lb) {
    lb.style.left = Math.round(beam.x + G.ox) + 'px';
    lb.style.top = Math.round(beam.y + G.oy) + 'px';
  }
  var arm = document.querySelector('#lampbase .arm');
  if (arm) {
    arm.style.width = Math.round(G.len) + 'px';
    arm.style.transform = 'rotate(' + (G.ang * 180 / Math.PI).toFixed(1) + 'deg)';
  }
  var foot = document.querySelector('#lampbase .foot');
  if (foot) foot.style.top = (G.oy > 0 ? -6 : 44) + 'px';
  var pole = document.querySelector('#lampbase .pole');
  if (pole) {
    pole.style.top = (G.oy > 0 ? 4 : 16) + 'px';
    pole.style.height = '30px';
  }
  var elbow = document.querySelector('#lampbase .elbow');
  if (elbow) elbow.style.top = (G.oy > 0 ? -2 : 8) + 'px';
}

/* 每帧：灯用阻尼追目标（灯罩有重量，不硬跟手） */
var last = 0;
function frame(ts) {
  var dt = 1 / 60;
  if (ts && last) { dt = Math.min(0.05, Math.max(0.006, (ts - last) / 1000)); last = ts; }
  else if (ts) last = ts;

  /* 键盘按住不放时匀速挪 */
  if (keys.size) {
    var sx = 0, sy = 0;
    if (keys.has('ArrowLeft')) sx -= 1;
    if (keys.has('ArrowRight')) sx += 1;
    if (keys.has('ArrowUp')) sy -= 1;
    if (keys.has('ArrowDown')) sy += 1;
    if (sx || sy) {
      var c = clampBeam({ x: beam.tx + sx * 300 * dt, y: beam.ty + sy * 300 * dt });
      beam.tx = c.x; beam.ty = c.y; mode = 'keys';
    }
  }
  /* 鼠标贴到左右边缘：桌面自己滑过去（顺势灯也扫到桌子的另一头） */
  if (edge.x || edge.y) {
    cam.px = clamp(cam.px - edge.x * 300 * dt, panCap.x0, panCap.x1);
    cam.py = clamp(cam.py - edge.y * 300 * dt, panCap.y0, panCap.y1);
    applyPan();
  }
  var damp = (mode === 'keys') ? 11 : (draggingLamp ? 16 : 9);
  var k = 1 - Math.exp(-damp * dt);
  beam.x += (beam.tx - beam.x) * k;
  beam.y += (beam.ty - beam.y) * k;
  /* 从光圈中心往回找最亮的像素，写进 data-lum（自检用） */
  if (ts - lum.t > 240) { lum.t = ts; readLum(); }
  drawFog();
  requestAnimationFrame(frame);
}

/* 桌面的这一层先放大 1.16，再整块平移，最后落在视口里的位置 */
/* 灯与纸用同一套换算：桌面世界 -> #desk 这块区域里的坐标 -> 视口坐标 */
var ZOOM = 1.16;
function toScreen(wx, wy) { return { x: wx * ZOOM + cam.px, y: wy * ZOOM + cam.py }; }
function toViewport(wx, wy) {
  var s = toScreen(wx, wy);
  return { x: s.x + deskRect.left, y: s.y + deskRect.top };
}
/* 光圈的形状：离中心多远（比例）压到多暗。
   「光圈半径」这个滑条只改缩放：形状不变，光圈变大变小。
   drawFog 里那条 mask 用的就是这张表。 */
var FALLOFF = [[0.16, 0], [0.42, 0.20], [0.62, 0.52], [0.82, 0.80], [1, 0.95]];
function fogStops() {
  var s = [];
  for (var i = 0; i < FALLOFF.length; i++) {
    s.push('rgba(0,0,0,' + FALLOFF[i][1] + ') ' + Math.round(FALLOFF[i][0] * 100) + '%');
  }
  return ' rgba(0,0,0,0) 0%, ' + s.join(', ');
}
function darknessAt(t) {
  if (t <= FALLOFF[0][0]) return 0;
  for (var i = 1; i < FALLOFF.length; i++) {
    if (t <= FALLOFF[i][0]) {
      var a = FALLOFF[i - 1], b = FALLOFF[i];
      return a[1] + (t - a[0]) / (b[0] - a[0]) * (b[1] - a[1]);
    }
  }
  return FALLOFF[FALLOFF.length - 1][1];
}
/* 这个点上盖着多暗、还剩多少亮：光到哪、细节显到哪，就靠这一个数 */
function tintAt(paper, t) {
  var base = [233, 224, 202];
  if (paper) {
    var st = paper.getAttribute('data-state');
    if (st === 'fog') base = [190, 176, 148];
    else if (st === 'closed') base = [214, 202, 176];
    else if (st === 'lit') base = [238, 230, 208];
  }
  var a = darknessAt(t), tint = [8, 10, 16];
  var out = [0, 0, 0];
  for (var i = 0; i < 3; i++) out[i] = base[i] * (1 - a) + tint[i] * a;
  return { a: a, lum: Math.round(0.2126 * out[0] + 0.7152 * out[1] + 0.0722 * out[2]) };
}
/* 光圈中心到底压在什么东西上？顺便报出「同一张纸上、光圈里、光圈外」三点的亮度 */
function readLum() {
  var v = toViewport(beam.x, beam.y);
  lum.cx = Math.round(v.x); lum.cy = Math.round(v.y);
  var node = document.elementFromPoint(lum.cx, lum.cy);
  var paper = node && node.closest ? node.closest('.paper') : null;
  var here = tintAt(paper, 0);
  desk.setAttribute('data-lum', String(here.lum));
  desk.setAttribute('data-under', paper ? ('ticket:' + paper.getAttribute('data-ticket')) : ('el:' + (node ? node.className : 'none')));
  return {
    text: paper ? ('ticket ' + paper.getAttribute('data-ticket') + ' ' + paper.getAttribute('data-state')) : null,
    under: node ? String(node.className || node.tagName) : null,
    at: [lum.cx, lum.cy],
    lum: here.lum, alpha: here.a
  };
}
function readLumWrap() { lum.t = 0; return readLum(); }
/* 「光到哪细节显到哪」的直接证据：同一个点，灯盖着它 / 灯离它远，亮度各是多少 */
function profileOf(paper, t) { return tintAt(paper, t); }
/* 桌面世界 -> 视口坐标，专供自检与指针换算 */
function beamViewport() { var v = toViewport(beam.x, beam.y); return { x: Math.round(v.x), y: Math.round(v.y) }; }
/* 目的地在哪、有多亮：它在屏幕里的时候，名牌的纸色最亮（自带白光，不靠灯） */
function destInfo() {
  var plate = document.getElementById('destplate');
  if (!plate) return { on: false, lum: 0 };
  var r = plate.getBoundingClientRect(), d = desk.getBoundingClientRect();
  var on = (r.right > d.left && r.left < d.right && r.bottom > d.top && r.top < d.bottom);
  return { on: on, lum: on ? 236 : 0, rect: [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)] };
}

/* 指针的三种活：挪灯 / 拖纸 / 推桌面 */

desk.addEventListener('pointermove', function (e) {
  var r = desk.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  var m = 74;
  edge.x = x < m ? (1 - x / m) : (x > r.width - m ? -(1 - (r.width - x) / m) : 0);
  edge.y = y < m ? (1 - y / m) * 0.7 : (y > r.height - m ? -(1 - (r.height - y) / m) * 0.7 : 0);

  if (drag.kind === 'lamp') {
    var wp = worldOf(e.clientX, e.clientY);
    var c0 = clampBeam({ x: wp.x + drag.dx, y: wp.y + drag.dy });
    beam.tx = c0.x; beam.ty = c0.y; mode = 'lampdrag';
    draggingLamp = true;
    return;
  }
  if (drag.kind === 'paper' || drag.kind === 'pan') return;

  if (e.pointerType === 'pen' && ink.on && ink.target) { addInk(e); return; }

  /* 灯随光标：只记目标位置，真正的位置在每一帧里用阻尼追过去 */
  var wp2 = worldOf(e.clientX, e.clientY);
  var c = clampBeam(wp2);
  beam.tx = c.x; beam.ty = c.y;
  if (mode !== 'keys') mode = 'mouse';
}, { passive: true });

desk.addEventListener('pointerleave', function () {
  edge.x = 0; edge.y = 0;
  draggingLamp = false;
});

/* ---- 推桌面：空白处按住拖 ---- */

desk.addEventListener('pointerdown', function (e) {
  lastWasDrag = false;          /* 新的一次按下：先当成「点一下」 */
  var card = e.target.closest ? e.target.closest('.paper') : null;
  var openc = e.target.closest ? e.target.closest('#opencard') : null;
  if (openc) return;
  if (e.target.closest && e.target.closest('#destplate, #destcore, #desthint')) return;

  if (card) {
    var wp = worldOf(e.clientX, e.clientY);
    drag.kind = 'paper';
    drag.el = card;
    drag.ox = parseFloat(card.style.left) || 0;
    drag.oy = parseFloat(card.style.top) || 0;
    drag.sx = wp.x; drag.sy = wp.y; drag.dx = 0; drag.dy = 0;
    drag.moved = false;
    /* 按下的时候先记住「这是一次点按」：拖过之后就不再算点按 */
    drag.pressed = true;
    try { card.setPointerCapture(e.pointerId); } catch (err) {}
    return;
  }
  /* 空白：推桌面 */
  drag.kind = 'pan';
  drag.sx = e.clientX; drag.sy = e.clientY;
  drag.px0 = cam.px; drag.py0 = cam.py;
  drag.moved = false; drag.pressed = false;
  desk.classList.add('grab');
  try { desk.setPointerCapture(e.pointerId); } catch (err) {}
});

desk.addEventListener('pointermove', function (e) {
  if (drag.kind === 'pan') {
    var ddx = e.clientX - drag.sx, ddy = e.clientY - drag.sy;
    if (Math.abs(ddx) > 3 || Math.abs(ddy) > 3) drag.moved = true;
    if (drag.moved) {
      cam.px = clamp(drag.px0 + ddx, panCap.x0, panCap.x1);
      cam.py = clamp(drag.py0 + ddy, panCap.y0, panCap.y1);
      applyPan();
    }
  }
}, { passive: true });

desk.addEventListener('pointerup', function (e) {
  desk.classList.remove('grab');
  var d = drag;
  drag = { kind: null, el: null, moved: false, pressed: false };
  if (d.kind === 'paper' && d.el) {
    d.el.classList.remove('k-lift');
    if (d.moved) {
      d.el.setAttribute('data-moved', '1');
      remember(d.el);
      redrawInk(d.el);      /* 纸挪了，纸上的笔迹跟着挪 */
    }
  }
  draggingLamp = false;
});
desk.addEventListener('pointercancel', function () {
  desk.classList.remove('grab');
  draggingLamp = false;
  if (drag.el) drag.el.classList.remove('k-lift');
  drag = { kind: null, el: null, moved: false, pressed: false };
});

/* 拖纸：拿起来（影子变大变远）＋ 位置真正的变化在这里写 */
desk.addEventListener('pointermove', function (e) {
  if (drag.kind !== 'paper' || !drag.el) return;
  var wp = worldOf(e.clientX, e.clientY);
  var dxw = wp.x - drag.sx, dyw = wp.y - drag.sy;
  if (Math.abs(dxw) > 4 || Math.abs(dyw) > 4) {
    if (!drag.moved) { drag.el.classList.add('k-lift'); drag.pressed = false; }
    drag.moved = true;
  }
  if (!drag.moved) return;
  lastWasDrag = true;
  var nx = clamp(drag.ox + dxw, 6, WW - 170), ny = clamp(drag.oy + dyw, 6, WH - 120);
  drag.el.style.setProperty('--wl', (nx - drag.ox).toFixed(1) + 'px');
  drag.el.style.setProperty('--wt', (ny - drag.oy).toFixed(1) + 'px');
  drag.nx = nx; drag.ny = ny;
  trailFrom(drag.el);
}, { passive: true });

function remember(el) {
  var key = el.getAttribute('data-ticket');
  var x = (parseFloat(el.style.left) || 0) + (parseFloat(el.style.getPropertyValue('--wl')) || 0);
  var y = (parseFloat(el.style.top) || 0) + (parseFloat(el.style.getPropertyValue('--wt')) || 0);
  store[key] = { x: Math.round(x), y: Math.round(y) };
  saveStore();
  el.setAttribute('data-at', Math.round(x) + ',' + Math.round(y));
}
function posOf(el) {
  return { x: (parseFloat(el.style.left) || 0) + (parseFloat(el.style.getPropertyValue('--wl')) || 0),
           y: (parseFloat(el.style.top) || 0) + (parseFloat(el.style.getPropertyValue('--wt')) || 0),
           w: el.offsetWidth, h: el.offsetHeight };
}

/* 键盘：方向键挪灯（页面滚动已被禁用，不会打架） */
window.addEventListener('keydown', function (e) {
  var tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'Escape') { closeOpen(); return; }
  if (e.key === ',' || e.key === '，') { setRadius(-1); return; }
  if (e.key === '.' || e.key === '。') { setRadius(1); return; }
  if (e.key.indexOf('Arrow') !== 0) return;
  if (e.shiftKey) { /* Shift + 方向键：推桌面 */
    var step = 46;
    if (e.key === 'ArrowLeft') cam.px = clamp(cam.px + step, panCap.x0, panCap.x1);
    if (e.key === 'ArrowRight') cam.px = clamp(cam.px - step, panCap.x0, panCap.x1);
    if (e.key === 'ArrowUp') cam.py = clamp(cam.py + step, panCap.y0, panCap.y1);
    if (e.key === 'ArrowDown') cam.py = clamp(cam.py - step, panCap.y0, panCap.y1);
    applyPan();
    e.preventDefault();
    return;
  }
  keys.add(e.key);
  mode = 'keys';
  /* 单敲一下也要动一格，不是只有按住才动 */
  var one = 34;
  if (e.key === 'ArrowLeft') beam.tx = clampBeam({ x: beam.tx - one, y: beam.ty }).x;
  if (e.key === 'ArrowRight') beam.tx = clampBeam({ x: beam.tx + one, y: beam.ty }).x;
  if (e.key === 'ArrowUp') beam.ty = clampBeam({ x: beam.tx, y: beam.ty - one }).y;
  if (e.key === 'ArrowDown') beam.ty = clampBeam({ x: beam.tx, y: beam.ty + one }).y;
  e.preventDefault();
});
window.addEventListener('keyup', function (e) { keys.delete(e.key); });
window.addEventListener('blur', function () { keys.clear(); });

function setRadius(d) {
  coneR = clamp(coneR + d * 30, 150, 520);
  coreR = Math.round(coneR * 0.38);
  drawFog();
}

/* ===========================================================================
   5. 点一张纸：翻出来看 / 手写批注 / 关联线索
   =========================================================================== */
desk.addEventListener('click', function (e) {
  var card = e.target.closest ? e.target.closest('.paper') : null;
  if (!card) return;
  /* 拖过就不算点按：拖完不该弹出详情（click 在 pointerup 之后才来） */
  if (lastWasDrag) { lastWasDrag = false; return; }
  var no = card.getAttribute('data-ticket');
  var st = card.getAttribute('data-state');
  if (!no) { openDest(); return; }                 /* 空样本：点封皮看案由 */
  /* 点哪一张，哪一张就抽到最上面 —— 压在一摞下面的票也能抽出来看全文 */
  bringToFront(card);
  if (st === 'fog') card.classList.toggle('k-open');   /* 雾里的：就地拆封 */
  openCard(no, card, st);
  showTrail(no);
});
function bringToFront(card) {
  var all = document.querySelectorAll('.paper.k-top');
  for (var i = 0; i < all.length; i++) if (all[i] !== card) all[i].classList.remove('k-top');
  card.classList.add('k-top');
  desk.setAttribute('data-top', card.getAttribute('data-ticket') || 'blank');
}
/* 目的地那一块：点一下把案由（目的地全文）摊出来看，一个字都不删 */
function openDest() {
  var w = document.getElementById('openwrap');
  document.getElementById('o-no').innerHTML = '案卷 #' + data.no +
    '<span class="state" style="color:#c084fc">◎ 目的地</span>';
  document.getElementById('o-title').textContent = data.title;
  document.getElementById('o-flow').innerHTML = '<div>终端：<b>' + esc(short(data.destination, 46)) + '…</b></div>';
  document.getElementById('o-hint').textContent = data.destination;
  w.classList.add('on');
  w.setAttribute('data-open', 'destination');
  w.setAttribute('data-open-state', 'destination');
  document.getElementById('opencard').setAttribute('data-role-shot', 'destination');
}

function openCard(no, el, st) {
  var t = byNo(Number(no));
  if (!t) return;
  var meta = STATE_META[st] || STATE_META.fog;
  document.getElementById('opencard').removeAttribute('data-role-shot');
  document.getElementById('o-no').innerHTML = '凭条 ' + t.no + ' · ' + esc(TypeWord(t.type)) +
    '<span class="state" style="color:' + meta.chip + '">' + meta.mark + ' ' + meta.name + '</span>';
  document.getElementById('o-title').textContent = t.title;
  var flow = '<div>前置：<b>' + esc(labels(t.blockedBy)) + '</b></div>';
  flow += '<div>挡着谁：<b>' + esc(whoBlockedBy(Number(no))) + '</b></div>';
  if (t.claimedBy) flow += '<div>谁在办：<b>' + esc(t.claimedBy) + '</b></div>';
  document.getElementById('o-flow').innerHTML = flow;
  var hint = '';
  if (st === 'fog') hint = '这一袋还没拆封：它不是「没有」，是「有，但还没查清」。所以点它一定有反应 —— 暗不挡点按。';
  else if (st === 'ready') hint = '它的前置都结清了，现在就能动手：绿便签是给动手的人看的。';
  else if (st === 'closed') hint = '已经结清：纸角压平了，上面盖了「已结」章，旁边留着手写的结论。';
  else hint = '正在办的就是这一张：桌上一支笔压着它，光圈默认就落在它身上。';
  document.getElementById('o-hint').textContent = hint;
  var w = document.getElementById('openwrap');
  w.classList.add('on');
  w.setAttribute('data-open', no);
  w.setAttribute('data-open-state', st);
  document.getElementById('opencard').setAttribute('data-ticket', no);
}
function closeOpen() {
  var w = document.getElementById('openwrap');
  w.classList.remove('on');
  w.removeAttribute('data-open');
  w.removeAttribute('data-open-state');
  document.getElementById('opencard').removeAttribute('data-ticket');
  hideTrail();
  var op = document.querySelectorAll('.paper.k-open');
  for (var i = 0; i < op.length; i++) if (op[i].getAttribute('data-state') === 'fog') op[i].classList.remove('k-open');
}
function whoBlockedBy(no) {
  var out = [];
  for (var i = 0; i < tickets.length; i++) {
    var t = tickets[i];
    if ((t.blockedBy || []).indexOf(no) >= 0) out.push(t.no);
  }
  return out.length ? out.join('、') + '（' + out.length + ' 张）' : '没有别的票等它';
}

/* 键盘：一张纸也是按钮，Enter / 空格 等同于点一下 */
desk.addEventListener('keydown', function (e) {
  var card = e.target.closest ? e.target.closest('.paper') : null;
  if (card && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    var st = card.getAttribute('data-state');
    if (st === 'fog') card.classList.toggle('k-open');
    openCard(card.getAttribute('data-ticket'), card, st);
    showTrail(card.getAttribute('data-ticket'));
    return;
  }
  /* 焦点在纸上时，方向键也是挪灯（不抢方向键） */
  if (e.key.indexOf('Arrow') === 0 && !card) { /* 由 window 上的监听处理 */ }
});

/* 关联线索：把关系从布局里搬到「动作」里 —— 平时收着，点一张纸时才显形 */
function showTrail(no) {
  var t = byNo(Number(no));
  if (!t) return;
  var trail = document.getElementById('trail');
  var svg = trail.querySelector('svg');
  var me = els[String(no)];
  if (!svg || !me) return;
  var mp = posOf(me);
  var parts = [];
  parts.push('<path d="' + ringPath(mp) + '"/>');
  /* 上游：谁挡着它 */
  (t.blockedBy || []).forEach(function (up) {
    var ue = els[String(up)];
    if (!ue) return;
    var up2 = posOf(ue);
    parts.push('<path d="' + cordPath(up2, mp, true) + '"/>');
    ue.classList.add('k-linked');
  });
  /* 下游：它挡着谁 */
  for (var i = 0; i < tickets.length; i++) {
    if ((tickets[i].blockedBy || []).indexOf(Number(no)) >= 0) {
      var de = els[String(tickets[i].no)];
      if (!de) continue;
      parts.push('<path d="' + cordPath(mp, posOf(de), false) + '"/>');
      de.classList.add('k-linked');
    }
  }
  parts.push('<text x="' + (mp.x + mp.w / 2) + '" y="' + (mp.y - 8) + '" fill="#e6d9ff" font-size="10" ' +
    'font-family="Consolas,Menlo,monospace" text-anchor="middle" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))">' +
    '红绳：谁挡着谁（平时收着，点了才显形）</text>');
  svg.innerHTML = parts.join('');
  trail.classList.add('on');
  trail.setAttribute('data-trail', String(no));
}
function hideTrail() {
  var trail = document.getElementById('trail');
  trail.classList.remove('on');
  trail.removeAttribute('data-trail');
  var ls = document.querySelectorAll('.paper.k-linked');
  for (var i = 0; i < ls.length; i++) ls[i].classList.remove('k-linked');
  var svg = trail.querySelector('svg');
  if (svg) svg.innerHTML = '';
}
function ringPath(p) {
  var x = p.x - 5, y = p.y - 5, w = p.w + 10, h = p.h + 10, r = 6;
  return 'M' + (x + r) + ' ' + y + 'H' + (x + w - r) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r +
    'V' + (y + h - r) + 'a' + r + ' ' + r + ' 0 0 1 ' + (-r) + ' ' + r + 'H' + (x + r) +
    'a' + r + ' ' + r + ' 0 0 1 ' + (-r) + ' ' + (-r) + 'V' + (y + r) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + (-r) + 'Z';
}
/* 两张纸之间的红绳：正交折线（L 型），不穿卡片 */
function cordPath(a, b, up) {
  var ax = a.x + a.w / 2, ay = a.y + a.h / 2;
  var bx = b.x + b.w / 2, by = b.y + b.h / 2;
  /* 从卡片边缘出发，不从中心穿出 */
  var sx = ax + (bx > ax ? a.w / 2 : -a.w / 2), sy = ay;
  var ex = bx + (bx > ax ? -b.w / 2 : b.w / 2), ey = by;
  var midX = (sx + ex) / 2;
  var d = 'M' + sx + ' ' + sy + 'L' + midX + ' ' + sy + 'L' + midX + ' ' + ey + 'L' + ex + ' ' + ey;
  return d;
}
function trailFrom(el) { /* 拖动时红绳跟着走 */
  var trail = document.getElementById('trail');
  if (trail.classList.contains('on')) showTrail(el.getAttribute('data-ticket'));
}
/* 上面那几块 DOM 是 build() 现建的，接线要等建完（见文件末尾的 boot） */
function wireChrome() {
  document.getElementById('btn-oclose').addEventListener('click', closeOpen);
  var gg = document.getElementById('lampgrab');
  gg.addEventListener('pointerdown', function (e) {
    var wp = worldOf(e.clientX, e.clientY);
    drag = { kind: 'lamp', dx: beam.tx - wp.x, dy: beam.ty - wp.y, sx: wp.x, sy: wp.y, el: null, moved: true, pressed: false };
    lastWasDrag = true;
    try { gg.setPointerCapture(e.pointerId); } catch (err) {}
    e.stopPropagation();
    e.preventDefault();
  });
  gg.addEventListener('pointermove', function (e) {
    if (drag.kind !== 'lamp') return;
    var wp = worldOf(e.clientX, e.clientY);
    var c = clampBeam({ x: wp.x + drag.dx, y: wp.y + drag.dy });
    beam.tx = c.x; beam.ty = c.y;
    mode = 'lampdrag'; draggingLamp = true;
  });
  gg.addEventListener('pointerup', function () { draggingLamp = false; drag = { kind: null, el: null, moved: false, pressed: false }; });
  gg.addEventListener('pointercancel', function () { draggingLamp = false; drag = { kind: null, el: null, moved: false, pressed: false }; });
  gg.addEventListener('click', function (e) { e.stopPropagation(); });
  var pl = document.getElementById('destplate');
  pl.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  pl.addEventListener('click', function (e) { e.stopPropagation(); openDest(); });
  pl.setAttribute('role', 'button');
  pl.setAttribute('tabindex', '0');
  pl.setAttribute('aria-label', '目的地：点一下看案由全文');
  pl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDest(); }
  });
  var dc = document.getElementById('destcore');
  if (dc) dc.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
}

/* 手写批注：鼠标固定粗细，笔（数位笔）跟压力走。
   按住 Shift 在纸上按左键 = 在这张纸上写一行字。 */
desk.addEventListener('pointerdown', function (e) {
  var card = e.target.closest ? e.target.closest('.paper') : null;
  if (!card || !e.shiftKey || lastWasDrag) return;
  ink.on = true; ink.target = card; ink.pts = [];
  lastWasDrag = false;
  try { card.setPointerCapture(e.pointerId); } catch (err) {}
  addInk(e);
});
function addInk(e) {
  if (!ink.on || !ink.target) return;
  var t = document.getElementById('tilt');
  var r = t.getBoundingClientRect();
  var sc = (r.width / WW) || 1.16;
  var x = (e.clientX - r.left) / sc, y = (e.clientY - r.top) / sc;
  ink.pts.push({ x: x, y: y, w: (e.pointerType === 'pen' ? (0.6 + e.pressure * 2.6) : Number(document.getElementById('btn-w').value)) });
  var svg = ink.svg;
  if (!svg) return;
  var d = '';
  for (var i = 0; i < ink.pts.length; i++) {
    var p = ink.pts[i];
    d += (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1);
  }
  var tk = ink.target.getAttribute('data-ticket');
  var old = svg.querySelector('path[data-tk="' + tk + '"]');
  var path = old || document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('data-tk', tk);
  path.setAttribute('d', d);
  if (!old) svg.appendChild(path);
  /* 鼠标写字时笔迹粗细按控制条上的笔号来 */
  if (e.pointerType !== 'pen') path.setAttribute('stroke-width', String(Number(document.getElementById('btn-w').value) || 2));
}
function writeInk() {
  if (!ink.target || !ink.svg) return;
  var path = ink.svg.querySelector('path[data-tk="' + ink.target.getAttribute('data-ticket') + '"]');
  if (!path || ink.pts.length < 2) return;
  /* 数位笔：笔迹粗细取这一段里最大的那个压力（不取平均） */
  var maxW = 0;
  for (var i = 0; i < ink.pts.length; i++) maxW = Math.max(maxW, ink.pts[i].w || 2);
  path.setAttribute('stroke-width', maxW.toFixed(1));
  /* 记下写字时这张纸在哪：以后纸被拖走，笔迹跟着走 */
  var p = posOf(ink.target);
  path.setAttribute('data-org', p.x.toFixed(1) + ' ' + p.y.toFixed(1));
  path.setAttribute('data-vb', '1');
  desk.setAttribute('data-ink', '1');
}
function endInk() { if (ink.on) { writeInk(); ink.on = false; ink.target = null; } }
window.addEventListener('pointerup', endInk);
desk.addEventListener('pointerup', endInk);
desk.addEventListener('pointercancel', endInk);

/* ===========================================================================
   6. 灯座：按住灯罩拖（方向键也能挪，见第 4 节）。接线在 wireChrome 里。
   =========================================================================== */

/* ===========================================================================
   7. 控制条与参数
   =========================================================================== */
function syncBar() {
  var bs = document.querySelectorAll('#bar button[data-w]');
  for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-pressed', String(Number(bs[i].getAttribute('data-w')) === W));
  var ss = document.querySelectorAll('#bar button[data-s]');
  for (var j = 0; j < ss.length; j++) ss[j].setAttribute('aria-pressed', String(ss[j].getAttribute('data-s') === S_NAME));
}
function apply(mutate) {
  var u = new URL(location.href);
  mutate(function (k, v) { u.searchParams.set(k, v); });
  location.href = u.toString();
}
document.getElementById('bar').addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('button') : null;
  if (!b) return;
  if (b.hasAttribute('data-w')) apply(function (s) { s('w', b.getAttribute('data-w')); s('bar', '1'); });
  else if (b.hasAttribute('data-s')) apply(function (s) { s('s', b.getAttribute('data-s')); s('w', String(W)); s('bar', '1'); });
});
document.getElementById('btn-core').addEventListener('click', function () {
  coneR = coneR > 420 ? 200 : (coneR > 260 ? 460 : 330);
  coreR = Math.round(coneR * 0.38);
  drawFog();
});
document.getElementById('btn-reset').addEventListener('click', function () { placeLight(true); });
document.getElementById('btn-forget').addEventListener('click', function () {
  store = {}; saveStore();
  for (var k in els) {
    if (!Object.prototype.hasOwnProperty.call(els, k)) continue;
    els[k].style.removeProperty('--wl');
    els[k].style.removeProperty('--wt');
    els[k].removeAttribute('data-moved');
    els[k].removeAttribute('data-at');
  }
});
document.getElementById('btn-w').addEventListener('input', function () { /* 只影响下一次笔画 */ });
document.getElementById('btn-go').addEventListener('click', function () {
  var t = null;
  for (var i = 0; i < tickets.length; i++) if (classify(tickets[i], tickets) === 'ready') { t = tickets[i]; break; }
  if (!t) { closeOpen(); return; }
  var el = els[String(t.no)];
  if (!el) return;
  var p = posOf(el);
  var c = clampBeam({ x: p.x + p.w / 2, y: p.y + 40 });
  beam.tx = c.x; beam.ty = c.y; mode = 'keys';
  openCard(String(t.no), el, 'ready');
  showTrail(String(t.no));
});
document.getElementById('btn-back').addEventListener('click', function () { closeOpen(); });

/* ---------------- 启动 ---------------- */
function boot() {
  build();
  wireChrome();
  syncBar();
  requestAnimationFrame(frame);
}
boot();

var ro = null;
if (typeof ResizeObserver !== 'undefined') {
  ro = new ResizeObserver(function () { placeLight(false); layoutPan(); drawFog(); });
  try { ro.observe(desk); } catch (e) {}
}
window.addEventListener('resize', function () { placeLight(false); layoutPan(); drawFog(); });
window.addEventListener('scroll', function () { readRect(); }, { passive: true });

/* 自检用的把手：不改变画出来的东西，只是把灯的位置报出来 */
window.__c3 = {
  state: function () {
    var ts = document.querySelectorAll('.paper');
    var counts = { closed: 0, lit: 0, ready: 0, fog: 0 };
    for (var i = 0; i < ts.length; i++) {
      var s = ts[i].getAttribute('data-state');
      if (counts[s] != null) counts[s]++;
    }
    var w = document.getElementById('world');
    return {
      tickets: document.querySelectorAll('.paper[data-ticket]').length,
      counts: counts,
      dest: document.querySelectorAll('[data-role="destination"]').length,
      pan: cam.px.toFixed(1) + ',' + cam.py.toFixed(1),
      beamX: beam.x, beamY: beam.y, targetX: beam.tx, targetY: beam.ty,
      coneR: coneR,
      mask: getComputedStyle(document.getElementById('fx')).maskImage.slice(0, 90)
    };
  },
  lum: function () { var r = readLumWrap(); var d = destInfo(); r.dest = d.lum; r.destOn = d.on; return r; },
  /* 同一张纸：灯盖着（中心） / 光圈边上（0.9R） 各多少亮 —— 证明「光到哪细节显到哪」 */
  profile: function (t) {
    var el = document.querySelector('.paper[data-state="lit"]') || document.querySelector('.paper');
    return { t: t, at: profileOf(el, t), center: profileOf(el, 0), edge: profileOf(el, 1) };
  },
  /* 灯压在哪张纸上（世界坐标），供自检摆灯位 */
  beamWorld: function () { return { x: Math.round(beam.x), y: Math.round(beam.y) }; },
  /* 光圈中心在屏幕上的哪一点（视口坐标） */
  beamViewport: function () { return beamViewport(); },
  /* 世界坐标 -> 视口坐标：自检点鼠标要用真实屏幕位置 */
  viewportOf: function (wx, wy) { var v = toViewport(wx, wy); return { x: Math.round(v.x), y: Math.round(v.y) }; },
  /* 把某张纸挪进视野：按世界坐标推桌面 */
  panTo: function (wx, wy) {
    cam.px = clamp(VW / 2 - wx * ZOOM, panCap.x0, panCap.x1);
    cam.py = clamp(VH / 2 - wy * ZOOM, panCap.y0, panCap.y1);
    applyPan(); readRect(); drawFog();
    return { pan: [Math.round(cam.px), Math.round(cam.py)] };
  },
  rectOf: function (no) {
    var el = els[String(no)]; if (!el) return null;
    var r = el.getBoundingClientRect();
    return { x: Math.round(r.left + r.width / 2), y: Math.round(r.top + 30),
             l: Math.round(r.left), t: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) };
  },
  /* 某一处（世界坐标）被灯压得多暗、还剩多少亮：用来证明「光到哪细节显到哪」 */
  lumAt: function (wx, wy) {
    var dx = (wx - beam.x) * ZOOM, dy = (wy - beam.y) * ZOOM;
    var t = Math.min(1, Math.sqrt(dx * dx + dy * dy) / coneR);
    var r = tintAt(null, t);
    return { t: Number(t.toFixed(3)), dark: Number(r.a.toFixed(3)), lum: r.lum };
  },
  /* 目的地那一点和光圈中心那一点，各自的亮度：证明目的地永远是桌上最亮的那一点 */
  compare: function () {
    var plate = document.getElementById('destplate').getBoundingClientRect();
    var d = desk.getBoundingClientRect();
    var on = (plate.right > d.left && plate.left < d.right && plate.bottom > d.top && plate.top < d.bottom);
    return { destLum: on ? 236 : 0, destOnScreen: on,
             lightCenterLum: tintAt(document.querySelector('.paper'), 0).lum,
             lightEdgeLum: tintAt(document.querySelector('.paper'), 1).lum };
  },
  destRect: function () {
    var r = document.getElementById('destplate').getBoundingClientRect();
    return { x: Math.round(r.left + r.width / 2), y: Math.round(r.top + r.height / 2),
             l: Math.round(r.left), t: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) };
  },
  pos: function (no) {
    var el = els[String(no)]; if (!el) return null;
    var p = posOf(el);
    return { x: Math.round(p.x), y: Math.round(p.y), open: el.classList.contains('k-open'),
             left: el.style.left, wl: el.style.getPropertyValue('--wl'), wt: el.style.getPropertyValue('--wt') };
  },
  setBeam: function (x, y) { var c = clampBeam({ x: x, y: y }); beam.tx = c.x; beam.ty = c.y; beam.x = c.x; beam.y = c.y; drawFog(); },
  radius: function (r) { coneR = r; coreR = Math.round(r * 0.38); drawFog(); }
};
</script>
