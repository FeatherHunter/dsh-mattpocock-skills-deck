<div class="page-head">
  <h1>原型 · 去掉地形与山：三个新画法</h1>
  <p>地形不要了，山也不要了。留下来的只有三样：<b>雾</b>（表示还没看清）、<b>虚线的需求</b>当起点、<b>问号</b>当路上要过的关口；终点是雾里一团光——知道大概在哪个方向，但看不清是什么。</p>
  <p>三个设计换的是「用什么当画面的骨架」：一排门、一条分岔的路、一条主线带几个支线。每个都配一张走完之后的样子（雾散、问号变勾、终点清楚）。挑方向时以每节末尾的 132×82 真实尺寸为准。</p>
</div>

/* ================= 渲染 ================= */
function withIds(svg, suffix){
  return svg.replace(/id="([^"]+)"/g, 'id="$1-' + suffix + '"')
            .replace(/url\(#([^)]+)\)/g, 'url(#$1-' + suffix + ')');
}
function mini(svg, cap, suffix){
  return '<div class="mini">' + withIds(svg, suffix) + '<div class="cap">' + cap + '</div></div>';
}
function designHtml(d){
  var h = '<section class="direction" id="design-' + d.id + '">';
  h += '<h2><span class="no">' + d.no + '</span>' + d.name + '</h2>';
  h += '<p class="idea">' + d.idea + '</p>';
  h += '<div class="pair">';
  h += '<div class="artbox explore"><div class="who">探索地图</div>' + withIds(d.explore, d.id) + '<div class="cap">' + d.ecap + '</div></div>';
  h += '<div class="artbox impl"><div class="who">实施地图</div>' + withIds(d.impl, d.id) + '<div class="cap">' + d.icap + '</div></div>';
  h += '</div>';
  h += '<div class="mini-label">真实尺寸（132×82，放进选择卡就是这么大）：</div>';
  h += '<div class="minirow">' + mini(d.explore, d.ecap, d.id + "m") + mini(d.impl, d.icap, d.id + "m") + '</div>';
  h += '</section>';
  return h;
}
document.getElementById("root").innerHTML = DESIGNS.map(designHtml).join("");
</script>
