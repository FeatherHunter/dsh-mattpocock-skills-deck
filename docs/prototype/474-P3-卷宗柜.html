<title>原型 #474 · P3 · 卷宗柜（档案柜 / 卷宗 ＋ 全部技法）</title>
<!--
  PROTOTYPE — 一次性原型，不是生产代码，不要合进主干。
  issue：FeatherHunter/dsh-mattpocock-skills-deck#474


  这一版做什么（P3 · 卷宗柜 ＋ 全部技法）：
    把探案板推进「档案柜 / 卷宗」的物理世界：每一层是一只抽屉（一只档案袋），卡片是袋里装着的物证 / 纸片。
    柜体有木头与金属滑轨，档案袋是牛皮纸，物证是纸片，抽屉面贴着带手写感的标签。
    雾照旧是「整张遮罩挖洞」，只是这一次它盖住的是整个柜子，走过的地方被擦成一格一格柔边的洞。

  五条技法（每一条都能在页面上开关对照，见右下角控件栈与底部控制条）：
    1. 雾 = 整张遮罩挖洞   一整张 Canvas 雾盖住柜体，globalCompositeOperation='destination-out' +
                          径向渐变把走过的地方擦成柔边洞；雾里铺噪点；全亮 = 整张雾淡出。
    2. 状态色明度阶梯     四态按 CIE L* 排开（相邻 L* 差 ≥ 10），并给「红 / 绿 / 蓝三型色觉模拟」开关，
                          切换后整个页面的状态色跟着变（全部走 CSS 变量），页面里附一张可核对的色阶表。
    3. 扫亮动画           亮痕（这里是从上面那只抽屉牵过去的绳线）用 stroke-dashoffset 一段段扫过去，
                          进页面播放，右下角控件栈里有「重播」。
    4. 边角控件栈         右下角一列小方块：聚焦当前 / 一键全亮 / 图例 / 放大 / 缩小；底部一条数据条
                          （走亮 n/总 m · 雾 n）。学 Leaflet：位置固定、可折叠。
    5. 进度环按票分段     一段一张票（走亮绿、照亮中蓝、其余留空），环心写「2/4 走亮」。
                          另给一个「对照开关」，让人看到现在线上那个「已通过层数 + 1」的错口径差在哪。

  数据：地图 #604 的真实 Destination / 子票 / fogTotal / decisions（简报 §4 原文，一字未改）。
        另做「还没画图」（tickets: []）与「大图」（9 张票 4 层）两个示例状态。

  运行：双击本文件即可（无后端、无依赖、无 CDN、无定时器轮询）。
  URL 参数：?w=400|810  ?s=active|empty|big  ?bar=0  ?cvd=none|protan|deutan|tritan  ?ring=real|legacy  ?lit=1
-->
<style>
:root{
  /* 面板外壳（DSH 客户端既定配色） */
  --bg:#07080b;      --base:#10131a;   --l2:#16181d;    --bd:#2a2d35;    --bd2:#3a3f4a;
  --tx:#e6edf3;      --sec:#a1a1aa;    --cap:#8b8b95;   --map:#c084fc;   --warn:#f59e0b;
  /* 四态色：由 JS 按明度阶梯算出来写回这里（见 buildingLadder()），色觉模拟时整页跟着换 */
  --c-walk:#3f9f6a;  --c-view:#3f7fd0; --c-open:#c9f0c4; --c-fog:#5c5c77;
  /* 材质（木头 / 金属 / 牛皮纸 / 物证纸片 / 红线绳） */
  --wood:#4a3527;    --wood-hi:#5d4433; --wood-lo:#2c1f16;
  --steel:#9aa4b0;   --steel-lo:#4d5461;
  --kraft:#c9b28c;   --kraft-lo:#a68f6a; --kraft-dk:#8d7a5c;
  --paper:#e9e2d2;   --paper-lo:#dad2bf;
  --thread:#c0504a;
  --hand:"Segoe Print","Bradley Hand","Comic Sans MS","KaiTi","STKaiti",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-size:14px;line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
.pbadge{position:fixed;top:8px;left:8px;z-index:99999;background:#ff3b30;color:#fff;
  font:700 11px/1 -apple-system,sans-serif;padding:5px 9px;border-radius:99px;letter-spacing:.02em}
.stage{display:flex;justify-content:center;padding:46px 10px 120px}

/* ============================ 面板 ============================ */
.panel{background:var(--base);border:1px solid var(--bd);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.chrome{flex:none;display:flex;align-items:center;gap:7px;padding:8px 10px;
  background:var(--l2);border-bottom:1px solid var(--bd)}
.btn{font:500 11px/1.5 inherit;padding:3px 9px;border-radius:7px;border:1px solid var(--bd);
  background:var(--base);color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn:hover{border-color:var(--bd2);background:#1b1f27}
.btn:focus-visible{outline:2px solid var(--map);outline-offset:1px}
.btn.primary{background:var(--c-walk);border-color:transparent;color:#08150d;font-weight:700}
.btn.ghost{background:transparent;color:var(--sec)}
.crumb{font:500 10.5px/1.5 var(--mono);color:var(--cap);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipm{font:500 10px/1.6 var(--mono);padding:0 7px;border-radius:99px;border:1px solid rgba(192,132,252,.5);
  color:var(--map);background:rgba(192,132,252,.08);white-space:nowrap}
.sp{flex:1;min-width:0}
.panel.narrow .crumb{display:none}

.scroll{overflow-x:hidden}
.pad{padding:10px 12px 14px}

/* ---------- 目的地卷宗（柜顶那只最厚的卷宗，永远亮着） ---------- */
.descfolder{position:relative;margin:10px 12px 0;border:1px solid rgba(192,132,252,.42);border-radius:12px;
  padding:9px 11px 10px;display:flex;gap:12px;align-items:flex-start;
  background:linear-gradient(180deg,rgba(192,132,252,.12),rgba(88,166,253,.03) 68%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.descfolder::before{content:"";position:absolute;left:14px;top:-6px;width:74px;height:8px;border-radius:4px 4px 0 0;
  background:rgba(192,132,252,.30);border:1px solid rgba(192,132,252,.45);border-bottom:0}
.df-main{flex:1;min-width:0}
.dh{display:flex;align-items:center;gap:6px}
.dno{font:700 11px/1.4 var(--mono);padding:1px 6px;border-radius:6px;border:1px solid var(--map);color:var(--map);flex:none}
.dtitle{font-size:12.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlabel{font:600 10px/1.8 inherit;letter-spacing:.08em;color:var(--map);margin-top:6px}
.dtext{font-size:12.5px;line-height:1.7;color:#e9d5ff;max-height:88px;overflow:hidden}
.dtext.open{max-height:none}
.more{font-size:10.5px;color:var(--cap);background:none;border:0;padding:2px 0;cursor:pointer;font-family:inherit}
.more:hover{color:var(--tx)}
.vital{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.10)}
.vitem{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--sec)}
.vitem .n{font-family:var(--mono);font-weight:700;color:var(--tx)}
.vdot{width:8px;height:8px;border-radius:2px;flex:none;position:relative}
/* 状态不只靠颜色：每种状态再配一个字形 */
.vdot::after{content:attr(data-g);position:absolute;inset:0;font:700 7px/8px var(--mono);text-align:center;color:rgba(0,0,0,.75)}
.ringwrap{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.ringcap{font-size:9.5px;color:var(--cap);text-align:center;max-width:104px;line-height:1.45}
.ringcap.warn{color:var(--warn)}
.panel.narrow .descfolder{flex-direction:column}
.panel.narrow .ringwrap{flex-direction:row;align-items:center;gap:9px}
.panel.narrow .ringcap{text-align:left;max-width:170px}

/* ============================ 柜体 ============================ */
.cabinet{position:relative;margin:10px 12px 0;border-radius:12px;overflow:hidden;
  border:1px solid #1d1610;border-top-color:#5b422f;border-left-color:#3b2b1e;
  background:
    repeating-linear-gradient(91deg,rgba(255,255,255,.028) 0 1px,transparent 1px 5px),
    repeating-linear-gradient(93deg,rgba(0,0,0,.10) 0 2px,transparent 2px 9px),
    radial-gradient(120% 80% at 22% -10%,rgba(255,214,160,.10),transparent 58%),
    linear-gradient(180deg,var(--wood-hi),var(--wood) 34%,var(--wood-lo));
  box-shadow:inset 0 2px 0 rgba(255,220,180,.09),inset 0 -14px 26px rgba(0,0,0,.5)}
.cabhead{position:relative;z-index:2;display:flex;align-items:center;gap:7px;padding:9px 10px 8px;
  border-bottom:1px solid rgba(0,0,0,.45);background:linear-gradient(180deg,rgba(0,0,0,.30),rgba(0,0,0,.05))}
.cabhead .n{font:700 10px/1.6 var(--mono);padding:1px 6px;border-radius:5px;background:rgba(0,0,0,.42);color:#e8d6bb;border:1px solid rgba(255,255,255,.14)}
.cabhead .t{font-size:11px;color:#e5d2b6;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cabhead .to{font-size:10.5px;color:#ffd9a8;margin-left:auto;white-space:nowrap;font-weight:600}
.cabhead::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:5px;
  background:linear-gradient(180deg,rgba(0,0,0,.34),transparent)}
/* 挡板与抽屉之间的金属滑轨 */
.rail{position:absolute;top:0;bottom:0;width:9px;z-index:2;background:
  linear-gradient(90deg,var(--steel-lo),var(--steel) 45%,#c7cfd8 62%,var(--steel-lo));opacity:.5;
  box-shadow:inset 0 0 4px rgba(0,0,0,.6)}
.rail.l{left:0}.rail.r{right:0}
/* 雾层：一整张 canvas，盖在整个柜体上（柜顶挡板、滑轨、抽屉、纸片平面都盖住，
   但**不盖纸片本身** —— 层次是：柜体/抽屉底纸 → 雾 → 纸片/绳线 → 控件）。
   走过的地方用 destination-out + 径向渐变擦成真透明的柔边洞，露出来的是底纸＋纸片。 */
#foglayer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;
  transition:opacity .7s ease}
/* 绳线画在雾的上层（被雾盖住就看不见「谁挡着谁」了），外面套一层壳，
   让它在柜顶挡板那里就被裁掉 —— 免得终点标记旁边飘着半截标签 */
.strandclip{position:absolute;left:0;right:0;bottom:0;z-index:4;overflow:hidden;pointer-events:none}
#strands{position:absolute;left:0;top:0;width:100%;display:block}
.drawers{position:relative;z-index:2;padding:8px 12px 12px}

/* ---------- 一只抽屉 = 一只档案袋 ---------- */
.drawer{position:relative;margin-bottom:9px;border-radius:9px;
  background:linear-gradient(180deg,var(--kraft),var(--kraft-lo));
  border:1px solid #6d5c40;box-shadow:0 7px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22)}
.drawer:last-child{margin-bottom:0}
.drawer .dface{display:flex;align-items:center;gap:7px;padding:6px 9px 6px 8px;background:linear-gradient(180deg,#6a5138,#4c3a27);
  border-bottom:1px solid rgba(0,0,0,.45);border-radius:8px 8px 0 0;min-height:34px}
.drawer .pull{width:26px;height:7px;border-radius:4px;flex:none;
  background:linear-gradient(180deg,#e6ecf3,#96a2b0 55%,#5d6672);box-shadow:0 1px 2px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.7)}
.drawer .dlab{font:700 11.5px/1.5 var(--hand);color:#ffeecd;letter-spacing:.02em;
  transform:rotate(-.7deg);text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap}
.drawer .dnear{font-size:9.5px;color:#e0cdaa;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap}
.drawer .dcnt{font:700 10px/1.5 var(--mono);padding:0 5px;border-radius:99px;
  background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.16);color:#f0e2c6;white-space:nowrap}
.drawer .dbody{position:relative;background:
  repeating-linear-gradient(0deg,rgba(120,100,70,.10) 0 1px,transparent 1px 22px),
  linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.14));border-radius:0 0 8px 8px}
.drawer.st-fog{border-color:#5d5480;background:linear-gradient(180deg,#b3a892,#8e856f)}
.drawer.st-fog .dcnt{color:#efe6ff}
.drawer.st-open{border-color:#6d5c40;box-shadow:0 7px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22),0 0 0 1px rgba(255,255,255,.10)}
/* 「这个抽屉还没打开」的封条：点它才拆开看物证 */
.seal{position:absolute;inset:0;z-index:6;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(226,214,190,.93),rgba(196,180,150,.95));
  border:1px dashed #6c5a3c;cursor:pointer;padding:8px 12px;text-align:center}
.seal .st1{font:700 12px/1.6 var(--hand);color:#4a3c26;display:block}
.seal .st2{font:400 10.5px/1.6 inherit;color:#6b5b42;display:block}
.seal:hover{background:linear-gradient(180deg,rgba(240,230,208,.97),rgba(210,196,166,.97))}
.seal .wax{position:absolute;right:9px;top:50%;transform:translateY(-50%) rotate(-8deg);width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#b4655f,#7d3b36 62%,#5d2a26);box-shadow:0 2px 5px rgba(0,0,0,.4)}
.seal .wax::after{content:"未";position:absolute;inset:0;font:700 12px/30px var(--hand);color:#f0d9d5;text-align:center}
.drawer.unsealed .seal{display:none}
.drawer.empty .dbody::after{content:"这只抽屉是空的 —— 这一层还没有票";display:block;
  padding:16px 10px;text-align:center;font:400 11px/1.6 inherit;color:#5d5138}
/* 雾里：抽屉上写明「这是不知道，不是待办」；拆开封条后这行字就撤掉 */
.fognote{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:400 10.5px/1.6 inherit;color:#e8dcc0;
  z-index:5;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.drawer.unsealed .fognote{display:none}

/* ---------- 物证纸片（卡片） ---------- */
.scrap{position:absolute;background:
    repeating-linear-gradient(0deg,rgba(90,78,56,.055) 0 1px,transparent 1px 19px),
    linear-gradient(180deg,var(--paper),var(--paper-lo));
  border:1px solid rgba(90,78,56,.5);border-radius:3px;padding:7px 8px 6px;color:#33302a;
  box-shadow:0 5px 12px rgba(0,0,0,.42);overflow:hidden;cursor:pointer}
.scrap::before{content:"";position:absolute;left:0;right:0;top:0;height:3px}
.scrap:focus-visible{outline:2px solid var(--map);outline-offset:2px}
.scrap .pin{position:absolute;left:50%;top:-5px;width:11px;height:11px;border-radius:50%;transform:translateX(-50%);
  background:radial-gradient(circle at 34% 30%,#ffc9c9,#b83232 62%,#79201d);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.scrap .rowh{display:flex;align-items:center;gap:5px;padding-right:2px}
.scrap .no{font:700 10.5px/1.5 var(--mono);color:#5b5346}
.scrap .tag{font:600 9px/1.6 var(--mono);padding:0 4px;border-radius:3px;border:1px solid rgba(90,78,56,.5);color:#5b5346}
.scrap .mark{margin-left:auto;font:700 11px/1.4 var(--mono);padding:0 5px;border-radius:4px;border:1px solid}
.scrap .tt{font-size:11.5px;line-height:1.5;margin-top:4px;color:#33302a;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scrap .why{font:400 9.8px/1.55 var(--hand);color:#7a4a45;margin-top:4px}
.scrap:hover{box-shadow:0 9px 20px rgba(0,0,0,.5)}
.scrap .stline{font:700 9.5px/1.5 inherit;letter-spacing:.02em}
/* 走亮：已结案，纸发黄、压着一条绿章 */
.scrap.st-walk::before{background:var(--c-walk)}
.scrap.st-walk{background:linear-gradient(180deg,#e3ddcd,#d6cfbb);color:#4a463c}
.scrap.st-walk .tt{color:#4a463c}
.scrap.st-walk .mark{color:#14301f;border-color:var(--c-walk);background:var(--c-walk)}
.scrap.st-walk .stline{color:#1d4a30}
.scrap.st-walk .tt{text-decoration:line-through;text-decoration-color:rgba(40,60,45,.35)}
/* 照亮中：正在办的那一张，纸是新的，压着蓝色「在办」角章 */
.scrap.st-view::before{background:var(--c-view)}
.scrap.st-view{box-shadow:0 5px 12px rgba(0,0,0,.42),0 0 0 2px rgba(88,166,253,.35)}
.scrap.st-view .mark{color:#0b2033;border-color:var(--c-view);background:var(--c-view)}
.scrap.st-view .stline{color:#1c4a7a}
/* 现在能做：纸边是双线，盖「可开工」的方章（形状与颜色都不同） */
.scrap.st-open::before{background:var(--c-open)}
.scrap.st-open{outline:2px double var(--c-open);outline-offset:-5px}
.scrap.st-open .mark{color:#26402a;border-color:#7d9b7f;border-style:dashed;background:transparent}
.scrap.st-open .stline{color:#2f5c3a}
/* 雾里：虚线边 + 略微虚焦 + 牛皮纸色，纸上写「不知道」而不是「待办」 */
.scrap.st-fog{background:linear-gradient(180deg,#cbbf9f,#b8ab8b);border-style:dashed;border-color:#7f7355}
.scrap.st-fog::before{background:var(--c-fog)}
.scrap.st-fog .tt{filter:blur(1.5px);opacity:.82;color:#403c30}
.scrap.st-fog .no,.scrap.st-fog .tag{filter:blur(.7px)}
.scrap.st-fog.revealed .tt,.scrap.st-fog.revealed .no,.scrap.st-fog.revealed .tag,.scrap.st-fog.revealed .why{filter:none;opacity:1}
.scrap.st-fog .mark{border-style:dashed;border-color:#7f7355;color:#4a4432;background:rgba(255,255,255,.3)}
.scrap.st-fog .stline{color:#4a4432}
.scrap.here{animation:scrapIn .42s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes scrapIn{from{opacity:.4;transform:translate(var(--x),var(--y)) rotate(var(--rot)) scale(.9)}
  to{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--rot)) scale(1)}}
@media (prefers-reduced-motion:reduce){.scrap.here{animation:none}}

/* ---------- 绳线（亮痕）：一段段扫过去 ---------- */
#strands .thread{fill:none;stroke:rgba(150,72,66,.55);stroke-width:2;stroke-linecap:round;stroke-dasharray:5 5}
#strands .lit{fill:none;stroke:var(--c-walk);stroke-width:3.2;stroke-linecap:round;
  filter:drop-shadow(0 0 5px rgba(74,222,128,.5))}
#strands .lit.blue{stroke:var(--c-view);filter:drop-shadow(0 0 6px rgba(88,166,253,.55))}
#strands .lit.dim{stroke:rgba(255,228,190,.28);stroke-dasharray:2 7;filter:none}
/* 扫亮：用 stroke-dashoffset 从「整段都藏起来」扫到「都亮起来」 */
#strands .sweep{animation:sweep .78s cubic-bezier(.25,.8,.3,1) both}
@keyframes sweep{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
#strands .glow{stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:14 900;opacity:0}
#strands .glow.run{animation:run .78s cubic-bezier(.25,.8,.3,1) both}
@keyframes run{0%{stroke-dashoffset:0;opacity:0}18%{opacity:.9}92%{opacity:.9}100%{stroke-dashoffset:var(--len);opacity:0}}
#strands .rl{font:600 9px/1 var(--mono);fill:#ffe7bd;opacity:.95;paint-order:stroke;stroke:rgba(10,8,6,.85);stroke-width:2.4px;stroke-linejoin:round}
.scene[data-anim="0"] #strands .sweep{animation:none;stroke-dashoffset:0}
@media (prefers-reduced-motion:reduce){#strands .sweep,#strands .glow.run{animation:none;stroke-dashoffset:0}}
/* 目的地标记（挂在柜顶那条挡板上，压在雾的上层 —— 雾再大也看得见） */
.stamp{position:absolute;z-index:6;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;pointer-events:none}
.stamp .c{width:28px;height:28px;border-radius:50%;border:2px solid var(--map);background:#150e21;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(192,132,252,.14),0 0 16px rgba(192,132,252,.5);flex:none}
.stamp .c svg{width:14px;height:14px;fill:none;stroke:var(--map);stroke-width:1.9;stroke-linecap:round}
.stamp .t{font:700 10.5px/1.4 inherit;color:#f0e6ff;white-space:nowrap;background:rgba(24,16,38,.88);
  border:1px solid rgba(192,132,252,.45);border-radius:99px;padding:1px 8px}

/* ---------- 边角控件栈（Leaflet）＋ 数据条 ---------- */
.ctrlstack{position:absolute;right:7px;bottom:38px;z-index:9;display:flex;flex-direction:column;gap:1px;
  border:1px solid rgba(20,16,10,.85);border-radius:9px;overflow:hidden;background:rgba(24,20,14,.90);
  box-shadow:0 6px 18px rgba(0,0,0,.6)}
.ctrlstack button{width:30px;height:28px;border:0;border-bottom:1px solid rgba(255,255,255,.07);background:transparent;
  color:#e6d6b8;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;font-family:inherit}
.ctrlstack button:last-child{border-bottom:0}
.ctrlstack button:hover{background:rgba(255,255,255,.10);color:#fff}
.ctrlstack button:focus-visible{outline:2px solid var(--map);outline-offset:-2px}
.ctrlstack button.on{background:rgba(192,132,252,.24);color:#f0e2ff}
.legendpop{position:absolute;right:44px;bottom:38px;z-index:10;background:rgba(22,18,13,.97);border:1px solid rgba(255,255,255,.16);
  border-radius:10px;padding:8px 10px;font-size:10.5px;color:#e8dcc4;box-shadow:0 10px 26px rgba(0,0,0,.6);max-width:250px}
.legendpop .li{display:flex;align-items:center;gap:6px;margin:3px 0}
.legendpop .lg{width:16px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.4);flex:none;position:relative}
.legendpop .lg::after{content:attr(data-g);position:absolute;inset:0;font:700 8px/12px var(--mono);text-align:center;color:rgba(0,0,0,.7)}
.legendpop .note{color:var(--cap);margin-top:6px;padding-top:5px;border-top:1px dashed rgba(255,255,255,.14);line-height:1.6}
/* 底部数据条：走亮 2/4 · 雾 2 */
.databar{position:absolute;left:7px;bottom:8px;z-index:9;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(40,32,22,.95),rgba(24,19,13,.95));border:1px solid rgba(20,16,10,.9);border-radius:8px;
  padding:3px 9px;font-size:10.5px;color:#eeddbd;box-shadow:0 5px 14px rgba(0,0,0,.5)}
.databar .n{font:700 10.5px/1.6 var(--mono);color:#fff}
.databar .s{width:1px;height:11px;background:rgba(255,255,255,.2)}
.panel.narrow .databar{gap:6px;font-size:10px}

/* ---------- 色阶自检表 ---------- */
.palcheck{margin:10px 12px 0;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:#0d1017}
.palcheck .cap{font:600 10px/1.7 var(--mono);letter-spacing:.08em;color:var(--cap)}
.paltab{display:grid;grid-template-columns:auto auto auto auto auto;gap:4px 9px;margin-top:6px;
  font:11px/1.7 var(--mono);align-items:center}
.paltab .sw{width:15px;height:15px;border-radius:4px;border:1px solid rgba(255,255,255,.14)}
.paltab .k{color:var(--sec);white-space:nowrap}
.palnote{font-size:10.5px;color:var(--cap);margin-top:6px;line-height:1.7}

/* ---------- 卷宗附录（已定的方向 / 还没想清楚的地方） ---------- */
.dossier{margin:12px 12px 16px;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#0d1017}
.dossier .acc{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--sec);padding:7px 10px;cursor:pointer;
  background:none;border:0;border-bottom:1px solid var(--bd);width:100%;text-align:left;font-family:inherit}
.dossier .acc:last-of-type{border-bottom:0}
.dossier .acc:hover{background:#141821;color:var(--tx)}
.dossier .acc .ar{font-family:var(--mono);color:var(--cap)}
.dossier .accbody{padding:2px 12px 9px 26px;font-size:11.5px;color:var(--sec);line-height:1.75;border-bottom:1px solid var(--bd)}
.dossier .accbody .it{margin:4px 0}
.dossier .accbody b{color:var(--tx);font-weight:600}

/* ---------- 原型的控制条（不属于设计本身） ---------- */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:9999;display:flex;flex-wrap:wrap;gap:7px;
  align-items:center;background:rgba(20,23,30,.95);border:1px solid var(--bd2);border-radius:14px;padding:8px 11px;
  box-shadow:0 12px 34px rgba(0,0,0,.6);max-width:calc(100vw - 16px)}
.grp{display:flex;align-items:center;gap:4px;border-left:1px solid var(--bd);padding-left:8px}
.grp:first-child{border-left:0;padding-left:0}
.gl{font-size:10.5px;color:var(--cap)}
.seg{font:500 11px/1.5 inherit;padding:3px 8px;border-radius:99px;border:1px solid var(--bd);background:#141821;color:var(--sec);cursor:pointer}
.seg:hover{border-color:var(--bd2);color:var(--tx)}
.seg.on{border-color:var(--map);background:rgba(192,132,252,.16);color:#e9d5ff;font-weight:600}
</style>
</head>
<body>

<div class="stage"><div class="panel" id="panel" role="region" aria-label="地图详情页原型 · 卷宗柜"></div></div>

<div class="bar" id="bar">
  <div class="grp"><span class="gl">宽度</span>
    <button class="seg" data-k="w" data-v="400">400</button>
    <button class="seg" data-k="w" data-v="810">810</button></div>
  <div class="grp"><span class="gl">状态</span>

<script>
/* ==================================================================================
   0. 数据（简报 §4 原文，一字未改；另两个示例状态按简报 §4 的描述造）
   ================================================================================== */
const ACTIVE = {
  no: 604,
  title: 'MattSkillsDeck 全量性能调查与优化落地（面板 · 状态栏 · 宿主取数链）',
  destination: '把整个 MattSkillsDeck 的性能查清、治到目标准、并在真机上复测通过。走完这张图：宿主外部命令链与定时扫描、客户端渲染与交互、装配与启动、日志落盘与内存，每一层都有实测数字支撑的结论；每一条超标的毛病要么已落地并复测达标，要么明确裁决「不改」并写明理由——插件里不再有「不知道慢在哪」的地方。',
  tickets: [
    { no: 605, type: 'task',     title: '收口上个会话的遗留：提交两处面板渲染修复与布局零抖动文档，临时测点留给下一票', state: 'CLOSED', blockedBy: [] },
    { no: 606, type: 'task',     title: '补上 gh 调用的测量盲区，并把临时测点改造成一组常备测点', state: 'CLOSED', blockedBy: [605] },
    { no: 607, type: 'research', title: '全量性能体检：宿主命令链与扫描、客户端渲染、装配启动、日志落盘逐块实测，产出按耗时排序的问题清单', state: 'OPEN', claimedBy: 'FeatherHunter', blockedBy: [605, 606] },
    { no: 608, type: 'grilling', title: '宿主取数层设计：接缝画在哪、缓存键怎么定、请求怎么合并、三个扫描器怎么收成一个', state: 'OPEN', blockedBy: [607] }
  ],
  fogTotal: 5,
  decisions: [
    { t: '收口上个会话的遗留', g: '倍数结论：点击到内容可见 5075 → 193 毫秒（约 26 倍）' },
    { t: '补上 gh 调用的测量盲区', g: '真机一天 2538 次 gh 调用，中位 7.8 秒，超过「单次 ≤ 1.5 秒」' }
  ],
  fog: [
    '按体检清单毕业出来的「方案 ＋ 落地 ＋ 真机复测」票：每一条毛病单独成票，数量与内容要等体检结果才知道，现在切不出来。',
    '客户端渲染类问题的具体治理方案：状态栏、列表与地图行、页签切换、详情页各自慢不慢、慢在哪，现在说不清，等体检数字。'
  ]
};
const EMPTY = {
  no: 800, title: '去泰国旅游',
  destination: '到泰国这件事是明确的：机票落地曼谷、玩十天、把该看的地方看完。怎么去、走哪条线、花多少钱，现在全是待探索——这张图还没画完。',
  tickets: [], fogTotal: 0, decisions: [], fog: []
};
const BIG = {
  no: 900, title: '示例大图：9 张票 · 4 层',
  destination: '把这条链路的读写路径各治一遍：先查清楚、再定方案、再落地、最后真机复测。到终点＝每个环节都有实测数字，慢在哪一眼能指出来。',
  tickets: [
    { no: 901, type: 'research',  title: '盘点现行取数路径与调用点（示例）', state: 'CLOSED', blockedBy: [] },
    { no: 902, type: 'research',  title: '客户端渲染路径实测（示例）', state: 'CLOSED', blockedBy: [] },
    { no: 903, type: 'prototype', title: '缓存键与合并策略原型（示例）', state: 'CLOSED', blockedBy: [] },
    { no: 904, type: 'grilling',  title: '定版：接缝画在哪、缓存键怎么定（示例）', state: 'CLOSED', blockedBy: [901, 902] },
    { no: 905, type: 'grilling',  title: '定版：请求合并与三个扫描器收成一个（示例）', state: 'OPEN', blockedBy: [902, 903], claimedBy: 'FeatherHunter' },
    { no: 906, type: 'task',      title: '落地：取数层收敛（示例）', state: 'OPEN', blockedBy: [904] },
    { no: 907, type: 'task',      title: '落地：渲染路径单点改造（示例）', state: 'OPEN', blockedBy: [905] },
    { no: 908, type: 'task',      title: '落地：日志落盘批量写（示例）', state: 'OPEN', blockedBy: [905] },
    { no: 909, type: 'research',  title: '真机复测：四个场景逐条给数字（示例）', state: 'OPEN', blockedBy: [906, 907, 908] }
  ],
  fogTotal: 4, decisions: [], fog: []
};

/* ==================================================================================
   1. 工具与判定（四个状态的语义照简报 §3，不改）
   ================================================================================== */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (s, n) => { const t = String(s == null ? '' : s); return t.length > n ? t.slice(0, n) + '…' : t };
const TYPE_L = { task: '任务', research: '研究', grilling: '对齐', prototype: '原型' };
/* 层：按 blockedBy 算的最长路径深度。层 0 最靠近起点，层号越大越靠近终点（简报 §3 的派生量） */
function levelize(ts) {
  const list = Array.isArray(ts) ? ts : [];
  const by = new Map(list.map((t) => [String(t.no), t]));
  const memo = new Map();
  const lv = (t) => {
    const key = String(t.no);
    if (memo.has(key)) return memo.get(key);
    memo.set(key, 0);                                   // 先占位，挡住环状数据
    const bs = (t.blockedBy || []).map((b) => by.get(String(b))).filter(Boolean);
    const v = bs.length ? Math.max.apply(null, bs.map(lv)) + 1 : 0;
    memo.set(key, v); return v;
  };
  const out = [];
  list.forEach((t) => { const i = lv(t); (out[i] = out[i] || { i: i, items: [] }).items.push(t) });
  return out.filter(Boolean);
}
function stateOf(t, all) {
  if (!t) return 'fog';
  if (t.state === 'CLOSED') return 'walk';
  if (t.claimedBy) return 'view';
  const bs = (t.blockedBy || []).map((b) => (all || []).find((x) => String(x.no) === String(b))).filter(Boolean);
  return bs.some((b) => b.state === 'OPEN') ? 'fog' : 'open';
}
const blockersOf = (t, all) => (t.blockedBy || []).map((b) => (all || []).find((x) => String(x.no) === String(b))).filter(Boolean);
const counts = (m) => {
  const a = (m && m.tickets) || [];
  const c = { walk: 0, view: 0, open: 0, fog: 0, total: a.length };
  a.forEach((t) => { c[stateOf(t, a)]++ });
  return c;
};
const STATE_W = { walk: '走亮', view: '照亮中', open: '现在能做', fog: '雾里' };
const STATE_G = { walk: '✓', view: '◉', open: '▶', fog: '?' };
const STATE_HINT = { walk: '已结案', view: '在办', open: '可开工', fog: '还不知道' };
const ORDER = ['walk', 'view', 'open', 'fog'];

/* ==================================================================================
   2. 状态色：明度阶梯（相邻 L* ≥ 10） + 红/绿/蓝三型色觉模拟
   —— Chroma.js 的判据：色阶在感知空间里排，且要能证明「色觉模拟后阶梯还在」。
      这里自己算 CIE L* 与 Viénot 1999 的线性 RGB 矩阵，不引任何库。
   ================================================================================== */
const hex2rgb = (h) => { const s = String(h).replace('#', ''); return [0, 2, 4].map((i) => parseInt(s.substr(i, 2), 16) / 255) };
const rgb2hex = (r) => '#' + r.map((v) => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')).join('');
const lin = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
const unlin = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);
const relY = (rgb) => 0.2126 * lin(rgb[0]) + 0.7152 * lin(rgb[1]) + 0.0722 * lin(rgb[2]);
const Lstar = (rgb) => { const Y = relY(rgb); return Y > 216 / 24389 ? 116 * Math.cbrt(Y) - 16 : (24389 / 27) * Y };
const CVD = {
  protan: [[0.152286, 1.052583, -0.204868], [0.114503, 0.786281, 0.099216], [-0.003882, -0.048116, 1.051998]],
  deutan: [[0.367322, 0.860646, -0.227968], [0.280085, 0.672501, 0.047413], [-0.011820, 0.042940, 0.968881]],
  tritan: [[1.255528, -0.076749, -0.178779], [-0.078411, 0.930809, 0.147602], [0.004733, 0.691367, 0.303900]]
};
function simulate(hex, kind) {
  if (kind === 'none') return hex;
  const M = CVD[kind]; if (!M) return hex;
  const L = hex2rgb(hex).map(lin);
  return rgb2hex(M.map((row) => unlin(Math.max(0, Math.min(1, row[0] * L[0] + row[1] * L[1] + row[2] * L[2])))));
}
/* 阶梯目标：走亮 L*58（绿）→ 照亮中 L*74（蓝）→ 现在能做 L*88（浅绿）→ 雾里 L*38（灰紫），相邻差 16 / 14 / 50 */
const LADDER = [['walk', '#75b06a', 58], ['view', '#77b3ef', 74], ['open', '#c9f0c4', 88], ['fog', '#7f7fa5', 38]];
function scaleL(hex, target) {
  const rgb = hex2rgb(hex), cur = Lstar(rgb);
  if (!isFinite(cur) || cur <= 0.5 || cur >= 99.5) return hex;
  let lo = 0.02, hi = 1.6;
  for (let i = 0; i < 30; i++) {
    const m = (lo + hi) / 2;
    if (Lstar(rgb.map((c) => Math.max(0, Math.min(1, c * m)))) < target) lo = m; else hi = m;
  }
  return rgb2hex(rgb.map((c) => c * ((lo + hi) / 2)));
}
const LADDER_HEX = {};
LADDER.forEach(([k, base, tgt]) => { LADDER_HEX[k] = scaleL(base, tgt) });
function applyPalette() {
  ORDER.forEach((k) => document.documentElement.style.setProperty('--c-' + k, simulate(LADDER_HEX[k], state.cvd)));
}
/* 页面里那张可核对的色阶表：本色 → 模拟后，相邻明度差多少 */
function ladderTable() {
  const rows = ORDER.map((k) => {
    const sim = simulate(LADDER_HEX[k], state.cvd);
    return { k: k, raw: LADDER_HEX[k], L: Lstar(hex2rgb(LADDER_HEX[k])), sim: sim, Ls: Lstar(hex2rgb(sim)) };
  });
  const gaps = []; let ok = true;
  for (let i = 0; i < rows.length - 1; i++) { const d = Math.abs(rows[i].Ls - rows[i + 1].Ls); if (d < 10) ok = false; gaps.push(d.toFixed(1)) }
  const word = { none: '正常视觉', protan: '红色盲模拟', deutan: '绿色盲模拟', tritan: '蓝色盲模拟' }[state.cvd] || '正常视觉';
  return '<div class="palcheck" id="palcheck"><div class="cap">色阶自检 · ' + word +
    '（判据：四态按明度阶梯排，相邻 L* 差 ≥ 10 才算「不靠颜色也分得开」）</div>' +
    '<div class="paltab">' + rows.map((r) =>
      '<span class="sw" data-sw="' + r.k + '" style="background:' + r.raw + '"></span>' +
      '<span class="k">' + STATE_W[r.k] + ' ' + STATE_G[r.k] + '</span>' +
      '<span style="color:var(--cap)">L* ' + r.L.toFixed(1) + '</span>' +
      '<span style="color:var(--sec)">本色 ' + r.raw + '</span>' +
      '<span data-sim="' + r.k + '" style="color:' + r.sim + '">现为 ' + r.sim + ' · L* ' + r.Ls.toFixed(1) + '</span>').join('') + '</div>' +
    '<div class="palnote">相邻明度差：' + gaps.join(' · ') + '　' +
    (ok ? '✓ 模拟后仍是有序的明暗阶梯（再看每张纸上的字形与边框样式，四态都不止靠颜色）'
        : '✗ 有两态在模拟后挤在一起，需要重新拉开明度') + '</div></div>';
}

/* ==================================================================================
   3. 进度环：一段一张票 + 环心写字（Chart.js 的甜甜圈约定）
      对照口径「已通过层数 + 1 / 总层数」是现在线上那个，单层地图永远满环 —— 放进来当反例。
   ================================================================================== */
function donut(map) {
  const c = counts(map), R = 33, C = 2 * Math.PI * R;
  if (state.ring === 'legacy') {
    const layers = levelize(map.tickets), total = layers.length || 1;
    let cur = layers.findIndex((L) => L.items.some((t) => t.state === 'OPEN'));
    if (cur < 0) cur = total - 1;
    const passed = layers.filter((L, i) => i < cur).length;
    const allClosed = map.tickets.length && map.tickets.every((t) => t.state === 'CLOSED');
    const pct = allClosed ? 1 : Math.min(1, (passed + 1) / total);
    const fakeWalk = Math.round(pct * c.total);
    return '<div class="ringwrap"><svg width="86" height="86" viewBox="0 0 86 86" role="img" aria-label="按层算的进度环">' +
      '<circle cx="43" cy="43" r="' + R + '" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/>' +
      '<circle cmp="legacyring" cx="43" cy="43" r="' + R + '" fill="none" stroke="var(--map)" stroke-width="8" stroke-linecap="round" ' +
      'transform="rotate(-90 43 43)" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - pct)) + '"/>' +
      '<text x="43" y="41" text-anchor="middle" font-size="16" font-family="Consolas,monospace" font-weight="700" fill="#e6edf3">' +
      fakeWalk + '/' + c.total + '</text>' +
      '<text x="43" y="56" text-anchor="middle" font-size="9.5" fill="#8b8b95">走亮</text></svg>' +
      '<span class="ringcap warn">对照：按「已通过层数 + 1」算 = ' + Math.round(pct * 100) + '%，与票数无关</span></div>';
  }
  const seg = C / Math.max(1, c.total), gap = Math.min(4, seg * 0.16);
  const dash = Math.max(1, seg - gap);
  let off = 0, arcs = '', order = ['walk', 'view'];
  for (let i = 0; i < c.walk + c.view; i++) {
    const k = i < c.walk ? 'walk' : 'view';
    arcs += '<circle cmp="ringseg" data-k="' + k + '" cx="43" cy="43" r="' + R + '" fill="none" stroke="var(--c-' + k + ')" stroke-width="8" ' +
      'stroke-linecap="butt" transform="rotate(-90 43 43)" stroke-dasharray="' + dash + ' ' + (C - dash) + '" stroke-dashoffset="' + (-off) + '"/>';
    off += seg;
  }
  return '<div class="ringwrap"><svg width="86" height="86" viewBox="0 0 86 86" role="img" aria-label="按票分段的进度环">' +
    '<circle cx="43" cy="43" r="' + R + '" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="8"/>' + arcs +
    '<text cmp="ringcore" x="43" y="41" text-anchor="middle" font-size="16" font-family="Consolas,monospace" font-weight="700" fill="#e6edf3">' +
    c.walk + '/' + c.total + '</text>' +
    '<text x="43" y="56" text-anchor="middle" font-size="9.5" fill="#8b8b95">走亮</text></svg>' +
    '<span class="ringcap">一段一张票 · 蓝段在走（还有 ' + c.open + ' 张现在能做）</span></div>';
}

/* ==================================================================================
   4. 几何：柜体 → 抽屉 → 纸片
   ================================================================================== */
/* 抽屉面 .dface 连边框 34px、两只抽屉之间 9px、.drawers 上下内边距 8 / 12px —— 这几个是量出来的。
   下面这套坐标用来摆纸片与牵绳线；雾挖洞的位置另行从已经渲染好的纸片上读（holesFromDOM），
   两边各管各的，谁也不回灌谁。 */
const CAB_FACE = 34, HEAD_OFF = 40, DRAWER_GAP = 9, DROWS_PAD_BOTTOM = 12, STRANDS_TOP = 46;
function geomOf(map, panelW) {
  const inner = panelW - 2 - 24;           // 面板边框与柜体左右外边距
  const cabW = Math.max(200, inner);
  const drW = cabW - 24;                   // 抽屉内容区宽度（扣掉左右滑轨）
  const narrow = panelW < 520;
  const cols = narrow ? 1 : 2;             // 810 宽两列并排，400 宽一列
  const gap = 11;
  const cw = Math.max(118, Math.floor((drW - gap * (cols - 1)) / cols));
  const cardH = narrow ? 130 : 106;
  const rowGap = 10;
  const padTop = 9, padBottom = 9;
  const head = HEAD_OFF;
  const step = CAB_FACE + (padTop + cardH + padBottom) + 2 + DRAWER_GAP;
  const layers = levelize(map.tickets);
  const place = {};
  let faceY = head;                        // 第一只抽屉的抽屉面顶边
  layers.forEach((L, li) => {
    const rows = Math.ceil(L.items.length / cols);
    const bodyH = padTop + rows * cardH + (rows - 1) * rowGap + padBottom;
    const bodyY = faceY + CAB_FACE;        // 抽屉面以下才是装纸片的袋子
    L.items.forEach((t, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      /* 这里存的是**纸片在袋子里的位置**（相对 .dbody 左上角），不是相对柜体。
         渲染时纸片就放在 .dbody 里，坐标口径必须一致，否则每张都会往下偏一个 bodyY。 */
      place[t.no] = { x: 12 + col * (cw + gap), y: padTop + row * (cardH + rowGap), w: cw, h: cardH, layer: li };
    });
    L.meta = { i: li, y: faceY, bodyY: bodyY, bodyH: bodyH, w: cabW };
    faceY += step;
  });
  const last = layers[layers.length - 1];
  const H = last ? (last.meta.bodyY + last.meta.bodyH + 2 + DROWS_PAD_BOTTOM + 1)
                 : (head + CAB_FACE + 60 + 2 + DROWS_PAD_BOTTOM + 1);
  /* 原点校正：算出来的布局与浏览器真正画出来的位置差多少，一次性补上（只补原点，不顶替坐标） */
  return {
    panelW: panelW, cabW: cabW, drW: drW, narrow: narrow, cols: cols, cw: cw, cardH: cardH,
    layers: layers, place: place, H: H, destY: 18
  };
}
/* 「一键全亮」＝整张雾淡出（CSS opacity 过渡），不是把雾清空、也不是假装走完 */
function setFogOpacity(on) {
  const cv = document.getElementById('foglayer');
  if (cv) cv.style.opacity = on ? '1' : '0';
}

/* ==================================================================================
   5. 画柜子
   ================================================================================== */
function cabinet(map, g) {
  const all = (map.tickets || []);
  const c = counts(map);
  const zero = !all.length;
  let drawers = '';
  if (zero) {
    drawers = '<div class="drawer empty" style="--skip:1"><div class="dface">' +
      '<span class="pull"></span><span class="dlab">第 1 层 · 抽屉</span><span class="sp"></span>' +
      '<span class="dcnt">0 张</span></div><div class="dbody" style="height:60px"></div></div>';
  }
  g.layers.forEach((L, li) => {
    const sts = L.items.map((t) => stateOf(t, all));
    const allFog = sts.every((s) => s === 'fog');
    const sealed = allFog && !state.unsealed[li];
    let scraps = '';
    L.items.forEach((t) => {
      const s = stateOf(t, all), p = g.place[t.no];
      const r = rot(t.no);
      const bs = blockersOf(t, all).filter((b) => b.state === 'OPEN');
      scraps += '<div class="scrap st-' + s + (s === 'view' ? ' here' : '') + (state.reveal[t.no] ? ' revealed' : '') +
        '" data-scrap="' + t.no + '" data-st="' + s + '" tabindex="0" role="button" aria-label="票 ' + t.no + ' · ' + STATE_W[s] + '"' +
        ' style="--x:' + p.x + 'px;--y:' + p.y + 'px;--rot:' + r + 'deg;left:0;top:0;transform:translate(var(--x),var(--y)) rotate(var(--rot));' +
        'width:' + p.w + 'px;height:' + p.h + 'px" title="' + esc(t.title) + '">' +
        '<span class="pin"></span>' +
        '<div class="rowh"><span class="no">#' + (t.no == null ? '—' : t.no) + '</span>' +
        '<span class="tag">' + (TYPE_L[t.type] || t.type || '票') + '</span>' +
        '<span class="mark">' + STATE_G[s] + '</span></div>' +
        '<div class="tt">' + esc(clamp(t.title, 96)) + '</div>' +
        '<div class="why">' + (s === 'fog'
          ? '还不知道 · 被 ' + (bs.map((b) => '#' + b.no).join('、') || '上面那几张') + ' 挡着'
          : (s === 'view' ? '在办 · ' + esc(t.claimedBy || '还没人认领')
             : (s === 'walk' ? '已结案' : '现在就能开工 · 阻塞者都关了'))) + '</div></div>';
    });
    drawers += '<div class="drawer st-' + (sts.length ? (allFog ? 'fog' : (sts.indexOf('view') >= 0 ? 'view' : 'mix')) : 'empty') +
      (sealed ? ' sealed' : ' unsealed') + '" data-drawer="' + li + '" style="--skip:1">' +
      '<div class="dface"><span class="pull"></span>' +
      '<span class="dlab">第 ' + (li + 1) + ' 层</span>' +
      '<span class="dnear">' + (li === 0 ? '离起点最近' : (li === g.layers.length - 1 ? '离终点最近' : '中间一层')) + '</span>' +
      '<span class="sp"></span><span class="dcnt">' + L.items.length + ' 张</span></div>' +
      '<div class="dbody" style="height:' + L.meta.bodyH + 'px">' + scraps +
        (allFog ? '<div class="fognote">这一格是雾里 —— 还不知道能不能走，点抽屉面上的封条可以拆开看个大概</div>' : '') + '</div>' +
      (sealed ? '<div class="seal" data-seal="' + li + '" tabindex="0" role="button" aria-label="拆开第 ' + (li + 1) + ' 层的封条">' +
        '<span><span class="st1">这个抽屉还没打开</span>' +
        '<span class="st2">里面 ' + sts.length + ' 张票，得先把上面那几张办完才知道能不能走 —— 点一下拆开封条看个大概</span></span>' +
        '<span class="wax"></span></div>' : '') +
      '</div>';
  });
  const fx = g.cabW / 2;
  return '<div class="cabinet scene" id="cabinet" data-anim="1" style="min-height:' + g.H + 'px">' +
    '<div class="cabhead"><span class="n">#' + (map.no == null ? '—' : map.no) + '</span>' +
      '<span class="t">卷宗柜 · 共 ' + (g.layers.length || 0) + ' 层</span>' +
      '<span class="to">' + (zero ? '图还没画' : '终点在最上面') + '</span></div>' +
    '<span class="rail l"></span><span class="rail r"></span>' +
    '<div class="strandclip" style="top:' + STRANDS_TOP + 'px">' + strands(map, g) + '</div>' +
    '<div class="drawers">' + drawers + '</div>' +
    '<div class="stamp" data-dest="1" style="left:' + fx + 'px;top:' + (g.destY + 3) + 'px">' +
      '<span class="c"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v18"/><path d="M5 4c4-2 6 2 12 0v9c-6 2-8-2-12 0"/></svg></span>' +
      '<span class="t">终点 · 雾再大也看得见</span></div>' +
    '<canvas id="foglayer" data-fog="1" aria-hidden="true"></canvas>' +
    (state.ctrl ? ctrlStack() : '') +
    (state.ctrl && state.legend ? legendPop() : '') +
    '<div class="databar" data-databar="1">走亮 <span class="n" data-n="walk">' + c.walk + '</span>/<span class="n" data-n="total">' + c.total + '</span>' +
      '<span class="s"></span>雾 <span class="n" data-n="fog">' + c.fog + '</span>' +
      '<span class="s"></span>照亮中 <span class="n" data-n="view">' + c.view + '</span>' +
      '<span class="s"></span>还没想清楚 ' + ((map.fogTotal == null ? 0 : map.fogTotal)) + ' 条</div>' +
    '</div>';
}
/* 绳线：从挡着的那张牵到被挡的那张，一条一段；扫亮动画就用在它们身上。
   纸片的坐标是「相对袋子」的，这里要牵到柜体上，所以要加上所属层的 bodyY。 */
function strands(map, g) {
  const all = map.tickets || [];
  const abs = (no) => {
    const p = g.place[no];
    if (!p) return null;
    const L = g.layers[p.layer];
    return { x: p.x, y: p.y + (L ? L.meta.bodyY : 0), w: p.w, h: p.h, layer: p.layer };
  };
  let main = '', glow = '';
  all.forEach((t) => {
    const p2 = abs(t.no); if (!p2) return;
    const s2 = stateOf(t, all);
    blockersOf(t, all).forEach((b) => {
      const p1 = abs(b.no); if (!p1) return;
      /* 绳线从上面那张纸片的下边沿直着牵到下面那张的上边沿（两张同列时就是一条竖线），
         不从纸片正中压过去、也不横穿整只抽屉；标签跟在旁边说清「谁挡着谁」。 */
      const x1 = p1.x + Math.min(46, p1.w - 20), y1 = p1.y + p1.h - 6 - STRANDS_TOP;
      const x2 = p2.x + Math.min(46, p2.w - 20), y2 = p2.y - 6 - STRANDS_TOP;
      const mx = (x1 + x2) / 2 + (x2 - x1) * 0.12;
      const d = 'M' + x1 + ' ' + y1 + ' Q' + mx + ' ' + ((y1 + y2) / 2) + ' ' + x2 + ' ' + y2;
      const len = Math.round(Math.abs(y2 - y1) + Math.abs(x2 - x1) * 0.8 + 24);
      const cls = s2 === 'walk' ? 'lit' : (s2 === 'view' ? 'lit blue' : (s2 === 'open' ? 'lit' : 'lit dim'));
      const delay = (g.layers.length - (p2.layer || 0)) * 0.13;
      main += '<path cmp="strand" class="' + cls + (state.anim ? ' sweep' : '') + '" data-no="' + t.no + '" d="' + d + '" ' +
        'style="--len:' + len + ';stroke-dasharray:' + len + ';animation-delay:' + delay.toFixed(2) + 's"/>';
      glow += '<path class="glow' + (state.anim ? ' run' : '') + '" d="' + d + '" style="--len:' + len + ';animation-delay:' + delay.toFixed(2) + 's"/>';
      main += '<text class="rl" x="' + (Math.max(x1, x2) + 8) + '" y="' + ((y1 + y2) / 2 + 3) + '">需先办完 #' + b.no + '</text>';
    });
  });
  return '<svg id="strands" viewBox="0 0 ' + g.cabW + ' ' + (g.H - STRANDS_TOP) + '" preserveAspectRatio="none" aria-hidden="true">' + main + glow + '</svg>';
}
function ctrlStack() {
  return '<div class="ctrlstack" data-ctrl="1">' +
    '<button data-act="focus" title="聚焦当前（正在推进的那张）" aria-label="聚焦当前">◎</button>' +
    '<button data-act="alllit" title="一键全亮：收起雾，但不假装走完" aria-label="一键全亮">☀</button>' +
    '<button data-act="legend" title="图例（可折叠）" aria-label="图例" class="' + (state.legend ? 'on' : '') + '">☰</button>' +
    '<button data-act="zoom-in" title="放大" aria-label="放大">＋</button>' +
    '<button data-act="zoom-out" title="缩小" aria-label="缩小">－</button>' +
    '</div>';
}
function legendPop() {
  return '<div class="legendpop" data-legend="1">' + ORDER.map((k) =>
    '<div class="li"><span class="lg" data-g="' + STATE_G[k] + '" style="background:var(--c-' + k + ')"></span>' +
    '<span>' + STATE_W[k] + ' · ' + STATE_HINT[k] + '</span></div>').join('') +
    '<div class="note">雾只盖住「还不知道」的那几格，不会盖住终点；' +
    '点雾里的抽屉可以拆开封条看个大概 —— 那是不知道，不是待办。</div></div>';
}
function rot(no) {
  const v = Math.sin(Number(no || 0) * 12.9898) * 43758.5453;
  return ((v - Math.floor(v)) * 1.8 - 0.9).toFixed(2);
}

/* ==================================================================================
   6. 雾：整张遮罩，挖柔边洞（Leaflet 的做法 / PixiJS 的 destination-out）
      1) 整块画布先铺满一层雾；2) destination-out + 径向渐变，把走过 / 照亮 / 能走 / 终点擦成柔边洞；
      3) 雾里铺噪点（只铺在还盖着雾的地方）；4) 「一键全亮」是整张雾按进度淡出，不是把雾擦没。
   ================================================================================== */
let fogRAF = 0;
function drawFog(progress) {
  const cv = document.getElementById('foglayer');
  if (!cv) return;
  const W = cv.clientWidth, H = cv.clientHeight;
  const g = state.geom, map = mapOf();
  if (!W || !H || !g) return;
  const dpr = 1.5;
  const pw = Math.round(W * dpr), ph = Math.round(H * dpr);
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph }
  const ctx = cv.getContext('2d');
  if (!ctx) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const op = Math.max(0, Math.min(1, (state.alllit ? (1 - progress) : progress)));
  if (op <= 0.004) return;
  /* 半黑，不是全黑：地形大概还看得清，只是细节被雾盖住（#474 原话）。
     纸片画在雾的上层，所以雾只需要交代「这柜子现在有多黑」，不需要去盖某一张票。 */
  ctx.fillStyle = 'rgba(13,16,24,' + (0.58 * op).toFixed(3) + ')';
  ctx.fillRect(0, 0, W, H);
  /* 洞：只给「终点」留一个（终点永远可见），另外给走过 / 照亮中的那几张留一圈柔光，
     让它们周围的地形也亮一点。 */
  const holes = [{ x: g.cabW / 2, y: g.destY, r: 66, a: 0.95 }];
  (map.tickets || []).forEach((t) => {
    const s = stateOf(t, map.tickets), p = g.place[t.no];
    if (!p || s === 'fog') return;
    const L = g.layers[p.layer];
    holes.push({ x: p.x + p.w / 2, y: p.y + (L ? L.meta.bodyY : 0) + p.h / 2,
      r: p.w / 2 + 30, a: s === 'open' ? 0.55 : 0.9 });
  });
  ctx.globalCompositeOperation = 'destination-out';
  holes.forEach((h) => {
    const r = Math.max(1, h.r * progress);
    const grd = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, r);
    grd.addColorStop(0, 'rgba(0,0,0,' + h.a + ')');
    grd.addColorStop(0.74, 'rgba(0,0,0,' + (h.a * 0.96).toFixed(3) + ')');
    grd.addColorStop(0.9, 'rgba(0,0,0,' + (h.a * 0.42).toFixed(3) + ')');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, Math.PI * 2); ctx.fill();
  });
  // 雾里的噪点：只铺在还盖着雾的地方
  ctx.globalCompositeOperation = 'source-atop';
  ctx.fillStyle = 'rgba(214,220,240,' + (0.11 * op).toFixed(3) + ')';
  for (let y = 0; y < H; y += 7) for (let x = ((y / 7) % 2) * 3.5; x < W; x += 7) ctx.fillRect(x, y, 1.5, 1.5);
  ctx.globalCompositeOperation = 'source-over';
}
/* 揭幕：一次向前的动画（requestAnimationFrame；不用定时器轮询）。
   亮痕的扫亮走 CSS 动画，与这里同时开始；右边的「重播」把两者都重来一遍。 */
function playOnce() {
  if (fogRAF) cancelAnimationFrame(fogRAF);
  const t0 = performance.now(), DUR = 880;
  const step = (now) => {
    const p = Math.min(1, (now - t0) / DUR);
    drawFog(1 - Math.pow(1 - p, 3));
    if (p < 1) fogRAF = requestAnimationFrame(step); else fogRAF = 0;
  };
  fogRAF = requestAnimationFrame(step);
}
function replay() {
  state.anim = false;
  const scene = document.getElementById('cabinet');
  if (scene) scene.dataset.anim = '0';                 // 先停一下，浏览器才会重新播同一段动画
  if (fogRAF) { cancelAnimationFrame(fogRAF); fogRAF = 0 }
  requestAnimationFrame(() => {
    state.anim = true;
    const s2 = document.getElementById('cabinet');
    if (s2) s2.dataset.anim = '1';
    state.replay = (state.replay || 0) + 1;
    if (s2) { s2.dataset.replay = String(state.replay); s2.dataset.animAt = String(Date.now()) }
    playOnce();
    const cv = document.getElementById('foglayer');
    if (cv) cv.dataset.replay = String(state.replay);
    document.querySelectorAll('#strands path').forEach((p) => {
      const a = p.getAnimations ? p.getAnimations() : [];
      a.forEach((x) => { try { x.cancel(); x.play() } catch (e) {} });
    });
  });
}

/* ==================================================================================
   7. 组装整屏
   ================================================================================== */
function dossier(map) {
  const D = Array.isArray(map.decisions) ? map.decisions : [];
  const F = Array.isArray(map.fog) ? map.fog : [];

  if (D.length) html += '<button class="acc" data-acc="d"><span class="ar">▶</span><span>已经定下来的方向（' + D.length + ' 条）</span></button>' +
    '<div class="accbody" data-accbody="d" hidden>' + D.map((d) => '<div class="it"><b>' + esc(d && d.t) + '</b> — ' + esc(d && d.g) + '</div>').join('') + '</div>';

    '<div class="accbody" data-accbody="f" hidden>' + F.map((f) => '<div class="it">· ' + esc(f) + '</div>').join('') + '</div>';

        '</div>' + donut(map) +

function paint() {
  const map = mapOf();
  const panel = document.getElementById('panel');
  panel.className = 'panel' + (Number(state.w) < 520 ? ' narrow' : '');
  panel.style.width = Number(state.w) + 'px';
  panel.style.transform = state.zoom === 1 ? 'none' : 'scale(' + state.zoom + ')';
  panel.style.transformOrigin = 'top center';
  state.geom = geomOf(map, Number(state.w));
  applyPalette();
  panel.innerHTML = panelHTML(map, state.geom);
  wire(map);
  syncSegs();
  /* 柜体高度按实际渲染出来的内容定一次（requestAnimationFrame 走一帧，不是定时器轮询）：
     手算的盒模型与浏览器总差几十像素，与其硬凑，不如量出来再定，雾层和绳线都跟着这个高度走。 */
  requestAnimationFrame(fitBoard);
}
/* 量出柜体真实内容高度，把 min-height 与雾层、绳线的坐标系一起对齐 */
function fitBoard() {
  const cab = document.getElementById('cabinet');
  if (!cab) return;
  const h = Math.ceil(cab.getBoundingClientRect().height);
  if (!h || !isFinite(h)) return;
  if (state.geom) state.geom.H = h;
  cab.style.minHeight = h + 'px';
  const svg = document.getElementById('strands');
  if (svg) svg.setAttribute('viewBox', '0 0 ' + (state.geom ? state.geom.cabW : 0) + ' ' + Math.max(1, h - STRANDS_TOP));
  if (state.zoom !== 1) document.getElementById('panel').style.marginBottom = (h * (state.zoom - 1)) + 'px';
}
function syncSegs() {
  document.querySelectorAll('.seg').forEach((b) => {
    if (!b.dataset.k) return;
    b.classList.toggle('on', String(state[b.dataset.k]) === b.dataset.v);
  });
}

/* ==================================================================================
   8. 交互（键盘可达：Tab 走得到，Enter / Space 等于点击）
   ================================================================================== */
function wire(map) {
  const act = (fn) => (e) => { e.preventDefault(); fn(e.currentTarget) };
  document.querySelectorAll('[data-act]').forEach((el) => {
    const a = el.dataset.act;
    if (a === 'more') el.onclick = () => {
      const d = document.getElementById('dtext');
      if (!d) return;
      d.classList.toggle('open');
      el.textContent = d.classList.contains('open') ? '收起' : '展开全文';
    };
    else if (a === 'back') el.onclick = () => flash(el);
    else if (a === 'advance') el.onclick = () => flash(el);
    else if (a === 'legend') el.onclick = () => { state.legend = !state.legend; paint() };
    else if (a === 'alllit') el.onclick = () => {
      state.alllit = !state.alllit;
      el.classList.toggle('on', state.alllit);
      setFogOpacity(!state.alllit);            // 整层淡出 / 淡回
      playOnce();                              // 淡回时洞也跟着再推开一次
    };
    else if (a === 'focus') el.onclick = () => {
      const t = document.querySelector('.scrap.st-view') || document.querySelector('.scrap.st-open') || document.querySelector('.scrap');
      if (!t) return;
      const r = t.getBoundingClientRect();
      const pr = document.querySelector('.scroll').getBoundingClientRect();
      document.querySelector('.scroll').scrollTop += (r.top - pr.top) - 80;
      t.focus({ preventScroll: true });
    };
    else if (a === 'zoom-in') el.onclick = () => { state.zoom = Math.min(1.5, state.zoom + 0.15); paint() };
    else if (a === 'zoom-out') el.onclick = () => { state.zoom = Math.max(0.85, state.zoom - 0.15); paint() };
  });
  document.querySelectorAll('[data-seal]').forEach((el) => {
    el.onclick = () => {
      const li = Number(el.dataset.seal);
      state.unsealed[li] = true;
      el.parentNode.classList.add('unsealed');
      el.setAttribute('hidden', '');
    };
  });
  document.querySelectorAll('[data-scrap]').forEach((el) => {
    const go = () => {
      const no = Number(el.dataset.scrap);
      if (el.dataset.st === 'fog' && !el.classList.contains('revealed')) { el.classList.add('revealed'); state.reveal[no] = true; return }
      flash(el);
    };
    el.onclick = go;
    el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); go() } };
  });
  document.querySelectorAll('.acc').forEach((b) => {
    b.onclick = () => {
      const body = document.querySelector('[data-accbody="' + b.dataset.acc + '"]');
      if (!body) return;
      const on = body.hasAttribute('hidden');
      if (on) body.removeAttribute('hidden'); else body.setAttribute('hidden', '');
      b.querySelector('.ar').textContent = on ? '▼' : '▶';
    };
  });
}
function flash(el) {
  if (!el || !el.animate) return;
  el.animate([{ filter: 'brightness(1)' }, { filter: 'brightness(1.45)' }, { filter: 'brightness(1)' }], { duration: 460, easing: 'ease-out' });
}

/* ==================================================================================
   9. 启动（URL 参数 / 控制条 / 一次性揭幕）
   ================================================================================== */
const state = {
  w: 810, s: 'active', cvd: 'none', ring: 'real', bar: 1,
  ctrl: true, legend: false, alllit: false, anim: true, zoom: 1,
  unsealed: {}, reveal: {}, geom: null, replay: 0
};
(function readURL() {
  let qs; try { qs = new URLSearchParams(location.search) } catch (e) { qs = new URLSearchParams('') }
  if (qs.get('w') != null && !isNaN(Number(qs.get('w')))) state.w = Math.max(320, Math.min(1200, Number(qs.get('w'))));
  if (['active', 'empty', 'big'].indexOf(qs.get('s')) >= 0) state.s = qs.get('s');
  if (['none', 'protan', 'deutan', 'tritan'].indexOf(qs.get('cvd')) >= 0) state.cvd = qs.get('cvd');
  if (['real', 'legacy'].indexOf(qs.get('ring')) >= 0) state.ring = qs.get('ring');
  if (qs.get('bar') === '0') state.bar = 0;
  if (qs.get('lit') === '1') state.alllit = true;
})();
function mapOf() { return state.s === 'empty' ? EMPTY : (state.s === 'big' ? BIG : ACTIVE) }
document.querySelectorAll('.seg').forEach((b) => {
  b.onclick = () => {
    if (b.dataset.act === 'replay') { replay(); return }
    const k = b.dataset.k;
    if (!k) return;
    state[k] = (k === 'w') ? Number(b.dataset.v) : b.dataset.v;
    if (k === 's') { state.unsealed = {}; state.reveal = {}; state.alllit = false }
    paint();
    requestAnimationFrame(playOnce);
  };
});
if (!state.bar) document.getElementById('bar').style.display = 'none';
paint();
requestAnimationFrame(playOnce);
</script>
