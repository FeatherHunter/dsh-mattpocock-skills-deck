    name: "一张一张定下来（进度卡）",
    idea: "把节点画成「决策卡」：第一张已经打勾定下来了，第二张还是问号，箭头越往后越淡，最后一格在雾里。这个方向强调「探索地图是逐张决议」的过程感，比方案一多了一层「已经开始了」的信息。",
    svg: O4,
    cap: "已经定了一张"
  }
];

/* ============ 渲染 ============ */
function withIds(svg, suffix){
  return svg.replace(/id="([^"]+)"/g, 'id="$1-' + suffix + '"')
            .replace(/url\(#([^)]+)\)/g, 'url(#$1-' + suffix + ')');
}
function optHtml(d){
  var h = '<section class="direction" id="' + d.id + '">';
  h += '<h2><span class="no">' + d.no + '</span>' + d.name + '</h2>';
  h += '<p class="idea">' + d.idea + '</p>';
  h += '<div class="pair">';
  h += '<div class="artbox"><div class="who">探索地图</div>' + withIds(d.svg, d.id) + '</div>';
  h += '</div>';
  h += '<div class="mini-label">真实尺寸（132×82，放进选择卡就是这么大）：</div>';
  h += '<div class="mini">' + withIds(d.svg, d.id + "m") + '<div class="cap">' + d.cap + '</div></div>';
  h += '</section>';
  return h;
}
var pairHtml = '<section class="direction" id="pair-sample"><h2><span class="no">配对示意</span>走清楚之后的同一张图（实施卡）</h2>' +
  '<p class="idea">同一套「分格节点 + 箭头 + 终点」的画法，把虚线换成实线、问号换成勾、空标签换成实心标签、雾去掉，就是实施卡那张图。这样两张卡并排时是同一张地图的两个阶段，而不是两张不相干的插画。</p>' +
  '<div class="pair"><div class="artbox"><div class="who" style="color:var(--blue-text)">实施地图（示意）</div>' + PAIR + '</div></div></section>';

document.getElementById("root").innerHTML = OPTIONS.map(optHtml).join("") + pairHtml;
</script>
