<!-- PROTOTYPE — throwaway, not production — 一个仓库多个 effort 时面板怎么呈现（4 版对照） -->
<!-- 结论（2026-09-09 维护者拍板）：采用 B —— 每行 effort 徽标 + 顶部 effort 筛选；C（分组折叠）与 D（顶部切换器）未采纳。
     真实现落在 src/client/views/ListTab.js 与 ListTabRow.js；本文件留作一手材料，不再维护。 -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype — 多 effort 面板呈现 4 方案（?variant=A|B|C|D）</title>
<style>
  :root{--bg:#0a0c10;--panel:#10131a;--panel2:#16181d;--border:#2a2d35;--text:#e6edf3;--muted:#a1a1aa;--cap:#8b8b95;
        --purple:#c084fc;--blue:#58a6ff;--green:#3fb950;--amber:#f59e0b;--red:#f87171;
        --chip-bg:rgba(188,140,255,.16);--chip-border:rgba(188,140,255,.6)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI','PingFang SC',sans-serif;line-height:1.5}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 120px}
  h1{font-size:17px;margin:0 0 4px;color:var(--purple)}
  .sub{font-size:12px;color:var(--cap);margin:0 0 14px;line-height:1.7}
  .question{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:12.5px;color:var(--muted)}
  .question b{color:var(--purple)}
  .panelbox{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px 4px}
  /* ---- 与真面板同一套行样式 ---- */
  .aggrow{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:var(--panel2);margin-bottom:8px;cursor:pointer}
  .aggrow:hover{background:rgba(255,255,255,.04);border-color:var(--border)}
  .aggrow.map{border-left:3px solid var(--purple);background:rgba(188,140,255,.07)}
  .row1{display:flex;align-items:flex-start;gap:8px;width:100%}
  .idcol{display:flex;flex-direction:column;gap:4px;flex:none;align-items:flex-start}
  .idnum{font-size:11px;padding:1px 6px;border-radius:999px;border:1px solid var(--green);color:var(--green)}
  .idnum.done{border-color:var(--green);color:var(--green)}
  .idnum.empty{border-color:var(--amber);color:var(--amber)}
  .tt{flex:1;min-width:0;font-size:13px;font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:break-word}
  .tt.map-title{font-weight:600}
  .chip{font-size:10px;padding:0 6px;border-radius:99px;border:1px solid var(--chip-border);background:var(--chip-bg);color:#bc8cff;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .chip.eff{background:rgba(88,166,255,.14);color:var(--blue);border-color:rgba(88,166,255,.45);max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .chip.mapchip{font-size:11px;font-weight:600;line-height:1.7;padding:0 8px}
  .chip.blocked{background:rgba(248,113,113,.16);color:var(--red);border-color:rgba(248,113,113,.55)}
  .chip.closed{background:rgba(139,139,149,.12);color:var(--cap);border-color:rgba(139,139,149,.35)}
  .chip.filter{cursor:pointer;font-size:10px}
  .chip.filter.off{background:rgba(255,255,255,.06);color:var(--muted);border-color:rgba(255,255,255,.15)}
  .chip.filter.on{background:rgba(88,166,255,.18);color:var(--blue);border-color:rgba(88,166,255,.6)}
  .tags{display:flex;align-items:center;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
  .ring{width:20px;height:20px;flex:none}
  .acts{display:flex;gap:3px;align-items:center;flex:none;margin-left:auto}
  .btn{font-size:10px;padding:1px 6px;border-radius:6px;border:1px solid transparent;background:var(--green);color:#0c1a10;cursor:pointer;white-space:nowrap}
  .btn.ghost{background:transparent;border-color:var(--border);color:var(--cap)}
  .filterrow{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0 8px}
  .grouphead{display:flex;align-items:center;gap:6px;padding:6px 8px;margin:10px 0 6px;border-radius:8px;background:rgba(88,166,255,.10);border:1px solid rgba(88,166,255,.35);cursor:pointer}
  .grouphead .name{font-size:12.5px;font-weight:600;color:var(--blue);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grouphead .caret{font-size:10px;color:var(--cap)}
  .groupbody{padding-left:8px;border-left:1px dashed rgba(88,166,255,.3)}
  .seg{display:flex;gap:0;margin:0 0 10px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{flex:1;font-size:11.5px;padding:6px 8px;background:transparent;border:0;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg button.on{background:rgba(88,166,255,.16);color:var(--blue);font-weight:600}
  .seg button+button{border-left:1px solid var(--border)}
  .kpi{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--muted);margin:2px 0 8px;flex-wrap:wrap}
  .note{font-size:11px;color:var(--cap);margin:8px 0 2px;line-height:1.7}
  /* ---- 底部切换条 + 状态面板 ---- */
  .bar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:6px;align-items:center;
       background:rgba(22,24,29,.96);border:1px solid var(--border);border-radius:999px;padding:6px 10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .bar button{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}
  .bar button.on{background:rgba(188,140,255,.18);color:var(--purple);border-color:rgba(188,140,255,.6);font-weight:600}
  .bar .hint{font-size:10.5px;color:var(--cap);margin-left:4px}
  .state{position:fixed;right:14px;bottom:14px;max-width:280px;background:rgba(22,24,29,.96);border:1px solid var(--border);
         border-radius:10px;padding:8px 10px;font-size:11px;color:var(--muted);white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace}
  .state b{color:var(--purple);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>Prototype — 一个仓库多个 effort，面板怎么呈现（4 版）</h1>
  <p class="sub">同一批数据：两个 effort（<code>m23-gate-audit</code>、<code>work-mode</code>），各自都有 #01/#02/#03 —— 编号故意撞车，就是你现在遇到的那种仓库。切版本看同一份数据怎么排。</p>
  <div class="question" id="q"></div>
  <div class="panelbox" id="stage"></div>
</div>
<div class="bar" id="bar"></div>
<div class="state" id="state"></div>

<script>
// ── 一次性原型：数据写死在内存里，刷新即还原；没有任何持久化 ─────────────────────
const EFFORTS = [
  { id: 'm23-gate-audit', map: { title: 'M23 闸门审计地图', state: 'OPEN' }, tickets: [
    { key: '01', title: '盘点现有闸门与缺口', state: 'OPEN', type: 'research', claimed: false, blockedBy: [] },
    { key: '02', title: '补齐缺失的门禁脚本', state: 'OPEN', type: 'task', claimed: false, blockedBy: ['01'] },
    { key: '03', title: '跑一遍全量回归并归档证据', state: 'CLOSED', type: 'task', claimed: false, blockedBy: [] },
  ] },
  { id: 'work-mode', map: { title: '工作模式地图', state: 'OPEN' }, tickets: [
    { key: '01', title: '定义模式枚举与默认值', state: 'OPEN', type: 'grilling', claimed: false, blockedBy: [] },
    { key: '02', title: '落地切换入口与状态栏展示', state: 'OPEN', type: 'task', claimed: true, blockedBy: [] },
    { key: '03', title: '文档同步与迁移说明', state: 'CLOSED', type: 'task', claimed: false, blockedBy: [] },
  ] },
]

const state = { variant: 'B', effFilter: [], collapsed: {}, activeEffort: 'all' }

// ── 小工具 ───────────────────────────────────────────────────────────────────
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const typeLabel = { research: 'research', prototype: 'prototype', grilling: 'grilling', task: 'task' }
function statsOf(eff) {
  const t = eff.tickets
  return { total: t.length, closed: t.filter((x) => x.state === 'CLOSED').length, open: t.filter((x) => x.state === 'OPEN').length }
}
function ring(stats) {
  const pct = stats.total ? Math.round(stats.closed / stats.total * 100) : 0
  const C = 2 * Math.PI * 7
  const off = C * (1 - pct / 100)
  const color = pct >= 100 ? '#4ade80' : '#bc8cff'
  return '<svg class="ring" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="2.4"/>' +
    '<circle cx="9" cy="9" r="7" fill="none" stroke="' + color + '" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + off + '"/></svg>'
}
function blockerIn(eff, key) {
  return eff.tickets.some((t) => t.key === key && t.state === 'OPEN')
}
function ticketRow(eff, t, opts) {
  const o = opts || {}
  const blocked = (t.blockedBy || []).some((b) => blockerIn(eff, b))
  const stats = statsOf(eff)
  const numCls = stats.closed === stats.total ? 'done' : (stats.total === 0 ? 'empty' : '')
  const chips = ['<span class="chip">wayfinder:' + typeLabel[t.type] + '</span>']
  if (blocked) chips.push('<span class="chip blocked">被阻塞</span>')
  if (t.claimed) chips.push('<span class="chip" style="background:rgba(88,166,255,.14);color:#58a6ff;border-color:rgba(88,166,255,.45)">已认领</span>')
  if (t.state === 'CLOSED') chips.push('<span class="chip closed">✅ 已关闭</span>')
  return '<div class="aggrow">' +
    '<div class="row1">' +
      '<span class="idcol">' +
        (o.showEffort ? '<span class="chip eff" title="' + esc(eff.id) + '">' + esc(eff.id) + '</span>' : '') +
        '<span class="idnum ' + numCls + '">#' + esc(t.key) + '</span>' +
      '</span>' +
      '<span class="tt">' + esc(t.title) + '</span>' +
      ring(stats) +
    '</div>' +
    '<div class="row1" style="align-items:center">' +
      '<span class="tags">' + chips.join('') + '</span>' +
      '<span class="acts"><button class="btn">执行</button><button class="btn ghost">完成</button><button class="btn ghost">新会话</button></span>' +
    '</div>' +
  '</div>'
}
function mapRow(eff, opts) {
  const o = opts || {}
  const stats = statsOf(eff)
  const chips = ['<span class="chip">wayfinder:map</span>']
  return '<div class="aggrow map">' +
    '<div class="row1">' +
      '<span class="idcol">' +
        '<span class="chip mapchip">地图</span>' +
        (o.showEffort ? '<span class="chip eff" title="' + esc(eff.id) + '">' + esc(eff.id) + '</span>' : '') +
      '</span>' +
      '<span class="tt map-title">' + esc(eff.map.title) + '</span>' +
      ring(stats) +
    '</div>' +
    '<div class="row1" style="align-items:center">' +
      '<span class="tags">' + chips.join('') + '</span>' +
      '<span class="acts"><button class="btn">推进</button><button class="btn ghost">新会话</button></span>' +
    '</div>' +
  '</div>'
}
function kpiRow(list) {
  const all = list.flatMap((e) => e.tickets)
  const open = all.filter((t) => t.state === 'OPEN')
  const occ = open.filter((t) => t.claimed || (t.blockedBy || []).some((b) => blockerIn(list.find((e) => e.tickets.includes(t)), b))).length
  return '<div class="kpi"><span>🎯 ' + (open.length - occ) + ' 可接</span><span>🔒 ' + occ + ' 占用</span><span>✅ ' + all.filter((t) => t.state === 'CLOSED').length + ' 已关闭</span></div>'
}

// ── 四个版本 ─────────────────────────────────────────────────────────────────
const VARIANTS = {
  A: {
    name: '现状对照（改动前）',
    question: '改动前：两个 effort 的地图都算 #00、票号都是 #01–#03，界面既分不清 effort，点第二张地图也只会打开第一张。这一版只是拿来对照。',
    render() {
      let html = kpiRow(EFFORTS)
      // 改动前：两张地图 + 全部票平铺，编号撞车、没有 effort 标识
      EFFORTS.forEach((eff) => {
        html += '<div class="aggrow map"><div class="row1"><span class="idcol"><span class="chip mapchip">地图</span></span>' +
          '<span class="tt map-title">' + esc(eff.map.title) + '</span>' + ring(statsOf(eff)) + '</div></div>'
      })
      const flat = EFFORTS.flatMap((eff) => eff.tickets.map((t) => ({ eff, t })))
      flat.forEach(({ eff, t }) => { html += ticketRow(eff, t, { showEffort: false }) })
      html += '<div class="note">↑ 注意：三张票的编号在两张地图下各出现一次，两个 effort 完全混在一起。</div>'
      return html
    },
  },
  B: {
    name: '每行徽标 + effort 筛选（已实现）',
    question: '每行标出它属于哪个 effort，上面一排 effort 筛选（可多选、可清空）。列表结构没变，改动最小。',
    render() {
      const on = (id) => state.effFilter.includes(id)
      let html = '<div class="filterrow">' +
        '<span class="chip filter ' + (state.effFilter.length ? 'off' : 'on') + '" data-act="eff-clear">全部</span>' +
        EFFORTS.map((e) => '<span class="chip filter ' + (on(e.id) ? 'on' : 'off') + '" data-act="eff" data-eff="' + esc(e.id) + '">' + esc(e.id) + '</span>').join('') +
        '</div>'
      const visible = EFFORTS.filter((e) => !state.effFilter.length || on(e.id))
      html += kpiRow(visible)
      visible.forEach((eff) => {
        html += mapRow(eff, { showEffort: true })
        eff.tickets.forEach((t) => { html += ticketRow(eff, t, { showEffort: true }) })
      })
      return html
    },
  },
  C: {
    name: '按 effort 分组折叠',
    question: '每个 effort 一个可折叠分组，组头就是 effort 名 + 进度环，地图与票都收在组里。一眼看出层次，但多占一层缩进。',
    render() {
      let html = kpiRow(EFFORTS)
      EFFORTS.forEach((eff) => {
        const st = statsOf(eff)
        const collapsed = !!state.collapsed[eff.id]
        html += '<div class="grouphead" data-act="group" data-eff="' + esc(eff.id) + '">' +
          '<span class="caret">' + (collapsed ? '▶' : '▼') + '</span>' +
          '<span class="name">' + esc(eff.id) + '</span>' +
          '<span style="font-size:11px;color:var(--muted)">' + st.closed + '/' + st.total + '</span>' + ring(st) +
          '</div>'
        if (!collapsed) {
          html += '<div class="groupbody">' + mapRow(eff, { showEffort: false })
          eff.tickets.forEach((t) => { html += ticketRow(eff, t, { showEffort: false }) })
          html += '</div>'
        }
      })
      return html
    },
  },
  D: {
    name: '顶部 effort 切换器',
    question: '顶部一条分段切换：全部 / 各 effort。一次只看一个 effort（或全部），列表回到单 effort 的干净样子，代价是切换多一次点击。',
    render() {
      const tabs = [{ id: 'all', label: '全部' }].concat(EFFORTS.map((e) => ({ id: e.id, label: e.id })))
      let html = '<div class="seg">' + tabs.map((tb) =>
        '<button class="' + (state.activeEffort === tb.id ? 'on' : '') + '" data-act="seg" data-eff="' + esc(tb.id) + '">' + esc(tb.label) + '</button>').join('') + '</div>'
      const visible = state.activeEffort === 'all' ? EFFORTS : EFFORTS.filter((e) => e.id === state.activeEffort)
      html += kpiRow(visible)
      visible.forEach((eff) => {
        if (state.activeEffort === 'all') {
          html += '<div class="grouphead" style="cursor:default;background:rgba(88,166,255,.06)"><span class="name">' + esc(eff.id) + '</span><span style="font-size:11px;color:var(--muted)">' + statsOf(eff).closed + '/' + statsOf(eff).total + '</span>' + ring(statsOf(eff)) + '</div>'
        }
        html += mapRow(eff, { showEffort: state.activeEffort === 'all' })
        eff.tickets.forEach((t) => { html += ticketRow(eff, t, { showEffort: state.activeEffort === 'all' }) })
      })
      return html
    },
  },
}

// ── 渲染 + 状态面板（每次切换/点击都把状态摊开）─────────────────────────────────
const stage = document.getElementById('stage')
const qBox = document.getElementById('q')
const stateBox = document.getElementById('state')
const bar = document.getElementById('bar')

function visibleCount() {
  if (state.variant === 'B') return EFFORTS.filter((e) => !state.effFilter.length || state.effFilter.includes(e.id)).reduce((n, e) => n + e.tickets.length + 1, 0)
  if (state.variant === 'C') return EFFORTS.reduce((n, e) => n + (state.collapsed[e.id] ? 0 : e.tickets.length + 1), 0)
  if (state.variant === 'D') return (state.activeEffort === 'all' ? EFFORTS : EFFORTS.filter((e) => e.id === state.activeEffort)).reduce((n, e) => n + e.tickets.length + 1, 0)
  return EFFORTS.reduce((n, e) => n + e.tickets.length + 1, 0)
}
function render() {
  const v = VARIANTS[state.variant]
  qBox.innerHTML = '<b>' + state.variant + ' · ' + esc(v.name) + '</b><br>' + esc(v.question)
  stage.innerHTML = v.render()
  document.querySelectorAll('.bar button[data-v]').forEach((b) => b.classList.toggle('on', b.dataset.v === state.variant))
  stateBox.innerHTML = '<b>' + state.variant + '</b> ' + esc(v.name) +
    '\n筛选 effort: ' + (state.effFilter.length ? state.effFilter.join(', ') : '（全部）') +
    '\n切换器选中: ' + (state.variant === 'D' ? state.activeEffort : '—') +
    '\n折叠: ' + (Object.keys(state.collapsed).filter((k) => state.collapsed[k]).join(', ') || '（无）') +
    '\n可见行数: ' + visibleCount()
}

// 底部切换条
bar.innerHTML = Object.keys(VARIANTS).map((k) => '<button data-v="' + k + '">' + k + ' · ' + esc(VARIANTS[k].name) + '</button>').join('') +
  '<span class="hint">← → 切换</span>'
bar.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-v]')
  if (!b) return
  setVariant(b.dataset.v)
})

// 面板内的交互（都只改内存状态）
stage.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]')
  if (!el) return
  const act = el.dataset.act
  if (act === 'eff-clear') state.effFilter = []
  else if (act === 'eff') {
    const id = el.dataset.eff
    state.effFilter = state.effFilter.includes(id) ? state.effFilter.filter((x) => x !== id) : state.effFilter.concat([id])
  } else if (act === 'group') {
    const id = el.dataset.eff
    state.collapsed[id] = !state.collapsed[id]
  } else if (act === 'seg') state.activeEffort = el.dataset.eff
  render()
})

function setVariant(v) {
  if (!VARIANTS[v]) return
  state.variant = v
  try {
    const url = new URL(location.href)
    url.searchParams.set('variant', v)
    history.replaceState(null, '', url)
  } catch (e) { /* 直接双击打开时（file://）浏览器不许改地址栏 —— 不影响切换，只是 URL 不跟着变 */ }
  render()
}
window.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return
  const keys = Object.keys(VARIANTS)
  const i = keys.indexOf(state.variant)
  setVariant(keys[(i + (e.key === 'ArrowRight' ? 1 : keys.length - 1)) % keys.length])
})

const fromUrl = new URLSearchParams(location.search).get('variant')
setVariant((fromUrl || 'B').toUpperCase())
</script>
</body>
</html>
