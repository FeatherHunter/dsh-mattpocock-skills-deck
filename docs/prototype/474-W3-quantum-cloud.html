<title>原型 #474 · W3 — 量子概率云（观测即坍缩）</title>
<!--
  PROTOTYPE — 一次性原型，不是生产代码，不要合进主干。
  issue：FeatherHunter/dsh-mattpocock-skills-deck#474
  设计任务书：docs/prototype/474-design-brief.md

  W3 · 量子概率云（观测即坍缩）。一句话：
    没走到的票不是一个待办，而是一团「还不确定在哪、也不确定它是什么」的概率云；
    你点它一下就是一次观测，观测会让它坍缩成一张确定的票，并且让旁边的云也清楚一点。

  怎么读这一屏：
    - 确定态（已走亮 / 照亮中 / 现在能做）：清晰的圆点 + 实的连线 + 完整标题，不抖动。
    - 概率云（雾里）：几十个细小粒子组成的一团模糊云，位置与透明度在缓慢浮动；
      里面只有一个隐约的问号与票号，标题不写出来（因为确实不知道）。
    - 点一下云 = 观测：粒子在 520 毫秒内收束坍缩成一颗确定的点，标题显形，连线接通，
      原位不动，右上角留一个「✦ 已观测」标记。
    - 一次观测会波及邻居（同一层 + 直接依赖它的票）：邻居的粒子数降到约一半、模糊度下降。
      这就是「看清一处，周围也跟着清楚一点」。
    - 目的地一颗亮锚点，永不抖动、永远可见；走亮的路从它往下连成一条实线光路。

  为什么「原位保留 + 已观测标记」：坍缩不是把一张票搬到别处，而是这一处从此确定了；
  界面要能看出「这一处是我观测出来的」。底部「重置观测」只服务原型演示，把这一屏的观测全部撤销。

  性能与实现约束：
    - 粒子总数 ≤ 200（40 粒/云 × 最多 5 云）。真实粒子数写在画布节点的 data-particles 上
      （已坍缩 = 0）；每个画布还写死了 data-particles-max 作为上限，便于自检脚本读数。
    - 没有 setInterval / setTimeout 轮询。粒子浮动是「只跑一次」的 requestAnimationFrame：
      跑 3.2 秒后自己停下，云保持静止但仍然模糊（静止的云一样看得出"不知道"）。
    - URL：?w=400|810  ?s=active|empty|big  ?bar=0  ?obs=0..n

  数据：#604 那段 JSON 是 design brief §4 的原样真数据；empty / big 两个状态是示例，界面标了「示例」。
-->
<style>

.chrome-top{display:flex;align-items:center;gap:6px;padding:9px 12px 5px;font-size:11px}
.chrome-top .repo{color:var(--view);font-family:var(--mono);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chrome-top .ico{color:var(--cap);border:1px solid var(--bd);border-radius:5px;padding:0 5px;font-size:10px}
.chrome-tabs{display:flex;align-items:center;gap:4px;padding:0 10px 8px;font-size:11px;flex-wrap:nowrap;overflow:hidden}
.chrome-tabs .tab{padding:1px 7px;border-radius:6px;color:var(--sec)}
.chrome-tabs .tab.on{background:rgba(192,132,252,.14);border:1px solid rgba(192,132,252,.45);color:#e9d5ff}
.chrome-tabs .mini{border:1px solid var(--bd);border-radius:6px;padding:0 6px;color:var(--sec);font-size:10.5px}
.chrome-tabs .ver{color:var(--cap);font-size:10px;font-family:var(--mono)}
.panel.narrow .chrome-tabs .mini,.panel.narrow .chrome-tabs .ver{display:none}
.sp{flex:1}
.sticky{display:flex;align-items:center;gap:7px;padding:8px 12px;background:var(--l2);border-bottom:1px solid var(--bd);flex-wrap:nowrap}
.panel.narrow .sticky{gap:5px}
.btn{font-size:11px;padding:3px 9px;border-radius:7px;border:1px solid var(--bd);background:var(--base);
  color:var(--tx);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.btn:hover{border-color:var(--bd2)}
.btn:focus-visible{outline:2px solid var(--map);outline-offset:1px}
.btn.primary{background:var(--walk);border-color:transparent;color:#04120a;font-weight:700}
.btn.ghost{background:transparent}
.crumb{color:var(--cap);font-size:11px;white-space:nowrap}
.panel.narrow .crumb{font-size:10px}
.chipm{font-size:10.5px;color:#e9d5ff;border:1px solid rgba(192,132,252,.45);border-radius:6px;padding:0 6px;
  background:rgba(192,132,252,.1);white-space:nowrap}

/* ---------- 图本体 ---------- */
.mapwrap{flex:1 1 auto;overflow:auto;background:
  radial-gradient(520px 300px at 50% 0%,rgba(192,132,252,.07),transparent 70%),var(--l3)}
.map{position:relative;margin:0 auto}
.map svg.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke-width:1.6}
.edge.walk{stroke:rgba(74,222,128,.62)}
.edge.dim{stroke:rgba(122,132,156,.34);stroke-dasharray:2 5}
.edge.trail{stroke:rgba(74,222,128,.9);stroke-width:2.4}
.edge.hot{stroke:rgba(192,132,252,.72);stroke-dasharray:5 6;animation:dash 1.4s linear 2}
.edge.hit{stroke:rgba(233,213,255,.85);stroke-dasharray:4 5;animation:dash 1.1s linear 3}
@keyframes dash{to{stroke-dashoffset:22}}

.anchor{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 12px 8px;border-radius:12px;border:1px solid rgba(192,132,252,.5);
  background:radial-gradient(circle at 50% 22%,rgba(192,132,252,.20),rgba(16,19,26,.9) 72%);
  box-shadow:0 0 22px rgba(192,132,252,.22);text-align:center;max-width:92%}
.anchor .apin{width:13px;height:13px;border-radius:99px;background:#e9d5ff;
  box-shadow:0 0 12px 3px rgba(233,213,255,.75),0 0 30px 10px rgba(192,132,252,.35)}
.anchor .alab{font-size:10.5px;color:#e9d5ff;letter-spacing:.04em}
.anchor .atxt{font-size:11.5px;color:var(--sec);line-height:1.5;max-width:560px}
.panel.narrow .anchor .atxt{font-size:11px}

/* 层的说明行：靠左对齐，避免和层间连线的竖干撞在一起 */
.phase{position:absolute;transform:translateY(-50%);text-align:left;color:var(--cap);font-size:10.5px;line-height:1.4;width:120px}
.panel.narrow .phase{width:46px}
.panel.narrow .phase .wn{font-size:10.5px;line-height:1.15;letter-spacing:0}
.panel.narrow .phase .pt{display:none}
.phase .wn{display:block;font-family:var(--mono);font-size:11.5px;color:#c7d2e0;letter-spacing:.06em}

/* 左边一条层的竖干：把层串起来 */
.rail{position:absolute;left:9px;top:0;width:1px;background:repeating-linear-gradient(180deg,rgba(122,132,156,.45) 0 3px,transparent 3px 8px)}
.panel.narrow .rail{display:none}

/* 确定态：一颗清晰的点 + 一张清晰的卡。不抖动、不模糊 */
.node{position:absolute;width:172px;margin-left:-86px;top:0}
.panel.narrow .node{width:150px;margin-left:-75px}
.node .card{border:1px solid var(--bd);border-radius:10px;background:#191c23;padding:7px 9px 8px;
  position:relative;overflow:hidden}
.node .head{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--cap);font-family:var(--mono)}
.node .head .no{color:#c7d2e0}
.node .glyph{width:15px;height:15px;flex:none;border-radius:5px;display:grid;place-items:center;
  font-size:10px;border:1px solid var(--bd2);color:var(--sec)}
.node .title{font-size:11.5px;line-height:1.45;color:var(--tx);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node .why{margin-top:5px;font-size:10px;padding:1px 6px;border-radius:99px;display:inline-block;
  border:1px solid var(--bd2);color:var(--sec);position:relative}
.node .dot2{position:absolute;left:50%;top:-8px;width:9px;height:9px;margin-left:-4.5px;border-radius:99px;
  border:1px solid #0b0d12;z-index:2}
/* 已走亮：实心绿点 + 实线边 */
.node.s-walk .card{border-color:rgba(74,222,128,.42);background:#151c19}
.node.s-walk .dot2{background:var(--walk);box-shadow:0 0 9px rgba(74,222,128,.7)}
.node.s-walk .why{color:#c9f7d8;border-color:rgba(74,222,128,.4)}
.node.s-walk .glyph{color:var(--walk);border-color:rgba(74,222,128,.45)}
/* 照亮中：实心蓝点 + 方角卡（形状不同，不只靠颜色） */
.node.s-view .card{border-color:rgba(88,166,253,.55);background:#141b25;border-radius:3px}
.node.s-view .dot2{background:var(--view);width:11px;height:11px;margin-left:-5.5px;top:-9px;
  box-shadow:0 0 12px rgba(88,166,253,.85)}
.node.s-view .why{color:#cfe4ff;border-color:rgba(88,166,253,.45)}
.node.s-view .glyph{color:var(--view);border-color:rgba(88,166,253,.45)}
/* 现在能做：空心的琥珀点 + 双描边（形状不同） */
.node.s-open .card{border-color:rgba(245,158,11,.5);background:#1b1811;
  box-shadow:0 0 18px rgba(245,158,11,.08)}
.node.s-open .dot2{background:#1a1409;border:2px solid var(--know);width:12px;height:12px;margin-left:-6px;top:-10px;
  box-shadow:0 0 10px rgba(245,158,11,.6)}
.node.s-open .why{color:#ffe1ad;border-color:rgba(245,158,11,.45)}
.node.s-open .glyph{color:var(--know);border-color:rgba(245,158,11,.45)}
.node.is-here .card{outline:1px dashed rgba(88,166,253,.5);outline-offset:3px}
.node{cursor:pointer}

/* ---------- 概率云（雾里的票） ---------- */
.node.is-cloud{cursor:crosshair}
.node.is-cloud .card{background:transparent;border:1px dashed rgba(140,150,180,.30);
  box-shadow:none;transition:border-color .4s ease,background .5s ease;
  display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:78px}
.node.is-cloud .qcanvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:1;
  filter:blur(.55px);transition:filter .5s ease}
.node.is-cloud .qover{position:relative;z-index:0;display:flex;flex-direction:column;gap:1px;
  align-items:center;text-align:center;user-select:none;
  /* 问号与票号底下垫一层很淡的暗光：粒子飘到字上也还能看清，但不吃掉云的感觉 */
  background:radial-gradient(ellipse 62% 72% at 50% 50%,rgba(13,15,22,.72),rgba(13,15,22,0) 100%)}
.node.is-cloud .gg{font-size:25px;line-height:1.05;color:rgba(224,230,244,.85);font-weight:600}
.node.is-cloud .qno{font-family:var(--mono);font-size:10.5px;color:rgba(199,210,224,.70)}
.node.is-cloud .qtip{font-size:9.5px;color:rgba(150,158,178,.62);line-height:1.45}
.node.is-cloud:hover .card{border-color:rgba(192,132,252,.6)}
.node.is-cloud:hover .gg{color:#e9d5ff}
.node.is-cloud:focus-visible{outline:2px solid var(--map);outline-offset:2px}
/* 被邻居的观测波及：粒子变少、模糊度下降、中心透出来 —— 这一处已经比别处清楚一点了 */
.node.is-cloud.is-thinning .qcanvas{filter:blur(.15px)}
.node.is-cloud.is-thinning .card{
  background:radial-gradient(circle at 50% 46%,rgba(192,132,252,.11),transparent 72%);
  border-color:rgba(160,170,205,.42)}
.node.is-cloud.is-thinning .gg{color:rgba(233,213,255,.95)}
.node.is-cloud.is-thinning .qtip{color:rgba(190,195,215,.72)}
/* 坍缩那一瞬的一次性涟漪（不是循环动画） */
.node.is-collapsing .card{border-color:rgba(233,213,255,.85);border-style:solid}
.node.is-collapsing::after{content:"";position:absolute;left:50%;top:14px;width:64px;height:64px;margin-left:-32px;
  border-radius:99px;border:1px solid rgba(233,213,255,.75);animation:ripple .62s ease-out 1 both;pointer-events:none;z-index:3}
@keyframes ripple{from{transform:scale(.45);opacity:.95}to{transform:scale(2.3);opacity:0}}
/* 坍缩后的确定态：原位定格 */
.node.is-observed .card{border:1px solid rgba(192,132,252,.62);background:#191622}
.node.is-observed .dot2{background:var(--map);box-shadow:0 0 12px rgba(192,132,252,.8)}
.node.is-observed .why{border-color:rgba(192,132,252,.5);color:#e9d5ff}
.obsmark{display:inline-block;margin-top:4px;margin-left:4px;font-size:9.5px;padding:0 5px;border-radius:99px;
  background:#2a1f3d;border:1px solid rgba(192,132,252,.6);color:#e9d5ff;white-space:nowrap;
  animation:popin .5s ease-out 1 both;vertical-align:top}
@keyframes popin{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

/* 虚空：还没画图 */
.void{position:absolute;left:0;right:0;text-align:center;color:var(--cap);font-size:11px;line-height:1.75;padding:0 22px}

/* ---------- 读数与详情 ---------- */
.readout{flex:none;border-top:1px solid var(--bd);background:var(--l2);padding:8px 12px;
  display:flex;flex-direction:column;gap:3px}
.rdrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.counts{font-family:var(--mono);font-size:12px;color:#c7d2e0;white-space:nowrap}
.counts b{color:#e9d5ff;font-weight:700}
.counts i{font-style:normal;color:var(--cap)}
.honest{font-size:11px;color:var(--sec)}
.hint{font-size:10.5px;color:var(--cap);line-height:1.5}
.detail{flex:none;border-top:1px solid var(--bd);background:var(--base);padding:9px 12px 11px}
.detail .dh{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--cap);font-family:var(--mono);flex-wrap:wrap}
.detail .dt{font-size:12.5px;color:var(--tx);margin-top:4px;line-height:1.55}
.detail .ds{font-size:11px;color:var(--sec);margin-top:3px;line-height:1.5}
.detail .dw{color:#e9d5ff}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:10px;color:var(--cap)}
.legend .li{display:flex;align-items:center;gap:4px}
.legend .sw{width:14px;height:14px;flex:none;border-radius:4px;border:1px solid var(--bd2);position:relative}
.legend .sw.walk{background:#151c19;border-color:rgba(74,222,128,.5)}
.legend .sw.walk::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:99px;background:var(--walk)}
.legend .sw.view{background:#141b25;border-color:rgba(88,166,253,.6)}
.legend .sw.view::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;background:var(--view)}
.legend .sw.open{background:#1b1811;border-color:rgba(245,158,11,.5)}
.legend .sw.open::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:99px;border:2px solid var(--know)}
.legend .sw.cloud{background:#0e1017;border:1px dashed rgba(140,150,180,.5);
  box-shadow:inset 0 0 8px 3px rgba(160,170,200,.22)}
.legend .sw.obs{background:#191622;border-color:rgba(192,132,252,.6)}
.legend .sw.obs::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:99px;background:var(--map)}

/* ---------- 原型控制条（不属于设计本身） ---------- */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:9999;display:flex;flex-wrap:wrap;
  gap:6px;align-items:center;background:rgba(12,14,19,.94);border:1px solid var(--bd);border-radius:12px;
  padding:7px 9px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.grp{display:flex;align-items:center;gap:4px}
.gl{font-size:10px;color:var(--cap);margin-right:1px}
.seg{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--bd);background:#141821;
  color:var(--sec);cursor:pointer;font-family:inherit}
.seg:hover{border-color:var(--bd2)}
.seg:focus-visible{outline:2px solid var(--map);outline-offset:1px}
.seg.on{border-color:var(--map);background:rgba(192,132,252,.16);color:#e9d5ff;font-weight:600}
.note{max-width:1500px;margin:10px auto 0;padding:0 18px;font-size:11.5px;color:var(--cap);line-height:1.75}
.note b{color:var(--sec)}
/* 晃动敏感的人：把浮动与那圈涟漪都收掉，云仍然是模糊的云，只是不动 */
@media (prefers-reduced-motion: reduce){
  .node.is-cloud .qcanvas{filter:blur(1.1px)}
  .node.is-collapsing::after{animation:none;opacity:0}
  .edge.hot,.edge.hit{animation:none}
}
</style>

  }
  var byNo = {};
  all.forEach(function (t) { byNo[t.no] = t; });
  var edges = [];
  all.forEach(function (t) {
    (t.blockedBy || []).forEach(function (bn) {
      var b = byNo[bn];
      if (!b || !pos[b.no] || !pos[t.no]) return;
      edges.push({ b: b, t: t, gap: pos[b.no].layer + '>' + pos[t.no].layer });
    });
  });
  // 同一个层间通道里的边各占一条横线，避免多条边叠成一条
  var groups = {};
  edges.forEach(function (e) { (groups[e.gap] = groups[e.gap] || []).push(e); });
  Object.keys(groups).forEach(function (k) {
    var g = groups[k];
    g.forEach(function (e, i) {
      var yTop = pos[e.b.no].y, yBot = pos[e.t.no].y;
      var rail = (yBot - yTop) > 30 ? yTop + 26 + ((yBot - yTop - 38) * i) / Math.max(1, g.length - 1 || 1)
        : (yTop + yBot) / 2;
      if (g.length === 1) rail = yBot - Math.max(18, (yBot - yTop) * .42);
      var sa = effectiveState(e.b, map), sb = effectiveState(e.t, map);
      var cls = (sa === 'walk' && (sb === 'walk' || sb === 'view' || sb === 'open' || sb === 'observed')) ? 'walk' : 'dim';
      var hot = state.observed[e.t.no] || state.observed[e.b.no];
      html += '<path class="edge ' + cls + (hot ? ' hot' : '') + '" data-from="' + e.b.no + '" data-to="' + e.t.no + '" d="' +
        orthoPath(pos[e.b.no], pos[e.t.no], rail) + '"/>';
    });
  });
  html += '</svg>';

  /* 目的地：永远清晰、永不抖动 */
  html += '<div class="anchor" id="destination" style="left:' + cx + 'px;top:' + L.top + 'px;width:' +
    Math.min(W - 32, 620) + 'px"><span class="apin"></span><span class="alab">目的地 · 永远清晰</span>' +
    '<span class="atxt">' + esc(clamp(map.destination, W < 520 ? 130 : 230)) + '</span></div>';

  /* 空图：一片还没有任何观测的虚空 */
  if (!all.length) {
    html += '<div class="void" style="top:' + (L.top + L.anchorH + 40) + 'px">' +
      '<div style="color:#a1a1aa;font-size:12px">这张图还是一片虚空。</div>' +
      '<div>没有一张票，也就没有一个地方被观测过 —— 只有上面那颗锚点亮着。</div>' +
      '<div style="color:#c7d2e0">目的地是清楚的，通往它的路一条都还没有。</div>' +
      '<div style="margin-top:10px">这是「不知道」最满的样子：我们连该问什么，现在还不知道。</div>' +
      '</div></div>';
    return { body: html, cn: cn };
  }

  /* 层的说明行 + 左边一条层的竖干 */
  var firstY = pos[L.layers[0].items[0].no].y;
  var lastY = pos[L.layers[L.layers.length - 1].items[0].no].y;
  html += '<div class="rail" style="top:' + firstY + 'px;height:' + Math.max(20, lastY - firstY) + 'px"></div>';
  L.layers.forEach(function (Lx) {
    var yy = pos[Lx.items[0].no].y;
    var states = Lx.items.map(function (t) { return effectiveState(t, map); });
    var word = states.every(function (s) { return s === 'walk'; }) ? '这一段已经走亮'
      : states.indexOf('view') >= 0 ? '这一层正在推进'
      : states.indexOf('open') >= 0 ? '这一层现在就能做'
      : states.every(function (s) { return s === 'fog'; }) ? '这一层全在雾里'
      : '半层清楚、半层在雾里';
    html += '<div class="phase" style="left:10px;top:' + (yy - 27) + 'px">' +
      '<span class="wn">第 ' + (Lx.i + 1) + ' 层</span><span class="pt">' + word + '</span></div>';
  });

  /* 票节点 */
  all.forEach(function (t) {
    var p = pos[t.no];
    var s = effectiveState(t, map);
    var isObs = s === 'observed';
    var isCloud = s === 'fog';
    var thin = isCloud && !!state.thinned[t.no];
    var cls = 'node s-' + s + (isCloud ? ' is-cloud' : '') + (thin ? ' is-thinning' : '') + (isObs ? ' is-observed' : '');
    if (state.sel === t.no) cls += ' is-here';
    var isBig = state.s === 'big';
    var cw = Math.min(state.w < 520 ? 150 : 172, (isBig ? (state.w < 520 ? 120 : 150) : 172));
    var ch = isBig ? (state.w < 520 ? 86 : 96) : Math.min(112, Math.max(70, 40 + Math.ceil(clamp(t.title, 42).length / 3) * 9));

    html += '<div class="' + cls + '" data-no="' + t.no + '" data-state="' + s + '"' +
      (isCloud ? ' role="button" tabindex="0" aria-label="' + esc('#' + t.no + ' 还在雾里，点一下观测它') + '"' : '') +
      ' style="left:' + Math.round(p.x) + 'px;top:' + p.y + 'px;width:' + cw + 'px;margin-left:' + (-cw / 2) + 'px">' +
      '<span class="dot2"></span><div class="card">';
    if (isCloud) {
      html += '<canvas class="qcanvas" data-particles-max="' + DOTS_MAX + '" data-particles="' + DOTS_MAX +
        '" width="' + (cw * 2) + '" height="' + (ch * 2) + '"></canvas>' +
        '<div class="qover" style="min-height:' + ch + 'px">' +
        '<span class="gg">？</span>' +
        '<span class="qno">#' + t.no + ' · ' + (TYPE_L[t.type] || t.type) + '</span>' +
        '<span class="qtip">不知道它是什么，也不知道它在哪</span>' +
        ((t.blockedBy && t.blockedBy.length) ? '<span class="qtip">路是画出来了，通不通还不知道</span>' : '') +
        '</div>';
    } else {
      html += '<div class="head"><span class="glyph">' + (GLYPH[t.type] || '·') + '</span>' +
        '<span class="no">#' + t.no + '</span><span>' + (TYPE_L[t.type] || '') + '</span></div>' +
        '<div class="title">' + esc(clamp(t.title, 62)) + '</div>';
    }
    if (isObs) html += '<span class="obsmark">✦ 已观测 · 原位坍缩</span>';
    if (!isCloud) {
      var why = isObs ? ('观测出来的' + (state.seq ? ' · 第 ' + state.seq + ' 次观测' : ''))
        : STATE_WORD[s] + (s === 'view' && t.claimedBy ? ' · ' + esc(t.claimedBy) : '');
      html += '<div class="why">' + why + '</div>';
    }
    html += '</div></div>';
  });

  html += '</div>';
  return { body: html, cn: cn };
}

function readoutHtml(cn, empty) {
  return '<div class="readout">' +
    '<div class="rdrow"><span class="counts" id="counts">已确定 <b>' + cn.determined + '</b> <i>·</i> 未观测 <b>' +
    cn.unexplained + '</b></span>' +
    '<span class="honest" id="honest">没观测的地方不是没有，是我们还不知道。</span></div>' +
    '<div class="rdrow"><span class="hint">' +
    (empty ? '这一屏里一个地方都还没被观测过。'
      : '点一下那团雾（概率云）＝ 一次观测：粒子会收束坍缩成一张确定的票，同层和依赖它的邻居云也跟着清楚一点。') +
    '</span></div></div>';
}

function legendHtml() {
  return '<div class="legend">' +
    '<span class="li"><span class="sw walk"></span>已走亮（实心圆点 · 实线）</span>' +
    '<span class="li"><span class="sw view"></span>照亮中（方角卡 · 大点）</span>' +
    '<span class="li"><span class="sw open"></span>现在能做（空心点 · 双描边）</span>' +
    '<span class="li"><span class="sw cloud"></span>概率云（一团粒子 · 模糊 · 只在雾里）</span>' +
    '<span class="li"><span class="sw obs"></span>观测出来的（原位定格 · 带 ✦ 标记）</span></div>';
}
function detailHtml(map) {
  var all = map.tickets;
  if (!all.length) {
    return '<div class="detail" id="detail"><div class="dh">这一屏还没有票</div>' +
      '<div class="dt">地图 #' + map.no + ' 还是一片虚空。</div>' +
      '<div class="ds">它不是空白，也不是报错 —— 是「我们连该问什么还不知道」。</div>' +
      legendHtml() + '</div>';
  }
  var sel = all.filter(function (t) { return t.no === state.sel; })[0]
    || all.filter(function (t) { return state.observed[t.no]; })[0]
    || all.filter(function (t) { return stateOf(t, map.tickets) === 'view'; })[0]
    || all.filter(function (t) { return stateOf(t, map.tickets) === 'open'; })[0]
    || all[all.length - 1];
  state.sel = sel.no;
  var s = effectiveState(sel, map);
  var why = s === 'walk' ? '这一段已经走完了。'
    : s === 'view' ? '正在照亮这一片，接着做就是它。'
    : s === 'open' ? '现在就能做的一张 —— 它的阻塞者全都关了。'
    : s === 'observed' ? '这一处是你刚刚观测出来的：原位坍缩成了一张确定的票。它原先是一团概率云 —— 不是没有，是我们还不知道。'
    : '路是画出来了，但通不通还不知道 —— 它前面还有没关掉的票。';
  var blockers = blockersOf(sel, map.tickets).map(function (b) { return '#' + b.no; }).join('、');
  return '<div class="detail" id="detail">' +
    '<div class="dh">#' + sel.no + ' · ' + (TYPE_L[sel.type] || sel.type) + ' · ' + (STATE_WORD[s] || s) +
    (s === 'view' && sel.claimedBy ? ' · ' + esc(sel.claimedBy) : '') +
    (s === 'fog' && blockers ? ' · 被 ' + blockers + ' 挡着' : '') +
    (sel.state === 'CLOSED' ? ' · CLOSED' : '') + '</div>' +
    '<div class="dt">' + esc(sel.title) + '</div>' +
    '<div class="ds" style="color:#8b8b95">' + esc(clamp(map.destination, 170)) + '</div>' +
    '<div class="ds dw">' + why + '</div>' + legendHtml() + '</div>';
}
function renderDetail() {
  var host = document.getElementById('dhost');
  if (host) host.innerHTML = detailHtml(mapOf());
}

/* =====================================================================
   6. 装载与交互
   ===================================================================== */
function mountClouds(map) {
  var all = map.tickets;
  clouds = [];
  var now = performance.now();
  var drifting = (now - driftStart) < DRIFT_MS;   // 上一次的浮动还没跑完 → 接着这一轮的相位画，不重置
  Array.prototype.forEach.call(document.querySelectorAll('.node'), function (node) {
    var no = Number(node.dataset.no);
    if (node.classList.contains('is-cloud')) {
      var cv = node.querySelector('.qcanvas');
      if (!cv) return;
      var w = Math.round(parseFloat(cv.width) / 2) || 150;
      var h = Math.round(parseFloat(cv.height) / 2) || 90;
      var cl = new Cloud(no);
      cl.mount(cv, w, h);
      if (state.thinned[no]) cl.count = Math.max(6, Math.round(DOTS_MAX * THIN_RATIO));
      /* 每一次重画界面都会拿到一块新的画布（旧像素不在了），所以粒子必须重新撒一遍 ——
         少撒一遍的话，坍缩一开始就会看见"粒子凭空消失"。 */
      cl.seed();
      cl.draw(now - driftStart);
      clouds.push(cl);
      node.onclick = function () { observe(no); };
      node.onkeydown = function (e) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); observe(no); }
      };
    } else {
      node.onclick = function () { select(no); };
    }
  });
  if (!drifting) driftStart = now;
  if (!manualPump) ensureLoop();
}
/* 只是换一个"选中"，不重建 DOM —— 免得每次点确定态的票都把云的浮动重新起一遍 */
function select(no) {
  state.sel = no;
  Array.prototype.forEach.call(document.querySelectorAll('.node'), function (n) {
    n.classList.toggle('is-here', Number(n.dataset.no) === no);
  });
  renderDetail();
}

var pendingObs = null;   // 正在进行坍缩的那张票

function observe(no) {
  var map = mapOf(), all = map.tickets;
  var t = all.filter(function (x) { return x.no === no; })[0];
  if (!t) return;
  if (effectiveState(t, map) !== 'fog') { select(no); return; }

  state.observed[no] = true;
  state.seq++;
  state.sel = no;
  pendingObs = no;

  /* 邻居：同一层 + 直接依赖它的票 —— 它们的云也清楚一点 */
  var nb = neighborsOf(t, map).filter(function (x) { return effectiveState(x, map) === 'fog'; });
  nb.forEach(function (x) { state.thinned[x.no] = true; });

  var cl = clouds.filter(function (x) { return x.no === no; })[0];
  if (cl) cl.collapse = { start: performance.now(), ms: 0, dur: COLLAPSE_MS };

  /* 先把 DOM 上的"坍缩中 + 邻居变清楚"表现出来，画布里的粒子在动画里收束 */
  var node = document.querySelector('.node[data-no="' + no + '"]');
  if (node) { node.classList.add('is-collapsing'); node.dataset.state = 'collapsing'; }
  nb.forEach(function (x) {
    var nx = document.querySelector('.node[data-no="' + x.no + '"]');
    if (!nx) return;
    nx.classList.add('is-thinning');
    nx.dataset.state = 'fog-thinning';
    var cv = nx.querySelector('.qcanvas');
    var cx = clouds.filter(function (y) { return y.no === x.no; })[0];
    if (cv && cx) { cx.count = Math.max(6, Math.round(DOTS_MAX * THIN_RATIO)); cv.setAttribute('data-particles', String(cx.count)); }
  });
  var countsEl = document.getElementById('counts');
  if (countsEl) {
    var cn = countsText();
    countsEl.innerHTML = '已确定 <b>' + cn.determined + '</b> <i>·</i> 未观测 <b>' + cn.unexplained + '</b>';
  }
  renderDetail();
  if (!manualPump) ensureLoop();
}

/* 坍缩收尾：原位定格，只重建这一屏（云的数量变了） */
function endCollapse(cl) {
  cl.count = 0;
  cl.parts = [];
  cl.collapse = null;
  cl.draw(0);
  if (cl.cv) cl.cv.setAttribute('data-particles', '0');
  repaintAll();
  /* 连线接通：把与它相连的线点亮一下（不是循环动画，跑几次就停） */
  Array.prototype.forEach.call(document.querySelectorAll('.edge'), function (e) {
    if (e.dataset.to === String(cl.no) || e.dataset.from === String(cl.no)) e.classList.add('hit');
  });
  pendingObs = null;
}

function repaintAll() {
  var map = mapOf();
  var panel = document.getElementById('panel');
  panel.className = 'panel' + (state.w < 520 ? ' narrow' : '');
  panel.style.width = state.w + 'px';
  var r = render(map, state.w);
  panel.innerHTML =
    '<div class="chrome">' +
      '<div class="chrome-top"><span class="repo">FeatherHunter/dsh-mattpocock-skills-deck</span><span class="sp"></span>' +
      '<span class="ico">⚙</span><span class="ico">✕</span></div>' +
      '<div class="chrome-tabs"><span class="tab on">列表</span><span class="tab">拉取请求</span><span class="tab">技能</span><span class="tab">环境检查</span>' +
      '<span class="sp"></span><span class="mini">+ 需求</span><span class="mini">+ bug</span><span class="mini">刷新</span><span class="ver">v1.7.24</span></div>' +
    '</div>' +
    '<div class="sticky"><button class="btn ghost sm" id="back">← 返回</button>' +
    '<span class="crumb">列表 / #' + map.no + '</span>' +
    '<span class="chipm">▣ wayfinder:map</span><span class="sp"></span>' +
    '<button class="btn primary sm" id="advance">▶ 推进这张图</button></div>' +
    '<div class="mapwrap" id="mapwrap">' + r.body + '</div>' +
    readoutHtml(r.cn, !map.tickets.length) +
    '<div id="dhost"></div>';

  document.getElementById('back').onclick = function () { state.sel = null; renderDetail(); };
  document.getElementById('advance').onclick = function () {
    var fog = map.tickets.filter(function (t) { return effectiveState(t, map) === 'fog'; })[0];
    if (fog) { observe(fog.no); return; }
    var open = map.tickets.filter(function (t) { return stateOf(t, map.tickets) === 'open'; })[0];
    if (open) select(open.no);
  };
  mountClouds(map);
  renderDetail();
  document.querySelectorAll('.seg').forEach(function (b) {
    if (b.dataset.k) b.classList.toggle('on', String(state[b.dataset.k]) === b.dataset.v);
  });
  var u = new URL(location.href);
  u.searchParams.set('w', String(state.w));
  u.searchParams.set('s', state.s);
  if (state.seq) u.searchParams.set('obs', String(state.seq)); else u.searchParams.delete('obs');
  history.replaceState(null, '', u.toString());
}

document.getElementById('note').innerHTML =
  '<b>W3 · 量子概率云（观测即坍缩）</b>　雾里的票不是一个待办，而是一团还没有形状的概率云：' +
  '位置在慢慢飘、标题写不出来，只剩一个隐约的问号。点它一下就是<b>一次观测</b> —— ' +
  '粒子收束坍缩成一张确定的票，并且把邻居的云也带清楚一点。上面那颗紫色的锚点是目的地，它永远亮着、永远不抖。';

document.querySelectorAll('.seg[data-k]').forEach(function (b) {
  b.onclick = function () {
    var k = b.dataset.k;
    state[k] = (k === 'w') ? Number(b.dataset.v) : b.dataset.v;
    if (k === 's') { state.observed = {}; state.thinned = {}; state.seq = 0; state.sel = null; }
    repaintAll();
  };
});
document.getElementById('reset').onclick = function () {
  state.observed = {}; state.thinned = {}; state.seq = 0; state.sel = null;
  repaintAll();
};
document.getElementById('observeAll').onclick = function () {
  var map = mapOf();
  var next = map.tickets.filter(function (t) { return effectiveState(t, map) === 'fog'; })[0];
  if (next) observe(next.no); else repaintAll();
};
window.addEventListener('keydown', function (e) {
  var tag = ((e.target && e.target.tagName) || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable)) return;
  /* ArrowLeft / ArrowRight 不拦截 */
});
if (state.bar) document.getElementById('bar').style.display = 'none';
if (state.s === 'big' && state.seq) { /* obs 参数已经填好 */ }
repaintAll();
})();
</script>
</body>
</html>
