<text x="184" y="222" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="20" font-weight="700" fill="#f0f0f6">dsh-opencode-palette</text>
<text x="184" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#8a8a94">github.com/FeatherHunter/dsh-opencode-palette</text>
<text x="184" y="280" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="15" fill="#b8b8c2">喜欢 opencode 的配色？让 DSH 也穿上它 ——</text>
<text x="184" y="304" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="15" fill="#b8b8c2">34 款经典主题，眼睛舒服了，码字也开心。</text>
