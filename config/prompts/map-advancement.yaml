mapInspect:
  version: 12
  placeholders:
    - n
    - title
    - url
    - subIssue
  use: map 空态 0/0 检查 · 诊断关联缺失
  zh: |-
    ## 目标 map
    - 编号：#{n}
    - 标题：{title}
    - 链接：{url}

    该 map 在面板中显示为 0/0（无子议题），这不正常——按 wayfinder 规则，有规划的 map 应通过子议题推进，0/0 通常意味着创建时子议题没有以本后端的原生父子关系正确关联到该 map。

    请按 wayfinder 技能排查并修复关联（遵循其规则）：

    ## 排查
    - [ ] 加载 wayfinder 技能（如未加载），结合该 map 的 Destination / Notes 回顾本应有哪些子议题
    - [ ] 在当前后端中核对这些子议题是否已存在但未成为该 map 的真正子议题（面板计数仍 0/0、详情未展示）

    ## 修复
    - [ ] 先读回该 map 的正文（里面必须保留 `## Destination` 一节），再按本后端声明的关联方式把子议题建成该 map 的子议题：{subIssue}
    - [ ] 若子议题尚未创建，按原规划创建后，用同一种关联方式补建
    - [ ] 修复后按上面的校验方式核对子议题数量与预期一致，并确认面板中该 map 的计数不再是 0/0，详情页能看到完整子议题列表且阻塞关系正确

    ## 收尾
    - [ ] 结束前把这张票的真实状态写进正文
    - [ ] 校验子议题数与面板计数一致，且不再为 0/0

    {{shared:sharedTools}}
  en: |-
    ## Target map
    - No: #{n}
    - Title: {title}
    - Link: {url}

    This map shows 0/0 (no sub-issues) in the panel, which is abnormal — a planned map is expected to advance via sub-issues. 0/0 typically means the sub-issues were not wired as native sub-issues of this map when it was created.

    Please investigate and fix the wiring per the wayfinder skill (follow its rules):

    ## Investigate
    - [ ] Load the wayfinder skill (if not loaded) and review Destination / Notes to recall what sub-issues were intended
    - [ ] Check whether those sub-issues already exist but are not showing as true sub-issues of this map (count still 0/0, not listed in detail)

    ## Fix
    - [ ] First fetch the map current body into an absolute-path file (keep the `## Destination` section), then wire the sub-issues to this map the way this backend declares: {subIssue}
    - [ ] If the sub-issues do not exist yet, create them per the original plan, then wire them the same way
    - [ ] After fixing, verify the sub-issue count matches the way stated above, and that the panel count is no longer 0/0 and the detail page lists all sub-issues with correct blocking

    ## Wrap-up
    - [ ] Before finishing, write the true state of this ticket into its body
    - [ ] Verify sub-issue count matches the panel count and is no longer 0/0

    {{shared:sharedTools}}
specComplete:
  version: 7
  placeholders: [url, closed, total]
  use: '规格容器 · 完成态「完成」按钮：先认这次是怎么做的，把改动交付到仓库长期分支（没有版本库则以当前工作区为准），逐条核对用户故事与逐票证据后按边界关闭规格；关闭只经 deck_issue_patch，没有「顺手关」的旁路，重开只能由人做（#1281、#1350）'
  zh: |-

    这张规格 issue（{url}）下面的实施 issue 已经全部关闭（{closed}/{total}）。这只是触发条件，不是完成证据。

    你的产出只有两样：一段收尾评论、一次关闭。评论要能让没参加这次会话的人独立复核下面四件事；缺任何一件，都不关闭：
    ① 规格承诺的内容真的实现：逐条用户故事都有对应的实现或测试，以「不做」「重复」削减的已经用户确认；
    ② 这批改动已经进入仓库长期保留的那条分支：合并提交、压缩提交都算；没有远端时以本地长期分支为准，没有版本库时以当前工作区为准；
    ③ 在评论写下的那个提交上，仓库检查可复现地全绿；
    ④ 遗留都已处置：待定事项、未提交改动、临时工作区与临时文件、未合并分支里的独有提交。
    没有把握就不关：误关之后只能由人手动纠正。做不到上面任何一条，就把缺口、下一步和由谁做交给用户。

    ## 一、取证据
    - [ ] 确定这批改动在哪：分支、工作区副本、提交。改动散在几处的，合到同一条分支再核对；合并时出现冲突，就是对应票没有真正落地，查清再解，不凭猜测。
    - [ ] 确认当前后端与仓库：本地 Markdown（markdown）/ github / gitlab、仓库地址、写权限；再读仓库说明与近期同类规格的收尾记录，确定交付惯例（用 PR/MR 还是直接推送）、仓库说明指定的平台工具与远端是否可用。后端报告写权限为只读时，评论与关闭都写不进去：不关闭，交回用户。
    - [ ] 找不到改动、或改动只在临时目录里：问用户，不假定已交付；读不到分支或 PR/MR 状态：不关闭，交回用户。

    ## 二、核对
    - [ ] 逐张打开实施 issue，对照验收判据看代码、测试或运行结果；只看关闭状态和票面自述不算数。
    - [ ] 回到规格正文逐条核对最终代码：每条用户故事都有实现或测试；以「不做」「重复」关闭的票，说明规格承诺如何被满足或缩减，并经用户确认；规格正文没有验收标准的，以实施票判据之和为准，并在评论里写明这个口径。逐票通过不等于规格通过。
    - [ ] 在最终要交付的那份代码上跑仓库规定的检查，记下分支名与提交号；在没含这些改动的主分支、有未提交改动的树、别人的分支上跑出的结果不算数。多张票改同一模块或接口的，合起来再核一次。
    - [ ] 处置遗留：规格正文与评论里的「待定」「后续再说」逐条处理（这次做完、转新票记下票号、用户确认不做），结果写回规格正文原处；未提交改动确认归属，不属于这次的交给用户；实施工作区副本、已合并的临时分支、临时文件清理掉，未合并的分支保留并把独有的提交列给用户；丢弃任何改动前先征得同意。
    - [ ] 发现遗漏、未完成，或判据缺失、写错：不关闭，把缺什么、影响哪条规格承诺告诉用户，与用户商量重开相关实施 issue、新建 issue 承接、或确认缩减范围；按用户决定执行并记下票号。不替用户编造确认，不自行放宽判据。

    ## 三、交付
    - [ ] 仓库用 PR/MR 交付：有 PR/MR 就核对状态，没有就建，草稿改为可评审；标题用一句话说清交付了什么、引用规格与实施票，正文用 /pr 技能写。等合入长期分支后再继续；需要人合并就停下，把链接与结论交给用户，说明合并后再关闭。未经用户当场授权，不替人合并。
    - [ ] 仓库直接推送，或后端是本地 Markdown（deck 这一侧不知道代码平台），或改动本来就在长期分支的主工作区、没有独立工作树：确认这次改动都已提交、已在长期分支上；还没提交的，只提交这次动过的路径并推送，提交信息按仓库规范写；没有远端时以本地长期分支为交付，并在评论里注明未推送。仓库说明要求 PR/MR 的，按上一条用仓库说明指定的平台工具。
    - [ ] 没有版本库的工作区：没有分支、提交和 PR 可做，以当前工作区文件为交付物，确认改动确实在这里，检查照跑。
    - [ ] 交付尚未完成（PR/MR 没合、分支没进长期分支、没有权限、只合了一部分）：不关闭，写清差哪条、下一步由谁做。交付未完成不重开实施票。
    - [ ] 合入后拉回长期分支的最新提交，在上面重跑一遍检查；这次失败同样按缺口交回用户。合入会带进交叉影响，合入前的绿不能当结论。
    - [ ] PR/MR 正文和提交信息里不写 Closes #<规格号> 这类自动关闭关键词；这张规格的关闭只经 deck_issue_patch。

    ## 四、关闭
    - [ ] 四件事都成立：用一次 deck_issue_patch 调用同时带 comment 与 close:true。评论按能照着重核的格式写：逐票一行写查了什么（文件、测试名、命令）；逐条用户故事写实现或测试证据；交付证明（分支名与提交号，或 PR/MR 的合并提交与合入提交，或没有版本库的文件清单）；检查命令与结果；遗留事项的新票号。不写「已核对、通过」这类空泛结论。
    - [ ] 关闭前自检：评论里的提交就是跑检查的那棵树，检查结果来自本次会话而不是记忆；对不上就回到核对或交付。
    - [ ] 任何一件不成立：不关闭，按缺口类型写清卡在哪、下一步由谁做。

    {{shared:sharedTools}}
  en: |-

    This spec issue ({url}) has all its implementation issues closed ({closed}/{total}). That is only the trigger, not proof of completion.

    You produce exactly two things: one closing comment and one close. The comment must let someone who was not in this session independently re-check the four things below; if any one is missing, do not close:
    (1) What the spec promised is really implemented: every user story has corresponding implementation or tests; any reduction as "will not do" or "duplicate" has been confirmed by the user.
    (2) These changes are already on the branch the repo keeps long-term: merge commits and squash commits both count; when there is no remote, judge by the local long-lived branch; when there is no version control, judge by the current workspace.
    (3) On the commit written in the comment, the repo checks pass reproducibly.
    (4) All leftovers are handled: open questions, uncommitted changes, temporary worktrees and temp files, and unique commits on unmerged branches.
    If you are not sure, do not close: a wrong close can only be corrected by a human. If any of the above does not hold, hand the gap, the next step and who does it to the user.

    ## 1. Gather evidence
    - [ ] Determine where these changes are: the branch, the workspace copy, the commits. If the changes are scattered, merge them onto one branch and verify there; a merge conflict means the corresponding ticket did not really land — investigate before resolving, never resolve on guesswork.
    - [ ] Confirm the current backend and repo: local Markdown (markdown) / github / gitlab, the repo address, and write permission; then read the repo instructions and the closing records of recent similar spec issues to determine the delivery convention (PR/MR or direct push), the matching platform tools the repo instructions name and whether the remote is available. If the backend reports read-only write permission, comments and closes cannot be written: do not close, hand back to the user.
    - [ ] If you cannot find the changes, or they exist only in a temporary directory: ask the user; do not assume they were delivered. If the branch or PR/MR status cannot be read: do not close, hand back to the user.

    ## 2. Verify
    - [ ] Open each implementation issue and check code, tests or run results against its acceptance criteria; a closed state and the issue body do not count.
    - [ ] Go back to the spec body and verify the final code item by item: every user story has implementation or tests; for tickets closed as "will not do" or "duplicate", explain how the spec promise is met or reduced, and get user confirmation; if the spec body has no acceptance criteria, use the sum of the implementation-ticket criteria and state that convention in the comment. Per-ticket passes do not mean the spec passes.
    - [ ] Run the checks the repo defines on the code you are actually delivering, and record the branch name and commit; results from a main branch without these changes, a tree with uncommitted changes, or someone else's branch do not count. When several tickets touch the same module or interface, verify them together once more.
    - [ ] Handle leftovers: process every "to decide" and "later" in the spec body and comments one by one (do it now, turn it into a new ticket and record its key, or the user confirms it is not done), and write the result back where it appears in the spec body; confirm the ownership of uncommitted changes and hand unrelated ones to the user; clean up implementation worktrees, merged temporary branches and temp files, keep unmerged branches and list their unique commits to the user; get consent before discarding any change.
    - [ ] If you find omissions, unfinished work, or missing or wrong criteria: do not close; tell the user what is missing and which spec promise is affected, and discuss whether to reopen the relevant implementation issue, create a new issue to carry it, or confirm a reduced scope; follow the user's decision and record the ticket keys. Do not invent user confirmation and do not loosen criteria on your own.

    ## 3. Deliver
    - [ ] If the repo delivers through PR/MR: check its state if a PR/MR exists, otherwise create one and turn the draft into reviewable; use one sentence in the title to say what was delivered and reference the spec and the implementation tickets, and write the body with the /pr skill. Continue only after it is merged into the long-lived branch; if a human has to merge, stop and hand the link and the conclusion to the user, saying you will close after the merge. Do not merge for the user without their explicit authorization in this session.
    - [ ] If the repo pushes directly, or the backend is local Markdown (deck cannot see the code platform), or the changes already live in the main worktree of the long-lived branch with no separate worktree: confirm every change is committed and on the long-lived branch; for anything not yet committed, commit only the paths this work touched and push, following the repo commit convention; when there is no remote, the local long-lived branch is the delivery, and note in the comment that it was not pushed. If the repo instructions require PR/MR, follow the previous item with the platform tool the instructions name.
    - [ ] If the workspace has no version control: there is no branch, commit or PR, so take the current workspace as the deliverable, confirm the changes are really here, and run the checks.
    - [ ] If delivery is not complete (PR/MR not merged, branch not on the long-lived branch, no permission, only part merged): do not close; state exactly what is missing and who does the next step. Incomplete delivery does not reopen implementation tickets.
    - [ ] After merging, pull the latest long-lived branch and rerun the checks on it; if they fail, hand it back to the user as a gap. A merge brings cross-effects, so pre-merge green is not a conclusion.
    - [ ] Do not put auto-close keywords such as Closes #<spec> in PR/MR bodies or commit messages; closing this spec goes only through deck_issue_patch.

    ## 4. Close
    - [ ] All four things hold: make one deck_issue_patch call carrying both comment and close:true. Write the comment in a format others can re-check: one line per ticket saying what you checked (files, test names, commands); one line per user story with implementation or test evidence; delivery proof (branch name and commit, or the PR/MR merge and landing commits, or the file list when there is no version control); the check commands and results; the new ticket keys for leftovers. Do not write vague conclusions such as "checked, passed".
    - [ ] Self-check before closing: the commit in the comment is the tree the checks ran on, and the results come from this session, not from memory; if they do not match, go back to verification or delivery.
    - [ ] If any item does not hold: do not close; state where you are stuck and who does the next step, according to the type of gap.

    {{shared:sharedTools}}
specExecute:
  version: 5
  placeholders:
    - url
  use: 规格容器 · 有未关实施票时「执行」按钮（首行 /implement-spec）（#1281）
  zh: |-
    /implement-spec
    {url}

    按 /implement-spec 技能把这张规格实现完。

    ## 降级路线（技能前提不成立时）
    - [ ] 开工先验证：当前目录在 git 仓库内且有提交。之后建不出技能要的工作树，也切到这条路线。
    - [ ] 默认串行：一次一个实现者子代理，地基票（类型、数据层、共享组件）先做，该票验证通过并关票后再起下一个。
    - [ ] 两张票的文件不重叠才并发：子代理只改本票文件、只跑本票单测；构建、代码生成、全量测试与共享清单、索引文件的改动由你串行做。
    - [ ] 提交与评审基线：git 可用、只是工作树建不出 → 集成分支按技能建，每票完成后由你在分支上串行提交，只暂存本票改动的路径；没有 git → 动手前把仓库复制到仓库外临时目录，收尾用 diff 作评审与回退依据，票里写「未提交」。
    - [ ] 全部票关完后跑一次全量验证；交付时说明降级原因与验证结果。

    ## 收口
    - [ ] 每完成一张实施 issue，如实更新它的状态与正文。
    - [ ] 全部实施 issue 关闭后，提醒用户点规格详情页的「完成」按钮做收口核对（不是自动关闭）。

    {{shared:sharedTools}}
  en: |-
    /implement-spec
    {url}

    Follow the /implement-spec skill to implement this whole spec.

    ## Fallback route (when the skill's prerequisites do not hold)
    - [ ] Verify the premise first: the current directory is inside a git repository and has commits. If you later cannot create the worktrees the skill needs, switch to this route too.
    - [ ] Default to serial: one implementer subagent at a time; foundation tickets (types, data layer, shared components) first; start the next one only after the current ticket is verified and closed.
    - [ ] Go concurrent only when two tickets touch disjoint files: a subagent only edits its own ticket's files and only runs its own ticket's unit tests; builds, code generation, the full test suite, and changes to shared manifests or index files are done by you serially.
    - [ ] Commit and review baseline: when git works and only worktrees cannot be created, build the integration branch per the skill, and after each ticket you commit serially on the branch, staging only that ticket's changed paths; when there is no git, copy the repository to a temporary directory outside the repository before starting, use the diff as the review and rollback basis at the end, and write uncommitted in the tickets.
    - [ ] After all tickets are closed, run one full verification; in the delivery note, state why the fallback was taken and the verification results.

    ## Wrap-up
    - [ ] After each implementation issue is done, update its state and body truthfully.
    - [ ] When all implementation issues are closed, remind the user to click "Complete" in the spec detail for the wrap-up check (not an automatic close).

    {{shared:sharedTools}}
specSplit:
  version: 5
  placeholders:
    - url
  use: 规格容器 · 空态「拆票」按钮（首行 /to-tickets）（#1281）
  zh: |-
    /to-tickets
    {url}

    按 /to-tickets 技能把这张规格 issue 拆成实施 issue。

    ## 拆票动作（建票走 deck 工具，不要手写票文件）
    - [ ] 动手前先调用 deck_context 确认当前后端是哪一个，后面的建票都按这个后端走。
    - [ ] 不论哪个后端，实施票一律用 deck_issue_create 发布：传 kind=spec-ticket，parentKey 填这张规格的票号，blockedBy 填它依赖的票号（没有依赖就空着）。
    - [ ] 本地 Markdown 后端不要自己写 .scratch 下的票文件：编号与文件头标记由工具写好落盘，调用时只传标题与正文。

    ## 拆完之后
    - [ ] 把拆出的实施 issue 数量与编号告诉用户。
    - [ ] 把「已拆成 N 张实施 issue」写进这张规格 issue 的正文，方便下次打开知道进度。
    - [ ] 提醒用户：之后在规格详情里点「执行」逐票推进；全部实施 issue 关闭后点「完成」做收口核对。

    {{shared:sharedTools}}
  en: |-
    /to-tickets
    {url}

    Follow the /to-tickets skill to split this spec issue into implementation issues.

    ## Splitting (create tickets with the deck tools, do not hand-write ticket files)
    - [ ] First call deck_context to confirm which backend is active, and follow that backend for the tickets below.
    - [ ] Whichever backend it is, publish every implementation ticket with deck_issue_create: pass kind=spec-ticket, put this spec number in parentKey, and put the tickets it depends on in blockedBy (leave it empty when there is no dependency).
    - [ ] On the local Markdown backend, do not hand-write ticket files under .scratch: numbering and header markers are written to disk by the tool — only pass the title and body.

    ## After splitting
    - [ ] Tell the user how many implementation issues were created and their numbers.
    - [ ] Write "split into N implementation issues" into this spec issue’s body so the next session can see the progress.
    - [ ] Remind the user: push tickets one by one with the "Execute" button in the spec detail; when all implementation issues are closed, click "Complete" for the wrap-up check.

    {{shared:sharedTools}}
