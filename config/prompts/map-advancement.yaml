mapInspect:
  version: 9
  placeholders:
    - n
    - title
    - url
    - subIssue
  use: map 空态 0/0 检查 · 诊断关联缺失
  zh: |-
    ## 目标 map
    - 编号：#{n}
    - 标题：{title}
    - 链接：{url}

    该 map 在面板中显示为 0/0（无子议题），这不正常——按 wayfinder 规则，有规划的 map 应通过子议题推进，0/0 通常意味着创建时子议题没有以本后端的原生父子关系正确关联到该 map。

    请按 wayfinder 技能排查并修复关联（遵循其规则）：

    ## 排查
    - [ ] 加载 wayfinder 技能（如未加载），结合该 map 的 Destination / Notes 回顾本应有哪些子议题
    - [ ] 在当前后端中核对这些子议题是否已存在但未成为该 map 的真正子议题（面板计数仍 0/0、详情未展示）

    ## 修复
    - [ ] 先读回该 map 的正文（里面必须保留 `## Destination` 一节），再按本后端声明的关联方式把子议题建成该 map 的子议题：{subIssue}
    - [ ] 若子议题尚未创建，按原规划创建后，用同一种关联方式补建
    - [ ] 修复后按上面的校验方式核对子议题数量与预期一致，并确认面板中该 map 的计数不再是 0/0，详情页能看到完整子议题列表且阻塞关系正确

    ## 收尾
    - [ ] 结束前把这张票的真实状态写进正文
    - [ ] 校验子议题数与面板计数一致，且不再为 0/0

    ## 工具
    - [ ] issue 相关操作优先使用 deck_ 开头的工具处理
    - [ ] 及时使用 deck_issue_report 工具上报处理过、处理中的 issue 编号
  en: |-
    ## Target map
    - No: #{n}
    - Title: {title}
    - Link: {url}

    This map shows 0/0 (no sub-issues) in the panel, which is abnormal — a planned map is expected to advance via sub-issues. 0/0 typically means the sub-issues were not wired as native sub-issues of this map when it was created.

    Please investigate and fix the wiring per the wayfinder skill (follow its rules):

    ## Investigate
    - [ ] Load the wayfinder skill (if not loaded) and review Destination / Notes to recall what sub-issues were intended
    - [ ] Check whether those sub-issues already exist but are not showing as true sub-issues of this map (count still 0/0, not listed in detail)

    ## Fix
    - [ ] First fetch the map current body into an absolute-path file (keep the `## Destination` section), then wire the sub-issues to this map the way this backend declares: {subIssue}
    - [ ] If the sub-issues do not exist yet, create them per the original plan, then wire them the same way
    - [ ] After fixing, verify the sub-issue count matches the way stated above, and that the panel count is no longer 0/0 and the detail page lists all sub-issues with correct blocking

    ## Wrap-up
    - [ ] Before finishing, write the true state of this ticket into its body
    - [ ] Verify sub-issue count matches the panel count and is no longer 0/0

    ## Tools
    - [ ] Prefer the deck_ tools for issue operations
    - [ ] Report processed and in-progress issue numbers with the deck_issue_report tool in a timely manner
specComplete:
  version: 1
  placeholders:
    - url
    - closed
    - total
  use: 规格容器 · 完成态「完成」按钮：逐张核对后按边界关闭规格，不提供旁路（#1281）
  zh: |-
    这张规格 issue（{url}）下面的实施 issue 已经全部关闭（{closed}/{total}）。先核对，再决定能不能关。

    ## 核对
    - [ ] 逐张打开实施 issue，对照验收判据核对是否真的做到；只看关闭状态不算数。
    - [ ] 在集成分支上跑测试与类型检查，确认全绿。
    - [ ] 规格正文与评论里还有没有没处理的「待定」「后续再说」。

    ## 关闭规格（核对通过之后）
    - [ ] 全部通过 → 先在规格 issue 留一条评论，写明逐张核对结果，再关闭它；人随时可以重开。
    - [ ] 有任何一条没通过 → 不关闭：说明缺什么、建议重开哪张实施 issue 或补一张。
    - [ ] 当前会话的任务全部完成时，主动提醒用户执行一次 /retro：用这次会话的实际过程，复盘当前工作区还能在哪些地方进一步优化环境。是否执行由用户决定，不要替用户执行。

    ## 工具
    - [ ] issue 相关操作优先使用 deck_ 开头的工具处理
    - [ ] 及时使用 deck_issue_report 工具上报处理过、处理中的 issue 编号
  en: |-
    All implementation issues under this spec issue ({url}) are closed ({closed}/{total}). Verify first, then decide whether it can be closed.

    ## Verify
    - [ ] Open each implementation issue and check whether its acceptance criteria are truly met; a closed status alone does not count.
    - [ ] Run tests and type checks on the integration branch and confirm they are green.
    - [ ] Check the spec body and comments for leftovers such as "TBD" or "revisit later".

    ## Close the spec (only after verification passes)
    - [ ] All checks pass → leave a comment on the spec issue listing the verification result per ticket, then close it; the human can reopen it at any time.
    - [ ] Any check fails → do not close: state what is missing and suggest reopening or adding an implementation issue.
    - [ ] Once every task of this session is finished, proactively remind the user to run /retro once: use this session’s actual course to review where the current workspace’s environment can be further improved. Whether to run it is the user’s decision — never run it on their behalf.

    ## Tools
    - [ ] Prefer the deck_ tools for issue operations
    - [ ] Report processed and in-progress issue numbers with the deck_issue_report tool in a timely manner
