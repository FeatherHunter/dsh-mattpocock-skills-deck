newBugWayfinder:
  version: 18
  placeholders:
    - repo
  use: "「+ 新增BUG单」按钮 / 状态栏 BUG 悬停菜单「新增」（issue #4 · v2 修 #1 BUG3：输入位移到末尾 · v3 #14：精简为 4 字段 · v4 #63：去内部规则+实际→期望+括号单行 · v5 #475：补标签要求 bug 必带+未诊断带 needs-triage，分远端原生/本地标签行 · v7 #882：压薄终稿四节清单 + 尾部四选填通用版 · v10 #1268 加调查节先查后问） · v12 #1407 加 suggest_next_steps 提醒、删 /retro 提醒 · v15 #1460 建单前查重：扫全可见 BUG 单、候选交报告人确认、正文固定写查重记录；v17（2026-10-29）：首段加元提示句「从第一性原理出发。」（公共小节 firstPrinciples），不改技能流程；v18（2026-10-31）：工具节公共提醒行改为「每轮回复收尾先判断、想得到就调用」"
  zh: |-
    /wayfinder
    请帮我新增一个 BUG 单（按 wayfinder 技能规则处理）。

    {{shared:firstPrinciples}}

    仓库：{repo}
    新建的单子必须带上 bug 标签；如果还没有经过诊断，同时带上 needs-triage 标签。远端后端按原生标签方式打标签，本地 Markdown 后端在正文加标签行（例如 Labels: bug, needs-triage）。


    ## 澄清
    - [ ] 有假设先用 grilling 澄清，不默认；已给的不重问；四项全空时不建单、先回问报告人，有现象但字段不全则建单并标 needs-info

    {{shared:investigation}}

    ## 查重
    - [ ] 收齐「实际」后，扫一遍工具能看见的全部 BUG 单：先调 deck_issue_list（state=open、labels=['bug']、limit=200）一次取全，再调一次（state=closed、labels=['bug']、limit=200）一次取全；看返回的编号、标题、标签和更新时间，不要只看前几条。
    - [ ] 这两次是全扫，不要用关键词搜索代替：同一个问题可能用完全不同的说法描述，关键词会漏。
    - [ ] 标题像的再调 deck_issue_get 看正文；工具回执说清单可能不全时，把这句记下来。
    - [ ] 有命中时不要自己先下结论：把最多 3 张候选（编号、标题、像在哪里）列给报告人，问一句「这些是不是同一个问题」，等到回答再决定。
    - [ ] 报告人确认是同一问题、旧单还开着：不建新单，在旧单下评论补充这次的现象和复现步骤；旧单不关闭。
    - [ ] 报告人确认是同一问题、旧单已关闭：按回归处理，建新单并在正文写明「回归：原单 #编号」，关联旧单。
    - [ ] 报告人确认不是，或没有命中：建新单，正文写明看过的候选和报告人的回答。
    - [ ] 报告人不确定：把旧单链接发给报告人再看一眼；仍不能判断时按新建处理并关联候选、标 needs-info。
    - [ ] 两次扫描与查重记录是建单的前置条件：缺任何一步，先补完再建单；工具本身报错时，把错误写进查重记录再建单。

    ## 查重记录
    - [ ] 新单正文固定加一节「## 查重记录」，没有命中也要写；按实际查重过程填，不要编造。
    - [ ] 扫描：查了哪些状态与标签、各拿到多少张；工具说清单可能不全，就写在这里。
    - [ ] 命中：候选的编号与标题；没有就写「无」。
    - [ ] 报告人确认：报告人怎么回答的。
    - [ ] 结论：新建 / 关联哪张旧单 / 按回归新建。

    ## 自查
    - [ ] 逐项核对无遗漏；查重记录已写进正文（或已在旧单评论）；结束前写明真实状态

    {{shared:sharedTools}}
  en: |-
    /wayfinder
    Please help me file a new BUG ticket (follow the wayfinder skill rules).

    {{shared:firstPrinciples}}

    Repo: {repo}
    New tickets must carry the bug label; if not yet triaged, also carry needs-triage. On remote backends use native labels; on the local Markdown backend add a Labels line (e.g. Labels: bug, needs-triage).


    ## Clarify
    - [ ] If you hold assumptions, settle them with the grilling skill — never assume; never re-ask what is given; if all four fields are empty, do NOT file — ask the reporter first; if the symptom is present but other fields are missing, file and label needs-info

    {{shared:investigation}}

    ## Check for duplicates
    - [ ] Once "Actual" is filled in, scan every BUG ticket the tools can see: call deck_issue_list (state=open, labels=['bug'], limit=200) to take them all, then call it again (state=closed, labels=['bug'], limit=200) to take them all. Read the returned key, title, labels and updated time; do not look only at the first few.
    - [ ] These two calls are full scans; do not replace them with keyword search — the same problem can be described in completely different words, and keywords will miss it.
    - [ ] Open the body with deck_issue_get only when a title looks similar. If the tool says the list may be incomplete, keep that sentence.
    - [ ] When something looks similar, do not decide on your own: show the reporter up to 3 candidates (key, title, why it looks similar) and ask "are these the same problem"; wait for the answer before deciding.
    - [ ] The reporter confirms the same problem and the old ticket is still open: do NOT file a new ticket; comment on the old ticket with this report's symptom and reproduction steps; do not close the old ticket.
    - [ ] The reporter confirms the same problem but the old ticket is closed: treat it as a regression, file a new ticket, write "Regression of #key" into the body, and link the old ticket.
    - [ ] The reporter says it is not the same, or nothing matched: file a new ticket and write the candidates you looked at and the reporter's answer into the body.
    - [ ] The reporter is unsure: send the old ticket link for a look; if it is still undecidable, file and link the candidates, label needs-info.
    - [ ] The two scans and the duplicate-check record are prerequisites for filing: finish any missing step before filing; if the tool itself errors, write the error into the duplicate-check record and then file.

    ## Duplicate check record
    - [ ] Always add a "## Duplicate check record" section to the new ticket body, even when nothing matched; fill it from the actual check, never fabricate.
    - [ ] Scanned: which states and labels you looked at, and how many tickets each returned; if the tool says the list may be incomplete, write that here.
    - [ ] Hits: candidate keys and titles; write "none" when nothing matched.
    - [ ] Reporter confirmed: what the reporter answered.
    - [ ] Conclusion: new ticket / linked to which old ticket / filed as a regression.

    ## Self-check
    - [ ] Check every box with no gaps; duplicate-check record written into the body (or already commented on the old ticket); true state written before finishing

    {{shared:sharedTools}}
newSpec:
  version: 7
  placeholders:
    - repo
  use: 「实施地图」卡（入口浮层里那张蓝卡，#1297 起改名）· 新会话预填 /grill-with-docs；收尾提醒用户手动执行 /to-spec 与 /to-tickets（#1281）；v6（2026-10-29）：首段加元提示句「从第一性原理出发。」（公共小节 firstPrinciples），不改技能流程；v7（2026-10-31）：工具节公共提醒行改为「每轮回复收尾先判断、想得到就调用」
  zh: |-
    /grill-with-docs
    请帮我讨论一个需求（严格遵循 grill-with-docs 技能规则）。

    {{shared:firstPrinciples}}

    仓库（已自动填入当前工作区）：{repo}

    {{shared:investigation}}

    ## 讨论收尾（下面这些动作由用户手动执行，不要替用户做）
    - [ ] 讨论结束、结论对齐后，提醒用户手动执行一次 /to-spec，把结论生成规格 issue。
    - [ ] 在规格 issue 生成后，再提醒用户手动执行一次 /to-tickets，把规格 issue 拆成实施 issue。

    {{shared:sharedTools}}
  en: |-
    /grill-with-docs
    Help me discuss a requirement (strictly follow the grill-with-docs skill rules).

    {{shared:firstPrinciples}}

    Repo (auto-filled from the current workspace): {repo}

    {{shared:investigation}}

    ## Discussion wrap-up (the user runs the actions below manually; do not run them on their behalf)
    - [ ] Once the discussion is settled and the conclusion is aligned, remind the user to manually run /to-spec once to turn the conclusion into a spec issue.
    - [ ] After the spec issue is created, remind the user to manually run /to-tickets once to split the spec issue into implementation issues.

    {{shared:sharedTools}}
newWayfinder:
  version: 31
  placeholders:
    - repo
  use: 「探索地图」卡（入口浮层里那张紫卡，#1297 起唯一入口开出的两张卡之一）· 新会话预填 /wayfinder；只留调查节、收尾与工具节，建图规则交给 wayfinder 技能（#1281）；v26（2026-10-29）：首段加元提示句「从第一性原理出发。」（公共小节 firstPrinciples），不改技能流程；v27（2026-10-30）：加「并行与串行」节与收尾复查项，建图时一次定好并行串行、收尾前再查一遍边；v28（2026-10-30）：并行与串行节中文措辞微调（「画地图定子票」加顿号、「同一批」换「同一组」），中英章节名与并行在前顺序不变；v29（2026-10-30）：收尾改成先复查边再向用户汇报，汇报里要讲清哪些 ISSUE 并行、哪些串行、谁等谁；过程条改为「并行不用另外标注、彼此不连 blockedBy 边」，并把「画地图、定子票」换成专业名词 map 与 subissue；v30（2026-10-30）：subissue 改成官方写法 sub-issue（带连字符），与 GitHub 文档和仓内既有写法一致；v31（2026-10-31）：工具节公共提醒行改为「每轮回复收尾先判断、想得到就调用」
  zh: |-
    /wayfinder
    请帮我处理一个需求（严格遵循 wayfinder 技能规则）。

    {{shared:firstPrinciples}}

    仓库（已自动填入当前工作区）：{repo}

    {{shared:investigation}}

    ## 并行与串行
    - [ ] 画 map、定 sub-issue 时，就把各个 sub-issue 之间的并行与串行关系一次想清楚：能同时开工、互不等待的是并行，不用另外标注——并行就是彼此之间不连 blockedBy 边；必须等前一个办完才能开工的才是串行，后一个的 blockedBy 指着前一个。
    - [ ] 串行只留在真有先后要求的地方：后一个要用前一个的结论、共用同一组文件或接口、合拢会打架的，先串行；各自独立、合拢不打架的，才并行。

    ## 收尾
    - [ ] 结束前先把各个 sub-issue 的并行与串行关系再查一遍：blockedBy 是否不多不少、串行链条有没有断开或绕圈、并行的 sub-issue 是否真能同时开工；对不上的先把边改对。
    - [ ] 再把这次讨论的结论告诉用户：建了新 map 就写明编号，并说清哪些 sub-issue 并行、哪些串行、谁等谁；没建成就写明下一步。

    {{shared:sharedTools}}
  en: |-
    /wayfinder
    Please handle a requirement (strictly follow the wayfinder skill rules).

    {{shared:firstPrinciples}}

    Repo (auto-filled from the current workspace): {repo}

    {{shared:investigation}}

    ## Parallel and serial
    - [ ] When drawing the map and defining its sub-issues, settle the parallel-versus-serial relation among the sub-issues in one pass: sub-issues that can start together without waiting are parallel and need no extra marking — parallel simply means no blockedBy edge between them; a sub-issue that can only start after an earlier one finishes is serial, with its blockedBy pointing at the earlier one.
    - [ ] Keep serial only where an order is really required: the later sub-issue needs the earlier conclusion, shares the same files or interfaces, or merging would collide — run those serially; run in parallel only sub-issues that stay independent and merge cleanly.

    ## Wrap-up
    - [ ] Before finishing, recheck the parallel-versus-serial relation among the sub-issues first: blockedBy edges are neither missing nor extra, serial chains have no breaks or cycles, and the parallel sub-issues can really start together; fix the edges first when anything mismatches.
    - [ ] Then tell the user the conclusion: if a new map was created, state its number and say which sub-issues run in parallel, which run serially, and which waits for which; otherwise state the next step.

    {{shared:sharedTools}}

# ============================================================
# 这一段是「片段」：不是一条完整模板，而是模板里替换进去的一段话。
#   它住在哪个族文件，就表示它在哪个注入时机被用上。
#   片段与模板的形状不同（模板带 version / placeholders / use，片段只有正文），
#   两者的清单与形状校验在 scripts/lib/prompt-config.mts 的 PROMPT_TEMPLATE_IDS / PROMPT_FRAGMENT_IDS。
# ============================================================

# newBugFields：bug 建单时那四项引导语（中文一份、英文一份）。
#   括号里的话是帮报告人把情况说清楚的提示，不是必填项；四项答不全也照常建单（缺的标 needs-info）。
newBugFields:
  zh: |-
    

    下面四项是帮报告人把情况说清楚的提示，不是四道必答题：知道多少写多少，说不清的可以空着。
    四项全空时先回问报告人，不要替他编；只答出一部分时照常建单，缺的地方标 needs-info。

    实际（看到了什么现象；知道影响范围就一并写上）：
    期望（原本预期是什么样；和实际看到的差异写清楚）：
    复现步骤（能说清前置条件和场景就先写，再按编号步骤写；只是偶发的话写下大概频率）：
    环境信息（知道的话写上 OS 版本、软件版本、运行环境）：
  en: |-
    

    The four items below are hints to help the reporter describe the problem clearly — they are not four questions that must be answered: write whatever is known and leave the rest blank.
    If all four are empty, ask the reporter first instead of guessing. If only some are answered, still file the ticket and label the missing parts needs-info.

    Actual (the symptom; add the impact if you know it):
    Expected (your expectation, plus the diff from actual):
    Reproduction (preconditions and scenario if you can, then numbered steps; if it is flaky, note how often):
    Environment (OS version, software version and runtime, as much as you know):

# newWayfinderWiring：建单时默认的父子议题接线说法（中文一份、英文一份）。
newWayfinderWiring:
  zh: 通过 Tracker 原生的父子关系关联（create 时带 parentKey 或创后 setParent）
  en: via Tracker native parent relation (create with parentKey or setParent after creation)
