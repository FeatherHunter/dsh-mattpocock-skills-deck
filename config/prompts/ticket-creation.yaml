# ============================================================
# 这一段是「片段」：不是一条完整模板，而是模板里替换进去的一段话。
#   它住在哪个族文件，就表示它在哪个注入时机被用上。
#   片段与模板的形状不同（模板带 version / placeholders / use，片段只有正文），
#   两者的清单与形状校验在 scripts/lib/prompt-config.mts 的 PROMPT_TEMPLATE_IDS / PROMPT_FRAGMENT_IDS。
# ============================================================

# newBugFields：bug 建单时那四项必填引导语（中文一份、英文一份）。
newBugFields:
  zh: |-
    

    以下四项均为必填；四项全空时不要建单，先回问报告人补齐。

    实际（现象；影响范围）：
    期望（预期；与实际差异）：
    复现步骤（前置条件和场景 + 编号步骤；偶发写频率）：
    环境信息（OS 版本 + 软件版本 + 运行环境）：
  en: |-
    

    The four fields below are required; if all four are empty, do not file — ask the reporter to complete them first.

    Actual (symptom; impact):
    Expected (expectation; diff from actual):
    Reproduction (preconditions and scenario + numbered steps; flaky → frequency):
    Environment (OS version + software version + runtime):

# newWayfinderWiring：建单时默认的父子议题接线说法（中文一份、英文一份）。
newWayfinderWiring:
  zh: 通过 Tracker 原生的父子关系关联（create 时带 parentKey 或创后 setParent）
  en: via Tracker native parent relation (create with parentKey or setParent after creation)
