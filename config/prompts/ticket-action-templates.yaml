tpl.fix:
  version: 17
  placeholders:
    - url
  use: 动作按钮「修复」（bug 票）· 首行 /implement；补 /diagnosing-bugs 落点（#1281）
  zh: |-
    /implement
    {url}

    按 /implement 技能修复这个 bug。

    ## 读现状
    - [ ] 已认领？若未认领，先认领。
    - [ ] 把这张票读全（正文 / 评论 / 标签 / 认领 / 父子与阻塞边），确认现象与验收标准。
    - [ ] 若还挂着 needs-triage，说明还没分流，先走完诊断再回来修。
    - [ ] 若复现不稳定、根因不明，先按 /diagnosing-bugs 技能定位根因，再回来修。

    ## 收尾
    - [ ] 结束前把这张票的真实状态写进正文；做完了就关闭，没做完写明缺什么。

    {{shared:sharedTools}}
  en: |-
    /implement
    {url}

    Follow the /implement skill to fix this bug.

    ## Read current state
    - [ ] Claimed? Claim first if unclaimed.
    - [ ] Read the whole ticket (body / comments / labels / claim / parent & blocking edges) — confirm symptoms & acceptance criteria.
    - [ ] If it still carries needs-triage, it is not triaged yet — finish diagnosis first, then come back.
    - [ ] If reproduction is unstable or the root cause is unclear, locate the root cause with the /diagnosing-bugs skill first, then come back to fix.

    ## Wrap-up
    - [ ] Before finishing, write the true state of this ticket into its body; close it when done, state what is missing when not.

    {{shared:sharedTools}}
tpl.handoff1:
  version: 5
  placeholders:
    - ts
  use: "交接第一击（写交接文档）；v5 #792 撤掉末尾的工具节（这条只写交接文档；维护者 2026-09-30 定稿：交接两条都不带工具节）"
  zh: |-
    /handoff 把当前会话生成交接文档，写到 .scratch/handoff/{ts}-<短标题>.md（相对当前工作目录）。<短标题> 是你给这次交接起的一个简短标题（中文 ≤10 字 / 英文 ≤20 字符，跟随当前会话语言，用连字符或下划线代替空格），让人一眼认出这是哪件事的交接。

    交接文档是给一个没有本次会话记忆的 agent 接手的——请站在它的视角，确保它能凭文档无缝继续，而不是靠猜或回翻本次会话。从第一性原理出发。
  en: |-
    /handoff Create a handoff doc from this session, written to .scratch/handoff/{ts}-<short>.md (relative to the current working directory). <short> is a brief title you give this handoff (zh ≤10 chars / en ≤20 chars, in the current session language, use hyphen or underscore instead of spaces) so a human can tell at a glance what it is about.

    This doc is for an agent with no memory of this session — write from its perspective, so it can continue seamlessly without guessing or revisiting this session. Approach from first principles.
tpl.handoff2:
  version: 5
  placeholders:
    - path
  use: "交接第二击（读交接文档）；v5 #792 撤掉末尾的工具节（维护者 2026-09-30 定稿：交接两条都不带工具节）"
  zh: |-
    请阅读 {path}（上一会话生成的交接文档），复述你的理解后再继续推进：

    ## 复述理解
    - [ ] 结论：本会话已确认的决定与成果
    - [ ] 未完成事项：下一步要继续的事
    - [ ] 建议 skill：新会话接手时应加载的技能
    - [ ] 把以上三点复述给我；若有遗漏或不确定 → 先问我确认，不猜

    ## 继续推进
    - [ ] 从第一性原理出发，继续完成未完成事项
  en: |-
    Read the handoff doc {path} (from the previous session), restate your understanding, then continue:

    ## Restate understanding
    - [ ] Conclusions: decisions and outcomes confirmed this session
    - [ ] Unfinished: what to continue next
    - [ ] Suggested skills: skills the new session should load
    - [ ] Restate the three points to me; if anything is missing or uncertain → ask me first, do not guess

    ## Continue
    - [ ] From first principles, continue with the unfinished work
tpl.implement:
  version: 4
  placeholders:
    - url
  use: 动作按钮「实施」（ready-for-agent 实施票）· 首行 /implement（#1281）
  zh: |-
    /implement
    {url}

    按 /implement 技能实施这张票。

    ## 读现状
    - [ ] 已认领？若未认领，先认领。
    - [ ] 把这张票读全（正文 / 评论 / 验收判据 / 父子与阻塞边），确认要交付什么；有歧义先问用户。
    - [ ] 有未关闭的前置票就先做前置，或写明为什么可以并行。

    ## 收尾
    - [ ] 结束前把这张票的真实状态写进正文；做完了就关闭，没做完写明缺什么。
    - [ ] 如果这张票属于某张规格 issue，且它是最后一张实施 issue，提醒用户回到规格详情点「完成」做收口核对。

    {{shared:sharedTools}}
  en: |-
    /implement
    {url}

    Follow the /implement skill to implement this ticket.

    ## Read current state
    - [ ] Claimed? Claim first if unclaimed.
    - [ ] Read the whole ticket (body / comments / acceptance criteria / parent & blocking edges) and confirm the deliverable; ask the user first when ambiguous.
    - [ ] If any blocking ticket is still open, do it first, or state why this one can proceed in parallel.

    ## Wrap-up
    - [ ] Before finishing, write the true state of this ticket into its body; close it when done, state what is missing when not.
    - [ ] If this ticket belongs to a spec issue and it is the last implementation issue, remind the user to go back to the spec detail and click "Complete" for the wrap-up check.

    {{shared:sharedTools}}
tpl.prototype:
  version: 16
  placeholders:
    - url
  use: 动作按钮「原型」（wayfinder:prototype 票）· map 子票统一入口：首行 /wayfinder（#1281）
  zh: |-
    /wayfinder
    {url}

    请按 wayfinder 技能推进这张票。

    {{shared:investigation}}

    ## 定版与移交
    - [ ] 把定版写进本票正文，让后人能打开同一版：产物在哪，用什么区分这一版和其他版本（提交号、分支名或文件名），当时看的是哪个变体或哪组演示参数。有变体或演示参数的一并写下，没有就不写。
    - [ ] 写清什么算数：已点头的界面、状态与交互逐条列出；没被选中的备选明确写成不算数。下游只照列出的部分做。
    - [ ] 写下照做标准与复核人：实施时对照哪几个界面或状态、什么算还原；由当初点头这一版的人复核。这是给下游写规格与实施票的移交要求，不是本票要交的验收证据。

    ## 收尾
    - [ ] 结束前把这张票的真实状态写进正文；没做完的写明下一步。

    {{shared:sharedTools}}
  en: |-
    /wayfinder
    {url}

    Please advance this ticket with the wayfinder skill.

    {{shared:investigation}}

    ## Agreed version and handoff
    - [ ] Write the agreed version into this ticket body so a later session can open the same version: where the artifact lives, what tells this version apart from other versions (a commit, a branch name, or a file name), and which variant or demo parameters were reviewed. Add the variant or demo parameters when there were any; leave them out when there were none.
    - [ ] State what counts: list the approved screens, states and interactions one by one; mark the alternatives that were not chosen as not part of the agreed version. Downstream work reproduces only what is listed.
    - [ ] Write the reproduction standard and the reviewer: which screens or states to compare, what counts as reproduced, and that the person who approved this version reviews it. This is the handoff requirement for the spec and implementation tickets, not evidence this ticket must produce.

    ## Wrap-up
    - [ ] Before finishing, write the true state of this ticket into its body; if unfinished, state the next step.

    {{shared:sharedTools}}
