tpl.supplement:
  version: 10
  placeholders:
    - url
  use: "动作按钮「补充」（needs-info 票）· 清单式 · v9 改挂 /triage，补答复回流与声明（2026-10-27 #1577）；#1407 加 suggest_next_steps 提醒、删 /retro 提醒"
  zh: |-
    /triage
    {url}

    这张票停在 needs-info：缺关键信息，还不能开工。能自己补的先补齐，只能问人的按可直接回答的形式问出来；本会话不实施、不改代码、不关票。

    ## 读现状
    - [ ] 读全该 issue（正文、评论、标签、认领、阻塞关系），核对报告人是否已经答复过：答了并覆盖缺口的，按 /triage 的 needs-info 回流规则核对后转回 needs-triage，不重复提问；没答全的，只追缺口。
    - [ ] 把缺口逐条列出来：缺什么、卡住哪一步、谁手上可能有（报告人 / 仓内既有记录 / 外部系统）。

    {{shared:investigation}}

    ## 已确认事项
    - [ ] 将已确认的事项逐条写进正文，避免重复检索评论。
    - [ ] 往票里写内容时带上 triage 声明：> *This was generated by AI during triage.*

    ## 问清楚（逐条可直接回答）
    - [ ] 每次仅提出最阻塞的一两个问题，明确缺失项（日志片段 / 复现步骤 / 期望结果）以及拿到后能推进哪一步。
    - [ ] 每个问题给出可直接回答的形式：指定粘贴片段、截图范围、二选一、填空；不提开放式问题。
    - [ ] 答案在当前维护者手上就当场问；在报告人或外部人手上，把问题写成一条票内评论（带上面的声明），并写明等谁回。
    - [ ] 每个问题需要从第一性原理出发，通过对抗式审查：这个问题真的必须问吗？答案能不能从票里、仓里或外部系统自己查出来。

    ## 收尾
    - [ ] 本会话内拿到答复：核对答复覆盖了哪些缺口；答全了就转回 needs-triage 继续分流，没答全就只追问缺口、仍缺的保持 needs-info。
    - [ ] 答复还没到：保持 needs-info，把「缺失项、已提问题、等待对象」写进正文。
    - [ ] 等待期间：不实施、不修改代码、不关闭该 issue。

    {{shared:sharedTools}}
  en: |-
    /triage
    {url}

    This issue is sitting on needs-info: key information is missing, so it cannot start. Fill in what you can yourself, and ask for what only a human can provide in a directly answerable form; do not implement, change code, or close the issue in this session.

    ## Read the current state
    - [ ] Read the whole issue (body, comments, labels, claim, blocking relationships), and check whether the reporter has already replied: if the reply covers the gaps, verify it per the /triage needs-info return rules and move the label back to needs-triage without asking again; if it only partly covers them, follow up only on what is missing.
    - [ ] List the gaps one by one: what is missing, which step it blocks, and who might have it (reporter / existing in-repo records / external systems).

    {{shared:investigation}}

    ## Settled items
    - [ ] Write each settled item into the body, so nobody has to dig through the comments again.
    - [ ] When writing into the ticket, add the triage note: > *This was generated by AI during triage.*

    ## Ask precisely (every question directly answerable)
    - [ ] Ask only the one or two most blocking questions, naming the exact gap (log excerpt / repro steps / expected result) and what it unblocks.
    - [ ] Shape each one for a direct answer: which excerpt to paste, which area to screenshot, pick one of two, fill in the blank — no open-ended questions.
    - [ ] If the answer is with the current maintainer, ask on the spot; if it is with the reporter or an outside party, write the question as a ticket comment (with the note above) and state who we are waiting for.
    - [ ] Each question must start from first principles and survive adversarial review: is this question really necessary, and can the answer be found in the ticket, the repo, or an external system instead?

    ## Wrap-up
    - [ ] Reply received in this session: check which gaps it covers; if all are covered, move the label back to needs-triage for re-triage; if not, follow up only on what remains and keep needs-info for the rest.
    - [ ] Reply not yet received: keep needs-info and write the missing items, the questions asked, and who we are waiting for into the body.
    - [ ] While waiting: do not implement, do not change code, do not close the issue.

    {{shared:sharedTools}}
tpl.takeover:
  version: 12
  placeholders:
    - url
  use: 动作按钮「接手」（ready-for-human 票）· v11 改挂 /triage，补读现状与已做完分支（2026-10-27 #1577）；恢复调查节；补 /wizard 落点（#1212、#1281）
  zh: |-
    /triage
    {url}

    这张票停在 ready-for-human：有一块必须由人亲自做的部分。先复核这个判定，再决定继续交给用户、改判，还是按已完成收口；用户必须亲自做的部分留给用户，其余由你完成，不要替他做。

    ## 读现状
    - [ ] 读全这张票（正文、评论、标签、认领、父子与阻塞边），确认它仍然开放、标签仍是 ready-for-human。
    - [ ] 先核对人那部分是否已经做完：票里已有验收记录且满足验收标准的，按 /triage 处理“已实现”票的规则核对后关票；只做了一半的，写明还缺什么；没有记录的，继续往下。

    {{shared:investigation}}

    ## 判断人工档位
    - [ ] 复核这个判定属于哪一类：判断类决策 / 外部访问权限（账号、设备或第三方系统）/ 设计决策 / 需人工测试。
    - [ ] 判定成立 → 把这一类写进正文，说明 AI 不代劳的原因；判定不成立 → 按 /triage 的技能规则在正文写明改判依据、建议转回（通常回 needs-triage 重新分流），等维护者确认后再改标签。

    ## 交给用户的清单
    - [ ] 只列用户必须亲自执行的部分：步骤、每步怎么验证、哪些不在范围内、做完后在票里回什么。
    - [ ] 把清单写进票里（正文或评论），不要只留在会话：下一个会话要能只凭票面开工。
    - [ ] 写清你之后怎么验收：用户回的结果对照哪条验收标准，不满足时差在哪。
    - [ ] 需要用户亲自执行的步骤较多或涉及外部系统时，用 /wizard 生成一份手把手清单。

    ## 收尾
    - [ ] 用户还没做：保持 ready-for-human，把真实状态、清单位置、等待项写进正文。
    - [ ] 用户已确认做完：对照验收标准核对，回写事实（凭据位置 / URL / 数据形状，不要只写「已完成」）；满足就按 /triage 规则关票，不满足就写明差在哪、继续等或改判。

    {{shared:sharedTools}}
  en: |-
    /triage
    {url}

    This ticket is sitting on ready-for-human: one part of it must be done by a human. Re-check that call first, then decide whether to hand the human part over, re-tier the ticket, or close it out as already done; leave the part only the user can do to the user, and do the rest yourself — never do the user's part for them.

    ## Read the current state
    - [ ] Read the whole ticket (body, comments, labels, claim, parent/child and blocked-by edges); confirm it is still open and still labeled ready-for-human.
    - [ ] First check whether the human part is already done: if the ticket records an acceptance check that meets the criteria, verify it per the /triage rules for an already-implemented ticket and close it; if it is half done, write what is missing; if nothing is recorded, continue below.

    {{shared:investigation}}

    ## Decide the human tier
    - [ ] Re-check which tier this belongs to: judgement call / external access (account, device, or third-party system) / design decision / manual testing.
    - [ ] Tier holds → write it into the body and state why the agent does not stand in; tier does not hold → follow the /triage skill rules, write the reason into the body, and suggest moving it back (usually to needs-triage for re-triage); change the label only after the maintainer confirms.

    ## Checklist for the user
    - [ ] List only the parts the user must personally do: steps, how to verify each, what is out of scope, and what to report back in the ticket.
    - [ ] Write the checklist into the ticket (body or comment) — never keep it only in the session: the next session must be able to start from the ticket alone.
    - [ ] State how you will verify afterwards: which acceptance criterion the user's reply is checked against, and what to report if it falls short.
    - [ ] When the user’s own steps are many or involve external systems, generate a step-by-step checklist with the /wizard skill.

    ## Wrap-up
    - [ ] User has not done it yet: keep ready-for-human, and write the true state, checklist location, and what is being waited on into the body.
    - [ ] User has confirmed it is done: check against the acceptance criteria and write the facts back (credential location / URL / data shape — do not just write "done"); close it per the /triage rules if it passes, otherwise state exactly what falls short, keep waiting, or re-tier.

    {{shared:sharedTools}}
