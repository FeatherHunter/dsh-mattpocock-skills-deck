# config/languages.yaml —— 客户端支持哪些语言、每种语言缺了内容往哪一门退、以及缺省是哪一门。
#
# 为什么单独一份、并且放在 config/ 根下：语言是「整个客户端」级别的事实，不是提示词一家的事。
#   提示词正文（config/prompts/ 下的五份族 YAML）与界面词表共用这一份清单，两边不再各写一遍支持的语言。
#   改动生效的方式：改这里 → 跑 `node scripts/generate-prompt-config.mts` → 构建 → 重启插件。
#
# 键的意思：
#   default     —— 语言快照读不到、或者读出来的语言这一份清单里没有时，用哪一门。
#   languages   —— 一门语言一条，键就是语言代码（与 DSH 语言快照的主标签对齐，例如 en-US 按 en 匹配）。
#     label     —— 语言选择器上怎么称呼这门语言；zh / en 各写一份，因为选择器本身也要跟随界面语言。
#     fallback  —— 这门语言缺了内容时，接着找哪一门；空数组表示「没有上一级可退」，
#                  缺省语言就是这种情况，它是回退链的终点。
#                  今天每门最多写一条（运行时只认第一项，多写的项不生效，校验层会直接判红拦下）；
#                  要一次退多门，得先把运行时改成沿列表逐项尝试。
#
# 今天的提示词正文只带中文与英文两份（每条模板的 zh / en），所以运行时沿回退链只可能落到这两门；
# 要加一门语言的正文，得先在这份清单里加条目，再在 config/prompts/ 的族文件里补上那门语言的正文。
default: zh
languages:
  zh:
    label:
      zh: 简体中文
      en: Simplified Chinese
    fallback: []
  en:
    label:
      zh: English
      en: English
    # 英文缺了内容就退到中文（英文是后补的第二语言，中文仍是最终兜底）。
    fallback:
      - zh
