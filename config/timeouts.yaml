# 中央时间参数的「超时」一份（票 #1215 立的头，2026-10-16 全量收拢时按用途拆开）。
#
# 全仓手写代码里的时间参数只在这三份文件里书写，按「这个时间是干什么的」分：
#   config/timeouts.yaml   单次等待的上限（到点没回来就按失败或放弃处理）
#   config/intervals.yaml  节拍间隔（每隔多久跑一次）与退避序列（失败后等多久再试）
#   config/ttl.yaml        有效期（一份结果多长之内算数，过期重取）
# 单位一律是毫秒，文件里不写单位后缀。想改一个时间，先改这里，再跑一次生成器
# （node scripts/generate-time-config.mts），调用方读到的是生成出来的值。
#
# 缺键是构建错误，不是合法状态：生成器遇到 YAML 里没有的键直接报错，
# 调用方不许自己写数字顶上（单源头纪律，见 #1215）。未知键同样报错，不静默忽略。

version: 1

timeouts:
  # 单次工具调用允许的最长时间：5 分钟。盖住批量建票在正常网络下的最坏情况。
  # 管着两处：工具壳的执行预算（call-budget.ts）与工具注册的外层上限（register-options.ts），
  # 两处同值由 tests/verify-895-bulk-deadline.ts 第⑦节看守。
  toolTimeoutMs: 300000
  # 工具调用收尾余量：15 秒。超时掐断之后留给收尾动作的时间。
  toolMarginMs: 15000
  # 单次远端操作的钳制：60 秒（2026-10-22 从 30 秒放宽，按维护者要求）。壳内看钟用的同一份预算里的远端上限。
  # 为什么放宽：实测列表查询每页约 4.7 秒，一趟列表要翻十几页，整趟越过 30 秒就会被掐断，
  # 大仓库的列表类读（deck_context / deck_issue_list）会超时，而单张票读不受影响。
  perOpTimeoutMs: 60000

  # 去 GitHub 的分档超时（#1224 按 2026-10-28 实测定为终值；数值沿用 2026-10-27 放宽后的档位）。
  # 2026-10-27 按“不拿残缺当完整”放宽：读 12 秒放到 30 秒，单页慢网下不再一刀切。
  outboundReadMs: 30000
  outboundWriteMs: 30000
  # 探活档：25 秒（2026-10-27 从 15 秒放宽；#1160 从 3 秒提到 15 秒的理由仍成立，冷启动慢不能误判）。
  # gh auth status 在插件里是冷启动（keyring 读取加 TLS 握手，代理环境下经常超 3 秒），
  # 3 秒到点强杀会把“登录着但慢”误判成网络异常。探活本该最快回来，但不能比冷启动还快。
  outboundProbeMs: 25000
  # 拿不到档位时的旧默认：沿用历史 30 秒，不静默变快。
  outboundDefaultMs: 30000
  # 去 GitHub 的通路失败之后的冷却：30 秒（#1007）。一次 transport 级失败（超时、被杀、进程没起来）
  # 之后，同一只桶（读 / 写）在这个窗口里不再起新进程，调用方立刻收到「通路不通」的回话。
  # 为什么取 30 秒：它与读档 30 秒同量级，够让一次真断网或代理黑洞的那阵子过去；
  # 第一次命令成功（或任何一条命令跑完拿到退出码）立刻清零，不等窗口走完。
  outboundTransportCooldownMs: 30000
  # 宿主 runGh 排 GitHub 出站名额的最长等待：10 秒（2026-10-27 从 3 秒放宽；不要降级，排队短了直接变降级）。
  # 名额被慢调用占满时，这一路最多在队列里等这么久，到点就中止排队、立刻回「还在排队、一次没跑起来」，
  # 不再把整档预算耗在排队上。为什么取 10 秒：读档已放到 30 秒，排队仍只夹排队段，起进程之后的等待仍按本档超时算。
  ghQueueWaitTimeoutMs: 10000

  # GitHub 房客户端兜底超时：30 秒。调用方显式传了超时就按调用方的来。
  githubClientTimeoutMs: 30000
  # GitHub 房 REST 读档：45 秒（2026-10-27 从 30 秒放宽；与读档 30 秒分开给）。
  # 为什么单开：REST 单页虽小，但在慢网下排队加传输经常越过旧的 12 秒读档；读档放宽到 30 秒后
  # 再单独给 REST 45 秒，备路翻页不再被房内到点砍掉整趟。
  # GraphQL 走读档 30 秒，REST 再宽一档，翻页不断。
  githubRestReadMs: 45000
  # 查登录态与版本号的探活用超时：15 秒（#1160 从 3 秒提到 15 秒，理由同探活档）。
  githubProbeMs: 15000
  # git 直调的探活超时：15 秒（#1160 从 3 秒提到 15 秒；读远端地址那一类只读调用，慢网下 3 秒不够）。
  gitProbeMs: 15000
  # GitHub 房建仓那一步的超时：30 秒。
  githubInitTimeoutMs: 30000

  # GitLab 房常规读超时：8 秒。房里二十多处列表与详情查询共用这一档。
  gitlabReadMs: 8000
  # GitLab 房慢读超时：10 秒。翻页列表与计数查询走这一档。
  gitlabSlowReadMs: 10000
  # GitLab 房探活与轻查询超时：15 秒（从 5 秒提到 15 秒，与 GitHub 房探活对齐；登录态检查不该比登录态本身还急）。
  gitlabProbeMs: 15000
  # GitLab 房内 git 直调超时：15 秒（从 3 秒提到 15 秒；直调子进程冷启动与慢网同理，3 秒误杀）。
  gitlabRepoGitMs: 15000
  # GitLab 房 git 回退链超时：5 秒（从 2 秒提到 5 秒；回退只是兜底，仍是三档里最短的）。
  gitlabFallbackMs: 5000
  # GitLab 房建仓那一步的超时：60 秒。建仓含远端建仓库与本地初始化两段。
  gitlabCreateProjectMs: 60000

  # —— 宿主直调的 git 命令与凭据助手（2026-10-16 全量收拢补）——
  # 单条 git 命令的默认超时：20 秒。接线显式给了超时就按接线那个（versionControl.js 的 TIMEOUT_MS）。
  vcRunTimeoutMs: 20000
  # 版本控制核对的整趟预算：60 秒。一趟核对里所有 git 命令加起来不许超过它。
  vcCheckCallBudgetMs: 60000
  # 核对时列表 files 的超时：15 秒。
  vcLsFilesTimeoutMs: 15000
  # 核对时问远端地址的超时：15 秒（从 5 秒提到 15 秒；问的是远端，走网络，与读类本地命令不是一档）。
  vcRemoteTimeoutMs: 15000
  # 写路径五条命令各自的超时：add 15 秒、commit 60 秒、pull 3 分钟、push 2 分钟、fetch 2 分钟。
  # pull 给得最宽：它要跟远端协商并搬对象，是这几条里最容易慢的。
  vcAddTimeoutMs: 15000
  vcCommitTimeoutMs: 60000
  vcPullTimeoutMs: 180000
  vcPushTimeoutMs: 120000
  vcFetchTimeoutMs: 120000
  # 读类命令的单条超时：10 秒（从 5 秒提到 10 秒；与下面读调用的整趟预算 10 秒对齐，单条不许超过整趟）。
  vcReadCmdTimeoutMs: 10000
  # 写路径四类调用的整趟预算：读头部 20 秒、默认读 10 秒、列表 files 30 秒、远端列表 15 秒。
  # 「单条超时」与「整趟预算」是两件事：一条命令不许超 10 秒，一趟调用最多能花 10 秒。
  vcHeadCallBudgetMs: 20000
  vcReadCallBudgetMs: 10000
  vcLsFilesCallBudgetMs: 30000
  vcRemoteListCallBudgetMs: 15000
  # 推送前让 git 复核两个分支名（只读命令）这一步的整趟预算：15 秒。两个名字共用这一趟预算。
  vcPrePushCheckCallBudgetMs: 15000
  # 写命令给整趟预算留的余量：10 秒。add / unstage / commit / pull / fetch / push 的整趟预算
  # = 该条命令的超时 + 这个余量（超时管「一条命令最多跑多久」，整趟预算管「这一步所有命令合起来的上限」）。
  vcWriteCallMarginMs: 10000
  # git 凭据代执行的整趟预算：4 分钟。上下限 5 秒与 10 分钟：接线给的预算会被钳进这个范围
  # （下限从 1 秒提到 5 秒；1 秒的预算在慢机器上连子进程启动都盖不住，等于没给）。
  gitCredentialCallBudgetMs: 240000
  gitCredentialMinBudgetMs: 5000
  gitCredentialMaxBudgetMs: 600000
  # 问 git 用哪个凭据助手（config --get credential.helper）的超时：10 秒（从 5 秒提到 10 秒；本地读，但挂住的 git 不该 5 秒就判死）。
  gitCredentialProbeTimeoutMs: 10000
  # 每类 git 操作的默认预算：ls-remote 20 秒、fetch 2 分钟、pull 3 分钟、push 2 分钟、其余（default）1 分钟。
  # 调用方没给每操作预算时按这一档；写操作要联网，给得比只读宽，到点一律强杀。
  gitCredentialLsRemoteBudgetMs: 20000
  gitCredentialFetchBudgetMs: 120000
  gitCredentialPullBudgetMs: 180000
  gitCredentialPushBudgetMs: 120000
  gitCredentialDefaultBudgetMs: 60000
  # http 传输连续 20 秒低于 1000 字节/秒就放弃。git 的 http.lowSpeedTime 只认秒，代码里把这一档毫秒除以 1000 再交给它。
  gitLowSpeedTimeoutMs: 20000

  # 跟踪器假身位匹配的超时：30 秒。超时视作 pending（未知），排除出决策集。
  matchesTimeoutMs: 30000

  # 九个 deck 工具问沙箱政策的等待上限：15 秒（从 5 秒提到 15 秒；等的是政策服务，短了会把“没问到”当成“无政策”继续）。
  deckSandboxMs: 15000
  # 地图存取（读、写、删计划快照）的等待上限：10 秒。超时只记一笔，不抛错。
  deckStoreMs: 10000
  # 工具壳确保有可用地图时的等待上限：15 秒。它与上一条是两件事（“确保有”与“读写”），值不同是刻意的。
  deckEnsureMs: 15000
  # deck 工具前置本地读的等待上限：10 秒（从 5 秒提到 10 秒；读本机记忆与工作区锚文件都是本地读，挂住的文件服务不该卡住整笔调用，
  # 等不到就按缺席跳过（超时走既有的失败继续路径，不抛错）。#1155 把宿主接线转成 TypeScript 后按“动到谁再入”的口径收进来。
  deckLocalReadMs: 10000
  # 工具钩子（票建好后的通知）的等待上限：10 秒（从 5 秒提到 10 秒）。等不到就跳过，不影响主流程。
  deckHookMs: 10000
  # 工具表装配声明文件读取的等待上限：8 秒。
  deckAssemblyMs: 8000
  # 桥接干跑等工具表的等待上限：8 秒。
  bridgeDryTableWaitMs: 8000
  # 代执行格等工具返回的等待上限：25 秒。
  delegatedCellWaitMs: 25000

  # 一步等待的统一值：30 秒。含义是「向对方发出一次请求之后，等它出结果」这一步的等待上限。
  # 这一类等待全仓只认这一个数（#1629）：面板自动复查一次、deck 工具走一步（选后端、取上下文）、
  # 宿主闸的一次求值，都从这里取；检查链重试退避的第二档也直接引用它，不另写一份。
  # 它与整笔工具的预算（toolTimeoutMs）、单次远端调用的上限（perOpTimeoutMs）、出站排队上限
  # （ghQueueWaitTimeoutMs）不是一件事，别并过来，也不许在这三处各写一个 30 秒。
  stepWaitMs: 30000
  # 宿主启动时等 subprocess/timer 通道就绪的兜底：30 秒。等不到只记一行警告，不拦进程启动。
  # 它与上一条不是一件事：上一条是发请求等结果的一步等待上限，这一条是启动引导自己的保险丝。
  hostBootDeferMs: 30000
  # 写锁默认等待上限：60 秒。等不到就诚实回，不无限排队。
  keyLockMs: 60000
  # 会话工作目录规范化的等待上限：10 秒（从 5 秒提到 10 秒）。超时回退，不拦启动。
  canonicalTimeoutMs: 10000
  # 在途租约保活哨兵：2 的 31 次方减 1。非常值，不可调——它不是“等多久”，
  # 是“让这一只定时器永远不触发”的写法，改小会让租约提前失效。
  inFlightKeepAliveMs: 2147483647

  # 客户端设置调试推送的等待上限：10 秒（从 5 秒提到 10 秒；客户端经构建 splice 吃到这个值，不运行时 import）。
  settingsDebugPushWaitMs: 10000
  # 配额同步软失败（超时、网络断开、读数解析不出来）后的冷却基准：60 秒。
  # 冷却期内不再发同步请求，不拿失败刷服务端；连续失败时等待时长翻倍，封顶见下一条。
  quotaSyncCooldownMs: 60000
  # 硬失败（机器上没装 gh、没登录、凭证坏了这类“再等也不会自己好”的情况）的冷却基准：10 分钟。
  # 与上面软失败分开：硬失败等得久，免得一遍遍去撞同一堵墙、白开进程。
  quotaSyncHardCooldownMs: 600000
  # 退避的上限：30 分钟。连续失败时等待时长按 2 的幂翻倍，但封顶在这里——
  # 有上限才不会把“等一会儿再试”拖成“等于放弃”。
  quotaSyncMaxCooldownMs: 1800000
  # 注册重试两次尝试之间的等待：5 秒（从 2 秒提到 5 秒；只在注册那条慢路上用，不进快路，刚失败就紧着重试没有意义）。
  registerRetryWaitMs: 5000
  # 壳命令寻址解析的等待上限：8 秒。等不到就按解析失败走，不拦工具执行。
  shellResolveMs: 8000
  # 问模型写一份工作区命名摘要的超时：30 秒。等不到就按没有摘要继续，名字回落到目录名。
  namingSummaryTimeoutMs: 30000
  # 客户端日志看门狗的阈值：10 秒（从 5 秒提到 10 秒；负载高时开关写与启动对账 5 秒没回不代表坏了，阈值太短等于自己吓自己）。
  logWatchdogMs: 10000
  # 客户端等一次自动探测结果的上限：15 秒。等不到就按“这一次没结果”继续，不卡住整轮。
  probeAutoWaitMs: 15000
  # 子进程收尾宽限：探活类（gh --version 这种一闪即走的）5 秒，常规 10 秒（分别从 1 秒、2 秒提到现在的值）。
  # 宽限到了进程还没退才杀——杀早了会把“正在刷最后一段输出”的进程误杀。
  procProbeGraceMs: 5000
  procGraceMs: 10000
  # 兜底探测 gh 能不能起（PATH 里没找到 gh 时，起一次 `gh --version` 看它答不答）的等待上限：15 秒（从 2 秒提到 15 秒）。
  # 与探活档同理：这一条过去会把「装了 gh 但冷启动慢」判成「没装 gh」，用户看到的是一句装 gh 的指引，
  # 而真没装 gh 时进程根本起不来、当场就回话，不会白等满 15 秒——放宽的代价只落在少数挂住的情况。
  ghVersionProbeMs: 15000
  # 检测链一次求值里，外层（整轮谓词等待）的等待上限：60 秒。
  # 这个数不是拍的，按「内层串行最坏和 + 余量」算出来：登记链的登录态与仓库可达两项都走 ghPreflight，
  # 内层一次预检串行问几条真实网络命令，档位取 src/tracker/kernel/outbound-tiers.ts 的出站档
  # （2026-10-27 起探活 25 秒、读 30 秒），而五条路互斥（详见 src/tracker/rooms/github/preflight.ts 的
  # GH_PREFLIGHT_SERIAL_PATHS）：
  #   登录通过、已有仓库短名：查登录 25 秒 + 读仓库可达 30 秒 = 55 秒；
  #   登录通过、缺仓库短名：再加一条读仓库短名 30 秒 = 85 秒；
  #   登录不通过、核对也不通过：查登录 25 秒 + 核对登录 25 秒 = 50 秒；
  #   登录不通过、核对通过、已有仓库短名：25 + 25 + 30 = 80 秒；
  #   登录不通过、核对通过、缺仓库短名：25 + 25 + 30 + 30 = 110 秒。
  # 内层最坏取五条路里最宽的 110 秒，再加下面的余量 6 秒，才是 120 秒（取整）。外层若比内层最坏还短，
  # 就会出现「外层先到点、内层命令还在跑、这次求值的结论被丢掉」，所以两边的数必须一起看。
  # 内层最坏不是手写在这里的：src/tracker/rooms/github/preflight.ts 的 ghPreflightWorstCaseMs()
  #   按出站档位现算，门禁 tests/verify-1475-predicate-budget.ts 断言外层 ≥ 内层最坏 + 余量；
  #   改这里或改出站档，都要让那道门禁重新变绿。
  predicateTimeoutMs: 120000
  # 给内层串行最坏额外留的余量：6 秒。内层最坏是「每条命令都拖满档位」的假想情形，
  # 实际还有平台解析 gh、起进程、两次会话往返与调度开销；留一点余量免得两边贴着等。
  # 它只进上面那条算式（外层 ≥ 内层最坏 + 余量），别单独调它去凑数——要放宽就放宽外层这一档。
  predicateMarginMs: 6000
  # 调用方不传 timeout 时的兜底：10 秒（从 3 秒提到 10 秒）。生产里唯一的调用方（检测链）总是显式传上面那一档（现为 60 秒），
  # 这一档只在将来有人裸调 createPredicateRegistry() 时生效。它决定「没传会等多久」这件事，
  # 所以照样登记；与上一档刻意不同值，改一个不要顺手改另一个。
  predicateFallbackTimeoutMs: 10000
  # 检测链预取 gh 登录名的一次性竞速超时：5 秒（从 2.5 秒提到 5 秒；仍是全文件最短一档的量级）。
  # owner 显示是装饰信息，拿不到就留占位，不能让一次附带查询拖慢整条检测链，所以上限给得短。
  ghLoginPrefetchMs: 5000
  # 同工作区构建互斥锁：拿不到锁时最多等 5 分钟。真构建一次约 30 秒，等锁的人排在后面；
  # 超过这一档还没拿到，说明持锁进程可能已经死了（心跳停了但锁没被接管），这时报错退出，不自动抢（#1365）。
  buildLockWaitMs: 300000

  # 初始化等待那一路（检查链 trigger 为 setup-pending）的等待封顶：15 秒（#1363 场景二）。
  # 为什么单独一档：初始化的产物是会话里写文件，检查链没有对应事件，只能靠正在看时的 5 秒节拍反复求值；
  # 连续没进展时退避会一路升到 5 分钟档，黄条要等很久才消失。有了封顶，等待超过这一刻度必真算一次，
  # 只放慢「刚算过又没变化」的重复求值，不改变人手重查与人动作那两路的永不降档。
  chainSetupPendingCapMs: 15000
