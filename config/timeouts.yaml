# 中央时间参数的「超时」一份（票 #1215 立的头，2026-10-16 全量收拢时按用途拆开）。
#
# 全仓手写代码里的时间参数只在这三份文件里书写，按「这个时间是干什么的」分：
#   config/timeouts.yaml   单次等待的上限（到点没回来就按失败或放弃处理）
#   config/intervals.yaml  节拍间隔（每隔多久跑一次）与退避序列（失败后等多久再试）
#   config/ttl.yaml        有效期（一份结果多长之内算数，过期重取）
# 单位一律是毫秒，文件里不写单位后缀。想改一个时间，先改这里，再跑一次生成器
# （node scripts/generate-time-config.mjs），调用方读到的是生成出来的值。
#
# 缺键是合法状态，不是故障：生成器对缺的键只告警，调用方用收拢当天的数字顶上
# （回落底座见生成器里的 FALLBACKS 表）。未知键一律报错，不静默忽略。

version: 1

timeouts:
  # 单次工具调用允许的最长时间：5 分钟。盖住批量建票在正常网络下的最坏情况。
  # 管着两处：工具壳的执行预算（call-budget.ts）与工具注册的外层上限（register-options.ts），
  # 两处同值由 tests/verify-895-bulk-deadline.ts 第⑦节看守。
  toolTimeoutMs: 300000
  # 工具调用收尾余量：15 秒。超时掐断之后留给收尾动作的时间。
  toolMarginMs: 15000
  # 单次远端操作的钳制：30 秒。壳内看钟用的同一份预算里的远端上限。
  perOpTimeoutMs: 30000

  # 去 GitHub 的分档超时（#969 暂定值，终值等 #967 测出耗时分布后回填）。
  outboundReadMs: 12000
  outboundWriteMs: 30000
  outboundProbeMs: 3000
  # 拿不到档位时的旧默认：沿用历史 30 秒，不静默变快。
  outboundDefaultMs: 30000

  # GitHub 房客户端兜底超时：30 秒。调用方显式传了超时就按调用方的来。
  githubClientTimeoutMs: 30000
  # 查登录态与版本号的探活用超时：3 秒。本该最快回来。
  githubProbeMs: 3000
  # git 直调的探活超时：3 秒（读远端地址那一类只读调用）。
  gitProbeMs: 3000
  # GitHub 房建仓那一步的超时：30 秒。
  githubInitTimeoutMs: 30000

  # GitLab 房常规读超时：8 秒。房里二十多处列表与详情查询共用这一档。
  gitlabReadMs: 8000
  # GitLab 房慢读超时：10 秒。翻页列表与计数查询走这一档。
  gitlabSlowReadMs: 10000
  # GitLab 房探活与轻查询超时：5 秒。登录态检查与单个用户查询走这一档。
  gitlabProbeMs: 5000
  # GitLab 房内 git 直调超时：3 秒。
  gitlabRepoGitMs: 3000
  # GitLab 房 git 回退链超时：2 秒。回退只是兜底，不值得久等。
  gitlabFallbackMs: 2000
  # GitLab 房建仓那一步的超时：60 秒。建仓含远端建仓库与本地初始化两段。
  gitlabCreateProjectMs: 60000

  # —— 宿主直调的 git 命令与凭据助手（2026-10-16 全量收拢补）——
  # 单条 git 命令的默认超时：20 秒。接线显式给了超时就按接线那个（versionControl.js 的 TIMEOUT_MS）。
  vcRunTimeoutMs: 20000
  # 版本控制核对的整趟预算：60 秒。一趟核对里所有 git 命令加起来不许超过它。
  vcCheckCallBudgetMs: 60000
  # 核对时列表 files 的超时：15 秒。
  vcLsFilesTimeoutMs: 15000
  # 核对时问远端地址的超时：5 秒。
  vcRemoteTimeoutMs: 5000
  # 写路径五条命令各自的超时：add 15 秒、commit 60 秒、pull 3 分钟、push 2 分钟、fetch 2 分钟。
  # pull 给得最宽：它要跟远端协商并搬对象，是这几条里最容易慢的。
  vcAddTimeoutMs: 15000
  vcCommitTimeoutMs: 60000
  vcPullTimeoutMs: 180000
  vcPushTimeoutMs: 120000
  vcFetchTimeoutMs: 120000
  # 读类命令的单条超时：5 秒。写路径里问状态、读内容、查远端都走这一档。
  vcReadCmdTimeoutMs: 5000
  # 写路径四类调用的整趟预算：读头部 20 秒、默认读 10 秒、列表 files 30 秒、远端列表 15 秒。
  # 「单条超时」与「整趟预算」是两件事：一条命令不许超 5 秒，一趟调用最多能花 10 秒。
  vcHeadCallBudgetMs: 20000
  vcReadCallBudgetMs: 10000
  vcLsFilesCallBudgetMs: 30000
  vcRemoteListCallBudgetMs: 15000
  # 推送前让 git 复核两个分支名（只读命令）这一步的整趟预算：15 秒。两个名字共用这一趟预算。
  vcPrePushCheckCallBudgetMs: 15000
  # 写命令给整趟预算留的余量：10 秒。add / unstage / commit / pull / fetch / push 的整趟预算
  # = 该条命令的超时 + 这个余量（超时管「一条命令最多跑多久」，整趟预算管「这一步所有命令合起来的上限」）。
  vcWriteCallMarginMs: 10000
  # git 凭据代执行的整趟预算：4 分钟。上下限 1 秒与 10 分钟：接线给的预算会被钳进这个范围。
  gitCredentialCallBudgetMs: 240000
  gitCredentialMinBudgetMs: 1000
  gitCredentialMaxBudgetMs: 600000
  # 问 git 用哪个凭据助手（config --get credential.helper）的超时：5 秒。
  gitCredentialProbeTimeoutMs: 5000
  # 每类 git 操作的默认预算：ls-remote 20 秒、fetch 2 分钟、pull 3 分钟、push 2 分钟、其余（default）1 分钟。
  # 调用方没给每操作预算时按这一档；写操作要联网，给得比只读宽，到点一律强杀。
  gitCredentialLsRemoteBudgetMs: 20000
  gitCredentialFetchBudgetMs: 120000
  gitCredentialPullBudgetMs: 180000
  gitCredentialPushBudgetMs: 120000
  gitCredentialDefaultBudgetMs: 60000
  # http 传输连续 20 秒低于 1000 字节/秒就放弃。git 的 http.lowSpeedTime 只认秒，代码里把这一档毫秒除以 1000 再交给它。
  gitLowSpeedTimeoutMs: 20000

  # 跟踪器假身位匹配的超时：30 秒。超时视作 pending（未知），排除出决策集。
  matchesTimeoutMs: 30000

  # 九个 deck 工具问沙箱政策的等待上限：5 秒。等不到就按无政策继续，不拦工具执行。
  deckSandboxMs: 5000
  # 地图存取（读、写、删计划快照）的等待上限：10 秒。超时只记一笔，不抛错。
  deckStoreMs: 10000
  # 工具壳确保有可用地图时的等待上限：15 秒。它与上一条是两件事（“确保有”与“读写”），值不同是刻意的。
  deckEnsureMs: 15000
  # deck 工具前置本地读的等待上限：5 秒。读本机记忆与工作区锚文件都是本地读，挂住的文件服务不该卡住整笔调用，
  # 等不到就按缺席跳过（超时走既有的失败继续路径，不抛错）。#1155 把宿主接线转成 TypeScript 后按“动到谁再入”的口径收进来。
  deckLocalReadMs: 5000
  # 工具钩子（票建好后的通知）的等待上限：5 秒。等不到就跳过，不影响主流程。
  deckHookMs: 5000
  # 工具表装配声明文件读取的等待上限：8 秒。
  deckAssemblyMs: 8000
  # 桥接干跑等工具表的等待上限：8 秒。
  bridgeDryTableWaitMs: 8000
  # 代执行格等工具返回的等待上限：25 秒。
  delegatedCellWaitMs: 25000

  # 宿主接线的通用超时：30 秒。经 deps 注入各宿主模块，改这里全链生效。
  hostTimeoutMs: 30000
  # 宿主启动时等 subprocess/timer 通道就绪的兜底：30 秒。等不到只记一行警告，不拦进程启动。
  # 它与上一条不是一件事：上一条是接线给各模块的业务超时，这一条是启动引导自己的保险丝。
  hostBootDeferMs: 30000
  # 写锁默认等待上限：60 秒。等不到就诚实回，不无限排队。
  keyLockMs: 60000
  # 会话工作目录规范化的等待上限：5 秒。超时回退，不拦启动。
  canonicalTimeoutMs: 5000
  # 在途租约保活哨兵：2 的 31 次方减 1。非常值，不可调——它不是“等多久”，
  # 是“让这一只定时器永远不触发”的写法，改小会让租约提前失效。
  inFlightKeepAliveMs: 2147483647

  # 客户端设置调试推送的等待上限：5 秒（客户端经构建 splice 吃到这个值，不运行时 import）。
  settingsDebugPushWaitMs: 5000
  # 配额同步失败后的冷却：60 秒。冷却期内不再发同步请求，不拿失败刷服务端。
  quotaSyncCooldownMs: 60000
  # 注册重试两次尝试之间的等待：2 秒。只在注册那条慢路上用，不进快路。
  registerRetryWaitMs: 2000
  # 壳命令寻址解析的等待上限：8 秒。等不到就按解析失败走，不拦工具执行。
  shellResolveMs: 8000
  # 问模型写一份工作区命名摘要的超时：30 秒。等不到就按没有摘要继续，名字回落到目录名。
  namingSummaryTimeoutMs: 30000
  # 客户端日志看门狗的阈值：5 秒。开关写与启动对账超过这么久没回，就记一行告警自举证。
  logWatchdogMs: 5000
  # 客户端等一次自动探测结果的上限：15 秒。等不到就按“这一次没结果”继续，不卡住整轮。
  probeAutoWaitMs: 15000
  # 子进程收尾宽限：探活类（gh --version 这种一闪即走的）1 秒，常规 2 秒。
  # 宽限到了进程还没退才杀——杀早了会把“正在刷最后一段输出”的进程误杀。
  procProbeGraceMs: 1000
  procGraceMs: 2000
