# 中央时间参数的「有效期」一份（票 #1215 立的头，2026-10-16 全量收拢时按用途拆开）。
#
# 全仓手写代码里的时间参数只在这三份文件里书写，按「这个时间是干什么的」分：
#   config/timeouts.yaml   单次等待的上限（到点没回来就按失败或放弃处理）
#   config/intervals.yaml  节拍间隔（每隔多久跑一次）、一次性延时（等一下再动）与退避（失败后等多久再试）
#   config/ttl.yaml        有效期（一份结果、一条提示多长之内还算数，过期重取或自动收起）
# 单位一律是毫秒，文件里不写单位后缀。想改一个时间，先改这里，再跑一次生成器
# （node scripts/generate-time-config.mjs），调用方读到的是生成出来的值。
#
# 缺键是构建错误，不是合法状态：生成器遇到 YAML 里没有的键直接报错，
# 调用方不许自己写数字顶上（单源头纪律，见 #1215）。未知键同样报错，不静默忽略。

version: 1

ttl:
  # 环境预检成功后的寿命：10 分钟。10 分钟之内复用同一份结果，不再重复花请求。
  preflightTtlMs: 600000
  # 检查链全绿后的缓存寿命：30 分钟。全绿这个状态本身变化很慢，不必反复重算。
  chainAllGreenTtlMs: 1800000
  # 被推迟的请求在队列里的过期时间：5 分钟。过期直接丢，不排队、不堆积、不重试。
  deferExpiryMs: 300000
  # 连续失败走完一整轮退避后，再等多久才放一笔探针试一次：5 分钟。
  # 与推迟过期同一量级：两件事都是“等这么久还没好转，就当这一轮过去了”。
  failureHalfOpenDelayMs: 300000
  # 视野信号失效的判据：90 秒内没有任何“我在看谁”的上报，全部工作区降为后台档。
  # 界面半边读的是同一个数（内核心跳那段用它判“自动刷新已暂停”），值同源，别改一边。
  attentionExpiryMs: 90000
  # 刚离开的那个工作区还算“活跃”多久：30 秒。照顾两个工作区之间快速来回切的手感。
  activeLingerMs: 30000
  # 扫描类取数的合并窗口：同一个工作区 10 秒内的多次扫描（probe-now）合并成一次；点名补行（patch-now）不受它限制。
  patchMergeWindowMs: 10000
  # 数据超过多久算“黄”：5 分钟。定稿第十章“界面三件事”第一条的延迟承诺。
  freshnessYellowMs: 300000
  # 数据超过多久算“红”：30 分钟。
  freshnessRedMs: 1800000
  # 写票据的有效期：2 分钟。过期未用即作废，重走申请。
  ticketTtlMs: 120000
  # 工作区探测缓存的有效期：30 秒。
  workspaceStoreTtlMs: 30000
  # 搭检查链便车的单次有效期：30 秒。超了就自己重新求值，不蹭旧结论。
  chainRideMaxAgeMs: 30000
  # 快照组合器的缓存有效期：5 秒。四处同值（两次快照组装加两次刷新组装），
  # 宿主跟踪器里“快照”与“依赖清单”两张缓存也吃这一档（src/host/tracker/snapshot.js 的两个缺省值）。
  snapshotTtlMs: 5000
  # 宿主平台通道的状态缓存有效期：30 秒。workspaceStore 探测级联的寿命。
  statusCacheMs: 30000
  # 会话快照内存缓存的有效期：60 秒。命中即用，不重算。
  snapshotCacheMs: 60000
  # 计划游标文件的有效期：7 天。过期视为无游标，重走全量。
  planCursorTtlMs: 604800000
  # 幂等锚的时间档位宽度：5 分钟。把时刻压到档位上，同一档位内的重复调用视为同一笔。
  anchorWindowMs: 300000
  # GitHub 房幂等回看窗口：30 分钟。建票前回看这么久之内的同名票，防重复建。
  idempotencyLookbackMs: 1800000
  # 地图票列表缓存的有效期：60 秒（客户端）。命中即用，miss 才走远端。
  mapTicketsTtlMs: 60000

  # —— 跟踪器同步的寿命（src/shared/tracker/sync.js，宿主与界面吃同一份）——
  # 两次窗口重叠的容差：90 秒。窗口边界对齐用，免得同一段时间被算两遍或漏掉。
  syncOverlapSkewMs: 90000
  # 脏标记回声的寿命：60 秒。自己刚写下的变化，这么久之内不再当成“新变化”。
  syncDirtyEchoTtlMs: 60000
  # 一次动作之后，多久之内的探测仍算“刚发生的动作带来的”：8 秒。
  syncActionProbeWindowMs: 8000
  # 快照超过多久算不新鲜：60 秒。超了重新取。
  syncSnapFreshMs: 60000
  # 票列表缓存的有效期：60 秒。命中即用，miss 才走远端。
  syncIssueCacheTtlMs: 60000
  # 索引窗口的上限：7 天。再往前不建索引，按全量取。
  trackerIndexMaxWindowMs: 604800000
  # 索引窗口边界的容差：60 秒。时钟抖动不至于把边界上的条目算漏。
  trackerIndexSkewMs: 60000

  # —— 宿主侧的小缓存与界面提示的停留时间 ——
  # 问到的技能清单记多久：30 秒。只记问到的（绿），问不到的不记。
  skillListCacheTtlMs: 30000
  # 技能探测结果的短时缓存：10 秒。同一份回答短时不再重复问。
  skillProbeCacheMs: 10000
  # 工作区根判定的缓存有效期：30 秒。同一条路径短时不再重新判定。
  workspaceRootTtlMs: 30000
  # 等界面快照回来的上限：30 秒。等不到按没有快照继续。
  snapWaitMs: 30000
  # 一次探测在界面上留下的高亮亮多久：2.6 秒。亮这么久就自己淡掉，不把痕迹一直挂在界面上。
  # 注意这**不是**等快照回来的超时（那一条是上面的 snapWaitMs，30 秒）：名字里的 probe 说的是「探测留下的高亮」。
  snapshotProbeMs: 2600
  # 提示条自动消失的时间：2.8 秒。
  storeNoticeDismissMs: 2800
  # 回落到本地数据之后多久算过期：1 小时。过期就不再说“这是本地的”，改说“取不到”。
  restFallbackStaleMs: 3600000
  # 版本控制界面里相对时间的窗口：7 天。超过 7 天就显示绝对日期，不再说“几天前”。
  vcRelativeWindowMs: 604800000
  # 详情页确认提示的停留时间：3 秒。
  issueDetailConfirmMs: 3000
  # 评论结果提示的停留时间：1.5 秒。
  commentResultFlashMs: 1500
  # “加载更多”至少转这么久：600 毫秒。太快闪过反而像没加载过。
  commentsMoreLoadingMinMs: 600
  # 复制成功提示的停留时间：1.3 秒。
  copyFlashMs: 1300
  # 鼠标离开技能浮层之后隔多久才真的收起：160 毫秒。留这点时间，手从技能名移到浮层上时浮层不会先消失。
  skillFloatCloseDelayMs: 160
  # 调色盘弹窗里「已复制」提示的停留时间：2.6 秒。到时自动收起，不留在界面上。
  labelCopyFlashMs: 2600
  # 技能详情里点「复制链接」之后「已复制」标记停留多久：1.5 秒。
  skillDetailCopiedFlashMs: 1500
  # 构建互斥锁判定「锁已死」的有效期：60 秒。超过这么久没见到持锁进程的心跳，
  # 就认为它死了（崩溃或被杀），等锁的人可以改名接管；定 60 秒是因为持锁进程
  # 最长的同步段（产物写盘）也在秒级，正常情况下心跳不可能停这么久（#1365）。
  buildLockStaleMs: 60000

  # —— 工作路线回执的两个窗口与保留期（#1259 定的口径；改这里，回执里的在办 / 陈旧与保留期一起变）——
  # 保留期 = 30 天：工作路线里的条目只收这么久以内的，超过 30 天在下一次落盘时清掉
  # （GLOSSARY「在办与陈旧」）。键名里的 InProgress 是历史上的叫法，实际管的是「收不收进表」这条线。
  # 这个值只做大小比较，不会交给 setTimeout 当延时（超过定时器上限是合法的）。
  workRouteInProgressWindowMs: 2592000000
  # 在办（active）= 24 小时内动过；超过 24 小时、未满 30 天的条目在回执里按陈旧计数。
  workRouteActiveWindowMs: 86400000
  # 撞单 = 前后 30 分钟内另一个会话也记过同一张票。
  workRouteCollisionWindowMs: 1800000

  # —— 会话链缓存与工作路线存档共用的保留期 ——
  # 超过 30 天的条目在下一次落盘时清掉：一个月前的处理动作对「最近在办什么」已经没有意义。
  # 这个值只做大小比较，不会交给 setTimeout 当延时（超过定时器上限是合法的）。
  chainKeepMs: 2592000000

  # —— 写事件补丁的短存 ——
  # 写事件之后探针通常在几秒内就到；超过 15 秒说明这一趟已经无关了，补丁不再落地。
  writePatchTtlMs: 15000

  # —— 视野模型上报的去重窗 ——
  # 同一窗口、同一种上报、同一份上报原文在 1 秒内重复到达时只处理第一条（现场见 #1247）。
  attentionReportDedupeMs: 1000
