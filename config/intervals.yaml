# 中央时间参数的「间隔与延时」一份（票 #1215 立的头，2026-10-16 全量收拢时按用途拆开）。
#
# 全仓手写代码里的时间参数只在这三份文件里书写，按「这个时间是干什么的」分：
#   config/timeouts.yaml   单次等待的上限（到点没回来就按失败或放弃处理）
#   config/intervals.yaml  节拍间隔（每隔多久跑一次）、一次性延时（等一下再动）与退避（失败后等多久再试）
#   config/ttl.yaml        有效期（一份结果多长之内算数，过期重取）
# 单位一律是毫秒，文件里不写单位后缀。想改一个时间，先改这里，再跑一次生成器
# （node scripts/generate-time-config.mjs），调用方读到的是生成出来的值。
#
# 缺键是构建错误，不是合法状态：生成器遇到 YAML 里没有的键直接报错，
# 调用方不许自己写数字顶上（单源头纪律，见 #1215）。未知键同样报错，不静默忽略。

version: 1

intervals:
  # 变化探测的间隔：正在看的那个活跃工作区每 5 秒探一次。
  probeIntervalMs: 5000
  # 黄档时探测放慢到的间隔：120 秒。红档不下探，直接全停。
  probeIntervalYellowMs: 120000
  # 活跃集合里“刚离开的那个”的探测间隔：15 秒。
  probeIntervalLingerMs: 15000
  # 黄档时两次整池重建之间的最短间隔：300 秒。防止降档之后还按原节奏重建。
  rebuildMinIntervalYellowMs: 300000
  # 后台对账（整池重建）的间隔：10 分钟。黄档时是否执行由档位决定。
  reconcileIntervalMs: 600000
  # 服务端剩余额度同步的间隔：60 秒。走不扣配额的接口，但仍是一条真实出站请求。
  quotaSyncIntervalMs: 60000
  # 面板可见时本地心跳的间隔：20 秒。零配额、不出网，只证明界面还看着这个工作区。
  attentionHeartbeatMs: 20000

  # —— 跟踪器同步的节拍（src/shared/tracker/sync.js，宿主与界面吃同一份）——
  # 一轮求值之间的最小间隙：4.5 秒。它管着「别把同一件事算两遍」。
  syncEvalGapMs: 4500
  # 脏标记探测的合并窗：1.2 秒。连着来的几次变化合成一次探测。
  syncDirtyProbeDebounceMs: 1200
  # 失败之后放慢到的探测间隔：5 分钟。单值退避放这一组，成序列的退避在下面的 backoff 组。
  syncFailureBackoffMs: 300000
  # 轮询栅格：4 秒。所有工作区的探测都对齐到这个栅格上，避免各查各的。
  syncPollGridMs: 4000
  # 没人看时的兜底探测间隔：60 秒。面板不可见时也不至于完全停摆。
  syncFallbackProbeMs: 60000
  # 刚获得焦点时的最短探测间隔：60 秒。焦点切换不该变成请求风暴。
  syncFocusProbeMinMs: 60000

  # —— 命名状态与日志的节拍 ——
  # 命名状态落盘的合并窗：1.2 秒。短窗内多次改动只落一次盘。
  namingPersistDebounceMs: 1200
  # 命名即时推进的默认合并窗：1.5 秒。调用方给了延迟就按调用方的。
  namingSweepSoonMs: 1500
  # 命名兜底整轮的间隔：10 分钟。长期没有事件时靠它把状态推齐。
  namingFallbackIntervalMs: 600000
  # 命名重试的冷却：45 秒。同一项失败之后至少隔这么久再试。
  namingRetryCooldownMs: 45000
  # 谓词调试日志的采样节拍：15 秒。debug 开启时，同类谓词状态变化至多每 15 秒记一批，
  # 防止高频检测把日志通道打满；只影响日志量，不影响检测行为。
  predicateLogSampleMs: 15000
  # 宿主日志落盘的合并窗：1 秒。短窗内的多行合成一次写。
  logWriteDebounceMs: 1000
  # 客户端日志通道的批量间隔：1 秒（界面的日志分批发给宿主）。
  logFlushMs: 1000

  # —— 界面上的一次性延时（等一下再动，动手之前留给人的眼睛）——
  # 交接会话时看通道的节拍：1 秒一次。等宿主把新的会话认下来。
  clientSessionTickMs: 1000
  # 交接之后至少转这么久才收尾：2 秒。“已经切走了”这件事要在界面上看得见。
  clientHandoffDelayMs: 2000
  # 连续弹两个窗口之间的让位间隔：80 毫秒。前一个先退场，后一个再上来。
  slotQueueStepMs: 80
  # 界面开关写盘的合并窗：500 毫秒。短窗内多次切换只写一次。
  viewFlagWriteDebounceMs: 500
  # 弹表格窗之前留的让位时间：1.1 秒。
  slotModalOpenDelayMs: 1100
  # 切库确认提示自动收起的时间：220 毫秒。
  storeSwitchConfirmMs: 220
  # 状态栏日志菜单关闭后的收起延时：300 毫秒（给鼠标一点回到菜单里的时间）。
  statusMenuDismissDelayMs: 300
  # 鼠标悬停到状态栏菜单上多久才展开：200 毫秒（划过去不算要看）。
  statusMenuHoverOpenDelayMs: 200
  # 状态栏菜单在宿主回话之前先开门的兜底延时：160 毫秒。
  statusMenuFallbackDelayMs: 160
  # 悬停提示（Tip 薄预设）的两个延时：显示等 500 毫秒、隐藏等 160 毫秒。
  # 它们与上面状态栏那两档不是一回事：那两档管菜单开合，这两档管提示框的出现与消失，
  # 只是数值上 160 撞在一起，调一个不要顺手改另一个。
  tipShowDelayMs: 500
  tipHideDelayMs: 160
  # 回填草稿后补一次焦点的重试延时：120 毫秒。宿主异步写草稿，第一帧可能还在旧值，
  # 窗口给小一点，避免抢用户后续输入；最多补一次（次数由调用处 attempts < 2 锁住，不在这里）。
  draftRefocusRetryMs: 120
  # 老宿主没有注入回调时，多久试一次注册右侧栏标签：1 秒（最多试十次）。
  nativeTabRetryIntervalMs: 1000
  # 技能原文超过这么久还没取回来就先摆骨架屏：2 秒（886 v3 定版：2 秒内到货不铺，避免闪一下）。
  skillSkeletonDelayMs: 2000
  # 构建互斥锁持锁期间的心跳间隔：15 秒。心跳只证明「持锁进程还活着」，不延长任何东西；
  # 陈旧判定（见 ttl 那一档的 buildLockStaleMs）按心跳的新鲜度来，所以这一档必须远小于那一档（#1365）。
  buildLockHeartbeatMs: 15000

  # —— 宿主出站排队段的日志节流（#1101）——
  # 排队放行时「等了很久」的常驻轨迹门槛：3 秒。低于它不记，免得正常波形也变成日志。
  laneLongWaitLogMs: 3000
  # 同一只桶「等久了」的最短记录间隔：5 分钟。排队风暴期间每秒都有放行，逐条记会把日志打满。
  laneWaitLogIntervalMs: 300000

backoff:
  # 检查链的退避序列：8 秒 → 30 秒 → 2 分钟 → 5 分钟。任何一步有进展立刻回到第一档。
  chainBackoffMs: [8000, 30000, 120000, 300000]
  # 「下一步建议」选项行自己的重试退避：1.2 秒 → 2.5 秒（客户端两档；只在面板拿不到建议时用）。
  ownRouteRetryMs: [1200, 2500]
