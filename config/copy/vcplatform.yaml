  vc.migrate.note.14.1: '上方就是 14.1 的导出向导。'

en:
  vc.platform.title: 'Platform and limits'
  vc.platform.cred.title: 'Credential helper chain (read-only)'
  vc.platform.cred.note: 'Credentials held by the panel: none. Only the helper chain configured on this machine is shown; the panel never enters, stores, or writes tokens to disk.'
  vc.platform.cred.empty: 'Neither this repository nor the global config defines credential.helper.'
  vc.platform.cred.list: 'Credential helpers configured on this machine (in effect order, {n} entries)'
  vc.platform.cred.store: 'The helper chain contains store: it writes user names and tokens to a plain file on disk. The panel does not offer plaintext storage and suggests credential manager or cache instead. Matched: {helper}'
  vc.platform.cred.ok: 'No store helper found; the chain looks normal.'
  vc.platform.cred.loadFail: 'The credential helper chain could not be read. Retry, or run git config --get-all credential.helper in a terminal.'
  vc.platform.updateRefs.title: 'Other branch pointers (5.9, explanation only)'
  vc.platform.updateRefs.valueOn: 'rebase.updateRefs is {value}: this repository moves other branch pointers during rebase.'
  vc.platform.updateRefs.valueOff: 'rebase.updateRefs is not enabled and no value was read.'
  vc.platform.updateRefs.why: 'The panel does not do --update-refs: moving several branch pointers automatically is hard to check and hard to undo; interactive rebase asks you about each branch instead.'
  vc.platform.updateRefs.refuse: 'rebase.updateRefs is enabled: the interactive rebase preflight will refuse and explain why. To move several branch pointers, run git rebase --update-refs explicitly in the sidebar terminal.'
  vc.platform.updateRefs.min: 'This capability needs git {v} or newer; below that only the explanation stays in the command palette.'
  vc.platform.rp.title: 'Request-pull note (14.3, read-only)'
  vc.platform.rp.note: 'Fill the start point, repository address, and an optional end point; the panel runs git request-pull and produces a note you can paste to a collaborator. It does not push, does not use the network, and does not change the repository.'
  vc.platform.rp.start: 'Start point (for example v1.0.0 or HEAD~3)'
  vc.platform.rp.url: 'Repository address or local path'
  vc.platform.rp.end: 'End point (optional, defaults to HEAD)'
  vc.platform.rp.run: 'Produce the note'
  vc.platform.rp.empty: 'Nothing produced yet; fill the start point and address, then choose Produce the note.'
  vc.platform.rp.loading: 'Producing...'
  vc.platform.rp.error: 'Could not produce the note'
  vc.platform.rp.result: 'Produced note (ready to copy)'
  vc.platform.rp.truncated: 'The output was too long; only the first part is shown.'
  vc.platform.note.5.9: 'The panel does not offer --update-refs: moving several branch pointers automatically is risky and hard to check. Pick branches one by one in interactive rebase, or run it explicitly in a terminal.'
  vc.platform.note.8.15: 'Read-only view of the credential helper chain and of the fact that the panel holds no credentials. No login box; tokens are never read, written, or stored. A store helper is marked red with a suggestion to replace it.'
  vc.platform.note.14.2: 'send-email opens an external program and sends through a mail server; the panel does not send it. Use git send-email in the sidebar terminal, or attach the patch on the platform web page.'
  vc.platform.note.14.3: 'A read-only call to git request-pull that produces a note; it does not push and does not use the network.'
  vc.platform.note.14.4: 'Pull requests, issues, and releases need the hosting platform API and a web login; the panel never fakes platform state. Do it on the platform web page and read the server own words when refused.'
  vc.platform.note.14.5: 'Actions and CI status are live platform data; the panel does not cache stale state and present it as live. Check the platform page.'
  vc.platform.note.14.6: 'Accounts, teams, and permissions belong to the platform; the panel stores no account credentials. Use the platform settings page.'
  vc.platform.note.14.7: 'Branch protection and force-push bans are server-side rules; the panel cannot change them and shows the remote own words when it refuses. Change them in the platform repository settings.'
  vc.platform.note.14.8: 'Transferring or archiving a repository needs platform administrator rights; the panel does not do it. Use the platform repository settings page.'
  vc.platform.section.outbound.title: 'Six capabilities handed off'
  vc.platform.section.outbound.count: '6 capabilities'
  vc.platform.section.outbound.note: 'These capabilities have no entry in the panel: not because they are skipped, but because doing them here would cross a permission boundary or hide the consequences from you.'
  vc.platform.section.boundaries.title: 'Four boundaries'
  vc.platform.section.boundaries.note: 'The boundaries are written here so that whoever writes the downstream spec knows what not to implement.'
  vc.platform.section.credentials.title: 'Credential chain'
  vc.platform.section.credentials.count: '1 capability'
  vc.platform.section.credentials.note: 'For authentication and credentials, the panel only explains the chain: the helper first, then the storage, then the risk. It never reads or writes any token.'
  vc.platform.section.updateRefs.title: 'Other branch pointers'
  vc.platform.section.updateRefs.count: '1 capability'
  vc.platform.section.updateRefs.note: 'All four states of rebase.updateRefs are spelled out here: off, on, unreadable, and refused by the preflight while on.'
  vc.platform.section.requestPull.title: 'Request-pull explanation'
  vc.platform.section.requestPull.count: '1 capability'
  vc.platform.section.requestPull.note: '14.3 read-only: it turns the range to be pulled into a written explanation, and the panel changes neither the remote nor local branches.'
  vc.platform.section.pointer.title: 'Go to another page'
  vc.platform.outbound.chip: 'Read-only'
  vc.platform.outbound.where.14.2: 'Generate the patch file with git format-patch in a terminal, then hand it to a mail client. The panel does not send mail for you.'
  vc.platform.outbound.where.14.4: 'Handle pull requests, issues, and releases on the hosting platform web page.'
  vc.platform.outbound.where.14.5: 'Check Actions and CI status on the platform web page. This repository retired its remote verification workflow on 2026-10-26 (#1542); local npm run verify:parallel is the only arbiter.'
  vc.platform.outbound.where.14.6: 'Manage accounts, tokens, and permissions on the platform settings page. The panel holds no platform token.'
  vc.platform.outbound.where.14.7: 'Branch protection and force-push bans are server-side rules configured on the platform settings page.'
  vc.platform.outbound.where.14.8: 'Repository transfer and archiving are done on the platform settings page; afterwards the local remote address has to be updated to match.'
  vc.platform.boundaries.editor.title: 'No built-in editor'
  vc.platform.boundaries.editor.sub: 'Commit messages, merge messages, and hook bodies can all be drafted by AI, but writing a complete message in an editor still belongs to an external editor (#1588 section 4).'
  vc.platform.boundaries.token.title: 'No platform token held'
  vc.platform.boundaries.token.sub: 'For web-side capabilities such as pull requests, issues, Actions, and branch protection, the panel only offers an entry point and an explanation; it neither does the work nor stores a token.'
  vc.platform.boundaries.longtask.title: 'Long tasks are not hidden'
  vc.platform.boundaries.longtask.sub: 'Time-consuming actions such as cloning, migration, and archiving show progress and the consequences of cancelling; the panel does not pretend they finish instantly.'
  vc.platform.boundaries.rewrite.title: 'No whole-repository rewrite on your behalf'
  vc.platform.boundaries.rewrite.sub: 'Full-history rewrites with filter-repo, overwrite imports with fast-import, and reference-format migrations all live in the dangerous area of the maintenance page: check them first, then hand them to the dedicated tool.'
  vc.migrate.title: 'Migrate and back up'
  vc.migrate.lede: 'This page owns {n} capabilities: 14.1 generating patch files, 5.13 history export and import, 8.16 cloning, 11.1 initializing a repository, 11.12 archive export, and 11.13 bundles; every one has its entry in the page body below.'
  vc.migrate.export.title: '14.1 Generate patch mails (output to a directory)'
  vc.migrate.export.note: 'Exports a commit range into patch files. The command runs through the long-task channel: it can be cancelled, and afterwards the patch files in the output directory are listed with their path.'
  vc.migrate.export.range: 'Commit range (for example HEAD~2..HEAD)'
  vc.migrate.export.dir: 'Output directory (relative to the repository root or absolute; created when missing)'
  vc.migrate.export.check: 'Preflight'
  vc.migrate.export.checked: 'Preflight passed: {range} will be exported to {dir}.'
  vc.migrate.export.ticket: 'Preflight ticket {id}; if it expires or the repo changes, preflight again — nothing is replayed automatically.'
  vc.migrate.export.stale: 'The ticket expired or the repository changed: run the preflight again before generating.'
  vc.migrate.export.confirmTitle: 'Confirm generating patch files'
  vc.migrate.export.what: 'What changes: one patch file per commit in {range} is written into the output directory {dir}; the directory is created if missing.'
  vc.migrate.export.wont: 'What does not change: nothing is pushed or mailed, no branch or commit is modified.'
  vc.migrate.export.reversible: 'Reversibility and recovery: patch files can simply be deleted and the repository is unchanged; a running task can be cancelled.'
  vc.migrate.export.verb: 'The verb states the consequence: after generating, these patch files stay on disk and you need to check the output directory.'
