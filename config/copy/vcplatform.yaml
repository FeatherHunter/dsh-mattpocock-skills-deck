  vc.platform.note.14.4: 'PR / Issue / Release 需要托管平台接口与网页登录；面板不伪造平台状态。到对应平台网页操作，被拒绝时看平台原话。'
  vc.platform.note.14.5: 'Actions / CI 状态是平台的实时数据；面板不缓存过期状态冒充实时。到平台页面查看。'
  vc.platform.note.14.6: '账号、团队与权限由平台管理；面板不保存任何账号凭据。到平台设置页处理。'
  vc.platform.note.14.7: '分支保护与禁止强推是服务端规则；面板改不了，远端拒绝时照原话显示。到平台仓库设置里改。'
  vc.platform.note.14.8: '仓库转移与归档要平台管理员权限；面板不代做。到平台仓库设置页操作。'
  vc.platform.section.outbound.title: '交出去的六条能力'
  vc.platform.section.outbound.count: '6 条能力'
  vc.platform.section.outbound.note: '这些能力没有面板入口：不是不做，而是做在面板里会越过权限边界或替用户隐瞒后果。'
  vc.platform.section.boundaries.title: '四条边界'
  vc.platform.section.boundaries.note: '边界写在这里，是为了让下游写规格时知道「不要实现什么」。'
  vc.platform.section.credentials.title: '凭据链'
  vc.platform.section.credentials.count: '1 条能力'
  vc.platform.section.credentials.note: '认证与凭据在面板里只解释链路：先看助手，再看存储，最后看风险；面板不读取、不写入任何令牌。'
  vc.platform.section.updateRefs.title: '其他分支指针'
  vc.platform.section.updateRefs.count: '1 条能力'
  vc.platform.section.updateRefs.note: 'rebase.updateRefs 的四种状态在这里写清：关着、开着、读不到、开着时预检拒绝。'
  vc.platform.section.requestPull.title: '请求拉取的说明'
  vc.platform.section.requestPull.count: '1 条能力'
  vc.platform.section.requestPull.note: '14.3 只读：把要拉取的范围写成一段说明，面板不改远端、不改本地分支。'
  vc.platform.section.pointer.title: '换页去找'
  vc.platform.outbound.chip: '只读'
  vc.platform.outbound.where.14.2: '在终端用 git format-patch 生成补丁文件，再交给邮件客户端。面板不代发邮件。'
  vc.platform.outbound.where.14.4: '在托管平台的网页上处理 PR、Issue 与 Release。'
  vc.platform.outbound.where.14.5: 'Actions 与 CI 状态在平台网页看。本仓库已于 2026-10-26 下线远端验证工作流（#1542），本地 npm run verify:parallel 是唯一裁决入口。'
  vc.platform.outbound.where.14.6: '账号、令牌与权限在平台设置页管理。面板不持有平台令牌。'
  vc.platform.outbound.where.14.7: '分支保护与禁止强制推送是服务端规则，在平台设置页配置。'
  vc.platform.outbound.where.14.8: '仓库转移与归档在平台设置页完成，成功后本地远端地址要跟着改。'
  vc.platform.boundaries.editor.title: '不内嵌编辑器'
  vc.platform.boundaries.editor.sub: '提交说明、合并说明、钩子正文都可以交给 AI 起草，但「用编辑器写完整说明」这类能力回外部编辑器完成（#1588 第 4 节）。'
  vc.platform.boundaries.token.title: '不持有平台令牌'
  vc.platform.boundaries.token.sub: 'PR、Issue、Actions、分支保护这些网页端能力，面板只给入口与解释，不代做、不保存令牌。'
  vc.platform.boundaries.longtask.title: '不隐藏长任务'
  vc.platform.boundaries.longtask.sub: '克隆、迁移、归档这些耗时动作会显示进度与取消后果，不在面板里假装瞬时完成。'
  vc.platform.boundaries.rewrite.title: '不替人做整仓重写'
  vc.platform.boundaries.rewrite.sub: 'filter-repo 全库重写、fast-import 覆盖导入、引用格式迁移都放维护页危险区，先核对再交给专门工具。'
  vc.migrate.title: '迁移与备份'
