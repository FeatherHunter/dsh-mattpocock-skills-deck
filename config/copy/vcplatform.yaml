  vc.migrate.open: '展开'
  vc.migrate.close: '收起'
  vc.migrate.readonlyChip: '只读'
  vc.migrate.note.5.13: '导出 / 导入历史走任务通道；导入只允许导进一个空目录。'
  vc.migrate.note.8.16: '克隆向导在本页正文：填来源与一个空目录，能看到阶段与进度，也可以取消。'
  vc.migrate.note.11.1: '初始化仓库只在「打开的不是仓库」的空态出现。'
  vc.migrate.note.11.12: '归档导出在本页正文的迁移动作行里：生成压缩包并给出落地路径。'
