  vc.migrate.export.note: '把一段提交区间导出成补丁文件。命令走长任务通道：可以取消，结束后列出输出目录里的补丁文件并给出路径。'
  vc.migrate.export.range: '提交区间（例如 HEAD~2..HEAD）'
  vc.migrate.export.dir: '输出目录（相对仓库根或绝对路径；不存在时会自动创建）'
  vc.migrate.export.check: '预检'
  vc.migrate.export.checked: '预检通过：{range} 将导出到 {dir}。'
  vc.migrate.export.ticket: '预检票据 {id}；过期或仓库变了就重新预检，不自动重放。'
  vc.migrate.export.stale: '票据过期或仓库变了：重新点一次预检再生成。'
  vc.migrate.export.confirmTitle: '确认生成补丁文件'
  vc.migrate.export.what: '会动什么：在输出目录 {dir} 里为 {range} 的每个提交写一个补丁文件；目录不存在会先创建。'
  vc.migrate.export.wont: '不会动什么：不推送、不发邮件、不改分支、不改提交。'
  vc.migrate.export.reversible: '可逆性与恢复路径：补丁文件可以直接删掉，仓库内容不变；任务进行中可以取消。'
  vc.migrate.export.verb: '动词写后果：生成后这些补丁文件会留在磁盘上，需要你按输出目录核对。'
  vc.migrate.export.run: '生成补丁文件'
  vc.migrate.export.running: '任务已经发出，进度看下面的任务区。'
  vc.migrate.export.error: '这一步没做成'
  vc.migrate.export.done: '任务结束：{state}；输出目录 {dir}。'
  vc.migrate.patches.title: '输出目录里的补丁文件'
  vc.migrate.patches.list: '共 {n} 个补丁文件；目录：{dir}'
  vc.migrate.patches.others: '目录里还有 {n} 个不是补丁的文件，没有列出来。'
  vc.migrate.patches.empty: '这个输出目录里还没有补丁文件。'
  vc.migrate.patches.missing: '输出目录还不存在；第一次生成时会创建。'
  vc.migrate.patches.rescan: '重新列一次'
  vc.migrate.section.cloneInit.title: '克隆与初始化'
  vc.migrate.section.cloneInit.count: '2 条能力'
  vc.migrate.section.cloneInit.note: '两个动作都会新建目录，不会改动当前仓库。首次打开时先问清目标路径与是否要完整历史。'
  vc.migrate.section.archive.title: '归档与离线包'
  vc.migrate.section.archive.count: '2 条能力'
  vc.migrate.section.archive.note: '产出是一份文件：界面要写清放哪、多大、是否含工作区。生成时间长的走任务进度页。'
  vc.migrate.section.history.title: '历史与邮件'
  vc.migrate.section.history.count: '2 条能力'
  vc.migrate.section.history.note: '导出/导入历史与生成补丁邮件都产出一份文件。前者整仓不可逆，后者只导出提交。'
  vc.migrate.section.backup.title: '备份与恢复'
  vc.migrate.section.backup.note: '备份不是 git 命令，但它是所有不可逆动作的最后一道保险，所以写在这一页。'
  vc.migrate.section.svn.title: 'SVN 桥'
  vc.migrate.section.svn.count: '2 条动作'
  vc.migrate.section.svn.note: 'svn 桥是本页的补充能力，账本里没有独立编号，也不做 dcommit 与整库 clone。'
