# config/copy/vcplatform.yaml —— 界面词表 —— 平台与边界页 / 迁移与备份页那一族（#1762 T26）
#
# 这是平台段（规格 #1586 域 14 与 5.9）页面的文案真源：凭据助手链、rebase.updateRefs 说明、
# request-pull 表单、逐条平台说明、14.1 生成补丁文件与输出目录列表都从这里读。
# 写法约定同其它族：每种语言一段、键集合一致、值里 {name} 是占位符、两语言的占位符必须一字不差。

zh:
  vc.platform.title: '平台与边界'
  vc.platform.cred.title: '凭据助手链（只读）'
