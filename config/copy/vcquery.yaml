# config/copy/vcquery.yaml —— 界面词表 —— 版本管理页历史高级查询那一族（#1745 T10）
#
# 这是历史高级查询面板的文案真源：十条能力的分组标题、字段标签、执行与重试、四态提示、
# 结果列表与截断说明都从这里读。能力名称、命令与主入口不在这里 —— 那些来自能力账本（#1586）。
# 写法约定同其它族：每种语言一段、键集合一致、值里 {name} 是占位符、两语言的占位符必须一字不差。
