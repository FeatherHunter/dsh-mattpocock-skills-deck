  vc.maintenance.op.tip.gc: "Garbage collection consolidates loose objects and redundant packs; it only removes intermediate garbage. The panel signs a two-minute confirmation and runs it through the long-task channel, so it can be cancelled."
  vc.maintenance.op.tip.maintenance-run: "Background maintenance is git's own scheduler: this runs the enabled tasks once right now and does not change repository configuration."
  vc.maintenance.op.tip.maintenance-enable: "Enabling registers a scheduled task on this machine (git maintenance start) so git keeps the repository tidy on its own. It changes this machine, so read the confirmation first."
  vc.maintenance.op.tip.maintenance-disable: "Disabling removes the registration and stops the scheduled task (maintenance stop / unregister); repository objects are left alone."
  vc.maintenance.op.tip.prune: "Removing unreachable objects cannot be undone: those objects are gone even from the reflog. The panel therefore makes a full backup first and only continues after it succeeds; read the backup path and size on the confirmation card, and note that restore steps are never run automatically."
