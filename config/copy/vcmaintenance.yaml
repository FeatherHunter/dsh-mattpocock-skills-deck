  vc.maintenance.op.tip.gc: "垃圾回收把松散对象与多余的包整理成更少的文件，清理的是已经没人引用的中间产物；面板会先签一张两分钟有效的确认票再执行，执行本体走长任务通道，可以取消。"
  vc.maintenance.op.tip.maintenance-run: "自动维护是 git 自带的定时任务体系：这条动作立刻跑一次已启用的任务，不会替你改仓库配置。"
  vc.maintenance.op.tip.maintenance-enable: "打开自动维护会在系统里登记一个定时任务（git maintenance start），之后 git 会自己按计划整理仓库。这是对这台机器的改动，先看确认卡再决定。"
  vc.maintenance.op.tip.maintenance-disable: "关闭自动维护会撤掉登记并停掉定时任务（maintenance stop / unregister），仓库里的对象不会动。"
  vc.maintenance.op.tip.prune: "清除不可达对象是不可逆的：被清掉的对象找不回来（reflog 也救不回）。所以面板强制先做一份整仓备份，备份成功才继续；请看确认卡里的备份路径与大小，并记住还原步骤面板不会自动执行。"
  vc.maintenance.fail.notReady: "这一步的输入或现场还不满足条件，按上面的说明改好再试。"
  vc.maintenance.fail.stale: "确认之后仓库现场变了（HEAD、工作区或索引），所以这一次什么都没执行；请重新确认。"
  vc.maintenance.fail.env: "面板本机出了问题（读不到目录、进程起不来等），这次什么都没改；看诊断日志后再试。"
