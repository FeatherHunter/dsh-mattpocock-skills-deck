  vc.maintenance.diag.exit.branch: "If some of these objects still hold commits you want: go to the history page and create a branch from them. The panel will not guess which one to keep."
  vc.maintenance.diag.exit.offline: "To archive the objects elsewhere: export an offline bundle from the migrate & backup page. This page only points there and never exports for you."
