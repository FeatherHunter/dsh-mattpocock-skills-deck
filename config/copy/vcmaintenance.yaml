  vc.maintenance.fail.env: "Something on this machine failed (unreadable directory, process could not start); nothing was changed. Check diagnostics and retry."
  vc.maintenance.fail.network: "The call did not get through; the panel may have lost its host connection. Refresh and retry."
  vc.maintenance.fail.unknown: "Git reported an error the panel does not classify; the original line is above."
