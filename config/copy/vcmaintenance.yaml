# config/copy/vcmaintenance.yaml —— 界面词表 —— 管理 › 维护页与诊断页那一族（#1758 T22，规格 #1586 域 11）
#
# 这是维护页（11.4–11.11）与诊断页（11.2–11.4）文案的真源：16 条动作名与动词、
# 对象读数、自动维护状态、不可达对象清单与两个出口说明、危险区确认卡与备份说明、
# 失败族话术。运行时读生成物 src/client/kernel/locale-data.ts（由 scripts/generate-locale-config.mts
# 按本文件生成、不入库）。
#
# 写法约定：
#   · 每种语言一段（今天 zh / en；加一门语言 = 在这里补一段同名键的词条）。
#   · 同一段里每个键都要有，缺一条生成器就报错；值一律是字符串（本文件统一加双引号）。
#   · 值里的 {name} 是占位符，由界面渲染处替换；同一键的中英两份占位符必须一字不差。
#   · 想改界面上的字：改这里 → 跑 node scripts/generate-locale-config.mts → 重新构建。

