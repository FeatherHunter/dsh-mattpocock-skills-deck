# config/copy/vctask.yaml —— 界面词表 —— 长任务区那一族（#1740）
#
# 这是长任务区文案的真源：界面标题、进度说法、四类结论、取消按钮，以及二十种动作的名字。
# 运行时读生成物 src/client/kernel/locale-data.ts（由 scripts/generate-locale-config.mts
# 按本文件生成、不入库）。
#
# 写法约定：
#   · 每种语言一段（今天 zh / en；加一门语言 = 在这里补一段同名键的词条）。
#   · 同一段里每个键都要有，缺一条生成器就报错；值一律是字符串。
#   · 值里的 {name} 是占位符，由界面渲染处替换；同一键的中英两份占位符必须一字不差。
#   · 想改界面上的字：改这里 → 跑 node scripts/generate-locale-config.mts → 重新构建。

zh:
  vc.task.title: 长任务
  vc.task.count: 正在运行 {n} 项
  vc.task.empty: 暂无长任务。克隆、抓取、清理这类耗时命令会在这里显示进度。
  vc.task.running: 正在运行
  vc.task.phase: 阶段：{phase}
  vc.task.phaseUnknown: 阶段：等待 git 报告
  vc.task.percent: 进度 {percent}%
  vc.task.percentUnknown: 进度暂时无法确定（git 还没有报出百分比）
  vc.task.bytes: 已接收 {bytes}
  vc.task.elapsed: 已用 {ms} 毫秒
  vc.task.cancel: 取消任务
  vc.task.doneSucceeded: 已完成
  vc.task.doneFailed: 已失败
  vc.task.doneFailedLine: 失败原因：{line}
  vc.task.doneCancelled: 已取消
  vc.task.doneInterrupted: 上一次任务已中断
  vc.task.interruptedNote: 宿主进程重启过，无法确认这条任务最后停在哪一步，请按命令手册核对产物后再重试。
  vc.task.residual: 残留说明：{residual}
  vc.task.truncated: 输出超过上限，已截断显示
  vc.task.start: 开始
  vc.task.query: 刷新
  vc.task.confirmRequired: 这个动作会改写历史或清理对象，需要先确认
  vc.task.modesTitle: 选一种长任务
  vc.task.modesNote: 三种长任务共用同一套进度与取消规则：开始前先说清目标，取消后要说清留下了什么。
  vc.task.mode.cloneNote: 从一个远端地址拉一份完整历史到本机目录。
  vc.task.mode.cloneCommand: git clone <地址> <目录>
  vc.task.mode.archiveNote: 只导出某条提交的文件快照，不含历史，产出是一个压缩包。
  vc.task.mode.archiveCommand: git archive -o <文件> <提交>
  vc.task.mode.bundleNote: 把完整历史打进一个文件，没有网络时也能克隆回来。
  vc.task.mode.bundleCommand: git bundle create <文件> --all
  vc.task.progressTitle: 进度
  vc.task.progressNote: 进度来自 git 的输出（真实实现里是 --progress 的读数），不是假动画。
  vc.task.stage.prepare: 准备目标目录
  vc.task.stage.prepareDetail: 检查目录是否为空、磁盘空间够不够；克隆会先写一个临时目录，成功后再改名。
  vc.task.stage.receive: 接收对象
  vc.task.stage.receiveDetail: 按对象数量与体积显示进度；网络中断时可以从已收到的部分继续。
  vc.task.stage.checkout: 检出文件
  vc.task.stage.checkoutDetail: 把当前分支的文件写到目标目录，这一步受磁盘速度影响最大。
  vc.task.stage.verify: 完成校验
  vc.task.stage.verifyDetail: 核对 HEAD 与远端一致、文件数量与权限正确，才算真正完成。
  vc.task.stage.done: 已完成
  vc.task.stage.active: 进行中
  vc.task.stage.waiting: 等待
  vc.task.percentUncertainNote: 这条任务还没有报出百分比，四个阶段只能依次等；界面不替它编数字。
  vc.task.idleNote: 现在没有正在运行的长任务；任务开始后这里按 git 的真实读数逐阶段走到完成。
  vc.task.listTitle: 任务清单
  vc.task.cancelAfterTitle: 取消之后
  vc.task.cancelAfterNote: 取消只是停掉正在跑的命令，不会替你删除已经写下的内容；结束时会把残留原样列出来，核对后由你自己清理。目标目录里原有的文件一律不动。
  vc.task.cancelAfterRetry: 重来就按原来的动作再起一次任务。已取消、已失败、已中断的结论都留在任务清单里，先看清上一次停在哪一步，再决定是否重试。
  vc.task.op.clone: 克隆仓库
  vc.task.op.fetch: 抓取远端
  vc.task.op.pull: 拉取并合并
  vc.task.op.push: 推送
  vc.task.op.submoduleInit: 初始化子模块
  vc.task.op.submoduleUpdate: 更新子模块
  vc.task.op.submoduleAdd: 新增子模块
  vc.task.op.submoduleFetch: 逐个抓取子模块
  vc.task.op.submoduleRemoteUpdate: 子模块更新到远端最新
  vc.task.op.archive: 导出归档包
  vc.task.op.bundle: 生成离线包
  vc.task.op.formatPatch: 导出补丁
  vc.task.op.fastExport: 导出对象流
  vc.task.op.fastImport: 导入对象流
  vc.task.op.filterRepo: 改写历史（filter-repo）
  vc.task.op.svnFetch: 从 svn 抓取
  vc.task.op.gc: 清理对象
  vc.task.op.prune: 清理不可达对象
  vc.task.op.fsck: 校验对象库
  vc.task.op.maintenanceRun: 运行仓库维护

en:
  vc.task.title: Long-running tasks
  vc.task.count: "{n} running"
  vc.task.empty: No long-running tasks yet. Commands like clone, fetch, and gc show their progress here.
  vc.task.running: Running
  vc.task.phase: "Phase {phase}"
  vc.task.phaseUnknown: Waiting for git to report a phase
  vc.task.percent: "{percent}% complete"
  vc.task.percentUnknown: Progress not available yet (git has not reported a percentage)
  vc.task.bytes: Received {bytes}
  vc.task.elapsed: Elapsed {ms} ms
  vc.task.cancel: Cancel task
  vc.task.doneSucceeded: Succeeded
  vc.task.doneFailed: Failed
  vc.task.doneFailedLine: "Reason {line}"
  vc.task.doneCancelled: Cancelled
  vc.task.doneInterrupted: The previous task was interrupted
  vc.task.interruptedNote: The host process restarted, so the last completed step is unknown. Check the artifacts against the command guide before retrying.
  vc.task.residual: "Remaining artifacts {residual}"
  vc.task.truncated: Output exceeded the limit and was truncated
  vc.task.start: Start
  vc.task.query: Refresh
  vc.task.confirmRequired: This action rewrites history or removes objects; confirm it first
  vc.task.modesTitle: Choose a long-running task
  vc.task.modesNote: "All three tasks share the same progress and cancel rules: state the target before starting, and say what was left behind when cancelling."
  vc.task.mode.cloneNote: Pull a full history from a remote address into a local directory.
  vc.task.mode.cloneCommand: git clone <url> <dir>
  vc.task.mode.archiveNote: Export the file snapshot of one commit without history; the result is an archive file.
  vc.task.mode.archiveCommand: git archive -o <file> <commit>
  vc.task.mode.bundleNote: Pack the full history into one file that can be cloned back without a network.
  vc.task.mode.bundleCommand: git bundle create <file> --all
  vc.task.progressTitle: Progress
  vc.task.progressNote: Progress comes from git output (the --progress readings in the real implementation), not from a fake animation.
  vc.task.stage.prepare: Prepare target directory
  vc.task.stage.prepareDetail: Check that the directory is empty and there is enough disk space; a clone writes a temporary directory first and renames it on success.
  vc.task.stage.receive: Receive objects
  vc.task.stage.receiveDetail: Progress follows object count and size; after a network drop the transfer resumes from what was already received.
  vc.task.stage.checkout: Check out files
  vc.task.stage.checkoutDetail: Write the files of the current branch into the target directory; disk speed matters most here.
  vc.task.stage.verify: Verify and finish
  vc.task.stage.verifyDetail: Confirm HEAD matches the remote and the file count and permissions are correct before calling it done.
  vc.task.stage.done: Done
  vc.task.stage.active: In progress
  vc.task.stage.waiting: Waiting
  vc.task.percentUncertainNote: This task has not reported a percentage yet, so the four stages can only wait in order; the interface does not invent numbers for it.
  vc.task.idleNote: No long-running task is active right now; once one starts, this block follows git's real readings stage by stage.
  vc.task.listTitle: Task list
  vc.task.cancelAfterTitle: After cancelling
  vc.task.cancelAfterNote: "Cancelling only stops the running command; it does not delete what was already written. The leftover artifacts are listed as-is when the task ends, and you clean them up after checking. Files already in the target directory are never touched."
  vc.task.cancelAfterRetry: "To retry, start the same action again. Cancelled, failed, and interrupted results stay in the task list, so check where the previous run stopped before retrying."
  vc.task.op.clone: Clone repository
  vc.task.op.fetch: Fetch from remote
  vc.task.op.pull: Pull and merge
  vc.task.op.push: Push
  vc.task.op.submoduleInit: Initialize submodules
  vc.task.op.submoduleUpdate: Update submodules
  vc.task.op.submoduleAdd: Add a submodule
  vc.task.op.submoduleFetch: Fetch each submodule
  vc.task.op.submoduleRemoteUpdate: Update submodules to the remote latest
  vc.task.op.archive: Export archive
  vc.task.op.bundle: Create bundle
  vc.task.op.formatPatch: Export patches
  vc.task.op.fastExport: Export object stream
  vc.task.op.fastImport: Import object stream
  vc.task.op.filterRepo: Rewrite history (filter-repo)
  vc.task.op.svnFetch: Fetch from svn
  vc.task.op.gc: Collect objects
  vc.task.op.prune: Prune unreachable objects
  vc.task.op.fsck: Verify object database
  vc.task.op.maintenanceRun: Run repository maintenance
