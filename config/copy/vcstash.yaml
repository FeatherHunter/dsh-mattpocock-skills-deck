# 贮藏页（#1751 T16，规格 #1586 域 7 十条）的可见文字。
# 一个键要在 zh 与 en 两段里同时存在、占位符一致，生成器 scripts/generate-locale-config.mts 会当场报错。
# 文案口径：动作说清「对什么做什么」，危险动作只说后果不吓人；版本门先说为什么不能点，再说替代做法。
zh:
  vc.stash.title: 储藏
