en:
  vc.stash.title: Stashes
  vc.stash.lede: "Package changes you do not want to commit yet into a stash, then apply them back and keep working."
  vc.stash.boundary: "Stash entries stay local and are never pushed. Applying them back restores them in the recorded order."
  vc.stash.count: "{n} stash entries"
  vc.stash.message.label: Stash message
  vc.stash.message.placeholder: One line describing these changes (shown as the stash subject)
  vc.stash.op.push: Stash current changes
  vc.stash.op.pushUntracked: Stash with untracked files
  vc.stash.op.pushStaged: Stash staged files only
  vc.stash.op.list: Refresh list
  vc.stash.op.show: Inspect content
  vc.stash.op.apply: Apply
  vc.stash.op.pop: Pop
  vc.stash.op.branch: Branch from this entry
  vc.stash.op.drop: Drop entry
  vc.stash.op.clear: Clear all
  vc.stash.op.unknown: Unknown action
  vc.stash.row.more: More tidy-up actions
  vc.stash.row.moreGlyph: ⋯
  vc.stash.clear.hint: Clear all records; a confirmation card states the count and consequences first
  vc.stash.entry.unknownSubject: (this stash has no message)
  vc.stash.entry.files: "{n} files"
  vc.stash.entry.filesUnknown: file count appears after "Inspect content"
  vc.stash.entry.at: "{when}"
  vc.stash.entry.oid: commit {oid}
  vc.stash.entry.sep: " · "
  vc.stash.gate.hidden: This git cannot stash staged files only (needs {needed}).
  vc.stash.gate.alternative: Stash everything first, then restore the unstaged part.
  vc.stash.list.empty: No stash entries yet.
  vc.stash.list.err: The stash list could not be read; try "Refresh list" again.
  vc.stash.branch.placeholder: New branch name (must not already exist)
  vc.stash.branch.go: Create branch
  vc.stash.branch.cancel: Cancel
  vc.stash.branch.err.empty: Enter a new branch name first.
  vc.stash.branch.err.tooLong: Branch name is too long; keep it within 200 characters.
  vc.stash.branch.err.invalid: 'Invalid branch name: no spaces, .., @{, ~^:?*[\\, and do not start with - or /.'
  vc.stash.confirm.target: "{selector} ({subject})"
  vc.stash.confirm.go: Confirm {verb}
  vc.stash.confirm.title: "Confirm {verb}"
  vc.stash.confirm.dropTitle: "Drop entry {selector}?"
  vc.stash.confirm.cancel: Cancel
  vc.stash.detail.title: Stash content
  vc.stash.detail.files: touches {n} files
  vc.stash.detail.truncated: The diff is too large; this is a truncated view.
  vc.stash.detail.close: Collapse
  vc.stash.pathsNote: "The entry keeps the changes as they were when stashed. After applying them back, stage and commit again."
  vc.stash.pathsHint: Only the newest 10 entries load automatically; choose "Inspect content" to list the files this entry touches.
  vc.stash.detail.loading: Reading the file list of this entry…
  vc.stash.detail.error: This entry's file list could not be read.
  vc.stash.detail.retry: Retry reading this entry
  vc.stash.emptyHint: Click Stash in the Changes tab to package the current changes.
  vc.stash.more.title: More stash actions (create, clear, recently dropped)
  vc.stash.recent.title: Recently dropped
  vc.stash.recent.empty: No dropped stash entries yet.
  vc.stash.recent.note: Until git garbage-collects them, the {n} most recently dropped entries can be restored here.
  vc.stash.recent.droppedAt: dropped at {when}
  vc.stash.recent.restore: Restore to list
  vc.stash.result.ok: "Done: {op}"
  vc.stash.result.next: The list is refreshed to the latest state.
  vc.stash.result.dropped: Cleared {n} stash records.
  vc.stash.result.untrackedLeft: '{n} untracked files stayed in the working tree.'
  vc.stash.result.untrackedTaken: '{n} of them were untracked files.'
  vc.stash.result.stagedNote: Only the staged part was taken; unstaged changes stay in the working tree.
  vc.stash.result.tagOk: Done
  vc.stash.result.tagFail: Not done
  vc.stash.fail.usage: The request was missing required parameters; nothing ran.
  vc.stash.fail.selector: Invalid stash selector; nothing ran.
  vc.stash.fail.branch: Invalid branch name; no branch was created.
  vc.stash.fail.branchExists: That branch name already exists; pick another one.
  vc.stash.fail.versionHidden: This git version cannot run that action (needs {needed}).
  vc.stash.fail.env: git could not be found; the stash list is unavailable.
  vc.stash.fail.notRepo: The current directory is not a git repository.
  vc.stash.fail.read: The stash list could not be read.
  vc.stash.fail.stashMissing: That stash entry no longer exists (it may have been dropped).
  vc.stash.fail.confirm: Destructive actions need confirmation; nothing ran.
  vc.stash.fail.stale: The precheck ticket expired or the repository changed; run the precheck again.
  vc.stash.fail.exit: git failed; stash entries are unchanged.
  vc.stash.fail.timeout: git did not answer in time; stash entries may be unchanged.
  vc.stash.fail.spawn: git could not be started.
  vc.stash.fail.cancelled: The operation was cancelled.
  vc.stash.fail.other: The operation did not succeed.
