# config/copy/vcworktrees.yaml —— 界面词表 —— 工作树页那一族（#1752 T17）
#
# 这是工作树页文案的真源：清单与四态说法、十二个动作的名字、判定理由的说法、
# 能力账本里那五条被版本门管住的能力（9.4–9.8）的替代做法。
# 运行时读生成物 src/client/kernel/locale-data.ts（由 scripts/generate-locale-config.mts
# 按本文件生成、不入库）。
#
# 写法约定：
#   · 每种语言一段（今天 zh / en；加一门语言 = 在这里补一段同名键的词条）。
#   · 同一段里每个键都要有，缺一条生成器就报错；值一律是字符串。
#   · 值里的 {name} 是占位符，由界面渲染处替换；同一键的中英两份占位符必须一字不差。
#   · 判定只回理由标识符（见 src/shared/version-control/src/worktree-ops.ts 的 WORKTREE_REASONS），
#     界面按 vc.wt.why.<标识符> 取词。改理由的措辞改这里，不要改判定里的标识符。
#   · 想改界面上的字：改这里 → 跑 node scripts/generate-locale-config.mts → 重新构建。

