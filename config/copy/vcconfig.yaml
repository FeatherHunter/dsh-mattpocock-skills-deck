  vc.config.identity.never: not configured
  vc.config.identity.old: "Old value: this repository {local}; this machine {global}"
  vc.config.identity.placeholder: New value (saving an empty value is rejected)
  vc.config.identity.set: Save
  vc.config.identity.unset: Delete this key
