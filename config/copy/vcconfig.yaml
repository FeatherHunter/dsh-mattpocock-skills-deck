  vc.config.identity.scope.global: This machine
  vc.config.scope.local: this repository
  vc.config.scope.global: this machine
  vc.config.scope.system: system level (read-only)
  vc.config.scope.other: other source (read-only)
  vc.config.attr.label: Attribute rules
