en:
  vc.rebase.pageTitle: "Rebase todo"
  vc.rebase.hint: "Interactive rebase, changing the base, auto-squashing fixups and preserving merge structure: read the window, order the actions, then confirm."
  vc.rebase.section.now: "This rebase"
  vc.rebase.section.steps: "Six-step todo"
  vc.rebase.section.stepsNote: "These six steps describe the flow, not progress: each step's state comes only from the repository's real state, and the panel does not guess. You can stop and check at any time."
  vc.rebase.stepsNotRebase: "The repository is currently {state}, not rebasing; the six steps below only describe the rebase flow, and their state comes from the repository's real state."
  vc.rebase.chip.error: "Last action failed"
  vc.rebase.step.freeze: "Freeze the worktree"
  vc.rebase.step.freezeDetail: "Stash or commit uncommitted changes first; the worktree must be clean during a rebase, otherwise a conflict cannot be traced to one side."
  vc.rebase.step.freezeCmd: "git stash push --keep-index"
  vc.rebase.step.pickBase: "Pick the new base"
  vc.rebase.step.pickBaseDetail: "The new base is an existing commit. Look at its common ancestor with the current branch to see exactly which commits will move."
  vc.rebase.step.pickBaseCmd: "git rebase --onto <new-base> <old-base>"
  vc.rebase.step.todoList: "Arrange the todo list"
  vc.rebase.step.todoListDetail: "Commits may be kept as they are, squashed, reworded or reordered. The list lives only in this page's memory and is never written to the repository."
  vc.rebase.step.todoListCmd: "git rebase -i <new-base>"
  vc.rebase.step.apply: "Apply one at a time"
  vc.rebase.step.applyDetail: "Pause after each commit: continue on success, or jump to the conflict page on a conflict. You can abort and return to the commit from before the rebase at any time."
  vc.rebase.step.applyCmd: "git rebase --continue / --abort"
  vc.rebase.step.verify: "Verify the result"
  vc.rebase.step.verifyDetail: "Run the local checks again to confirm the tree matches expectations and no commit was lost. Only then move the branch pointer."
  vc.rebase.step.verifyCmd: "git range-diff <old-branch> <new-branch>"
  vc.rebase.step.finish: "Finish or roll back"
  vc.rebase.step.finishDetail: "Finishing moves only the current branch pointer; other branches stay put. Rolling back uses the commit recorded before the rebase, not the reflog."
  vc.rebase.step.finishCmd: "git reset --hard <commit-before-rebase>"
  vc.rebase.stepChip.done: "Done"
  vc.rebase.stepChip.running: "In progress"
  vc.rebase.stepChip.pending: "Pending"
  vc.rebase.section.actions: "Rebase actions"
  vc.rebase.section.actionsNote: "Three steps: pick an action, read its effect once, then confirm it in the confirmation card. The five read-only entries only read; they do not change history on this page."
