# config/copy/vcsubmodules.yaml —— 界面词表 —— 子模块页那一族（#1757 T21，域 10）
#
# 这是子模块页文案的真源：八条能力的入口名、固定四项批量菜单、逐行清单、确认卡与结果回执，
# 以及判定理由（见 src/shared/version-control/src/submodule-ops.ts 的 SUBMODULE_REASONS）的说法。
# 运行时读生成物 src/client/kernel/locale-data.ts（由 scripts/generate-locale-config.mts
# 按本文件生成、不入库）。
#
# 写法约定：
#   · 每种语言一段（今天 zh / en；加一门语言 = 在这里补一段同名键的词条）。
#   · 同一段里每个键都要有，缺一条生成器就报错；值一律是字符串。
#   · 值里的 {name} 是占位符，由界面渲染处替换；同一键的中英两份占位符必须一字不差。
#   · 判定只回理由标识符（见 submodule-ops.ts 的 SUBMODULE_REASONS），界面按 vc.sub.why.<标识符>
#     取词；改措辞改这里，不要改判定里的标识符。
#   · 想改界面上的字：改这里 → 跑 node scripts/generate-locale-config.mts → 重新构建。

