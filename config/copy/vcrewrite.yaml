# config/copy/vcrewrite.yaml —— 界面词表 —— 维护页整仓重写那一族（#1750 T15）
#
# 这是维护页整仓重写（能力 5.11）文案的真源：五张 filter-repo 表单、影响预览、四段确认卡、
# 备份与还原步骤、长任务进度与四类结论、以及预检/执行两族失败理由。
# 运行时读生成物 src/client/kernel/locale-data.ts（由 scripts/generate-locale-config.mts
# 按本文件生成、不入库）。
#
# 写法约定：
#   · 每种语言一段（今天 zh / en；加一门语言 = 在这里补一段同名键的词条）。
#   · 同一段里每个键都要有，缺一条生成器就报错；值一律是字符串（本文件统一加双引号）。
#   · 值里的 {name} 是占位符，由界面渲染处替换；同一键的中英两份占位符必须一字不差。
#   · 想改界面上的字：改这里 → 跑 node scripts/generate-locale-config.mts → 重新构建。

