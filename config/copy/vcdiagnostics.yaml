# 诊断页（#1761 T25，规格 #1586 域 13 十四条 + 5.12 替换对象）的可见文字。
# 一个键要在 zh 与 en 两段里同时存在、占位符一致，生成器 scripts/generate-locale-config.mts 会当场报错。
# 文案口径：只读查询说清「查什么」，受控写说清「改的是哪一份记录」；13.3 / 13.14 的主入口不在本页，指针写清去哪里。
zh:
  vc.diag.title: 诊断
  vc.diag.section.facts.title: 版本与计数
  vc.diag.section.facts.note: 这些数字全部来自本仓库此刻的 git 读数。读不到时界面写「读不到」，不写 0。
  vc.diag.section.shapes.title: 只读对象查看
  vc.diag.section.shapes.count: 6 条能力
  vc.diag.section.shapes.note: 底层排查只展示读到的形状，不提供可操作按钮。需要执行时交给终端或诊断工具。
  vc.diag.section.checks.title: 检查与定位
  vc.diag.section.checks.count: 4 条能力
  vc.diag.section.checks.note: 完整性检查、可回收对象、二分查找与引用日志：都能在面板里发起并看到结果，但都不写提交。
  vc.diag.section.replace.title: 替换对象：受控写
  vc.diag.section.replace.count: 1 条能力
  vc.diag.section.replace.note: 替换只改「引用指向哪个对象」，不动提交内容；先预演再确认，撤销列表就在这一块里。
  vc.diag.section.patch.title: 应用补丁：先预演
  vc.diag.section.patch.count: 1 条能力
  vc.diag.section.patch.note: 预演只回答「这段补丁能不能干净应用」，不改工作区；确认应用仍走受控写通道。
  vc.diag.section.trailer.title: 尾部签名
  vc.diag.section.trailer.count: 1 条能力
  vc.diag.section.trailer.note: 尾部签名只读：看到提交尾部的签名行，不在面板里改签名。
  vc.diag.section.more.title: 更多只读查询
  vc.diag.section.more.count: 2 条能力
  vc.diag.section.more.note: 按条件列文件与补丁等价是原型没画的两条只读查询，放在这里，结果同样贴在这一行下面。
  vc.diag.section.pointer.title: 换页去找
  vc.diag.section.pointer.note: 按内容搜工作区去搜索页，图形历史浏览器去提交历史页：这两处更适合用完整界面。
  vc.diag.facts.gitVersion: git 版本
  vc.diag.facts.describe: describe
  vc.diag.facts.head: HEAD
  vc.diag.facts.refs: 引用总数
  vc.diag.facts.worktrees: 工作区
  vc.diag.facts.statusLines: 工作区状态行
  vc.diag.facts.repoRoot: 仓库根
  vc.diag.facts.unreadable: 读不到
  vc.diag.facts.headValue: '{oid}（{branch}）'
  vc.diag.facts.refsValue: '{total} · 本地分支 {local} 条'
  vc.diag.facts.worktreesValue: '{n} 棵'
  vc.diag.facts.statusValue: '{n} 行'
  vc.diag.checks.fsck.sub: 完整性检查会读全库对象，真实实现里显示进度与「发现几个问题」，不写仓库。
  vc.diag.checks.bisect.sub: 二分查找要选一段提交范围与一个好/坏判定。它会检出中间提交，结束后要回到原分支。
  vc.diag.checks.log.sub: 引用日志按时间倒序列出 HEAD 与分支的移动记录。它是误操作后的第一道找回入口。
  vc.diag.bisect.range: 开始二分要同时给最近的坏提交与好提交；之后的标坏、标好、跳过只改二分记录。
  vc.diag.bisect.start: 开始二分
  vc.diag.bisect.bad: 标为坏
  vc.diag.bisect.good: 标为好
  vc.diag.bisect.skip: 跳过这个
  vc.diag.bisect.reset: 结束二分
  vc.diag.bisect.refresh: 看范围与日志
  vc.diag.bisect.inactive: 现在不在二分里。
  vc.diag.read.query: 查询
  vc.diag.read.empty: 还没有读数；先填好条件再点「查询」。
  vc.diag.field.paths: 路径过滤（可留空）
  vc.diag.field.object: 对象（提交、分支或文件）
  vc.diag.field.mode: 查看方式
  vc.diag.field.modePretty: 看内容
  vc.diag.field.modeType: 只看类型
  vc.diag.field.rev: 版本（留空默认 HEAD）
  vc.diag.field.prefix: 引用命名空间（如 refs/heads/）
  vc.diag.field.ancestor: 祖先提交
  vc.diag.field.descendant: 后代提交
  vc.diag.field.upstream: 上游分支或提交
  vc.diag.field.head: 要比较的提交
  vc.diag.field.modeCount: 只数个数
  vc.diag.field.modeLeftRight: 左右各多少
  vc.diag.field.left: 左边（第一个版本）
  vc.diag.field.right: 右边（第二个版本）
  vc.diag.field.bad: 最近的坏提交
  vc.diag.field.good: 最近的好提交
  vc.diag.field.from: 被替换对象
  vc.diag.field.to: 被指向对象
  vc.diag.patch.note: 只做预演：git 会检查这个补丁能不能打上，不会改动工作区。
  vc.diag.patch.placeholder: 贴一段 diff（git diff 的输出）
  vc.diag.patch.preview: 预演补丁
  vc.diag.trailer.note: 这里只读展示提交说明末尾的签名行；要写入 Signed-off-by，请到提交页勾选「追加签名行」。
  vc.diag.replace.note: 建立替换后，所有命令看到被替换对象时读到的其实是被指向对象；撤销就删掉这一条记录。
  vc.diag.replace.create: 建立替换
  vc.diag.replace.refresh: 刷新清单
  vc.diag.replace.undo: 撤销替换
  vc.diag.pointer.search: 全文搜索的主入口在「全库搜索」，从那里按内容搜工作区。
  vc.diag.pointer.commits: 图形化历史在「提交历史」页；这里不打开 gitk，也不弹外部窗口。
  vc.diag.confirm.cancel: 取消
  vc.diag.confirm.go: 确认
  vc.diag.result.ok: 这一步做完了
  vc.diag.result.fail: 这一步没成
  vc.diag.result.running: 正在和 git 打交道…
  vc.diag.fail.args: 参数不合规，请检查填的内容
  vc.diag.fail.blocked: 当前状态不允许这个动作
  vc.diag.fail.timeout: git 没有在限定时间内回音
  vc.diag.fail.truncated: 输出太大，这里显示的是截断后的内容
  vc.diag.fail.exit: git 报了错，原文见下面
  vc.diag.fail.git: git 报了错，原文见下面
  vc.diag.fail.env: 宿主环境没准备好，稍后重试
  vc.diag.fail.parse: git 的输出看不懂，可能是版本不一致
  vc.diag.fail.unknown: 没见过这一类失败，原文见下面
  vc.diag.reason.notACommit: 填的版本名不是一个提交
  vc.diag.reason.alreadyBisecting: 已经在一趟二分里，先结束或重置
  vc.diag.reason.notBisecting: 现在不在二分里，先开始二分
  vc.diag.reason.sameObject: 两个版本是同一个对象，换了没意义
  vc.diag.reason.alreadyReplaced: 这个对象已经有替换记录
  vc.diag.reason.noReplace: 这个对象没有替换记录，撤销不了
  vc.diag.reason.badTarget: 目标不合法，请检查填的内容
  vc.diag.reason.needConfirm: 这个动作会改仓库状态，先点确认卡上的确认
en:
  vc.diag.title: Diagnostics
  vc.diag.section.facts.title: 'Version and counts'
  vc.diag.section.facts.note: 'Every number here comes from a git reading of this repository at this moment. When a value cannot be read, the interface says "not readable" instead of showing 0.'
  vc.diag.section.shapes.title: 'Read-only object inspection'
  vc.diag.section.shapes.count: '6 capabilities'
  vc.diag.section.shapes.note: 'Troubleshooting only shows the shapes that were read and offers no action buttons. To run something, use a terminal or the diagnostics tools.'
  vc.diag.section.checks.title: 'Checks and pinpointing'
  vc.diag.section.checks.count: '4 capabilities'
  vc.diag.section.checks.note: 'Integrity checks, recoverable objects, bisection, and the reflog: all of them can be started here with their results shown, but none of them writes a commit.'
  vc.diag.section.replace.title: 'Replace objects: controlled write'
  vc.diag.section.replace.count: '1 capability'
  vc.diag.section.replace.note: 'Replacement only changes which object a reference points to; commit content stays untouched. Preview first, then confirm; the undo list sits in this section.'
  vc.diag.section.patch.title: 'Apply a patch: preview first'
  vc.diag.section.patch.count: '1 capability'
  vc.diag.section.patch.note: 'The preview only answers whether the patch applies cleanly and leaves the working tree untouched. Applying it still goes through the controlled-write channel.'
  vc.diag.section.trailer.title: 'Trailer signature'
  vc.diag.section.trailer.count: '1 capability'
  vc.diag.section.trailer.note: 'Trailer signatures are read-only here: you see the signature lines at the end of a commit, and signing is not edited in the panel.'
  vc.diag.section.more.title: 'More read-only queries'
  vc.diag.section.more.count: '2 capabilities'
  vc.diag.section.more.note: 'Listing files by condition and patch equivalence are two read-only queries the prototype did not draw; their results also appear right under the row.'
  vc.diag.section.pointer.title: 'Go to another page'
  vc.diag.section.pointer.note: 'Search the working tree by content on the search page, and open the graphical history browser on the commit history page; both are more comfortable with their full interface.'
  vc.diag.facts.gitVersion: 'git version'
  vc.diag.facts.describe: 'describe'
  vc.diag.facts.head: 'HEAD'
  vc.diag.facts.refs: 'Total references'
  vc.diag.facts.worktrees: 'Worktrees'
  vc.diag.facts.statusLines: 'Working tree status lines'
  vc.diag.facts.repoRoot: 'Repository root'
  vc.diag.facts.unreadable: 'Not readable'
  vc.diag.facts.headValue: '{oid} ({branch})'
  vc.diag.facts.refsValue: '{total} · {local} local branches'
  vc.diag.facts.worktreesValue: '{n} worktrees'
  vc.diag.facts.statusValue: '{n} status lines'
  vc.diag.checks.fsck.sub: 'The integrity check reads every object in the repository; the real implementation shows progress and "how many problems were found" and writes nothing to the repository.'
  vc.diag.checks.bisect.sub: 'A bisect needs a commit range and a good/bad verdict. It checks out middle commits, and you have to return to the original branch afterwards.'
  vc.diag.checks.log.sub: 'The reflog lists HEAD and branch moves newest first. It is the first place to look after a mistaken operation.'
  vc.diag.bisect.range: Starting a bisect needs both the latest bad commit and a good commit; marking bad, good or skipping only changes the bisect record.
  vc.diag.bisect.start: Start bisect
  vc.diag.bisect.bad: Mark bad
  vc.diag.bisect.good: Mark good
  vc.diag.bisect.skip: Skip this one
  vc.diag.bisect.reset: End bisect
  vc.diag.bisect.refresh: Show range and log
  vc.diag.bisect.inactive: Not in a bisect right now.
  vc.diag.read.query: Query
  vc.diag.read.empty: No reading yet; fill in the conditions and press "Query".
  vc.diag.field.paths: Path filter (may be empty)
  vc.diag.field.object: Object (commit, branch or file)
  vc.diag.field.mode: View mode
  vc.diag.field.modePretty: Show content
  vc.diag.field.modeType: Type only
  vc.diag.field.rev: Revision (empty means HEAD)
  vc.diag.field.prefix: Ref namespace (e.g. refs/heads/)
  vc.diag.field.ancestor: Ancestor commit
  vc.diag.field.descendant: Descendant commit
  vc.diag.field.upstream: Upstream branch or commit
  vc.diag.field.head: Commit to compare
  vc.diag.field.modeCount: Count only
  vc.diag.field.modeLeftRight: Count each side
  vc.diag.field.left: Left side (first revision)
  vc.diag.field.right: Right side (second revision)
  vc.diag.field.bad: Latest bad commit
  vc.diag.field.good: Latest good commit
  vc.diag.field.from: Replaced object
  vc.diag.field.to: Replacement object
  vc.diag.patch.note: 'Preview only: git checks whether the patch applies, without touching the working tree.'
  vc.diag.patch.placeholder: Paste a diff (output of git diff)
  vc.diag.patch.preview: Preview patch
  vc.diag.trailer.note: This shows the trailer lines at the end of the commit message; to write a Signed-off-by, use "Append sign-off line" on the commit page.
  vc.diag.replace.note: Once a replacement exists, every command reading the replaced object sees the replacement object instead; undoing it removes the record.
  vc.diag.replace.create: Create replacement
  vc.diag.replace.refresh: Refresh list
  vc.diag.replace.undo: Undo replacement
  vc.diag.pointer.search: Full-text search lives on the global search page; search the working tree by content there.
  vc.diag.pointer.commits: The graphical history is on the commit history page; gitk is never opened here.
