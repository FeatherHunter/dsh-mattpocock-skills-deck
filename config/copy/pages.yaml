  setup.layoutSingle: 根目录一份 GLOSSARY.md
  setup.layoutMulti: 子项目各一份 GLOSSARY.md，根目录 GLOSSARY-MAP.md
  setup.layout.single: "本仓库的域文档布局已在初始化时与用户确认为 single-context（一个仓库共用一份根目录的 GLOSSARY.md，架构决定放 docs/adr/）：请把 single-context 这一句结论写进 docs/agents/domain.md，并让 AGENTS.md 的 ## Agent skills 块里 Domain docs 那一行也用这同一个词（技能要求的写法是「一行布局摘要 ＋ See docs/agents/domain.md」）；本次初始化不创建 GLOSSARY-MAP.md 与各子项目的 GLOSSARY.md，留到第一次真正写下词条时再建。如果这个仓库里已经有旧名的 CONTEXT.md 或 CONTEXT-MAP.md（新版技能只认 GLOSSARY.md 与 GLOSSARY-MAP.md），请把它们改名为 GLOSSARY.md 与 GLOSSARY-MAP.md，并把 docs/agents/domain.md 里写着旧名的地方一起改过来"
  setup.layout.multi: "本仓库的域文档布局已在初始化时与用户确认为 multi-context（子项目各一份 GLOSSARY.md，根目录一份 GLOSSARY-MAP.md）：请把 multi-context 这一句结论写进 docs/agents/domain.md，并让 AGENTS.md 的 ## Agent skills 块里 Domain docs 那一行也用这同一个词（技能要求的写法是「一行布局摘要 ＋ See docs/agents/domain.md」）；本次初始化不创建 GLOSSARY-MAP.md 与各子项目的 GLOSSARY.md，留到第一次真正写下词条时再建，届时由仓库根目录的 GLOSSARY-MAP.md 指向它们。如果这个仓库里已经有旧名的 CONTEXT.md 或 CONTEXT-MAP.md（新版技能只认 GLOSSARY.md 与 GLOSSARY-MAP.md），请把它们改名为 GLOSSARY.md 与 GLOSSARY-MAP.md，并把 docs/agents/domain.md 里写着旧名的地方一起改过来"
  setup.layoutSwitchNote: 这个工作区已经初始化过。这里改的是记在仓库里的域文档布局结论；点确认之后，除「把记录后端的那几处对齐到新后端」之外，还会请 AI 把 docs/agents/domain.md 与 AGENTS.md 里记布局的那两行也改成新结论（不会重跑初始化、也不会重建已有产物）。
