en:
  list.pageLoaded: "{x} loaded / {n} total"
  list.pageAllOnWeb: This backend cannot page here — see everything on its web page
  list.pageStale: The page position expired; restarted from the most recent page
  list.pageFail: Could not load more history; try again shortly
  list.pageTrimmed: Older pages were dropped from memory; scrolling back up reloads them
  setup.layoutQuestion: Do the parts of this repo share one glossary, or does each keep its own?
  setup.layoutSingle: One GLOSSARY.md at the repo root
  setup.layoutMulti: One GLOSSARY.md per subproject, plus a root GLOSSARY-MAP.md
  setup.layout.single: "The domain-doc layout for this repo was confirmed with the user at setup time as single-context (one GLOSSARY.md at the repo root, with architecture decisions in docs/adr/): write that single-context conclusion into docs/agents/domain.md, and make the Domain docs line in the ## Agent skills block of AGENTS.md use that same word too (the skill’s required form is “a one-line layout summary + See docs/agents/domain.md”); this setup run creates neither GLOSSARY-MAP.md nor per-subproject GLOSSARY.md files — they wait until the first real glossary entry is written. If this repo still has the old CONTEXT.md or CONTEXT-MAP.md (the current skills only look for GLOSSARY.md and GLOSSARY-MAP.md), rename them to GLOSSARY.md and GLOSSARY-MAP.md and update the old names in docs/agents/domain.md too"
  setup.layout.multi: "The domain-doc layout for this repo was confirmed with the user at setup time as multi-context (one GLOSSARY.md per subproject, plus a GLOSSARY-MAP.md at the repo root): write that multi-context conclusion into docs/agents/domain.md, and make the Domain docs line in the ## Agent skills block of AGENTS.md use that same word too (the skill’s required form is “a one-line layout summary + See docs/agents/domain.md”); this setup run creates neither GLOSSARY-MAP.md nor the per-subproject GLOSSARY.md files — they wait until the first real glossary entry is written, and the GLOSSARY-MAP.md at the repo root will then point at them. If this repo still has the old CONTEXT.md or CONTEXT-MAP.md (the current skills only look for GLOSSARY.md and GLOSSARY-MAP.md), rename them to GLOSSARY.md and GLOSSARY-MAP.md and update the old names in docs/agents/domain.md too"
  setup.layoutSwitchNote: This workspace is already set up. What you change here is the domain-doc layout conclusion recorded in the repo; after you confirm, the plugin will additionally ask the AI to rewrite the two lines that record the layout in docs/agents/domain.md and AGENTS.md (it will not re-run setup and will not rebuild existing artifacts).
