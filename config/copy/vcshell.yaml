  vc.shell.page.note.worktrees: '工作区页列出仓库挂出来的工作区，可新建、删除、锁定与移动，也能清掉失效登记；写动作集中在每行的操作里，动手前先看那个工作区有没有未提交的改动。'
  vc.shell.page.note.stash: '储藏页把当前改动先收起来，列表里能看内容、应用或删除某一条；储藏不影响已提交的历史，应用时遇到冲突仍回到冲突向导处理。'
  vc.shell.page.note.branch-tags: '分支列表来自 git 的真实引用，标签来自本地 refs。切换在行尾直给；删除分支、重命名、切到这个提交、设置或取消上游、写分支说明收在每行尾部的「⋯」菜单里；新建并切换分支与建标签在页尾。不管点哪一个，都先预检、再确认，最后才执行。'
  vc.shell.page.note.remote: '远端与同步页列出远端仓库与远端分支，能新增改名、改地址，并做获取、拉取、推送这些同步动作；强推与删远端引用风险高，页面上单独标出来，只在你确认后才执行。'
  vc.shell.page.note.submodules: '子模块页列出仓库里登记的子模组和它们当前的提交，能新增、初始化、改地址同步与取消登记；每个子模组是独立仓库，它的写动作要进到那个目录里执行。'
  vc.shell.page.note.maintenance: '维护页放的是整理仓库与改写历史的重活：垃圾回收、重新打包、提交图、索引整理，以及整仓重写这类不可逆动作；危险动作单独成段，执行前要先看影响范围并确认。'
  vc.shell.page.note.migrate: '这一页的动作都会产生一份新副本或整仓替换，所以每一行都写着「产出什么、放在哪、原仓库会不会被动」。任务时间长的走任务进度页，不在面板里假装瞬间完成。'
  vc.shell.page.note.config: '配置页读写当前仓库的 git 配置、提交身份、属性规则与邮件映射；改动直接写进仓库的配置文件，保存后可以在这页读到新值。'
  vc.shell.page.note.hooks: '钩子页列出当前仓库装好的客户端钩子，也能手动跑其中一个看它输出什么；钩子本身是可执行脚本，启用与编辑仍在仓库的钩子目录里做。'
  vc.shell.page.note.diagnostics: '这一页把「看得到但改不了」的能力集中展示：每一条都写明它读到什么、哪些版本才支持、读不到时界面怎么写。诊断结果只贴在对应行下面，不跳页。'
  vc.shell.page.note.platform: '这一页逐条列出必须交出去的能力，以及为什么交出去：面板不持有网页端令牌、不替代服务端权限、不内嵌编辑器与图形工具。每一条都给出「去哪里做」。'
  vc.shell.page.note.rebase: '变基待办页处理历史改写：撤销提交、重置、还原、拣选、交互式变基与换基座；这些动作都会改写提交，做之前先看影响范围，硬重置与批量重写要额外确认。'
  vc.shell.page.note.conflicts: '冲突向导页在合并、变基或拣选之后接管冲突文件：列出冲突清单，整文件选一边或手工改，标记已解决再继续；中止与跳过也在这里，走完之前工作区一直停在中间状态。'
  vc.shell.page.note.search: '全库搜索页按能力编号、名称或命令原文搜 162 条能力，选中只跳到对应入口，不在这里执行动作。'
  vc.shell.page.note.task: '任务页是流程页：长任务的排队、进度与取消都在这里看，它不占 16 页能力账本里的条目，也不含写 git 的操作。'
