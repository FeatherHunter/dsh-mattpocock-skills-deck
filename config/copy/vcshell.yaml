  vc.shell.page.manage: 'Manage'
  vc.shell.page.note.manage: 'The index never writes to the repository; it only lays out the nine sections: branches and tags, remotes, submodules, maintenance, migration, config, hooks, diagnostics, and platform limits. Every section entry says what it covers.'
  vc.shell.page.back: 'Back'
  vc.shell.page.backTitle: 'Back to the previous page (Esc also works)'
  vc.shell.page.caps: '{n} capabilities'
  vc.shell.page.danger: 'Includes irreversible actions'
  vc.shell.page.dangerZone: 'Danger zone'
  vc.shell.page.note.changes: 'The changes page shows which files changed and which are already staged, and you stage, discard, or delete files here; commits are also made on this page, and every write action asks you to pick a target and confirm first.'
  vc.shell.page.note.commits: 'The history page reads the commit list and details, shows per-file diffs, and searches by commit message or by code change; this page is mostly read-only, and rewriting history belongs to the rebase and conflict pages.'
  vc.shell.page.note.worktrees: 'The worktrees page lists the worktrees attached to the repository, and you create, remove, lock, or move them here; write actions sit on each row, so check for uncommitted work before you remove one.'
  vc.shell.page.note.stash: 'The stash page sets the current changes aside, then lists, inspects, applies, or drops individual entries; stashing never rewrites committed history, and a conflict still goes back to the conflict wizard.'
  vc.shell.page.note.branch-tags: 'The branch list comes from real git refs and the tags come from local refs. Switching sits at the end of the row; delete, rename, check out this commit, set or unset upstream, and write a description live in the row''s "⋯" menu; create-and-switch and create-tag sit at the bottom of the page. Every action pre-checks, confirms, then runs.'
  vc.shell.page.note.remote: 'The remotes and sync page lists remotes and their branches, and you add, rename, or re-point a remote and run fetch, pull, and push here; force push and remote deletion are marked as risky and only run after you confirm.'
  vc.shell.page.note.submodules: 'The submodules page lists registered submodules with their current commit, and you add, initialize, re-point, or unregister them here; each submodule is its own repository, so its write actions run inside that directory.'
  vc.shell.page.note.maintenance: 'The maintenance page holds the heavy housekeeping and history rewrites: garbage collection, repacking, commit graph, index cleanup, and whole-repository rewrites; irreversible actions sit in their own section and ask you to review the impact first.'
  vc.shell.page.note.migrate: 'Every action on this page produces a new copy or a whole-repository replacement, so each row states what it produces, where it goes, and whether the current repository is touched. Long-running work goes to the task progress page; the panel never pretends it finishes instantly.'
  vc.shell.page.note.config: 'The config page reads and writes the repository git config, commit identity, attribute rules, and mailmap; saving a change writes straight into the repository config file, and the page reads the new value back.'
  vc.shell.page.note.hooks: 'The hooks page lists the client hooks installed in this repository and can run one by hand to see its output; hooks are executable scripts, so enabling and editing them still happens in the hooks directory.'
  vc.shell.page.note.diagnostics: 'This page gathers the capabilities you can inspect but cannot change: each row states what it reads, which versions support it, and what the interface says when the reading fails. Diagnostics results appear under their own row and never jump to another page.'
  vc.shell.page.note.platform: 'This page lists, one by one, the capabilities that must be handed off and why: the panel holds no web token, does not replace server-side permissions, and does not embed an editor or graphical tools. Every row says where to do it.'
  vc.shell.page.note.rebase: 'The rebase todo page handles history rewriting: undo a commit, reset, revert, cherry-pick, interactive rebase, and change the base; all of these rewrite commits, so review the impact first and confirm hard resets and batch rewrites explicitly.'
  vc.shell.page.note.conflicts: 'The conflict wizard takes over conflicted files after a merge, rebase, or cherry-pick: it lists the conflicts, lets you pick one side for a whole file or edit by hand, then marks them resolved and continues; abort and skip also live here, and the working tree stays mid-operation until the wizard finishes.'
  vc.shell.page.note.search: 'The search page looks up the 162 capabilities by id, name, or exact command, and picking a result only jumps to its entry; it never runs an action.'
  vc.shell.page.note.task: 'The task page is a process page: long-running tasks queue, report progress, and can be cancelled here; it has no entry in the 16-page capability ledger and contains no git write actions.'
