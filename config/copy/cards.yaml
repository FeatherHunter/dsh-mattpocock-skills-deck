# config/copy/cards.yaml —— 界面词表 —— 卡片族（飘卡、悬浮卡、票卡）
#
# 这是界面文案的真源：#1294（T3）把原来 src/client/kernel/locale-cards.ts 里的词条搬到这里，
# 运行时不再读 .ts 词表文件，而是读生成物 src/client/kernel/locale-data.ts（由
# scripts/generate-locale-config.mts 按本文件生成、不入库）。
#
# 写法约定：
#   · 每种语言一段（今天 zh / en；加一门语言 = 在这里补一段同名键的词条）。
#   · 同一段里每个键都要有，缺一条生成器就报错；值一律是字符串。
#   · 值里的 {name} 是占位符，由界面渲染处替换；同一键的中英两份占位符必须一字不差。
#   · 想改界面上的字：改这里 → 跑 node scripts/generate-locale-config.mts → 重新构建。

