<!DOCTYPE html>
<!-- PROTOTYPE·抛弃式·票887·像素风视觉稿·不进生产：双击即跑，无依赖，状态只在内存 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE 887·技能详情页像素风视觉稿</title>
<style>
*{box-sizing:border-box;border-radius:0!important}
:root{--frame:#3a2c14;--paper:#f2e4c0;--card:#fffdf4;--ink:#2b2113;--ink2:#6b5b3e;--shadow:#241a0c;--gold:#e3a92f;--acc:#8b5cf6;--ok:#0e8a16;--bad:#a3231a;--warn:#f59e0b;--stripe:#ddcda1}
body{margin:0;color:var(--ink);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;padding:0 0 120px;background-color:#8a6f4d;background-image:repeating-conic-gradient(#93764f 0% 25%,#8a6f4d 0% 50%);background-size:8px 8px}
header.bar{background:var(--frame);color:var(--paper);padding:8px 16px;border-bottom:4px solid var(--shadow)}
header.bar b{font-size:15px;letter-spacing:2px}header.bar span{font-size:12px;color:#ffd97a;margin-left:10px}
.wrap{max-width:1000px;margin:0 auto;padding:14px 16px}
.panel{background:var(--paper);border:4px solid var(--frame);box-shadow:6px 6px 0 var(--shadow);padding:12px 14px;margin:14px 0}
.panel>h2{margin:0 0 8px;font-size:15px;letter-spacing:2px}
.skillrow{display:flex;gap:8px;align-items:center;background:var(--card);border:3px solid var(--frame);box-shadow:3px 3px 0 var(--shadow);padding:6px 10px;margin:8px 0}
.skillrow.rec{background:#efe8fb}
.dot{flex:none;width:10px;height:10px;border:2px solid var(--frame)}
.sname{font:700 13px ui-monospace,Menlo,Consolas,monospace;min-width:120px}
.sname .star{color:var(--acc)}
.suse{flex:1;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn{font:700 12px ui-monospace,Menlo,Consolas,monospace;border:3px solid var(--frame);background:var(--paper);color:var(--ink);padding:4px 12px;cursor:pointer;box-shadow:2px 2px 0 var(--shadow);transition:transform .12s steps(2,end),box-shadow .12s steps(2,end)}
.pbtn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--shadow);outline:2px solid var(--gold);outline-offset:1px}
.pbtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}
.pbtn:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
.pbtn:disabled{opacity:.6;cursor:wait}
.spin{display:none;width:10px;height:10px;background:var(--acc);margin-right:6px;vertical-align:-1px;animation:blk .6s steps(2,end) infinite}
.pbtn.loading .spin{display:inline-block}
@keyframes blk{50%{opacity:.15}}
#draft{width:min(420px,90%);font:13px system-ui;background:var(--card);color:var(--ink);border:3px solid var(--frame);box-shadow:2px 2px 0 var(--shadow);padding:5px 8px}
#ringBox{position:relative;width:250px;height:210px;margin:10px auto}
.cen{position:absolute;left:95px;top:75px;width:60px;height:60px;background:var(--acc);color:#fff;border:3px solid var(--frame);box-shadow:3px 3px 0 var(--shadow);display:flex;align-items:center;justify-content:center;font:700 11px ui-monospace,monospace}
.ringnode{position:absolute;width:44px;height:26px;border:3px solid var(--frame);background:var(--card);color:var(--ink2);font:700 10px ui-monospace,monospace;cursor:pointer;padding:0}
.ringnode:hover{opacity:.55}
.ringnode:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
.overlay{position:fixed;inset:0;background:rgba(28,16,4,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:14px}
.modal{background:var(--paper);border:4px solid var(--frame);box-shadow:8px 8px 0 var(--shadow);width:min(660px,94vw);max-height:86vh;display:flex;flex-direction:column;position:relative}
.seal{position:absolute;left:50%;top:-13px;margin-left:-11px;width:22px;height:22px;background:#c9503f;border:3px solid var(--frame)}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:3px solid var(--frame);font:700 13px ui-monospace,monospace}
.top .sub{font:12px system-ui;color:var(--ink2);font-weight:400}
.body{padding:10px 14px;overflow:auto;flex:1;min-height:120px}
.bot{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:3px solid var(--frame)}
.st{font-size:12.5px;background:var(--card);border:3px solid var(--frame);border-top:8px solid #9a8f78;box-shadow:2px 2px 0 var(--shadow);padding:5px 8px;margin:0 0 8px}
.ic{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border:2px solid var(--frame);font-weight:800;font-size:12px;margin-right:6px;vertical-align:-3px}
.ic-ok{background:#d9f2dc;color:var(--ok)}.ic-err{background:#fbe3e1;color:var(--bad)}.ic-warn{background:#fdf0d3;color:#9a6a00}
.ic-idle{background:var(--stripe);color:var(--ink2)}
.skel{height:14px;background:var(--stripe);border:2px solid var(--frame);margin:8px 0;animation:blk 1s steps(2,end) infinite}
.banner{background:#fbe3e1;border:3px solid var(--frame);border-left:10px solid var(--bad);box-shadow:3px 3px 0 var(--shadow);padding:8px 10px;font-size:13px;margin:10px 0;display:flex;gap:8px;align-items:center}
.banner.warn{background:#fdf0d3;border-left-color:var(--warn)}
.banner .grow{flex:1}
.toc{background:var(--card);border:3px solid var(--frame);box-shadow:3px 3px 0 var(--shadow);padding:6px 10px;font-size:12.5px;margin:8px 0}
.toc b{letter-spacing:1px}
.toc a{display:block;color:#5b3df0;cursor:pointer}
.doc{line-height:1.85;font-size:13.5px}
.doc h1{font-size:18px;letter-spacing:1px}
.doc h2{font-size:15px;border-bottom:3px solid var(--frame);padding-bottom:3px}
.doc pre{background:#241a0c;color:#f2e4c0;padding:10px;font:12px/1.6 ui-monospace,monospace;overflow:auto;border:3px solid var(--frame)}
.doc blockquote{border-left:8px solid var(--acc);background:#efe8fb;margin:8px 0;padding:4px 10px}
.kv{border:3px solid var(--frame);background:var(--card)}
.kv div{display:flex;gap:8px;padding:5px 10px;font-size:13px;border-bottom:2px solid var(--stripe)}
.kv div:last-child{border-bottom:none}
.kv b{min-width:80px;color:#5b3df0}
.doc ul,.doc ol{margin:6px 0;padding-left:22px}
.doc li{margin:3px 0}
.doc li ul,.doc li ol{margin:2px 0}
.doc h3{font-size:14px}
.doc a{color:#5b3df0}
.doc pre{white-space:pre-wrap}
.totop{float:right;position:sticky;bottom:10px}
.drawerwrap{position:fixed;top:0;right:0;bottom:0;width:min(450px,94vw);background:var(--paper);border-left:4px solid var(--frame);box-shadow:-8px 0 0 rgba(0,0,0,.25);z-index:200;display:flex;flex-direction:column}
.drill{background:var(--paper);border:4px solid var(--frame);box-shadow:6px 6px 0 var(--shadow);margin-top:10px}
#switcher{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:999;background:#000;color:#fff;border:3px solid #fff;box-shadow:5px 5px 0 rgba(0,0,0,.5);padding:6px 8px;display:flex;align-items:center;gap:10px;font:700 13px ui-monospace,monospace}
#switcher button{background:#fff;color:#000;border:none;width:30px;height:30px;font-size:15px;font-weight:800;cursor:pointer}
#switcher .lab b{color:#ffd97a}
.bubble{position:fixed;z-index:999;background:var(--card);color:var(--ink);border:3px solid var(--frame);box-shadow:3px 3px 0 var(--shadow);padding:4px 10px;font-size:12.5px;font-weight:700}
.f-ok{animation:fok .5s steps(3,end)}
.f-err{animation:ferr .5s steps(3,end)}
@keyframes fok{0%{background:#d9f2dc}100%{background:var(--paper)}}
@keyframes ferr{0%{background:#fbe3e1}100%{background:var(--paper)}}
.shake{animation:shk .4s steps(4,end)}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar"><b>技能详情页·像素风视觉稿 PROTOTYPE 887</b><span>抛弃式草稿·不进生产</span></header>
<div class="wrap">
<div class="panel"><h2>■ 技能</h2>
<div style="margin-bottom:4px"><input id="draft" placeholder="先打几个字，再点详情：弹窗盖住后字还在"></div>
<div id="listBox"></div>
<div id="ringBox"></div>
</div>
<div class="panel"><h2>■ 详情</h2><div id="bannerSeat"></div><div id="detailMount"></div></div>
</div>
<div id="switcher"><button id="prevV">←</button><span class="lab" id="varLab"></span><button id="nextV">→</button></div>
<script>
"use strict";
var VARIANTS=[{k:"A",n:"居中弹窗"},{k:"B",n:"右侧抽屉"},{k:"C",n:"整页下钻"}];
function vf(){try{var m=/(?:^|[?&])variant=([ABC])/i.exec(location.search);if(m)return m[1].toUpperCase()}catch(e){}return "A"}
var S={v:vf(),skill:null,phase:"idle",pt:"",cache:{},miss:false,draftFocus:false,forceSlow:false,skel:false};
var SKILLS=[
{n:"prototype",u:"一次性原型回答设计问题",how:"slow"},
{n:"research",u:"后台调研，写进仓库 markdown",how:"fast"},
{n:"tdd",u:"红-绿-重构",how:"fail"},
{n:"grilling",u:"穷追不舍的对齐提问",how:"fast"},
{n:"ask-matt",u:"不知道用哪个时问它",how:"fast",rec:1},
{n:"missing-demo",u:"这篇没有随包原文",how:"missing"}];
var DOCS={
prototype:{t:"/prototype·一次性原型",h:["什么时候用","分支怎么选"],b:"<p>原型是扔掉的草稿，用来回答一个设计问题。逻辑顺不顺走单文件，界面长什么样走多变体。</p><blockquote>先把问题写下来，再写代码。</blockquote>",tab:"simple",tall:1},
research:{t:"/research·后台调研",h:["调研员的工作","落盘位置"],b:"<p>开一个后台调研员顺着一手来源读，结论写进仓库 markdown，每条带出处。</p><pre>只认一手来源&#10;一问只落一个文件</pre>"},
tdd:{t:"/tdd·红-绿-重构",h:["循环规则"],b:"<p>先写失败测试，再写刚好通过的代码，一次只走一小片。</p><pre>red -&gt; green -&gt; review</pre>"},
grilling:{t:"/grilling·对齐提问",h:["什么时候停","对抗结论"],b:"<p>对着方案一直追问，直到每句话都有人拍板，机器不替人拍板。</p>",tab:"complex"},
"ask-matt":{t:"/ask-matt·技能路由器",h:["不知道用哪个时"],b:"<p>先问它，它会把你领到对的技能。</p><div class=imgph onclick=zoomImg()>示意图片：点我放大</div>"}};
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function dot(lv){var c=lv==="warn"?"#f59e0b":lv==="bad"?"#a3231a":"#0e8a16";return '<span class=dot style="background:'+c+'"></span>'}
function renderList(){
var h="";SKILLS.forEach(function(sk){
h+='<div class="skillrow'+(sk.rec?" rec":"")+'">'+dot(sk.how==="missing"?"bad":sk.rec?"warn":"ok")+'<span class=sname>/'+sk.n+(sk.rec?' <span class=star>★</span>':"")+'</span><span class=suse>'+esc(sk.u)+'</span><button class=pbtn data-sk="'+sk.n+'"><span class=spin></span>详情</button></div>'});
$("listBox").innerHTML=h;
var bs=$("listBox").querySelectorAll("button.pbtn");
for(var i=0;i<bs.length;i++)(function(b){b.addEventListener("click",function(){openDetail(b.getAttribute("data-sk"),b)})})(bs[i]);
}
function renderRing(){
var box=$("ringBox"),h='<div class=cen>/ask<br>matt</div>',ring=SKILLS.slice(0,6);
for(var i=0;i<ring.length;i++){var a=i/ring.length*Math.PI*2-Math.PI/2,x=125+92*Math.cos(a),y=105+78*Math.sin(a);
h+='<button class=ringnode style="left:'+Math.round(x-22)+'px;top:'+Math.round(y-13)+'px" data-sk="'+ring[i].n+'">'+esc(ring[i].n.slice(0,6))+"</button>"}
box.innerHTML=h;
var bs=box.querySelectorAll(".ringnode");
for(var j=0;j<bs.length;j++)(function(b){b.addEventListener("click",function(){openDetail(b.getAttribute("data-sk"),null)})})(bs[j]);
}
function openDetail(name,btn){
S.skill=name;S.miss=false;S.banner=null;$("bannerSeat").innerHTML="";
try{S.draftFocus=(document.activeElement&&document.activeElement.id==="draft")}catch(e){S.draftFocus=false}
if(btn){btn.classList.add("loading");btn.disabled=true;
setTimeout(function(){btn.classList.remove("loading");btn.disabled=false},S.pathOf(name)==="slow"?2600:600)}
if(S.cache[name]){S.phase="ready";S.pt="内容已到（缓存命中）";renderDetail();return}
var how=S.pathOf(name);
if(how==="missing"){failOpen("这篇没有随包原文",true);return}
if(how==="fail"&&!S.forceSlow){failOpen("读文件失败：包里找不到这一篇",false);return}
S.forceSlow=false;S.phase="loading";
if(how==="fast"){S.pt="正在取文件…";renderDetail();
setTimeout(function(){if(S.skill!==name||S.phase!=="loading")return;S.cache[name]=1;S.phase="ready";S.pt="内容已到";renderDetail()},300);
}else{S.pt="正在取文件…";renderDetail();
setTimeout(function(){if(S.skill!==name||S.phase!=="loading")return;S.pt="正在解析…";renderDetail()},800);
setTimeout(function(){if(S.skill!==name||S.phase!=="loading")return;S.pt="正在排版…";renderDetail()},1500);
setTimeout(function(){if(S.skill!==name||S.phase!=="loading")return;S.pt="正在排版…（超过 2 秒）";S.skel=true;renderDetail()},2000);
setTimeout(function(){if(S.skill!==name||S.phase!=="loading")return;S.skel=false;S.cache[name]=1;S.phase="ready";S.pt="内容已到";renderDetail()},2600)}}
S.pathOf=function(n){for(var i=0;i<SKILLS.length;i++)if(SKILLS[i].n===n)return SKILLS[i].how;return "fast"};
function failOpen(reason,missing){
S.phase="error";S.pt=reason;S.miss=!!missing;
$("bannerSeat").innerHTML='<div class="banner'+(missing?" warn":"")+'"><b>'+(missing?"!":"✕")+'</b><span class=grow>'+esc((missing?"缺文：":"失败：")+reason)+'</span><button class=pbtn onclick="retryOpen()">重试</button><button class=pbtn onclick="dismissBanner()">关闭</button></div>';
renderDetail()}
window.retryOpen=function(){S.forceSlow=!S.miss;dismissBanner(true);if(S.skill)openDetail(S.skill,null)};
window.dismissBanner=function(silent){$("bannerSeat").innerHTML="";if(!silent&&S.phase==="error"){S.phase="idle";S.pt="";renderDetail()}};
function tocHtml(hs){var h='<div class=toc><b>■ 本篇目录</b>';for(var i=0;i<hs.length;i++)h+='<a data-toc="'+i+'">· '+esc(hs[i])+"</a>";return h+"</div>"}


function docHtml(name){
if(name==="missing-demo")return "<p><span class='ic ic-warn'>!</span><b>这篇没有随包原文</b></p><p>包里没有这一篇，不编内容。下面保留短描述：演示缺文兜底。</p>";
var d=DOCS[name]||DOCS.research,h=(d.h&&d.h.length?tocHtml(d.h):"")+ '<div class=doc><h1>'+esc(d.t)+"</h1>"+d.b+"</div>";
return h}
function innerParts(){
var ic=S.phase==="loading"?"<span class='ic ic-idle'>…</span>":S.phase==="ready"?"<span class='ic ic-ok'>✓</span>":S.phase==="error"?(S.miss?"<span class='ic ic-warn'>!</span>":"<span class='ic ic-err'>✕</span>"):"<span class='ic ic-idle'>○</span>";
var st='<div class=st>'+ic+esc(S.pt||"点上面任意一行的详情开始")+"</div>",body="";
if(S.phase==="loading"&&S.skel)body='<div class=skel></div><div class=skel style="width:82%"></div><div class=skel style="width:64%"></div>';
else if(S.phase==="ready")body=docHtml(S.skill);
else if(S.phase==="error"&&S.miss)body=docHtml("missing-demo");
else if(S.phase==="error")body="<p>正文没拿到，原因见上面横幅，点重试再拉一次。</p>";
else body="<p>还没打开任何详情。</p>";
var bar='<button class=pbtn onclick="copyLink(this)">复制链接</button>'+(S.phase==="error"&&!S.miss?'<button class=pbtn onclick="retryOpen()">重试</button>':"");
return {st:st,body:body,bar:bar}}
function renderDetail(){
syncUrl();
var m=$("detailMount");
if(S.phase==="idle"){m.innerHTML="<p>还没打开任何详情。点上面任意一行的“详情”开始。</p>";return}
var p=innerParts(),title=S.skill?"/"+S.skill:"详情";
var cls=S.phase==="ready"?"f-ok":S.phase==="error"&&!S.miss?"f-err shake":"";
if(S.v==="A"){m.innerHTML='<div class=overlay id=ovl><div class="modal '+cls+'"><span class=seal></span><div class=top><span>'+esc(title)+'</span><span class=sub>居中弹窗·表单在背后</span><span style="flex:1"></span><button class=pbtn onclick="closeDetail()">关闭 ✕</button></div>'+p.st+'<div class=body id=docBody onscroll="onScroll(this)">'+p.body+'<button class="pbtn totop" id=totop style="display:none" onclick="toTop()">顶部 ↑</button></div><div class=bot>'+p.bar+"</div></div></div>";
var o=$("ovl");if(o)o.addEventListener("click",function(e){if(e.target===o)closeDetail()});bindToc()}
else if(S.v==="B"){m.innerHTML='<div class="drawerwrap '+cls+'"><span class=seal></span><div class=top><span>'+esc(title)+'</span><span class=sub>右侧抽屉</span><span style="flex:1"></span><button class=pbtn onclick="closeDetail()">关闭 ✕</button></div>'+p.st+'<div class=body id=docBody onscroll="onScroll(this)">'+p.body+'<button class="pbtn totop" id=totop style="display:none" onclick="toTop()">顶部 ↑</button></div><div class=bot>'+p.bar+"</div></div>";bindToc()}
else{m.innerHTML='<div class="drill '+cls+'"><div class=top><button class=pbtn onclick="closeDetail()">← 回列表</button><span>'+esc(title)+'</span><span class=sub>整页下钻</span></div>'+p.st+'<div class=body id=docBody style="max-height:52vh" onscroll="onScroll(this)">'+p.body+'<button class="pbtn totop" id=totop style="display:none" onclick="toTop()">顶部 ↑</button></div><div class=bot>'+p.bar+"</div></div>";bindToc()}}
function bindToc(){var as=document.querySelectorAll("[data-toc]");for(var i=0;i<as.length;i++)(function(a){a.addEventListener("click",function(){var b=$("docBody");if(!b)return;var hs=b.querySelectorAll("h2,h3");var k=+a.getAttribute("data-toc");if(hs[k])b.scrollTop=hs[k].offsetTop-8})})(as[i])}
window.onScroll=function(el){var t=$("totop");if(t)t.style.display=el.scrollTop>240?"block":"none"};
window.toTop=function(){var b=$("docBody");if(b)b.scrollTop=0};
window.closeDetail=function(){S.phase="idle";S.pt="";S.skel=false;renderDetail();try{if(S.draftFocus)$("draft").focus()}catch(e){}};
window.copyLink=function(btn){var b=document.createElement("span");b.className="bubble";b.setAttribute("role","status");b.textContent="已复制";document.body.appendChild(b);
try{var r=btn.getBoundingClientRect();b.style.left=r.left+"px";b.style.top=(r.top-36)+"px"}catch(e){b.style.left="50%";b.style.top="120px"}
setTimeout(function(){b.remove()},1500)};
function syncUrl(){var lab=null;for(var i=0;i<VARIANTS.length;i++)if(VARIANTS[i].k===S.v)lab=VARIANTS[i];
$("varLab").innerHTML="变体 <b>"+S.v+"</b>·"+lab.n;
try{var u=new URL(location.href);u.searchParams.set("variant",S.v);history.replaceState(null,"","?"+u.searchParams.toString())}catch(e){}}
function setVariant(k){var ok=false;for(var i=0;i<VARIANTS.length;i++)if(VARIANTS[i].k===k)ok=true;S.v=ok?k:"A";renderDetail()}
function idx(){for(var i=0;i<VARIANTS.length;i++)if(VARIANTS[i].k===S.v)return i;return 0}
$("prevV").addEventListener("click",function(){setVariant(VARIANTS[(idx()+2)%3].k)});
$("nextV").addEventListener("click",function(){setVariant(VARIANTS[(idx()+1)%3].k)});
document.addEventListener("keydown",function(e){
var t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable))return;
if(e.key==="ArrowLeft")$("prevV").click();
if(e.key==="ArrowRight")$("nextV").click();
if(e.key==="Escape"&&(S.phase==="ready"||S.phase==="error"))closeDetail()});
renderList();renderRing();renderDetail();
</script>
</body>
</html>
